<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zOrg — onchain TokenList governance</title>
<!--
  ERC-8244 onchain pointer. This page hosts NOTHING: the interface below is the
  contract's own html(), fetched at runtime with a single eth_call and rendered
  as-is. The same document is served by any 8244 gateway at
  <addr>.w4eth.io, so this site is one reader among several, not the source.

    governor  0x0000006D936bA3653b8854490E16E782cd32a9a8  html()  0x33c34ac3
    registry  0x0000006013dF75A31678B786061C2B54bf531524

  Unlike dapp/tokenlist/ipfs/index.html - a standalone 8244 pointer that REPLACES
  its own documentElement and becomes the dapp - this page keeps the zFi nav, so
  the contract's document is framed rather than adopted. The governor concatenates
  it from ZorgPageStyle + ZorgConvictionRenderer, both onchain. If Moloch swaps the renderer, this page changes with no deploy
  here. Keeping a second hand-written copy in this repo is exactly how the old
  version drifted onto a registry address that was never deployed.
-->
<link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../wallet.css">
<script>try{if(localStorage.getItem('dark')==='1'||(localStorage.getItem('dark')===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(_){}</script>
<script src="../theme.js"></script>
<style>
  body{max-width:none;padding:64px 0 0}
  .bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;
       max-width:1180px;margin:0 auto;padding:10px 18px;font-size:12px;color:var(--fg-muted)}
  .bar a{color:inherit;text-underline-offset:3px}
  .bar b{color:var(--fg);font-weight:500}
  #frame{display:block;width:100%;height:calc(100dvh - 108px);border:0;border-top:1px solid var(--border);background:#09090b}
  #fail{max-width:640px;margin:60px auto;padding:0 18px;color:var(--fg-muted);font-size:14px;line-height:1.6}
  #fail code{color:var(--fg)}
</style>
</head><body>
<div id="z-nav"></div>
<div class="bar">
  <span id="prov">Loading the interface from Ethereum…</span>
  <span><a href="https://etherscan.io/address/0x0000006D936bA3653b8854490E16E782cd32a9a8#code" target="_blank" rel="noopener">contract</a>
  · <a href="https://0x0000006d936ba3653b8854490e16e782cd32a9a8.w4eth.io/" target="_blank" rel="noopener">w4eth.io</a></span>
</div>
<iframe id="frame" title="zOrg onchain interface" hidden></iframe>
<div id="fail" hidden></div>
<script>
const C='0x0000006d936ba3653b8854490e16e782cd32a9a8', HTML='0x33c34ac3',
RPCS=['https://eth.blockrazor.xyz','https://eth-mainnet.public.blastapi.io','https://ethereum-rpc.publicnode.com','https://rpc.mevblocker.io','https://eth.merkle.io','https://0xrpc.io/eth','https://eth.rpc.blxrbdn.com','https://eth.drpc.org','https://mainnet.gateway.tenderly.co','https://eth-pokt.nodies.app','https://eth.api.onfinality.io/public'];
const $=i=>document.getElementById(i);
async function post(u,b){const c=AbortSignal.timeout?AbortSignal.timeout(12000):undefined;
  const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b),signal:c});
  if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();
  if(j&&j.error)throw Error(j.error.message||'rpc error');return j.result}
/* Decode a single ABI-encoded string return. */
function str(h){h=h.slice(2);
  const o=Number(BigInt('0x'+h.slice(0,64)))*2, n=Number(BigInt('0x'+h.slice(o,o+64)))*2;
  const b=h.slice(o+64,o+64+n);
  return new TextDecoder().decode(Uint8Array.from(b.match(/../g)||[],x=>parseInt(x,16)))}
async function pull(){
  for(const u of RPCS){
    try{
      const res=await post(u,{jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:C,data:HTML},'latest']});
      if(!res||res==='0x')throw Error('empty');
      return {html:str(res),via:u.replace(/^https?:\/\//,'').replace(/\/.*$/,'')}
    }catch(e){/* try the next endpoint */}
  }
  throw Error('no endpoint answered')}
/* The onchain page talks to a wallet directly. A same-origin srcdoc frame usually
   gets its own injected provider; where it does not, hand it the parent's. The
   prepended shim is the ONLY byte this site adds to the contract's output. */
const BRIDGE="<script>try{if(!window.ethereum&&parent!==window&&parent.ethereum)"+
  "Object.defineProperty(window,'ethereum',{value:parent.ethereum,configurable:true,writable:true})}catch(e){}<\/script>";
(async()=>{
  try{
    const {html,via}=await pull();
    $('prov').innerHTML='Interface served from <b>'+html.length.toLocaleString()+' bytes</b> of contract storage · read via '+via;
    const f=$('frame');
    f.srcdoc=BRIDGE+html;
    f.hidden=false;
  }catch(e){
    $('prov').textContent='Could not reach Ethereum.';
    $('fail').hidden=false;
    $('fail').innerHTML='<p>The interface lives at <code>'+C+'</code> and is fetched with one <code>eth_call</code> to <code>html()</code>. '+
      'Every public endpoint this page knows about failed just now, which is a connectivity problem rather than a contract one.</p>'+
      '<p>You can reach the same page directly over <a href="https://0x0000006d936ba3653b8854490e16e782cd32a9a8.w4eth.io/" target="_blank" rel="noopener">w4eth.io</a>, '+
      'or read <code>html()</code> (<code>0x33c34ac3</code>) yourself on <a href="https://etherscan.io/address/0x0000006D936bA3653b8854490E16E782cd32a9a8#readContract" target="_blank" rel="noopener">Etherscan</a>.</p>';
  }
})();
</script>
</body></html>
