// ==================== GALLERY ====================

// Stale-while-revalidate cache. Gallery state changes slowly (minutes), but the cold-load
// pipeline (RPCs + IPFS metadata) takes 1-3s. We snapshot the rendered
// HTML keyed by the connected wallet so revisits paint instantly, then fetch fresh in the
// background.
const GALLERY_CACHE_KEY = 'zfi_gallery_cache_v1';
const GALLERY_CACHE_TTL = 5 * 60 * 1000; // 5 minutes

function _galleryCacheLoad() {
  try {
    const c = JSON.parse(localStorage.getItem(GALLERY_CACHE_KEY) || 'null');
    if (!c || !c._ts || (Date.now() - c._ts) > GALLERY_CACHE_TTL) return null;
    return c;
  } catch { return null; }
}
function _galleryCacheSave(html, connectedAddress, userVerified) {
  // Skip save when wallet isn't connected. The render that runs before wallet
  // auto-connect resolves would otherwise overwrite a prior connected snapshot
  // with a null-keyed one, forcing another cache miss the next time the wallet
  // reconnects (and dropping the spam-button paint until the next refresh).
  if (!connectedAddress) return;
  try {
    localStorage.setItem(GALLERY_CACHE_KEY, JSON.stringify({
      _ts: Date.now(),
      connectedAddress: connectedAddress || null,
      // Persist verification so the cache-hit path matches the spam-button HTML it
      // restores. Without this, _userIsVerified resets to false on fresh page load
      // and the verified user sees buttons that respond with the "need 100k+ ZORG"
      // toast until the background refresh re-verifies.
      userVerified: !!userVerified,
      html,
    }));
  } catch {} // quota exceeded etc. — non-fatal, just skip caching
}

async function renderGallery() {
  const gen = ++_renderGen;
  // Invalidate any in-flight curve/zamm quote so its async callback can't write into the
  // newly-rendered gallery DOM. _renderGen guards _galleryRenderFresh; these guard the
  // already-fired quote setTimeout bodies that are mid-await on RPC.
  if (_curveQuoteTimer) { clearTimeout(_curveQuoteTimer); _curveQuoteTimer = null; }
  if (_curveZammQuoteTimer) { clearTimeout(_curveZammQuoteTimer); _curveZammQuoteTimer = null; }
  if (_curveSniperTimer) { clearInterval(_curveSniperTimer); _curveSniperTimer = null; }
  ++_curveQuoteGen;
  ++_curveZammQuoteGen;
  updateOGMeta('COIN', 'Trade coins on zFi - the most secure-by-default exchange', '');
  const app = $('app');

  // Try the SWR cache. Wallet must match — spam buttons are gated on _userIsVerified
  // which depends on the connected address, and rendering cached buttons for a different
  // wallet would let the wrong user flag coins until the background refresh lands.
  const cached = _galleryCacheLoad();
  const currentAddr = _connectedAddress || null;
  const cacheUsable = cached && cached.connectedAddress === currentAddr && cached.html;

  if (cacheUsable) {
    // Re-hydrate state that the cached HTML depends on but doesn't carry on its own:
    //   _spamSet — the .coin-spam classes are baked in but flagCoinAsSpam reads/writes
    //              the in-memory Set on click; an unloaded Set would lose the user's
    //              prior flags until the background refresh runs loadSpamListFresh.
    //   _userIsVerified — see comment in _galleryCacheSave.
    loadSpamListCached();
    if (typeof cached.userVerified === 'boolean') _userIsVerified = cached.userVerified;
    app.innerHTML = cached.html;
    // Background refresh: don't await. The gen check inside _galleryRenderFresh prevents
    // a stale resolve from clobbering the DOM if the user navigated away.
    _galleryRenderFresh(gen).catch(() => {});
    return;
  }

  // Keep existing gallery on screen during the SWR refresh. Without this, the
  // wallet-auto-connect path wipes the just-painted (no-wallet) gallery back to
  // a loading screen before the verified re-render completes.
  if (!$('coinGrid')) {
    app.innerHTML = `
      <div class="header">
        <h1>Coins</h1>
        <div><a href="../" class="nav-link">Swap</a> &middot; <a href="../dao/" class="nav-link">DAO</a></div>
      </div>
      <div class="loading">${zfiLoadingSVG(48)}Scanning for coins...</div>
    `;
  }
  await _galleryRenderFresh(gen);
}

async function _galleryRenderFresh(gen) {
  const app = $('app');

  try {
    // Fetch DAICOs, ClassicalCurveSale tokens, NFT auctions, and ZAMM v0 coins in parallel.
    const [daicos, curveTokenAddrs, nftAuctions, zammV0Coins] = await Promise.all([
      withRPC(async rpc => {
        const helper = new ethers.Contract(VIEW_HELPER, SCAN_ABI, rpc);
        const scanned = Array.from(await helper.scanDAICOs(0, 500, [ZERO]));
        // Causes summoned through SafeSummoner are not in the registry this helper
        // walks, so no window finds them — CELL comes back empty at every offset.
        // Read the few that matter directly and prepend them in the same shape.
        const seen = new Set(scanned.map(d => d.dao.toLowerCase()));
        const extra = (await Promise.all(OUT_OF_BAND_CAUSES
          .filter(a => !seen.has(a.toLowerCase()))
          .map(a => fetchOutOfBandCause(rpc, a).catch(() => null)))).filter(Boolean);
        return extra.concat(scanned);
      }),
      fetchCurveTokenList(),
      fetchNftAuctions(),
      fetchZammV0CoinsForGallery()
    ]);

    if ((!daicos || daicos.length === 0) && curveTokenAddrs.length === 0 && nftAuctions.length === 0 && (!zammV0Coins || zammV0Coins.length === 0)) {
      if (gen !== _renderGen) return;
      app.innerHTML = `
        <div class="header">
          <h1>Coins</h1>
          <div><a href="../" class="nav-link">Swap</a> &middot; <a href="../dao/" class="nav-link">DAO</a></div>
        </div>
        <div class="loading">No coins found yet. <a href="../#coin">Launch one</a>.</div>
      `;
      return;
    }

    // Exclude test coins
    const EXCLUDED_COINS = new Set([
      '0xd77F85a19D242391CeEf95e2D7fe35E251593f28',
      '0x816f6f801a525eef715BF015704C2672A0abf018',
      '0x729B47e8e4fBE54268E70a169398E7a5DCA579d1',
      '0xC455Dc876E1cF371cFf6ef5af85dA7675E3d2281',
      '0x7dDECc13905448159d5462bF49ac7C48f348d18C',
      '0xF792394938E553eA4cdbFa984509550A5fe335e5'
    ].map(a => a.toLowerCase()));
    let filtered = (daicos || []).filter(d => !EXCLUDED_COINS.has(d.dao.toLowerCase()));

    // Load cached spam list synchronously (zero latency), refresh in background
    loadSpamListCached();
    loadSpamListFresh(); // fire-and-forget; updates _spamSet + localStorage for next visit

    // Fetch metadata, pool reserves, and ETH/USD price in parallel
    // Batch ZORG balance check into the same multicall3 as pool reserves
    const zammI = new ethers.Interface(ZAMM_POOLS_ABI);
    const erc20I = new ethers.Interface(ERC20_ABI);
    const poolCalls = filtered.map(d => {
      const sale = d.sales && d.sales.length > 0 ? d.sales[0] : null;
      const feeOrHook = sale ? BigInt(sale.feeOrHook) : 30n;
      const poolId = computePoolId(ZERO, d.meta.sharesToken, 0n, 0n, feeOrHook);
      return { target: ZAMM, allowFailure: true, callData: zammI.encodeFunctionData('pools', [poolId]) };
    });
    // Append ZORG balance check to the same multicall batch (if wallet connected)
    if (_connectedAddress) {
      poolCalls.push({ target: ZORG_TOKEN, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
    }

    // Build activity map from cache or prepare to fetch in parallel
    const INACTIVE_DAYS = 3;
    const INACTIVE_MS = INACTIVE_DAYS * 86400 * 1000;
    const ACTIVITY_CACHE_KEY = 'zfi_activity_cache';
    const ACTIVITY_CACHE_TTL = 30 * 60 * 1000; // 30 minutes
    let activityMap = {}; // token address (lowercase) -> updatedAt (ms)
    let activityCached = false;
    try {
      const cached = JSON.parse(localStorage.getItem(ACTIVITY_CACHE_KEY) || '{}');
      if (cached._ts && (Date.now() - cached._ts) < ACTIVITY_CACHE_TTL) {
        activityMap = cached;
        activityCached = true;
      }
    } catch {}

    // Pool activity/recency came from the coinchan indexer (retired). Without it we
    // skip the inactive-coin heuristic — coins are simply not flagged inactive.
    const activityPromise = Promise.resolve(null);

    // Build curve multicall in advance so it runs in parallel with DAICO data
    const daicoAddrs = new Set(filtered.map(d => d.dao.toLowerCase()));
    const curveAddrs = curveTokenAddrs.filter(a => !daicoAddrs.has(a.toLowerCase()) && !EXCLUDED_COINS.has(a.toLowerCase()));
    const csIface = curveAddrs.length > 0 ? new ethers.Interface(CURVE_SALE_ABI) : null;
    const curveUriI = curveAddrs.length > 0 ? new ethers.Interface(['function contractURI() view returns (string)']) : null;
    const curveNameI = curveAddrs.length > 0 ? new ethers.Interface(['function name() view returns (string)', 'function symbol() view returns (string)']) : null;
    const curvePoolI = curveAddrs.length > 0 ? new ethers.Interface(ZAMM_POOLS_ABI) : null;
    let curveMcCalls = [];
    // Per-token call count. Named so adding a read stays a one-line change instead of
    // an off-by-one hunt through every curveMcRes[i * N + k] below.
    const CURVE_MC_STRIDE = 6;
    for (const addr of curveAddrs) {
      curveMcCalls.push(
        { target: CURVE_SALE, allowFailure: true, callData: csIface.encodeFunctionData('curves', [addr]) },
        { target: addr, allowFailure: true, callData: curveUriI.encodeFunctionData('contractURI') },
        { target: addr, allowFailure: true, callData: curveNameI.encodeFunctionData('name') },
        { target: addr, allowFailure: true, callData: curveNameI.encodeFunctionData('symbol') },
        // Post-graduation the curve's sold/virtualReserve freeze, so the card's mcap
        // (and the low-mcap filter and mcap sort that read it) would stay pinned to the
        // graduation price. Read the zAMM pool for the live number.
        { target: ZAMM, allowFailure: true, callData: curvePoolI.encodeFunctionData('pools', [computePoolId(ZERO, addr, 0n, 0n, CURVE_HOOK_FEE)]) },
        // A launch may mint more than cap + lpTokens and escrow the remainder as a
        // creator allocation that unlocks at graduation. Nothing in curves() reveals it.
        { target: CURVE_SALE, allowFailure: true, callData: csIface.encodeFunctionData('creatorVests', [addr]) }
      );
    }

    const [allMetadata, mcResults, ethUsd, activityGql, curveMcRes] = await Promise.all([
      Promise.all(filtered.map(d => fetchMetadata(d.meta.contractURI))),
      withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(poolCalls);
      }).catch(() => poolCalls.map(() => ({ success: false }))),
      getEthUsd(),
      activityPromise,
      curveMcCalls.length > 0 ? withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(curveMcCalls);
      }).catch(() => curveMcCalls.map(() => ({ success: false }))) : Promise.resolve([])
    ]);

    // Process activity results if freshly fetched
    if (activityGql && !activityCached) {
      const pools = activityGql?.data?.pools?.items || [];
      for (const p of pools) {
        const token = (p.token1 && p.token1 !== '0x0000000000000000000000000000000000000000') ? p.token1
                    : (p.token0 && p.token0 !== '0x0000000000000000000000000000000000000000') ? p.token0
                    : null;
        if (!token) continue;
        const key = token.toLowerCase();
        const ts = Number(p.updatedAt);
        if (!activityMap[key] || ts > activityMap[key]) activityMap[key] = ts;
      }
      activityMap._ts = Date.now();
      try { localStorage.setItem(ACTIVITY_CACHE_KEY, JSON.stringify(activityMap)); } catch {}
    }

    // Extract pool results (first N entries) and ZORG balance (last entry if wallet connected)
    const poolResults = mcResults.slice(0, filtered.length);
    if (_connectedAddress && mcResults.length > filtered.length) {
      const zorgResult = mcResults[filtered.length];
      try {
        const bal = zorgResult.success ? erc20I.decodeFunctionResult('balanceOf', zorgResult.returnData)[0] : 0n;
        _userIsVerified = bal >= ZORG_VERIFY_THRESHOLD;
      } catch { _userIsVerified = false; }
    }
    if (gen !== _renderGen) return;

    const cards = [];
    let testCount = 0;
    let lowMcapCount = 0;
    let spamCount = 0;
    let inactiveCount = 0;
    let legacyCount = 0;
    for (let i = 0; i < filtered.length; i++) {
      const d = filtered[i];
      const md = allMetadata[i];
      const _cs = CONTINUOUS_SALES[d.dao.toLowerCase()];
      if (_cs?.icon && md && !md.image) md.image = _cs.icon;
      const sale = d.sales && d.sales.length > 0 ? d.sales[0] : null;

      let salePct = 0;
      if (sale && sale.totalSupply > 0n) {
        const saleTeamBps = md && md.teamBps ? BigInt(md.teamBps) : 0n;
        const saleAlloc = saleTeamBps > 0n ? sale.totalSupply * (10000n - saleTeamBps) / 10000n : sale.totalSupply;
        const soldShares = saleAlloc > sale.remainingSupply ? saleAlloc - sale.remainingSupply : 0n;
        if (saleAlloc > 0n) salePct = Number((soldShares * 10000n) / saleAlloc) / 100;
      }

      const now = BigInt(Math.floor(Date.now() / 1000));
      const contSaleConfig = CONTINUOUS_SALES[d.dao.toLowerCase()];
      const hasContSale = !!contSaleConfig;
      const saleActive = hasContSale || (sale && sale.remainingSupply > 0n && sale.allowance > 0n && sale.forAmt > 0n && (sale.deadline === 0n || now <= BigInt(sale.deadline)));

      // Market cap (circulating): price * circulating supply
      // Circulating = total - unsold - team locked
      let mcapETH = 0;
      let poolR0 = 0n;
      let poolR1 = 0n;
      const pr = poolResults[i];
      if (pr && pr.success) {
        try {
          const decoded = zammI.decodeFunctionResult('pools', pr.returnData);
          poolR0 = decoded[0];
          poolR1 = decoded[1];
        } catch(e) {}
      }
      const coinTotalSupply = sale ? Number(ethers.formatEther(sale.totalSupply)) : Number(COIN_SUPPLY_TOTAL);
      const treasuryETH = sale ? sale.treasuryBalance : 0n;
      const teamBps = md && md.teamBps ? md.teamBps : 0;
      const teamLocked = teamBps > 0 ? coinTotalSupply * teamBps / 10000 : 0;
      const unsold = sale ? Number(ethers.formatEther(sale.remainingSupply)) : 0;
      const circulating = coinTotalSupply - unsold - teamLocked;
      // Price: pool spot if sale ended or pool is deep, else sale price
      const lpTokens = Number(ethers.formatEther(poolR1));
      const hasPool = poolR0 > 0n && poolR1 > 0n;
      const poolDeep = hasPool && lpTokens > coinTotalSupply * 0.01;
      const usePool = hasPool && (!saleActive || poolDeep);
      if (circulating > 0) {
        if (hasContSale && treasuryETH > 0n) {
          // Collector DAO: treasury-backed valuation (ragequittable ETH)
          mcapETH = Number(ethers.formatEther(treasuryETH));
        } else if (usePool) {
          mcapETH = (Number(ethers.formatEther(poolR0)) / lpTokens) * circulating;
        } else if (sale && sale.tribAmt > 0n && sale.forAmt > 0n) {
          mcapETH = (Number(ethers.formatEther(sale.tribAmt)) / Number(ethers.formatEther(sale.forAmt))) * circulating;
        }
      }
      const mcapDisplay = mcapETH > 1e-6 ? fmtMcap(mcapETH) : '';
      const mcapUsd = mcapETH > 1e-6 && ethUsd > 0 ? fmtUsd(mcapETH * ethUsd) : '';

      const cardName = (md.name || d.meta.name || '').toLowerCase();
      const cardSym = (md.symbol || d.meta.symbol || '').toLowerCase();
      const cardAddr = d.dao.toLowerCase();
      const isCause = md && md.launchType === 'cause';
      const isTest = cardName === 'test';
      if (isTest) testCount++;
      const isAlwaysShown = ALWAYS_SHOW_ADDRS.includes(cardAddr);
      const isLowMcap = !isTest && !isCause && !isAlwaysShown && mcapETH < 0.05;
      if (isLowMcap) lowMcapCount++;
      const isSpam = _spamSet.has(cardAddr);
      if (isSpam) spamCount++;
      const isCollect = md && (md.launchType === 'collector' || md.type === 'collector' || md.type === 'fw-collector');
      const isFund = md && md.launchType === 'fund';
      const isLegacy = !isCause && !isCollect && !isAlwaysShown && (isFund || (md && md.template && !md.launchType));
      if (isLegacy) legacyCount++;

      // Determine if coin is inactive (no trades in last 3 days)
      const ALWAYS_SHOW = ALWAYS_SHOW_ADDRS;
      let isInactive = false;
      if (hasPool && !isSpam && !isCause && !ALWAYS_SHOW.includes(d.dao.toLowerCase())) {
        const tokenKey = d.meta.sharesToken.toLowerCase();
        const updatedAtMs = activityMap[tokenKey];
        // Only mark inactive if we have a real updatedAt that's older than 3 days
        if (typeof updatedAtMs === 'number' && updatedAtMs > 0 && (Date.now() - updatedAtMs) > INACTIVE_MS) {
          isInactive = true;
          inactiveCount++;
        }
      }

      const cardHTML = `
        <a href="#${d.dao}" class="coin-card${isTest ? ' coin-test' : ''}${isSpam ? ' coin-spam' : ''}${isInactive ? ' coin-inactive' : ''}${isLegacy ? ' coin-legacy' : ''}${isLowMcap ? ' coin-lowmcap' : ''}" data-name="${escText(cardName)}" data-symbol="${escText(cardSym)}" data-addr="${cardAddr}" style="position:relative">
          ${spamBtnHTML(cardAddr, isSpam)}
          <div class="coin-card-head">
            <div class="coin-logo">${logoHTML(d.meta, md)}</div>
            <div>
              <div class="coin-card-name">${escText(d.meta.name || 'Unnamed')}</div>
              <div class="coin-card-symbol">$${escText(d.meta.symbol || '???')}${md && md.launchType === 'cause' ? `<span class="coin-tpl-badge coin-tpl-simple" title="DAICO fundraise &middot; ragequittable">cause</span>` : md && md.launchType === 'curve' ? `<span class="coin-tpl-badge coin-tpl-simple" title="bonding curve &middot; permanent LP">curve</span>` : md && (md.launchType === 'collector' || md.type === 'collector' || md.type === 'fw-collector') ? `<span class="coin-tpl-badge coin-tpl-simple" title="collector DAO">collect</span>` : md && md.launchType === 'fund' ? `<span class="coin-tpl-badge coin-tpl-simple" title="fund launch &middot; ops allocation &middot; tap vesting &middot; governance">fund</span>` : md && md.template ? `<span class="coin-tpl-badge" title="${escText(md.template)} template"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>` : ''}</div>
            </div>
          </div>
          ${isCause && md.description
            ? `<div class="coin-card-stat" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escText(md.description)}</div>`
            : `<div class="coin-card-bar">${'█'.repeat(Math.round(Math.min(salePct,100) / 10))}${'░'.repeat(10 - Math.round(Math.min(salePct,100) / 10))}</div>
          <div class="coin-card-stat">${hasContSale ? 'Continuous sale' : saleActive ? `${salePct.toFixed(1)}% sold` : 'Sale ended'}</div>`}
          ${hasContSale
            ? `<div class="coin-card-mcap" style="color:var(--fg-muted);font-weight:400">Collector DAO</div>`
            : (isCollect && treasuryETH > 0n)
            ? `<div class="coin-card-mcap">Treasury ${fmtMcap(Number(ethers.formatEther(treasuryETH)))}${ethUsd > 0 ? ` <span class="usd">${fmtUsd(Number(ethers.formatEther(treasuryETH)) * ethUsd)}</span>` : ''}</div>`
            : mcapDisplay ? `<div class="coin-card-mcap">MCap ${mcapDisplay}${mcapUsd ? ` <span class="usd">${mcapUsd}</span>` : ''}</div>` : ''}
        </a>
      `;
      cards.push({ html: cardHTML, key: cardName + '|' + cardSym, mcap: mcapETH, r0: poolR0, poolDeep, saleActive, isTest, isSpam, isInactive, isLegacy, isLowMcap, isCause });
    }

    // ── Curve coin cards (multicall data already fetched in Phase 2 above) ──
    if (curveAddrs.length > 0 && curveMcRes.length > 0) {
      // Fetch all curve metadata in parallel
      const curveMetaPromises = curveAddrs.map((_, i) => {
        const uriRes = curveMcRes[i * CURVE_MC_STRIDE + 1];
        if (!uriRes || !uriRes.success) return Promise.resolve(null);
        try {
          const uri = curveUriI.decodeFunctionResult('contractURI', uriRes.returnData)[0];
          return uri ? fetchMetadata(uri).catch(() => null) : Promise.resolve(null);
        } catch { return Promise.resolve(null); }
      });
      const curveMetadatas = await Promise.all(curveMetaPromises);
      if (gen !== _renderGen) return;

      for (let i = 0; i < curveAddrs.length; i++) {
        const tokenAddr = curveAddrs[i];
        const cRes = curveMcRes[i * CURVE_MC_STRIDE];
        if (!cRes.success) continue;
        let curve;
        try { curve = csIface.decodeFunctionResult('curves', cRes.returnData); } catch { continue; }
        if (!curve.creator || curve.creator === ZERO) continue;

        const cMeta = curveMetadatas[i] || {};
        let cName, cSym;
        try { cName = curveNameI.decodeFunctionResult('name', curveMcRes[i * CURVE_MC_STRIDE + 2].returnData)[0]; } catch { cName = cMeta.name || 'Unknown'; }
        try { cSym = curveNameI.decodeFunctionResult('symbol', curveMcRes[i * CURVE_MC_STRIDE + 3].returnData)[0]; } catch { cSym = cMeta.symbol || '???'; }

        const sold = BigInt(curve.sold);
        const cap = BigInt(curve.cap);
        const virtualReserve = BigInt(curve.virtualReserve);
        const startPrice = BigInt(curve.startPrice);
        const raisedETH = BigInt(curve.raisedETH);
        const graduationTarget = BigInt(curve.graduationTarget);
        const graduated = curve.graduated;
        const seeded = curve.seeded;

        const remaining = virtualReserve - sold;
        let spotPrice = remaining > 0n ? (startPrice * virtualReserve * virtualReserve) / (remaining * remaining) : 0n;
        // Once seeded, price lives in the zAMM pool — the curve figures are frozen.
        if (seeded && curveMcRes[i * CURVE_MC_STRIDE + 4]?.success) {
          try {
            const pr = curvePoolI.decodeFunctionResult('pools', curveMcRes[i * CURVE_MC_STRIDE + 4].returnData);
            const r0 = BigInt(pr[0]), r1 = BigInt(pr[1]);
            if (r0 > 0n && r1 > 0n) spotPrice = (r0 * (10n ** 18n)) / r1;
          } catch {}
        }
        const spotPriceEth = Number(spotPrice) / 1e18;
        const salePct = cap > 0n ? Number((sold * 10000n) / cap) / 100 : 0;
        // When graduationTarget > 0 the curve graduates on raisedETH ≥ target, not full cap sale.
        // XYK pricing back-loads ETH into the last ~30% of supply, so a coin can be ~90% to
        // graduation while only ~50% sold. Use the binding criterion (max of both) for the bar
        // and label so progress is monotonic and matches what's shown on the detail page.
        const ethPct = graduationTarget > 0n
          ? Math.min(100, Number(raisedETH * 10000n / graduationTarget) / 100)
          : 0;
        const progressPct = Math.max(salePct, ethPct);
        const curveMcap = spotPriceEth * 1e9; // 1B supply FDV
        const cSaleActive = !graduated && cap > 0n && sold < cap;

        const cCardName = cName.toLowerCase();
        const cCardSym = cSym.toLowerCase();
        const cCardAddr = tokenAddr.toLowerCase();
        const isTest = cCardName === 'test';
        if (isTest) { testCount++; }
        const isLowMcap = !isTest && !cSaleActive && curveMcap < 0.05;
        if (isLowMcap) lowMcapCount++;
        const isSpam = _spamSet.has(cCardAddr);
        if (isSpam) spamCount++;

        // Only claim permanent LP when this coin actually burns it, and surface any
        // other deviation from the standard template as a "!" badge on the card.
        let cVest = null;
        try {
          const vr = curveMcRes[i * CURVE_MC_STRIDE + 5];
          if (vr?.success) cVest = csIface.decodeFunctionResult('creatorVests', vr.returnData);
        } catch {}
        const cCurveWarnings = curveParamWarnings(curve, cVest);
        const cCurveBadgeTitle = curveLpIsPermanent(curve)
          ? 'bonding curve · permanent LP'
          : 'bonding curve';

        const mcapDisplay = curveMcap > 1e-6 ? fmtMcap(curveMcap) : '';
        const mcapUsd = curveMcap > 1e-6 && ethUsd > 0 ? fmtUsd(curveMcap * ethUsd) : '';
        const statusText = seeded ? 'Graduated' : graduated ? 'Ready to LP' : `${progressPct.toFixed(1)}% bonded`;
        const logoImg = cMeta.image ? resolveIPFS(cMeta.image) : null;
        const logoEl = logoImg
          ? `<img src="${escAttr(logoImg)}" alt="" loading="lazy" decoding="async" style="width:40px;height:40px;border-radius:50%;object-fit:cover" onerror="if(!ipfsNextGateway(this))this.parentNode.innerHTML=symbolSVG(${escAttr(JSON.stringify(cSym))},40)">`
          : symbolSVG(cSym, 40);

        const cCardHTML = `
          <a href="#${tokenAddr}" class="coin-card${isTest ? ' coin-test' : ''}${isSpam ? ' coin-spam' : ''}${isLowMcap ? ' coin-lowmcap' : ''}" data-name="${escText(cCardName)}" data-symbol="${escText(cCardSym)}" data-addr="${cCardAddr}" style="position:relative">
            ${spamBtnHTML(cCardAddr, isSpam)}
            <div class="coin-card-head">
              <div class="coin-logo">${logoEl}</div>
              <div>
                <div class="coin-card-name">${escText(cName)}</div>
                <div class="coin-card-symbol">$${escText(cSym)}<span class="coin-tpl-badge coin-tpl-simple" title="${escAttr(cCurveBadgeTitle)}">curve</span>${cCurveWarnings.length ? `<span class="coin-tpl-badge coin-tpl-warn" title="${escAttr(cCurveWarnings.join(' \u00b7 '))}">!</span>` : ''}</div>
              </div>
            </div>
            <div class="coin-card-bar">${'█'.repeat(Math.round(Math.min(progressPct,100) / 10))}${'░'.repeat(10 - Math.round(Math.min(progressPct,100) / 10))}</div>
            <div class="coin-card-stat">${statusText}</div>
            ${mcapDisplay ? `<div class="coin-card-mcap">FDV ${mcapDisplay}${mcapUsd ? ` <span class="usd">${mcapUsd}</span>` : ''}</div>` : ''}
          </a>
        `;
        cards.push({ html: cCardHTML, key: cCardName + '|' + cCardSym, mcap: curveMcap, r0: 0n, poolDeep: false, saleActive: cSaleActive, isTest, isSpam, isInactive: false, isLegacy: false, isLowMcap, isCause: false, isCurve: true });
      }
    }

    // Group by name|symbol, stack duplicates (exclude spam/inactive from grouping)
    const groups = new Map();
    const spamCards = [];
    const inactiveCards = [];
    const legacyCards = [];
    const lowMcapCards = [];
    for (const c of cards) {
      if (c.isSpam) { spamCards.push(c); continue; }
      if (c.isInactive) { inactiveCards.push(c); continue; }
      if (c.isLegacy) { legacyCards.push(c); continue; }
      if (c.isLowMcap) { lowMcapCards.push(c); continue; }
      if (!groups.has(c.key)) groups.set(c.key, []);
      groups.get(c.key).push(c);
    }
    let stackedCount = 0;
    let grid = '';
    const allGroups = [...groups.values()];
    for (const group of allGroups) group.sort((a, b) => b.mcap - a.mcap);

    // Classify each group as curve or DAICO based on its top (highest-mcap) card.
    // Mixed-type stacks (rare — same name/symbol shared across launch types) follow
    // their top card into whichever section it belongs to.
    const curveGroups = [];
    const daicoGroups = [];
    for (const group of allGroups) {
      if (group[0]?.isCurve) curveGroups.push(group);
      else daicoGroups.push(group);
    }
    // DAICOs: finalized (post-sale) before in-sale; finalized sub-sorts by LP
    // depth (r0), in-sale sub-sorts by mcap. Curve cards never capture r0, so
    // a separate sort uses mcap for both halves — graduated/seeded first, then
    // still-bonding by mcap (which tracks sale progress on a curve).
    const daicoSort = (a, b) => {
      const aTop = a[0], bTop = b[0];
      const aFinalized = !aTop.saleActive;
      const bFinalized = !bTop.saleActive;
      if (aFinalized !== bFinalized) return aFinalized ? -1 : 1;
      if (aFinalized) return aTop.r0 > bTop.r0 ? -1 : aTop.r0 < bTop.r0 ? 1 : 0;
      return bTop.mcap - aTop.mcap;
    };
    const curveSort = (a, b) => {
      const aTop = a[0], bTop = b[0];
      const aFinalized = !aTop.saleActive;
      const bFinalized = !bTop.saleActive;
      if (aFinalized !== bFinalized) return aFinalized ? -1 : 1;
      return bTop.mcap - aTop.mcap;
    };
    curveGroups.sort(curveSort);
    daicoGroups.sort(daicoSort);

    function renderGroup(group) {
      if (group.length === 1) return group[0].html;
      const extra = group.length - 1;
      stackedCount += extra;
      let out = `<div class="coin-stack">`;
      out += `<span class="coin-stack-badge" onclick="event.preventDefault();toggleStack(this)">+${extra} more</span>`;
      out += group[0].html;
      for (let j = 1; j < group.length; j++) {
        out += group[j].html.replace('class="coin-card', 'class="coin-card coin-stacked');
      }
      out += `</div>`;
      return out;
    }

    if (curveGroups.length > 0) {
      const n = curveGroups.reduce((s, g) => s + g.length, 0);
      grid += `<div class="coin-grid-section" data-section="curve">Curve coins <span class="count">${n}</span></div>`;
      for (const group of curveGroups) grid += renderGroup(group);
    }
    if (daicoGroups.length > 0) {
      const n = daicoGroups.reduce((s, g) => s + g.length, 0);
      grid += `<div class="coin-grid-section" data-section="daico">DAICOs <span class="count">${n}</span></div>`;
      for (const group of daicoGroups) grid += renderGroup(group);
    }
    // Append hidden cards individually (hidden by CSS, searchable)
    for (const c of lowMcapCards) grid += c.html;
    for (const c of legacyCards) grid += c.html;
    for (const c of inactiveCards) grid += c.html;
    for (const c of spamCards) grid += c.html;

    // NFT auctions: enrich via one batched multicall3 instead of N×3 RPC reads per
    // auction. For ~60 auctions this drops the load from O(180) RPC calls to O(1)
    // before the IPFS layer.
    // Time-sensitive listings get prepended above the rest. Failures per auction fall
    // back to a generic "NFT #id" card rather than dropping the whole row.
    let nftAuctionCount = 0;
    try {
      const enriched = await batchEnrichNftAuctions(nftAuctions);
      // Newest first — getAuctions already returns in id order, so reverse.
      enriched.reverse();
      const nftHtml = enriched.map(({a, meta}) => renderNftAuctionCard(a, meta)).join('');
      nftAuctionCount = enriched.length;
      const nftHeader = nftAuctionCount > 0
        ? `<div class="coin-grid-section" data-section="auctions">Auctions <span class="count">${nftAuctionCount}</span></div>`
        : '';
      grid = nftHeader + nftHtml + grid;
    } catch (e) { console.warn('NFT auction rendering failed:', e); }

    // ZAMM coins — top by liquidity, appended at the bottom of the gallery.
    let zammV0Count = 0;
    try {
      if (Array.isArray(zammV0Coins) && zammV0Coins.length > 0) {
        const zammHtml = zammV0Coins.map(renderZammV0CoinCard).join('');
        zammV0Count = zammV0Coins.length;
        // Flagged ZAMM v0 coins are hidden by CSS like the rest — count them so the
        // "N coins hidden" footer stays accurate.
        for (const zc of zammV0Coins) {
          const cid = (() => { try { return BigInt(zc.coinId); } catch { return null; } })();
          const zAddr = (cid !== null && cid < (1n << 160n))
            ? '0x' + cid.toString(16).padStart(40, '0')
            : COINS_SINGLETON.toLowerCase();
          if (_spamSet.has(zAddr)) { spamCount++; zammV0Count--; }
        }
        const zammHeader = `<div class="coin-grid-section" data-section="zamm">ZAMM coins <span class="count">${zammV0Count}</span></div>`;
        grid = grid + zammHeader + zammHtml;
      }
    } catch (e) { console.warn('ZAMM coins rendering failed:', e); }

    const _coinTotal = [...groups.values()].reduce((n, g) => n + g.filter(c => !c.isTest).length, 0) + zammV0Count;
    const _countLabel = nftAuctionCount > 0
      ? `${_coinTotal} coins &middot; ${nftAuctionCount} auction${nftAuctionCount === 1 ? '' : 's'}`
      : `${_coinTotal}`;
    // Final gen check before writing: a background refresh that finishes after the user
    // navigated away to a coin detail page would otherwise replace the detail with the gallery.
    if (gen !== _renderGen) return;
    const _galleryHtml = `
      <div class="header">
        <h1>Coins <span style="font-weight:400;color:var(--fg-muted)">(${_countLabel})</span></h1>
        <div><a href="../#coin" class="nav-link">Launch</a><span class="nav-sep">&middot;</span><a href="../" class="nav-link">Swap</a><span class="nav-sep">&middot;</span><a href="../dao/" class="nav-link">DAO</a></div>
      </div>
      <input type="text" class="coin-search" id="coinSearch" placeholder="Search by name, symbol, or address..." oninput="filterCoins()">
      <div class="coin-grid" id="coinGrid">${grid}</div>
      ${(() => {
        const parts = [];
        if (legacyCount > 0) parts.push(`<span class="spam-toggle" onclick="toggleLegacyCoins()">${legacyCount} legacy</span>`);
        if (inactiveCount > 0) parts.push(`<span class="spam-toggle" onclick="toggleInactiveCoins()">${inactiveCount} inactive</span>`);
        if (spamCount > 0) parts.push(`<span class="spam-toggle" onclick="toggleSpamCoins()" id="spamCountLabel">${spamCount} flagged</span>`);
        if (lowMcapCount > 0) parts.push(`<span class="spam-toggle" onclick="toggleLowMcapCoins()">${lowMcapCount} low-liquidity</span>`);
        const total = legacyCount + inactiveCount + spamCount + lowMcapCount;
        return total > 0 ? `<div style="text-align:center;font-size:11px;color:var(--fg-muted);margin-top:16px">${total} coins hidden (${parts.join(' · ')})</div>` : '';
      })()}
      <div id="spamCount" data-count="${spamCount}" style="display:none"></div>
      <div style="text-align:center;font-size:10px;color:var(--fg-dim);margin-top:20px;padding-top:12px;border-top:1px solid var(--border-muted)">100k <a href="https://zfi.wei.is/?from=eth&to=zorg" target="_blank" style="color:inherit;text-decoration:underline">$zOrg</a> holders can flag spam</div>
    `;
    // Preserve user state across the cache→fresh swap. Without this, a user who started
    // searching/scrolling the cached view loses their input + scroll position 1-2s later
    // when fresh data lands and replaces innerHTML.
    const _prevSearch = $('coinSearch')?.value || '';
    const _prevScrollY = window.scrollY;
    app.innerHTML = _galleryHtml;
    if (_prevSearch) {
      const _newSearch = $('coinSearch');
      if (_newSearch) { _newSearch.value = _prevSearch; filterCoins(); }
    }
    if (_prevScrollY > 0) window.scrollTo(0, _prevScrollY);
    // Snapshot for instant first paint on the next visit. Keyed by wallet so spam-button
    // visibility doesn't leak between accounts; userVerified rides along so the restored
    // buttons match the in-memory verification flag.
    _galleryCacheSave(_galleryHtml, _connectedAddress, _userIsVerified);
  } catch(e) {
    // Don't replace the page with a failure banner if the user already navigated
    // away — the cached gallery (or detail page) on screen is more useful than
    // an error from a stale background refresh.
    if (gen !== _renderGen) return;
    app.innerHTML = `
      <div class="header">
        <h1>Coins</h1>
        <div><a href="../" class="nav-link">Swap</a> &middot; <a href="../dao/" class="nav-link">DAO</a></div>
      </div>
      <div class="loading">Failed to load coins: ${escText(e.message || '')}</div>
    `;
  }
}

function toggleStack(el) {
  const stack = el.closest('.coin-stack');
  const wasExpanded = stack.classList.toggle('expanded');
  // Toggle the badge label so users know how to collapse it again.
  const extra = stack.querySelectorAll('.coin-card.coin-stacked').length;
  el.textContent = wasExpanded ? 'collapse' : `+${extra} more`;
}

function filterCoins() {
  const q = ($('coinSearch')?.value || '').toLowerCase().trim();
  const stacks = document.querySelectorAll('#coinGrid .coin-stack');
  stacks.forEach(s => {
    if (q) s.classList.add('expanded');
    else s.classList.remove('expanded');
  });
  // Section headers are organizational, not search-relevant — collapse them
  // while a query is active so the result list doesn't have orphan headings.
  document.querySelectorAll('#coinGrid .coin-grid-section').forEach(h => {
    h.style.display = q ? 'none' : '';
  });
  const cards = document.querySelectorAll('#coinGrid .coin-card');
  cards.forEach(c => {
    const isTest = c.classList.contains('coin-test');
    const isSpam = c.classList.contains('coin-spam');
    const isSpamVisible = c.classList.contains('coin-spam-visible');
    if (!q) { c.style.display = isTest ? 'none' : (isSpam && !isSpamVisible) ? 'none' : ''; return; }
    const match = c.dataset.name.includes(q) || c.dataset.symbol.includes(q) || c.dataset.addr.includes(q);
    c.style.display = match ? 'block' : 'none';
  });
}

// ==================== COIN DETAIL PAGE ====================

let _swapDir = 'buy'; // buy = ETH→shares, sell = shares→ETH
let _exactOut = false; // false = exact input, true = exact output
let _coinData = null;
let _coinMeta = null;
let _tradeMode = 'swap'; // 'sale' | 'swap' | 'ragequit' | 'lp'
let _saleData = null; // sale object from getDAICO
let _saleExactOut = false; // true when user typed in receive field
let _lpSubMode = 'zap'; // 'zap' | 'pair'

let _poolReserve0 = 0n;
let _poolReserve1 = 0n;
let _poolSupply = 0n; // total LP supply for the zAMM pool
let _lpBalance = 0n;

// ==================== CURVE COIN PAGE ====================
let _curveSlippageBps = 300; // 3% default
let _curveTokenAddr = null;
let _curveData = null;
let _curveObs = [];
let _curveEthUsd = 0;
let _curveBalance = 0n;
// Live creator-fee config so post-grad routed swaps charge the right amount.
// _curveCreatorRouted is true when beneficiary != 0 (i.e. ZAMM direct swaps would revert with Unauthorized).
// *OnInput flags determine which leg of the swap is taxed; quote/minOut math diverges based on them.
let _curveCreatorBuyBps = 0;
let _curveCreatorSellBps = 0;
let _curveCreatorBuyOnInput = false;
let _curveCreatorSellOnInput = false;
let _curveCreatorRouted = false;
// Single-flight guard so a quick double-click can't enqueue two trades.
let _curveTrading = false;
// Chart mode: 'curve' (bonding-curve trajectory) or 'price' (price line + trade dots over time).
// In-memory only — defaults to 'curve' every page load since it tells the more complete story
// for a coin you've never seen. Toggle holds for the session only; no persistence needed.
let _curveChartMode = 'curve';

function formatEthPrice(val) {
  if (val === 0) return '0';
  if (val < 0.0001) return val.toExponential(2);
  if (val < 0.01) return val.toFixed(6);
  if (val < 1) return val.toFixed(4);
  if (val < 1000) return val.toFixed(3);
  if (val < 1000000) return (val / 1000).toFixed(2) + 'k';
  return (val / 1000000).toFixed(2) + 'M';
}


function formatPct(pct) {
  const abs = Math.abs(pct);
  const sign = pct > 0 ? '+' : '';
  if (abs >= 1000) return sign + (pct / 1000).toFixed(1) + 'k%';
  if (abs >= 100) return sign + pct.toFixed(0) + '%';
  return sign + pct.toFixed(1) + '%';
}

function fmtTokenAmount(weiStr) {
  const v = Number(BigInt(weiStr)) / 1e18;
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(2);
}

async function renderCurveCoinPage(tokenAddr, curve, gen) {
  const app = $('app');
  _curveTokenAddr = tokenAddr;
  _curveData = curve;
  _curveEffectiveFee = null;
  // Invalidate any in-flight quote from a previous coin so its callback can't write into
  // the freshly-rendered DOM. clearTimeout stops not-yet-fired timers; the gen bump guards
  // already-fired async callbacks awaiting their RPC response.
  if (_curveQuoteTimer) { clearTimeout(_curveQuoteTimer); _curveQuoteTimer = null; }
  if (_curveZammQuoteTimer) { clearTimeout(_curveZammQuoteTimer); _curveZammQuoteTimer = null; }
  if (_curveSniperTimer) { clearInterval(_curveSniperTimer); _curveSniperTimer = null; }
  ++_curveQuoteGen;
  ++_curveZammQuoteGen;

  const sold = BigInt(curve.sold);
  const cap = BigInt(curve.cap);
  const virtualReserve = BigInt(curve.virtualReserve);
  const startPrice = BigInt(curve.startPrice);
  const raisedETH = BigInt(curve.raisedETH);
  const graduated = curve.graduated;
  const seeded = curve.seeded;
  const launchTime = Number(curve.launchTime);

  // Spot price. Pre-graduation this is the bonding curve. Post-graduation the
  // curve's sold/virtualReserve freeze at their graduation values, so this formula
  // would pin the header (and FDV) to the graduation price forever while real
  // trading moves the zAMM pool. Verified on a simulated graduation: one 3 ETH buy
  // left this reading 143% below the actual pool price. `let` so the post-multicall
  // block below can swap in the live pool spot once reserves are known.
  const remaining = virtualReserve - sold;
  const curveSpotPrice = remaining > 0n ? (startPrice * virtualReserve * virtualReserve) / (remaining * remaining) : 0n;
  let spotPrice = curveSpotPrice;
  let spotPriceEth = Number(spotPrice) / 1e18;
  const salePct = cap > 0n ? Number((sold * 10000n) / cap) / 100 : 0;
  let fdvEth = spotPriceEth * 1e9;

  // Graduation progress tracks whichever criterion the contract actually uses:
  //   graduationTarget > 0 → triggers on raisedETH ≥ target (sold/cap is misleading because
  //                          XYK pricing back-loads ETH into the last ~30% of supply).
  //   graduationTarget == 0 → triggers on full cap sale, so sold/cap is the right metric.
  const graduationTarget = BigInt(curve.graduationTarget);
  const targetGated = graduationTarget > 0n;
  const ethPct = targetGated && raisedETH > 0n
    ? Math.min(100, Number(raisedETH * 10000n / graduationTarget) / 100)
    : 0;
  const progressPct = targetGated ? ethPct : Math.min(100, salePct);
  const progressLabel = targetGated ? 'graduation' : 'curve';

  // Batch: obsCount + graduable + ETH/USD + token name/symbol + contractURI + creatorFees + balance via multicall
  const csIface = new ethers.Interface(CURVE_SALE_ABI);
  const erc20I = new ethers.Interface(ERC20_ABI);
  const nameI = new ethers.Interface(['function name() view returns (string)', 'function symbol() view returns (string)']);

  const uriI = new ethers.Interface(['function contractURI() view returns (string)']);
  const mc3Calls = [
    { target: CURVE_SALE, allowFailure: true, callData: csIface.encodeFunctionData('observationCount', [tokenAddr]) },
    { target: CURVE_SALE, allowFailure: true, callData: csIface.encodeFunctionData('graduable', [tokenAddr]) },
    { target: CHAINLINK_ETH_USD, allowFailure: true, callData: new ethers.Interface(CHAINLINK_ABI).encodeFunctionData('latestAnswer') },
    { target: tokenAddr, allowFailure: true, callData: nameI.encodeFunctionData('name') },
    { target: tokenAddr, allowFailure: true, callData: nameI.encodeFunctionData('symbol') },
    { target: tokenAddr, allowFailure: true, callData: uriI.encodeFunctionData('contractURI') },
    // Post-grad routing: read live creator fee so swap quotes & minOut match what the contract will actually charge.
    { target: CURVE_SALE, allowFailure: true, callData: csIface.encodeFunctionData('creatorFees', [tokenAddr]) },
    // Post-graduation the live price lives in the zAMM pool, not the frozen curve.
    { target: ZAMM, allowFailure: true, callData: new ethers.Interface(ZAMM_POOLS_ABI).encodeFunctionData('pools', [computePoolId(ZERO, tokenAddr, 0n, 0n, CURVE_HOOK_FEE)]) }
  ];
  if (_connectedAddress) {
    mc3Calls.push({ target: tokenAddr, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
  }
  // Appended last, after the optional balance, so the fixed indices above keep meaning
  // what they say whether or not a wallet is connected.
  const vestIdx = mc3Calls.length;
  mc3Calls.push({ target: CURVE_SALE, allowFailure: true, callData: csIface.encodeFunctionData('creatorVests', [tokenAddr]) });

  const mcRes = await withRPC(async rpc => {
    const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
    return await mc.aggregate3(mc3Calls);
  }).catch(() => mc3Calls.map(() => ({ success: false })));
  if (gen !== _renderGen) return;

  const obsCount = mcRes[0].success ? Number(csIface.decodeFunctionResult('observationCount', mcRes[0].returnData)[0]) : 0;
  const graduable = mcRes[1].success ? csIface.decodeFunctionResult('graduable', mcRes[1].returnData)[0] : false;
  const ethUsd = mcRes[2].success ? Number(new ethers.Interface(CHAINLINK_ABI).decodeFunctionResult('latestAnswer', mcRes[2].returnData)[0]) / 1e8 : 0;
  const tokenName = mcRes[3].success ? nameI.decodeFunctionResult('name', mcRes[3].returnData)[0] : 'Unknown';
  const tokenSymbol = mcRes[4].success ? nameI.decodeFunctionResult('symbol', mcRes[4].returnData)[0] : '???';
  const contractURI = mcRes[5].success ? uriI.decodeFunctionResult('contractURI', mcRes[5].returnData)[0] : '';
  let cfBeneficiary = ZERO, cfBuyBps = 0, cfSellBps = 0, cfBuyOnInput = false, cfSellOnInput = false;
  if (mcRes[6].success) {
    try {
      const cf = csIface.decodeFunctionResult('creatorFees', mcRes[6].returnData);
      cfBeneficiary = cf[0]; cfBuyBps = Number(cf[1]); cfSellBps = Number(cf[2]);
      // *OnInput flags decide which leg is taxed — quote and minOut math diverges based on them.
      // Defaults (false) match the prior assumption (sellOnInput=false), so existing pools are unaffected.
      cfBuyOnInput = Boolean(cf[3]); cfSellOnInput = Boolean(cf[4]);
    } catch {}
  }
  _curveCreatorBuyBps = cfBuyBps;
  _curveCreatorSellBps = cfSellBps;
  _curveCreatorBuyOnInput = cfBuyOnInput;
  _curveCreatorSellOnInput = cfSellOnInput;
  _curveCreatorRouted = cfBeneficiary !== ZERO;
  // Pool reserves are index 7; the optional balanceOf now lands at 8.
  if (seeded && mcRes[7]?.success) {
    try {
      const pr = new ethers.Interface(ZAMM_POOLS_ABI).decodeFunctionResult('pools', mcRes[7].returnData);
      const r0 = BigInt(pr[0]), r1 = BigInt(pr[1]);
      if (r0 > 0n && r1 > 0n) {
        spotPrice = (r0 * (10n ** 18n)) / r1;   // ETH per whole token, 1e18-scaled
        spotPriceEth = Number(spotPrice) / 1e18;
        fdvEth = spotPriceEth * 1e9;
      }
    } catch {}
  }
  const tokenBalance = (_connectedAddress && mcRes[8]?.success) ? erc20I.decodeFunctionResult('balanceOf', mcRes[8].returnData)[0] : 0n;
  let curveVest = null;
  try {
    if (mcRes[vestIdx]?.success) curveVest = csIface.decodeFunctionResult('creatorVests', mcRes[vestIdx].returnData);

  _curveEthUsd = ethUsd;
  _curveBalance = tokenBalance;

  // Resolve metadata + load observations in parallel (both depend on phase 1 results)
  const [curveMeta, observations] = await Promise.all([
    contractURI ? fetchMetadata(contractURI).catch(() => null) : Promise.resolve(null),

      const cs = new ethers.Contract(CURVE_SALE, CURVE_SALE_ABI, rpc);

  if (gen !== _renderGen) return;

  const raisedFmt = Number(ethers.formatEther(raisedETH)).toFixed(4);

  const balFmt = tokenBalance > 0n ? fmtTokenAmount(tokenBalance.toString()) : '0';

  // Price change from observations
  let priceChangeHTML = '';

    const first = prices[0], last = prices[prices.length - 1];
    const pct = first > 0 ? ((last - first) / first) * 100 : 0;
    const isUp = last >= first;

  }

  const perMil = spotPriceEth * 1e6;
  const perMilUsd = ethUsd ? ' <span style="font-size:11px;color:var(--fg-muted)">($' + (perMil * ethUsd < 0.01 ? (perMil * ethUsd).toExponential(2) : (perMil * ethUsd).toFixed(2)) + ')</span>' : '';

  const statusColor = seeded ? 'var(--green)' : graduated ? '#FF9800' : 'var(--fg)';
  const statusText = seeded ? 'Graduated' : graduated ? 'Ready to LP' : 'Active';

  // Creator earnings from observations (volume × effective fee at trade time / 10000).
  // Mirrors ClassicalCurveSale._effectiveFee so the displayed total matches what the contract

  const baseFeeBps = Number(curve.feeBps);

  const sniperDuration = Number(curve.sniperDuration);
  const launchTimeSec = Number(curve.launchTime);
  function _effFeeAt(ts) {
    if (sniperFeeBps === 0 || sniperDuration === 0) return baseFeeBps;
    const elapsed = ts - launchTimeSec;
    if (elapsed >= sniperDuration) return baseFeeBps;
    if (elapsed <= 0) return sniperFeeBps;
    return baseFeeBps + Math.floor((sniperFeeBps - baseFeeBps) * (sniperDuration - elapsed) / sniperDuration);
  }
  let creatorEarnings = 0;
  for (const obs of observations) {
    const vol = Number(BigInt(obs.volume)) / 1e18;
    creatorEarnings += vol * _effFeeAt(obs.timestamp) / 10000;
  }
  const earningsFmt = creatorEarnings >= 0.0001 ? creatorEarnings.toFixed(4) : creatorEarnings > 0 ? creatorEarnings.toExponential(2) : '0';
  const earningsUsd = ethUsd && creatorEarnings > 0 ? ' ($' + (creatorEarnings * ethUsd).toFixed(2) + ')' : '';

  let html = `

        <div class="coin-symbol-row">

    })()}

    ${curveDesc || (curveMeta && (curveMeta.twitter || curveMeta.telegram || curveMeta.discord)) ? `<div class="section-card">${curveDesc ? `<div class="desc-text">${escText(curveDesc)}</div>` : ''}${curveMeta && (curveMeta.twitter || curveMeta.telegram || curveMeta.discord) ? renderSocials(curveMeta, !!curveDesc) : ''}</div>` : ''}

    <!-- Price header -->
    <div style="margin-bottom:10px;display:flex;align-items:baseline;flex-wrap:wrap">
      <span style="font-size:18px;font-weight:700">${formatEthPrice(perMil)} ETH</span>

    </div>

    <!-- Price chart with mode toggle -->

      <div style="display:inline-flex;border:1px solid var(--border-muted);border-radius:4px;overflow:hidden">
        <button id="curveChartCurveBtn" onclick="setCurveChartMode('curve')" style="padding:3px 10px;background:${_curveChartMode === 'curve' ? 'var(--btn-bg)' : 'transparent'};border:none;color:${_curveChartMode === 'curve' ? 'var(--btn-fg)' : 'var(--fg-muted)'};font-size:10px;font-weight:600;cursor:pointer">Curve</button>
        <button id="curveChartPriceBtn" onclick="setCurveChartMode('price')" style="padding:3px 10px;background:${_curveChartMode === 'price' ? 'var(--btn-bg)' : 'transparent'};border:none;color:${_curveChartMode === 'price' ? 'var(--btn-fg)' : 'var(--fg-muted)'};font-size:10px;font-weight:600;cursor:pointer">Price</button>
      </div>
    </div>
    <canvas id="curveChart" style="width:100%;height:200px;border-radius:6px;background:var(--surface);margin-bottom:12px"></canvas>

    <!-- Stats grid -->
    <div class="coin-stat-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;font-size:11px;margin-bottom:14px">
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Raised</div>
        <div style="font-weight:600">${raisedFmt} ETH</div>
        <div style="font-size:9px;color:var(--fg-dim)">${raisedUsd}</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Sold</div>
        <div style="font-weight:600">${salePct.toFixed(1)}%</div>
        <div style="font-size:9px;color:var(--fg-dim)">of curve supply</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Fees</div>
        <div style="font-weight:600">${earningsFmt} ETH</div>
        <div style="font-size:9px;color:var(--fg-dim)">${earningsUsd || 'to creator'}</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Status</div>
        <div style="font-weight:600;color:${statusColor}">${statusText}</div>
        <div style="font-size:9px;color:var(--fg-dim)">${observations.length} trades</div>
      </div>
    </div>

    <!-- Progress bar (graduation criterion: ETH-target if set, otherwise sold/cap) -->
    <div style="margin-bottom:14px;font-family:monospace">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--fg-dim);margin-bottom:2px">
        <span>${progressLabel}</span>
        <span>${progressPct.toFixed(1)}%</span>
      </div>
      <div style="font-family:monospace;font-size:11px;line-height:1;color:var(--fg-dim);display:flex;width:100%"><span style="flex:${Math.max(progressPct,0.5)};overflow:hidden;white-space:nowrap">${'█'.repeat(200)}</span><span style="flex:${Math.max(100-progressPct,0.5)};overflow:hidden;white-space:nowrap">${'░'.repeat(200)}</span></div>

  // Render the slippage row with the persisted selection marked active. The previous

    return `<div class="coin-slippage-row" style="display:flex;align-items:center;gap:4px;margin-top:8px">

  if (!graduated) {

    html += `
      <div class="section-card">
        <div class="section-title">Trade</div>
        <div class="coin-side-toggle" style="display:flex;gap:0;margin-bottom:12px;border:1px solid var(--border-muted);overflow:hidden">

    `;
  }

  // Graduation button — visible only when the curve has hit its trigger (sold == cap if
  // graduationTarget == 0, else raisedETH >= graduationTarget) and the LP hasn't been
  // seeded yet. The call is permissionless: any wallet can pay the gas to seed.
  if (graduable && !seeded) {
    const _gradTrigger = targetGated ? 'ETH target reached' : 'curve fully sold';
    html += `
      <div style="margin-bottom:14px">
        <button class="swap-btn" style="width:100%;background:#FF9800;color:#fff;font-size:13px" onclick="curveGraduate()">${_connectedAddress ? 'Graduate to zAMM' : 'Connect Wallet to Graduate'}</button>

  // zAMM swap panel (post-graduation)
  if (seeded) {
    html += `
      <div style="margin-bottom:12px;padding:8px 12px;background:var(--surface);border-radius:6px;font-size:11px;color:var(--fg-dim)">Graduated &mdash; liquidity is now on zAMM. Trade below.</div>

        </div>
        <div id="curveZammBuyWrap">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <input id="curveZammBuyInput" type="text" inputmode="decimal" placeholder="0.00" aria-label="ETH amount to buy" style="flex:1;padding:8px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:16px;outline:none" oninput="curveZammQuote('buy')">
            <span style="font-size:12px;color:var(--fg-muted);align-self:flex-end;padding-bottom:10px">ETH</span>
          </div>
          <div class="coin-preset-row" style="display:flex;gap:4px;margin-bottom:8px">
            <button class="coin-tpl-btn" onclick="$('curveZammBuyInput').value='0.005';curveZammQuote('buy')" style="font-size:10px;padding:4px 8px">.005</button>
            <button class="coin-tpl-btn" onclick="$('curveZammBuyInput').value='0.01';curveZammQuote('buy')" style="font-size:10px;padding:4px 8px">.01</button>
            <button class="coin-tpl-btn" onclick="$('curveZammBuyInput').value='0.05';curveZammQuote('buy')" style="font-size:10px;padding:4px 8px">.05</button>
            <button class="coin-tpl-btn" onclick="$('curveZammBuyInput').value='0.1';curveZammQuote('buy')" style="font-size:10px;padding:4px 8px">.1</button>
          </div>
          <div id="curveZammBuyQuote" style="font-size:11px;color:var(--fg-muted);margin-bottom:6px;min-height:16px">Enter amount to see quote</div>

            <span style="font-size:12px;color:var(--fg-muted);align-self:flex-end;padding-bottom:10px">tokens</span>
          </div>
          <div class="coin-preset-row" style="display:flex;gap:4px;margin-bottom:8px">
            <button class="coin-tpl-btn" onclick="curveZammSellPct(25)" style="font-size:10px;padding:4px 8px">25%</button>
            <button class="coin-tpl-btn" onclick="curveZammSellPct(50)" style="font-size:10px;padding:4px 8px">50%</button>
            <button class="coin-tpl-btn" onclick="curveZammSellPct(75)" style="font-size:10px;padding:4px 8px">75%</button>
            <button class="coin-tpl-btn" onclick="curveZammSellPct(100)" style="font-size:10px;padding:4px 8px">100%</button>
          </div>
          <div id="curveZammSellQuote" style="font-size:11px;color:var(--fg-muted);margin-bottom:6px;min-height:16px">Enter amount to see quote</div>
          <button class="swap-btn" style="width:100%;font-size:13px;background:var(--red);color:#fff" onclick="curveZammSwap('sell')">Sell</button>
        </div>

        <div id="curveTradeStatus" style="margin-top:8px"></div>
      </div>
    `;
  }

  // Trade history from observations
  if (observations.length > 0) {
    const rows = observations.slice().reverse().slice(0, 50).map(o => {
      const cls = o.isSell ? 'evt-sell' : 'evt-buy';
      const label = o.isSell ? 'Sell' : 'Buy';
      // Price in wei-of-ETH per wei-of-token (1e18-scaled) → render as ETH per 1M tokens to match
      // the page header and chart Y axis. Otherwise a fresh-curve trade reads as "1.67e-9" which
      // is technically correct but useless to humans.
      const priceEthPerMil = (Number(BigInt(o.price)) / 1e18) * 1e6;
      // Volume is the ETH cost/proceeds in wei (uint80 packed). Render with adaptive precision so
      // sub-0.01-ETH trades don't collapse to "0.00" the way fmtTokenAmount used to render them.
      const volEth = Number(ethers.formatEther(o.volume));
      const vol = volEth >= 1 ? volEth.toFixed(3)
                : volEth >= 0.001 ? volEth.toFixed(5)
                : volEth >= 0.000001 ? volEth.toFixed(7)
                : volEth > 0 ? volEth.toExponential(2)
                : '0';
      return `<tr class="${cls}">
        <td>${fmtAge(o.timestamp)}</td>
        <td class="evt-type">${label}</td>
        <td>${formatEthPrice(priceEthPerMil)}</td>

    }).join('');
    html += `
      <div class="drawer open">

  // Holders drawer — candidates from Transfer logs, then batch balanceOf on-chain
  html += `

  // Fine print: the covenant, then the contracts it all points at.
  html += `<div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--border-muted)">${charterHTML}</div>`;

  html += `
