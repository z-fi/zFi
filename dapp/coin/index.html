<style>
:root {
  --btn-dis-bg:transparent;--btn-dis-border:#ccc;--btn-dis-fg:#999;
  --green:#22c55e;--red:#ef4444;
}
.dark {
  --btn-dis-bg:transparent;--btn-dis-border:#444;--btn-dis-fg:#666;
  --green:#22c55e;--red:#ef4444;
}
body { max-width:720px; }
button {
  font-family:inherit;cursor:pointer;border:none;border-radius:0;
  background:var(--btn-bg);color:var(--btn-fg);
  padding:10px 20px;font-size:13px;font-weight:600;letter-spacing:0.05em;
}
button:hover { background:var(--btn-hover); }
button:disabled { background:var(--btn-dis-bg);border:1px solid var(--btn-dis-border);color:var(--btn-dis-fg);cursor:not-allowed; }
input {
  font-family:inherit;font-size:16px;background:transparent;color:var(--fg);
  border:none;border-bottom:1.5px solid var(--border);outline:none;
  padding:8px 0;width:100%;
}
.header {
  display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;
}
.header h1 {
  font-size:14px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;
}
.nav-link { font-size:12px;color:var(--fg-muted);text-decoration:none; }
.nav-sep { margin:0 4px;font-size:10px;vertical-align:1px;color:var(--fg-muted);opacity:0.5; }
.nav-link:hover { color:var(--fg); }
.back-link { font-size:12px;color:var(--fg-muted);text-decoration:none;margin-bottom:16px;display:inline-block; }
.back-link:hover { color:var(--fg); }
.coin-search {
  width:100%;padding:8px 0;font-size:16px;border:none;border-bottom:1px solid var(--border);
  outline:none;background:transparent;color:var(--fg);margin-bottom:16px;
}
.coin-search::placeholder { color:var(--input-ph); }

/* Gallery */
.coin-grid {
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;
  align-items:start;
}
.coin-grid-section {
  grid-column:1 / -1;
  font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--fg-muted);
  padding:0 0 6px;margin-top:4px;
  border-bottom:1px solid var(--border-muted);
  display:flex;align-items:baseline;gap:8px;
}
.coin-grid-section:first-child { margin-top:0; }
.coin-grid-section .count {
  font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--fg-dim);font-size:10px;
}
.coin-card {
  border:1px solid var(--border);padding:16px;
  cursor:pointer;transition:background 0.15s, transform 0.15s;text-decoration:none;color:var(--fg);display:block;
}
.coin-card:hover { background:var(--surface-hover);transform:translateY(-1px); }
.coin-test { display:none; }
.coin-spam { display:none; }
.coin-spam.coin-spam-visible {
  display:block;position:relative;opacity:0.5;
  border-color:var(--red);
}
.coin-spam.coin-spam-visible::after {
  content:'Flagged as spam';position:absolute;top:6px;right:6px;
  font-size:9px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--red);background:var(--status-error);padding:2px 6px;
}
.coin-inactive { display:none; }
.coin-legacy { display:none; }
.coin-lowmcap { display:none; }
.spam-toggle {
  cursor:pointer;text-decoration:underline;text-decoration-style:dotted;

}
.spam-toggle:hover { color:var(--fg); }
.spam-btn {
  position:absolute;top:6px;right:6px;z-index:5;
  width:22px;height:22px;padding:0;margin:0;
  background:transparent;border:1px solid var(--border-muted);
  color:var(--fg-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.15s;
}
.coin-card:hover .spam-btn { opacity:1; }
.spam-btn:hover { background:var(--red);color:#fff;border-color:var(--red);opacity:1; }
.coin-card-head { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
.coin-logo {
  width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  font-size:16px;font-weight:700;background:var(--surface);
}
.coin-logo img { width:100%;height:100%;object-fit:cover; }
.coin-card-name { font-size:14px;font-weight:600; }
.coin-card-symbol { font-size:12px;color:var(--fg-muted); }
.coin-card-bar { margin-top:8px;font-family:monospace;font-size:9px;line-height:1;letter-spacing:0.5px;color:var(--fg-dim);overflow:hidden; }
.coin-card-stat { font-size:11px;color:var(--fg-muted);margin-top:6px; }
.coin-card-mcap { font-size:11px;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--fg); }
.coin-card-mcap .usd { font-weight:400;color:var(--fg-muted); }
.coin-tpl-badge {
  display:inline-flex;align-items:center;vertical-align:middle;margin-left:4px;
  color:var(--fg);opacity:0.7;
}
.coin-tpl-badge svg { display:block; }
.coin-tpl-simple {
  font-size:9px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
  padding:1px 4px;border-radius:3px;
  background:var(--surface);border:1px solid var(--border-muted);
  opacity:1;color:var(--fg-muted);
}
/* Marks a curve launched with non-template parameters. Hover gives the reason. */
.coin-tpl-warn {
  font-size:9px;font-weight:700;line-height:1;
  padding:1px 5px;border-radius:3px;
  background:transparent;border:1px solid #FF9800;
  opacity:1;color:#FF9800;cursor:help;
}
/* Same signal at the top of a coin's own page, where there is room to spell it out. */
.curve-param-notice {
  margin:10px 0;padding:10px 12px;border-radius:6px;
  border:1px solid #FF9800;background:color-mix(in srgb, #FF9800 8%, transparent);
  font-size:13px;line-height:1.5;color:var(--fg);
}
.curve-param-notice strong { color:#FF9800; }
.curve-param-notice ul { margin:6px 0 0;padding-left:18px; }

/* Stacked duplicates: a single grid cell that renders the canonical card up
   front, with a paper-stack shadow hinting at hidden variants. The badge
   expands the stack inline (extras flow in below) without affecting neighbor
   cells, since the grid uses align-items:start. */
.coin-stack {
  display:flex;flex-direction:column;gap:8px;
  position:relative;
}
.coin-stack > .coin-card:first-of-type {
  box-shadow:
    2px 2px 0 0 var(--bg),
    2px 2px 0 1px var(--border),
    4px 4px 0 0 var(--bg),
    4px 4px 0 1px var(--border);
}
.coin-stack > .coin-card.coin-stacked { display:none; }
.coin-stack.expanded > .coin-card:first-of-type { box-shadow:none; }
.coin-stack.expanded > .coin-card.coin-stacked { display:block; }
.coin-stack-badge {
  position:absolute;bottom:10px;right:10px;z-index:3;
  font-size:10px;font-weight:600;padding:3px 8px;
  background:var(--btn-bg);color:var(--btn-fg);
  cursor:pointer;letter-spacing:0.03em;
}
.coin-stack-badge:hover { background:var(--btn-hover); }

.cause-meter-head {
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:10px;color:var(--fg-dim);margin-bottom:5px;

}

.swap-quote { font-size:12px;color:var(--fg-muted);min-height:18px;margin-bottom:10px; }
.action-btn {
  width:100%;margin:0;padding:12px;font-size:13px;font-weight:600;letter-spacing:0.05em;
  text-transform:uppercase;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);
  border:none;font-family:inherit;transition:background 0.2s;
}
.action-btn:hover:not(:disabled) { background:var(--btn-hover); }
.action-btn:disabled { background:var(--btn-dis-bg);border:1px solid var(--btn-dis-border);color:var(--btn-dis-fg);cursor:not-allowed; }

/* Curve swap-tile pieces — the receive side is read-only (quote-driven) so it can't reuse
   `.swap-section input`; this gives the same visual weight as the input side. */
.curve-out-row { display:flex;gap:8px;align-items:flex-end; }
.curve-out-amount {
  flex:1;font-size:22px;font-weight:400;color:var(--fg);
  padding:8px 0;border-bottom:1.5px solid var(--border);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-height:40px;line-height:24px;font-variant-numeric:tabular-nums;
}
.curve-out-amount.placeholder { color:var(--input-ph); }
.curve-out-amount.muted { color:var(--fg-muted);font-style:italic; }
.curve-out-sub { font-size:11px;color:var(--fg-muted);margin-top:4px;min-height:14px;font-variant-numeric:tabular-nums; }
.curve-dir-arrow {
  width:28px;height:28px;border:1px solid var(--border-muted);background:var(--bg);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg-muted);
}
.curve-dir-arrow svg { display:block; }
.curve-details {
  margin:10px 0 0;padding:8px 10px;background:var(--surface);font-size:11px;
  border:1px solid var(--border-muted);
}
.curve-details-row {
  display:flex;justify-content:space-between;align-items:center;
  padding:2px 0;color:var(--fg-muted);
}
.curve-details-row .v { color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums; }
.curve-details-row .v.warn { color:var(--red); }

/* Collapsible drawer */
.drawer { border:1px solid var(--border);margin-bottom:16px;overflow:hidden; }
.drawer-toggle {
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-muted);
  background:transparent;border:none;width:100%;text-align:left;
}
.drawer-toggle:hover { background:var(--surface); }
.drawer-toggle .arrow { transition:transform 0.2s;font-size:10px; }
.drawer.open .drawer-toggle .arrow { transform:rotate(180deg); }
.drawer-body { display:none;padding:0 16px 16px; }
.drawer.open .drawer-body { display:block; }

/* Drawer body / tables — shared by Holders, Proposals, Orders drawers */
.activity-body { display:none;padding:0; }
.drawer.open .activity-body { display:block; }
.activity-table { width:100%;border-collapse:collapse;font-size:12px; }
.activity-table th {
  text-align:left;padding:6px 10px;font-size:10px;font-weight:600;letter-spacing:0.05em;
  text-transform:uppercase;color:var(--fg-muted);border-bottom:1px solid var(--border-muted);
}
.activity-table td { padding:5px 10px;border-bottom:1px solid var(--border-muted);white-space:nowrap; }
.activity-table tr:last-child td { border-bottom:none; }
.activity-table .evt-buy { color:var(--green); }
.activity-table .evt-sell { color:var(--red); }
.activity-table .evt-type { font-weight:600;font-size:11px; }
.activity-table a { color:var(--fg-muted);font-size:11px; }
.activity-table a:hover { color:var(--fg); }
.activity-empty { padding:16px;text-align:center;font-size:12px;color:var(--fg-muted); }

.holder-row { position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border-muted);font-size:12px; }
/* Share-weight bar, scaled to the largest holder so the distribution reads at a glance */
.holder-row::before { content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--fg);opacity:0.05;pointer-events:none; }
.holder-row > * { position:relative; }
.holder-row:last-child { border-bottom:none; }
.holder-addr { flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.holder-addr a { color:var(--fg-muted);text-decoration:none; }
.holder-addr a:hover { color:var(--fg); }
.holder-tag { font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap; }
.holder-tag-pool { background:rgba(59,130,246,0.15);color:#60a5fa; }
.holder-tag-dao { background:rgba(168,85,247,0.15);color:#c084fc; }
.holder-tag-badge { background:rgba(234,179,8,0.15);color:#facc15; }
.holder-shares { font-weight:600;white-space:nowrap; }
.holder-pct { color:var(--fg-muted);font-size:11px;white-space:nowrap; }

.desc-text { font-size:13px;line-height:1.6;color:var(--fg);white-space:pre-wrap;word-break:break-word; }
.socials-row { display:flex;gap:14px;flex-wrap:wrap;font-size:12px; }
.socials-row a { color:var(--fg-muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px; }
.socials-row a:hover { color:var(--fg); }
.links-row { display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:8px; }
.links-row a { color:var(--fg-muted); }
.links-row a:hover { color:var(--fg); }

/* Proposals */
/* The drawer body itself is flush (the holders table wants that); this list is
   prose and cards, so it needs a gutter. */
#proposalsContent { padding:4px 14px 14px; }
/* Section heads carry a rule that runs to the right edge, so Discussion and
   Proposals read as two bands rather than two paragraphs of small caps. */
.prop-sec-head {
  display:flex;align-items:center;gap:8px;margin:22px 0 8px;
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-muted);
}
.prop-sec-head.prop-sec-first { margin-top:2px; }
.prop-sec-head::after {
  content:'';flex:1;height:1px;background:var(--border-muted);
}
.prop-sec-head span {
  font-size:9px;padding:1px 6px;border-radius:8px;border:1px solid var(--border-muted);
  color:var(--fg-dim);font-variant-numeric:tabular-nums;letter-spacing:0.04em;
}
.prop-chat-list { margin-bottom:4px; }
/* A message is a row, not a card: the thread should read top-to-bottom without
   fifteen boxes competing with the proposal cards below it. */
.prop-chat-item {
  display:flex;gap:10px;padding:8px 8px 8px 6px;margin:0 -8px 0 -6px;border-radius:6px;
  font-size:12px;line-height:1.6;color:var(--fg-muted);
  border-bottom:1px solid var(--border-muted);
  transition:background 0.15s ease;
}
.prop-chat-item:last-child { border-bottom:none; }
.prop-chat-item:hover { background:var(--surface); }
.prop-chat-item:hover .prop-chat-body { color:var(--fg); }
.prop-chat-idx {
  flex:none;min-width:24px;color:var(--fg-dim);font-size:10px;padding-top:4px;
  font-variant-numeric:tabular-nums;text-align:right;
}
.prop-chat-main { flex:1;min-width:0; }
/* Long updates are common here; clamp them so the proposals below stay reachable
   without nesting a scrollbar inside the drawer. */
.prop-chat-body {
  white-space:pre-wrap;overflow-wrap:anywhere;transition:color 0.15s ease;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
/* The clamp only fades when there is genuinely more text, so a three-line message
   does not look truncated. `has-more` is set after measuring. */
.prop-chat-main.has-more:not(.open) .prop-chat-body {
  -webkit-mask-image:linear-gradient(to bottom, #000 55%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 55%, transparent 100%);
}
.prop-chat-main.open .prop-chat-body { -webkit-line-clamp:unset;overflow:visible; }
.prop-chat-link {
  color:var(--fg-muted);text-decoration:underline;text-decoration-color:var(--border);
  text-underline-offset:2px;
}
.prop-chat-link:hover { color:var(--fg);text-decoration-color:var(--fg-dim); }
.prop-more {
  margin-top:4px;padding:0;background:none;border:none;font:inherit;font-size:10px;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-dim);cursor:pointer;
  opacity:0.7;transition:opacity 0.15s;
}
.prop-more:hover, .prop-more:focus-visible { opacity:1;color:var(--fg-muted); }
.prop-showall {
  display:block;width:100%;margin-top:8px;padding:8px;background:none;
  border:1px dashed var(--border-muted);border-radius:6px;font:inherit;font-size:10px;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-dim);cursor:pointer;
  transition:color 0.15s, border-color 0.15s;
}
.prop-showall:hover { color:var(--fg-muted);border-color:var(--fg-dim); }

.prop-item {
  position:relative;padding:12px 12px 12px 14px;border:1px solid var(--border-muted);
  border-radius:8px;margin-bottom:8px;background:var(--surface);
  transition:border-color 0.15s ease;
}
.prop-item:hover { border-color:var(--fg-dim); }
/* The live proposals — open for votes, or queued and waiting on the timelock — are
   the only ones a reader can still act on: give them an accent rail so they are
   findable in a list of fifteen settled ones. */
/* The rail is a thicker left border, not an overlaid pseudo-element: a 3px box with
   an 8px radius bulges outside the card's own rounded corner. */
.prop-item.is-live { border-color:var(--green);border-left-width:3px;padding-left:12px; }
.prop-head { display:flex;justify-content:space-between;align-items:flex-start;gap:10px; }
.prop-desc { font-size:13px;font-weight:500;flex:1;min-width:0;word-break:break-word;line-height:1.55; }
.prop-desc-body { display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden; }
.prop-desc-body.clamped {
  -webkit-line-clamp:3;
  -webkit-mask-image:linear-gradient(to bottom, #000 55%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 55%, transparent 100%);
}
.prop-state { font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid;white-space:nowrap;font-weight:600; }
.prop-state.executed { border-color:var(--fg-dim);color:var(--fg-dim);background:var(--surface-hover); }
.prop-state.active { border-color:var(--green);color:var(--green);background:var(--status-success); }
.prop-state.succeeded,.prop-state.queued { border-color:var(--green);color:var(--green);background:var(--status-success); }
.prop-state.defeated,.prop-state.expired { border-color:var(--red);color:var(--red);background:var(--status-error); }
.prop-state.unopened { border-color:var(--fg-dim);color:var(--fg-dim); }
.prop-votes { display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:7px;font-size:11px;color:var(--fg-muted);font-variant-numeric:tabular-nums; }
.prop-votes .for { color:var(--green); }
.prop-votes .against { color:var(--red); }
/* A tally of zero is context, not a result — keep it readable but out of the way. */
.prop-votes .zero { opacity:0.45; }
.prop-bar { position:relative;height:5px;border-radius:3px;background:var(--border-muted);margin-top:8px;overflow:hidden;display:flex; }
/* The quorum threshold is the number that decides the proposal, so it outranks the
   tally visually. At a 5% quorum it sits near the left edge and a 1px hairline was
   indistinguishable from the vote sliver beside it. */
.prop-bar-quorum { position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--fg);opacity:0.8;border-radius:1px; }
.prop-turnout { margin-left:auto;color:var(--fg-dim);white-space:nowrap; }
.prop-turnout.met { color:var(--green); }
.prop-clock { color:var(--fg-muted);font-variant-numeric:tabular-nums; }
.prop-clock-ready { color:var(--green); }
.prop-id { margin-left:auto;opacity:0.55;font-variant-numeric:tabular-nums; }
.stat-row-nav { border-top:1px solid var(--border-muted);margin-top:4px;padding-top:8px; }
/* Derived treasury analysis — understated, collapsed by default */
.stat-reveal { display:flex;align-items:center;gap:5px;width:100%;padding:7px 0 2px;margin-top:2px;background:none;border:none;font:inherit;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:var(--fg-dim);cursor:pointer;opacity:0.65;transition:opacity 0.15s; }
.stat-reveal:hover { opacity:1; }
.stat-reveal > span { font-size:9px; }
.stat-reveal-body[hidden] { display:none; }
.coin-desc-inline { margin:0 0 14px;font-size:13px;line-height:1.6;color:var(--fg-muted); }
/* A real but tiny vote (0.6% of supply) rounds to a sub-pixel sliver and reads as
   "nobody voted". Non-zero tallies are emitted only when non-zero, so the floor
   never manufactures a bar out of nothing. */
.prop-bar-for { background:var(--green);min-width:2px; }
.prop-bar-against { background:var(--red);min-width:2px; }
.prop-bar-abstain { background:var(--fg-dim);min-width:2px; }
.prop-meta { display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:10px;color:var(--fg-dim);margin-top:7px;padding-top:7px;border-top:1px solid var(--border-muted); }
.prop-meta a { color:var(--fg-dim); }
.prop-meta a:hover { color:var(--fg-muted); }
.prop-meta .sep { opacity:0.5; }

.loading { text-align:center;padding:40px;color:var(--fg-muted);font-size:13px; }
@keyframes spin { to { transform:rotate(360deg); } }
.spinner {
  display:inline-block;width:14px;height:14px;border:2px solid var(--border-muted);
  border-top:2px solid var(--fg);border-radius:50%;animation:spin 0.8s linear infinite;
  vertical-align:middle;margin-right:8px;
}

/* Mobile */
@media (max-width: 600px) {
  body { padding:80px 16px max(40px, env(safe-area-inset-bottom, 40px)); }
  .header h1 { font-size:13px; }
  .coin-grid { grid-template-columns:1fr 1fr;gap:10px; }
  .coin-card { padding:12px; }
  .coin-logo { width:32px;height:32px; }
  .coin-card-name { font-size:13px; }
  .coin-card-symbol { font-size:11px; }
  .coin-card-stat { font-size:10px; }
  .coin-card-mcap { font-size:10px; }
  .coin-search { font-size:16px; }
  .coin-banner { height:130px; }
  .coin-detail-logo { width:48px;height:48px; }
  .coin-detail-title h2 { font-size:15px; }
  .coin-detail-title span { font-size:12px; }
  .section-card { padding:12px; }
  .stat-row { font-size:12px; }
  .stat-value { word-break:break-all; }
  .swap-section input { font-size:18px; }
  .swap-pct-btn { font-size:9px;padding:5px 0;border-radius:0; }
  .activity-table { font-size:11px; }
  .activity-table th, .activity-table td { padding:4px 6px; }
  .activity-body { overflow-x:auto; }
  .activity-table { min-width:480px; }
  .desc-text { font-size:12px; }
  .links-row { gap:10px;font-size:11px; }
  .drawer-toggle { padding:10px 12px; }
  /* Detail page stats grid: 4-col → 2x2 */
  .coin-stat-grid { grid-template-columns:1fr 1fr !important; }
  /* Touch-friendly preset & slippage buttons */
  .coin-preset-row button { min-height:36px;padding:6px 10px !important;font-size:11px !important; }
  .coin-slippage-row button { min-height:32px;padding:5px 8px !important;font-size:10px !important; }
  .coin-slippage-row { flex-wrap:wrap; }
  /* Buy/sell side toggle */
  .coin-side-toggle button { min-height:44px;padding:10px !important;font-size:13px !important; }
  /* Swap/action buttons */
  .swap-btn, .action-btn { min-height:48px;font-size:14px; }
  /* User balance tag */
  .coin-user-balance { font-size:11px; }
  /* Ragequit / collapsible panels */
  .coin-rq-toggle { min-height:44px;padding:10px 0; }
}
@media (max-width: 380px) {
  body { padding:70px 12px 20px; }
  .coin-grid { grid-template-columns:1fr;gap:8px; }
  .coin-detail-head { gap:10px; }
  .coin-detail-logo { width:40px;height:40px; }
  .coin-detail-title h2 { font-size:14px; }
  .section-card { padding:10px; }
  .stat-row { font-size:11px;flex-wrap:wrap;gap:2px; }
  .swap-section input { font-size:16px; }
  .swap-dir button { font-size:10px;padding:8px 0; }
  .swap-mode-tabs button { font-size:10px;padding:8px 0; }
  .coin-banner { height:100px;margin-bottom:-20px; }
  .activity-table { min-width:420px; }
  .activity-table a { font-size:10px; }
  /* Stats grid single column on very small screens */
  .coin-stat-grid { grid-template-columns:1fr 1fr !important; }
  .coin-preset-row button { padding:8px 6px !important; }
  .coin-slippage-row { gap:4px; }
}

.swap-stake { margin-top:4px;font-size:11px;color:var(--green);font-variant-numeric:tabular-nums; }

/* Keeper actions — permissionless DAO chores */
.keeper-panel { margin:10px 0 4px;padding-top:10px;border-top:1px solid var(--border-muted); }
.keeper-head {
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
  font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-dim);
}
.keeper-head a { color:var(--fg-muted);text-decoration:underline;text-underline-offset:2px; }
.keeper-head a:hover { color:var(--fg); }
.keeper-actions { display:flex;gap:10px;flex-wrap:wrap; }
.keeper-action { flex:1 1 180px;min-width:0; }
.keeper-btn {
  width:100%;padding:9px 10px;font-size:12px;font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--fg-muted);
  border:1px solid var(--border-muted);border-radius:6px;
  transition:border-color 0.15s, color 0.15s, background 0.15s;
}
/* Only an action that would actually succeed right now gets the accent — the rest
   stay legible but plainly inert, with the reason underneath. */
.keeper-btn.ready { color:var(--green);border-color:var(--green); }
.keeper-btn.ready:hover { background:var(--status-success); }
.keeper-btn:disabled { cursor:not-allowed;opacity:0.55; }
.keeper-why { margin-top:4px;font-size:10px;line-height:1.45;color:var(--fg-dim); }
.keeper-status { margin-top:8px;font-size:11px;min-height:14px; }
.keeper-status a { color:inherit;text-decoration:underline; }

/* Vault collection gallery */
.nft-tile {
  display:block;width:100%;padding:0;border:none;background:none;text-align:center;
  cursor:zoom-in;border-radius:8px;outline-offset:3px;
}
.nft-tile:hover { background:none; }
.nft-tile img {
  width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:8px;
  background:var(--surface);border:1px solid var(--border-muted);
  transition:transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.nft-tile:hover img, .nft-tile:focus-visible img {
  transform:translateY(-2px) scale(1.03);border-color:var(--fg-muted);
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
}
.nft-tile-label {
  font-size:10px;color:var(--fg-muted);margin-top:4px;letter-spacing:0.03em;
  transition:color 0.18s ease;
}
.nft-tile:hover .nft-tile-label, .nft-tile:focus-visible .nft-tile-label { color:var(--fg); }
.nft-skel {
  aspect-ratio:1;border-radius:8px;background:var(--surface);
  animation:nftPulse 1.4s ease-in-out infinite;
}
@keyframes nftPulse { 0%,100% { opacity:0.4 } 50% { opacity:0.75 } }
/* Lightbox */
.nft-lb {
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,0.72);backdrop-filter:blur(3px);
  animation:nftFade 0.15s ease;
}
@keyframes nftFade { from { opacity:0 } to { opacity:1 } }
.nft-lb-inner { max-width:min(520px,92vw);width:100%;text-align:center; }
.nft-lb img {
  width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:var(--surface);
  display:block;margin:0 auto;
}
.nft-lb-meta { margin-top:12px;font-size:12px;color:#fff;opacity:0.9; }
.nft-lb-meta a { color:#fff;text-decoration:underline; }
.nft-lb-close {
  position:absolute;top:16px;right:20px;background:none;color:#fff;font-size:22px;
  line-height:1;padding:6px 10px;opacity:0.8;
}
.nft-lb-close:hover { background:none;opacity:1; }
@media (prefers-reduced-motion: reduce) {
  .nft-tile img { transition:none }
  .nft-tile:hover img, .nft-tile:focus-visible img { transform:none }
  .nft-skel, .nft-lb { animation:none }
}
</style>

<div id="z-nav"></div>


<div id="app"></div>

<!-- Pool Mint/Burn logs, used lazily to date the DAO's LP position. Deferred: nothing
     on first paint depends on it. -->
<script defer src="../modules/pool-events.js"></script>
<script>
const $ = id => document.getElementById(id);
const _escTextMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
function escText(s) { return String(s).replace(/[&<>]/g, m => _escTextMap[m]); }
function escAttr(s) { return escText(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }


const RPCS = [
  'https://ethereum.publicnode.com',
  'https://mainnet.gateway.tenderly.co',
  'https://eth.drpc.org'
];

const WEINS = "0x0000000000696760E15f265e828DB644A0c242EB";
const WEINS_ABI = ["function reverseResolve(address) view returns (string)"];

const VIEW_HELPER = '0x00000000006631040967E58e3430e4B77921a2db';

// Ordered gateway list, not a single host. Metadata drives launch-type routing
// (renderCoinPage dispatches on metadata.launchType), so one unreachable gateway
// used to mean a cause coin silently rendered as a generic legacy DAO page.
// ipfs.io is listed last on purpose: it serves <img> fine but sends no
// Access-Control-Allow-Origin, so every fetch() for a metadata document from a
// browser fails CORS. It was first, which meant a cause's launchType could not be
// read, the page fell back to the generic DAO render, and the gallery filed the
// coin as low-liquidity. Our own pinning provider holds every zFi pin, so it leads.
const IPFS_GWS = [
  'https://ipfs.filebase.io/ipfs/',   // our own pinning provider — holds every zFi pin
  'https://dweb.link/ipfs/',
  'https://w3s.link/ipfs/',
  'https://ipfs.io/ipfs/'   // last: no CORS header, fetch() from a browser fails
];
const IPFS_GW = IPFS_GWS[0];

// <img> can't retry on its own — onerror walks to the next gateway and returns
// false only once every gateway has been tried, at which point callers apply
// their own fallback (symbol SVG, hide the banner, etc).
function ipfsNextGateway(img) {
  const src = img.getAttribute('src') || '';
  const i = IPFS_GWS.findIndex(g => src.startsWith(g));
  if (i === -1 || i + 1 >= IPFS_GWS.length) return false;
  img.src = IPFS_GWS[i + 1] + src.slice(IPFS_GWS[i].length);
  return true;
}

// Fetch JSON through each gateway in turn. Non-IPFS URIs (http, ar://) have no
// alternates, so they get a single attempt.
// One DAO on mainnet stored "ipfs://ipfs://Qm..." — collapse repeated schemes so a
// malformed URI still resolves instead of being fetched as a relative path.
function ipfsNormalize(uri) {
  let u = String(uri || '').trim();
  while (u.startsWith('ipfs://ipfs://')) u = u.slice(7);
  return u;
}

// Gateways are raced, not walked. Walking them in order cost the FIRST gateway's
// timeout before the second was even tried — 8s each, four of them, so a coin page
// whose metadata lived behind a slow or dead host sat blank for up to 32 seconds
// while every on-chain read had already landed in a few hundred milliseconds. The
// detail page awaits this alongside its multicall, so that wait was the page.
//
// The documents are small, immutable and cached in localStorage after the first hit,
// so asking four hosts at once costs little and returns at the speed of the fastest
// one that answers. Order still expresses preference: a gateway earlier in the list
// wins a tie, because a response already in hand beats one still in flight.
async function ipfsFetchJson(uri, timeoutMs) {
  uri = ipfsNormalize(uri);
  const paths = uri.startsWith('ipfs://')
    ? IPFS_GWS.map(g => g + uri.slice(7))
    : [uri.startsWith('ar://') ? 'https://arweave.net/' + uri.slice(5) : uri];

  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), timeoutMs || 8000);
  try {
    return await Promise.any(paths.map(async (url, i) => {
      // A few ms of stagger keeps the preferred gateway ahead without serialising.
      if (i > 0) await new Promise(r => setTimeout(r, i * 120));
      if (ac.signal.aborted) throw new Error('aborted');
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error('http ' + r.status);
      return await r.json();
    }));
  } catch (e) {
    // AggregateError when every gateway failed; surface something callers can log.
    throw (e && e.errors && e.errors[0]) || e || new Error('unreachable');
  } finally {
    clearTimeout(to);
    ac.abort(); // cancel the losers
  }
}

const OOB_IFACE = new ethers.Interface([
  'function sales(address) view returns (address token, address payToken, uint40 deadline, uint256 price)',
  'function allowance(address token, address spender) view returns (uint256)',
  'function name(uint256) view returns (string)',
  'function symbol(uint256) view returns (string)',
  'function contractURI() view returns (string)',
  'function shares() view returns (address)',
  'function totalSupply() view returns (uint256)'
]);

async function fetchOutOfBandCause(rpc, dao) {
  const call = (to, data) => rpc.call({ to, data });
  const dec = (fn, d) => OOB_IFACE.decodeFunctionResult(fn, d);
  // A cause is on ShareOffering or on ShareSale; ask the newer one first and fall back,
  // otherwise every cause launched from now on reads as "no sale here" and never appears.
  // sales(address) carries the same selector on both singletons — a selector is name and
  // inputs only — so one encoding serves, and just the returned tuple differs. Ask the
  // newer one first and fall back, or every cause launched from now on reads as "no sale
  // here" and never appears anywhere.
  const salesCall = OOB_IFACE.encodeFunctionData('sales', [dao]);
  const OFFER_SHAPE = ['address', 'address', 'uint40', 'uint256', 'uint256'];
  let sale = null, saleAddr = SHARE_OFFERING_ADDR;
  try {
    const raw = await call(SHARE_OFFERING_ADDR, salesCall);
    const d = ethers.AbiCoder.defaultAbiCoder().decode(OFFER_SHAPE, raw);
    if (d[3] > 0n) sale = { token: d[0], payToken: d[1], deadline: d[2], price: d[3], cap: d[4] };
  } catch {}
  if (!sale) {
    saleAddr = SHARE_SALE;
    sale = dec('sales', await call(SHARE_SALE, salesCall));
  }
  if (!sale.price || sale.price === 0n) return null;
  const [nm, sym, uri, sharesAddr, allowance] = await Promise.all([
    call(dao, OOB_IFACE.encodeFunctionData('name', [0n])).then(d => dec('name', d)[0]).catch(() => ''),
    call(dao, OOB_IFACE.encodeFunctionData('symbol', [0n])).then(d => dec('symbol', d)[0]).catch(() => ''),
    call(dao, OOB_IFACE.encodeFunctionData('contractURI', [])).then(d => dec('contractURI', d)[0]).catch(() => ''),
    call(dao, OOB_IFACE.encodeFunctionData('shares', [])).then(d => dec('shares', d)[0]),
    call(dao, OOB_IFACE.encodeFunctionData('allowance', [dao, saleAddr])).then(d => dec('allowance', d)[0]).catch(() => 0n)
  ]);
  const [supply, treasury] = await Promise.all([
    call(sharesAddr, OOB_IFACE.encodeFunctionData('totalSupply', [])).then(d => dec('totalSupply', d)[0]),
    rpc.getBalance(dao)
  ]);
  const sold = supply > 10n ** 18n ? supply - 10n ** 18n : 0n;
  return {
    dao,
    meta: { name: nm, symbol: sym, contractURI: uri, sharesToken: sharesAddr,
            lootToken: ZERO, badgesToken: ZERO, renderer: ZERO },
    sales: [{ tribTkn: ZERO, tribAmt: sale.price, forAmt: 10n ** 18n, forTkn: ZERO,
              deadline: sale.deadline, remainingSupply: allowance, totalSupply: sold + allowance,
              treasuryBalance: treasury, allowance, lpBps: 0, maxSlipBps: 0, feeOrHook: 30n }],
    tap: { ops: ZERO, tribTkn: ZERO, ratePerSec: 0n, lastClaim: 0n,
           claimable: 0n, pending: 0n, treasuryBalance: treasury, tapAllowance: 0n }
  };
}

// The sale contract does not constrain launch parameters — it only bounds them
// (feeBps up to 100%, lpTokens may be 0, lpRecipient may be any address). Our own
// launcher hardcodes a safe template, but anyone can call launch() directly and the
// result appears in this list looking identical. These checks read the values the
// coin actually launched with, so a card never advertises properties it doesn't have.
//
// lpRecipient is deliberately re-read rather than trusted from an earlier load: the
// creator can call setLpRecipient right up until the graduating buy lands, so a coin
// can show burn-address LP for its whole bonding phase and still redirect it.
const CURVE_BURN_ADDRS = new Set([ZERO, '0x000000000000000000000000000000000000dead']);

function curveLpIsPermanent(curve) {
  try { return CURVE_BURN_ADDRS.has(String(curve.lpRecipient).toLowerCase()) && BigInt(curve.lpTokens) > 0n; }
  catch { return false; }
}

// Human-readable reasons this coin deviates from the standard template. Empty array
// means it matches what the launcher produces.
//
// `vest` is the creatorVests entry and is optional -- callers that haven't read it
// pass nothing and simply get the checks that curves() alone can answer.
function curveParamWarnings(curve, vest) {
  const out = [];
  try {
    const feeBps = Number(curve.feeBps);
    if (feeBps > 300) out.push(`${(feeBps / 100).toFixed(2)}% trading fee to the creator on every buy and sell`);
    if (BigInt(curve.lpTokens) === 0n) {
      out.push('no tokens reserved for liquidity — the creator receives the raised ETH instead of a pool being seeded');
    } else if (!CURVE_BURN_ADDRS.has(String(curve.lpRecipient).toLowerCase())) {
      out.push('LP tokens go to the creator on graduation, so the liquidity can be withdrawn');
    }
    // Supply minted beyond cap + lpTokens is escrowed for the creator and unlocks on
    // graduation, subject to whatever cliff and duration they chose. It is invisible
    // in curves(), and it dilutes every buyer, so it belongs on the card.
    if (vest) {
      const total = BigInt(vest.total ?? vest[0] ?? 0);
      if (total > 0n) {
        const supply = BigInt(curve.cap) + BigInt(curve.lpTokens) + total;
        const pct = supply > 0n ? Number((total * 10000n) / supply) / 100 : 0;
        const cliff = Number(vest.cliff ?? vest[3] ?? 0);
        const duration = Number(vest.duration ?? vest[4] ?? 0);
        const when = duration === 0
          ? (cliff === 0 ? 'unlocking in full at graduation' : `unlocking in full ${fmtDuration(cliff)} after graduation`)
          : `vesting over ${fmtDuration(duration)}${cliff ? ` after a ${fmtDuration(cliff)} cliff` : ''}`;
        out.push(`${pct.toFixed(1)}% of supply is allocated to the creator, ${when}`);
      }
    }
  } catch {}
  return out;
}

// Coarse duration for the vesting note -- "3 months" reads better than "7776000s".
function fmtDuration(secs) {
  if (!secs) return '0s';
  const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60]];
  for (const [name, size] of units) {
    if (secs >= size) {
      const n = Math.round(secs / size);
      return `${n} ${name}${n === 1 ? '' : 's'}`;
    }
  }
  return `${secs} seconds`;
}

// Custom-error name -> what actually went wrong, in the user's terms. Ethers gives
// us the bare error name once the fragments above are present; this turns it into
// something a trader can act on.
const CURVE_ERROR_TEXT = {
  Graduated: 'This coin just graduated — liquidity moved to zAMM. Reloading the trade panel...',
  NotGraduable: 'Not ready to graduate yet.',
  Slippage: 'Price moved past your slippage tolerance. Raise slippage or try a smaller size.',
  DeadlineExpired: 'The transaction sat too long and expired. Try again.',
  ZeroAmount: 'Enter an amount greater than zero.',
  TransferFromFailed: 'Token transfer failed — check your balance.'
};

// Pull a friendly message out of an ethers error, falling back to its own text.
function curveErrText(e) {
  const name = e?.revert?.name || (typeof e?.errorName === 'string' ? e.errorName : null);
  if (name && CURVE_ERROR_TEXT[name]) return CURVE_ERROR_TEXT[name];
  const msg = e?.shortMessage || e?.reason || (e?.message || '').split('\n')[0] || 'Trade failed';
  return msg.length < 120 ? msg : 'Trade failed';
}

// True when the revert means "the curve finished" — the page should flip to the
// post-graduation zAMM panel rather than leave a stale bonding-curve form up.
function curveIsGraduatedErr(e) {
  return (e?.revert?.name === 'Graduated')
    || e?.data === '0x9d4b7885'
    || /Graduated/i.test(e?.shortMessage || '')
    || /Graduated/i.test(e?.message || '');
}

// Source of truth is on-chain: getAuctions(start, end) returns the flat struct
// snapshot for every id in [start, end). Display metadata comes from the NFT's
// own tokenURI at render time.

const DUTCH_AUCTION = '0x0000000003635fd3852E772C6E09Ce2aF25d7133';
const DUTCH_AUCTION_ABI = [
  'function nextId() view returns (uint256)',
  'function getAuctions(uint256,uint256) view returns (tuple(uint256 id, address seller, address token, bool isNFT, uint40 startTime, uint40 duration, uint128 startPrice, uint128 endPrice, uint128 initial, uint128 remaining, uint256[] ids, uint256 price)[])'
];
const NFT_ERC721_ABI_MIN = [
  'function tokenURI(uint256) view returns (string)',
  'function name() view returns (string)',
  'function symbol() view returns (string)'
];
const WORKER_PROXY = 'https://api.zfi.wei.is/proxy-metadata';

// Fetch up to the last N auctions (cheaper than the full history) and keep
// only live NFT listings (seller != 0 and isNFT). Closed listings are filtered
// out so the gallery only shows buyable items.
async function fetchNftAuctions(limit = 60) {
  try {
    const rows = await withRPC(async rpc => {
      const c = new ethers.Contract(DUTCH_AUCTION, DUTCH_AUCTION_ABI, rpc);
      const nextId = await c.nextId();
      if (nextId === 0n) return [];
      const start = nextId > BigInt(limit) ? nextId - BigInt(limit) : 0n;
      return await c.getAuctions(start, nextId);
    });
    return rows.filter(a => a.seller !== ZERO && a.isNFT);
  } catch (e) {
    console.warn('fetchNftAuctions failed:', e);
    return [];
  }
}

// Metadata fetcher mirroring the auction detail page — direct fetch first,
// worker proxy on CORS failure. Covers ipfs://, ar://, http(s), and data URIs.
async function auctionFetchMeta(uri) {
  if (!uri) return {};
  // Bare on-chain JSON with no data: prefix — see fetchMetadata().
  if (uri.trimStart().startsWith('{')) { try { return JSON.parse(uri); } catch { return {}; } }
  if (uri.startsWith('data:application/json')) {
    const comma = uri.indexOf(',');
    const body = uri.slice(comma + 1);
    const isB64 = uri.slice(5, comma).includes('base64');
    const s = isB64 ? atob(body) : decodeURIComponent(body);
    try { return JSON.parse(s); } catch { return {}; }
  }
  // Every IPFS gateway first, then the worker proxy for CORS-blocked origins.
  try { return await ipfsFetchJson(uri); } catch {}
  const url = uri.startsWith('ipfs://') ? IPFS_GW + uri.slice(7)
           : uri.startsWith('ar://')   ? 'https://arweave.net/' + uri.slice(5)
           : uri;
  try {
    const r = await fetch(`${WORKER_PROXY}?url=${encodeURIComponent(url)}`);
    if (r.ok) return await r.json();
  } catch {}
  return {};
}

// Batched enrichment for the gallery — replaces an O(N) fan-out (3 RPC reads per
// auction) with a single multicall3. The IPFS metadata fetches still run in
// parallel per-auction since the URIs are heterogeneous.
async function batchEnrichNftAuctions(auctions) {
  if (!auctions.length) return [];

  // Step 1: Batch tokenURI + name + symbol into one multicall3 across all the
  // source NFT contracts.
  const needOnchain = auctions.slice();
  const onchainData = {};
  if (needOnchain.length > 0) {
    const erc721I = new ethers.Interface(NFT_ERC721_ABI_MIN);
    const calls = [];
    for (const a of needOnchain) {
      const tokenId = a.ids[0];
      calls.push({ target: a.token, allowFailure: true, callData: erc721I.encodeFunctionData('tokenURI', [tokenId]) });
      calls.push({ target: a.token, allowFailure: true, callData: erc721I.encodeFunctionData('name') });
      calls.push({ target: a.token, allowFailure: true, callData: erc721I.encodeFunctionData('symbol') });
    }
    try {
      const mcRes = await withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(calls);
      });
      const decode = (r, fn) => {
        if (!r || !r.success) return '';
        try { return erc721I.decodeFunctionResult(fn, r.returnData)[0]; } catch { return ''; }
      };
      for (let i = 0; i < needOnchain.length; i++) {
        const a = needOnchain[i];
        onchainData[a.id.toString()] = {
          uri: decode(mcRes[i * 3], 'tokenURI'),
          name: decode(mcRes[i * 3 + 1], 'name'),
          symbol: decode(mcRes[i * 3 + 2], 'symbol'),
        };
      }
    } catch {}
  }

  // Step 2: Resolve metadata IPFS in parallel. Heterogeneous URIs (IPFS, Arweave, http)
  // mean we can't batch this layer further; fan it out and let the gateway concurrency budget cap it.
  return Promise.all(auctions.map(async a => {
    const oc = onchainData[a.id.toString()];
    if (oc) {
      const tokenId = a.ids[0];
      try {
        const md = await auctionFetchMeta(oc.uri);
        return {
          a,
          meta: {
            name: md.name || `${oc.symbol || oc.name || 'NFT'} #${tokenId.toString()}`,
            image: md.image || '',
            collName: oc.name,
          },
        };
      } catch {}
    }
    return { a, meta: { name: `NFT #${a.ids[0]?.toString() || '?'}`, image: '' } };
  }));
}

function _fmtAuctionDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec/60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ${m%60}m`;
  const d = Math.floor(h/24);
  return `${d}d ${h%24}h`;
}

function renderZammV0CoinCard(c) {
  const sym = String(c.symbol || '').slice(0, 24);
  const name = c.name || sym;
  const liq = typeof c.liquidityEth === 'number' ? c.liquidityEth : 0;
  // Adaptive precision: at the bottom of the gallery, ZAMM v0 coins can have sub-milli-ETH
  // liquidity. The old 3-decimal floor showed those as "0.000 Ξ" — useless. Carry more
  // decimals down to the noise floor and fall back to scientific for sub-µETH so users
  // can still tell a non-zero pool from genuinely empty.
  const liqFmt = liq >= 10 ? liq.toFixed(1)
    : liq >= 1 ? liq.toFixed(2)
    : liq >= 0.0001 ? liq.toFixed(5)
    : liq > 0 ? liq.toExponential(2)
    : '0';
  const holders = typeof c.holders === 'number' ? c.holders : 0;
  const imgHref = c.imageUrl
    ? (c.imageUrl.startsWith('ipfs://') ? IPFS_GW + c.imageUrl.slice(7)
     : c.imageUrl.startsWith('https://') ? c.imageUrl : '')
    : '';
  const initial = (sym[0] || '?').toUpperCase();
  const logoInner = imgHref
    ? `<img src="${escAttr(imgHref)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover" onerror="if(!ipfsNextGateway(this))this.outerHTML='${escAttr(initial)}'">`
    : escText(initial);
  const searchable = `${name} ${sym} zamm coin`.toLowerCase();
  // Deeplink to the swap page using the coin's ERC20 wrapper address
  // (= `address(uint160(coinId))`). The swap page's ?to= resolver matches by 0x address,
  // which is collision-free regardless of how the dropdown suffixes the symbol on its end.
  // Coins whose coinId doesn't fit in 160 bits don't have an ERC20 wrapper and can't be
  // routed via sweep — fall back to the canonical ZAMM swap so the click still goes somewhere.
  const cid = (() => { try { return BigInt(c.coinId); } catch { return null; } })();
  const wrapperAddr = (cid !== null && cid < (1n << 160n))
    ? '0x' + cid.toString(16).padStart(40, '0')
    : null;
  const href = wrapperAddr ? `../?to=${wrapperAddr}` : `../?to=ZAMM`;
  const dataAddr = wrapperAddr || COINS_SINGLETON.toLowerCase();
  const isSpam = _spamSet.has(dataAddr);
  return `<a href="${href}" class="coin-card${isSpam ? ' coin-spam' : ''}" data-name="${escAttr(searchable)}" data-symbol="${escAttr(sym.toLowerCase())}" data-addr="${dataAddr}" data-coin-id="${escAttr(String(c.coinId))}" style="position:relative">
      ${spamBtnHTML(dataAddr, isSpam)}
      <div class="coin-card-head">
        <div class="coin-logo">${logoInner}</div>
        <div style="min-width:0;flex:1">
          <div class="coin-card-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escText(name)}</div>
          <div class="coin-card-symbol">$${escText(sym)} &middot; ZAMM</div>
        </div>
      </div>
      <div class="coin-card-stat" style="font-variant-numeric:tabular-nums">${liqFmt} Ξ liq${holders > 0 ? ' &middot; ' + holders.toLocaleString() + ' holders' : ''}</div>
    </a>`;
}

const ZORG_DAO = '0x5E58BA0e06ED0F5558f83bE732a4b899a674053E';
const ZORG_TOKEN = '0x00a6bA94BBb5474725515De88fE04F854f2dCb12';
const ZORG_VERIFY_THRESHOLD = 100000n * (10n ** 18n);
const ZORG_CHAT_ABI = [
  'function chat(string) payable',
  'function badges() view returns (address)',
  'event Message(address indexed from, uint256 indexed index, string text)'
];
// Moloch.chat() gates on `badges.balanceOf(msg.sender) != 0`, NOT on share balance.
// The badge (a top-256 shareholder seat) is minted by Badges.onSharesChanged, which
// only fires on a share balance change — so a holder who bought 100k+ zOrg through a
// path that never touched the Shares transfer hook has no seat and every chat() call
// reverts with Unauthorized. A zero-value self-transfer of shares re-triggers the hook
// and mints the seat, so we preflight the badge and offer that as a one-click fix.
const ZORG_BADGES_ABI = ['function balanceOf(address) view returns (uint256)'];
const ZORG_SHARES_ABI = ['function transfer(address,uint256) returns (bool)'];

let _userIsVerified = false;
let _spamSet = new Set();

// Flag button markup. Every card type in the gallery renders this so a verified
// 100k+ zOrg holder can flag any coin, not just bonding-curve launches.
function spamBtnHTML(addr, isSpam) {
  if (!_userIsVerified || isSpam || !addr) return '';
  return `<button class="spam-btn" title="Flag as spam" onclick="event.preventDefault();event.stopPropagation();flagCoinAsSpam('${addr}')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;

// Load cached spam list synchronously (no RPC), then update in background
function loadSpamListCached() {
  try {
    const cached = localStorage.getItem('zfi_spam_cache');
    if (cached) {
      const c = JSON.parse(cached);
      _spamSet = new Set(c.addrs || []);
    }
  } catch {}
  return _spamSet;
}

async function loadSpamListFresh() {
  try {
    const cached = localStorage.getItem('zfi_spam_cache');
    let fromBlock = 21000000;
    let existing = new Set(_spamSet);
    if (cached) {
      try { fromBlock = (JSON.parse(cached).block || fromBlock) + 1; } catch {}
    }
    const latestBlock = await withRPC(async rpc => rpc.getBlockNumber());
    if (fromBlock > latestBlock) return _spamSet;
    const dao = await withRPC(async rpc => new ethers.Contract(ZORG_DAO, ZORG_CHAT_ABI, rpc));
    const CHUNK = 50000;
    // Parallelize chunk queries
    const chunks = [];
    for (let start = fromBlock; start <= latestBlock; start += CHUNK) {
      chunks.push([start, Math.min(start + CHUNK - 1, latestBlock)]);
    }
    const results = await Promise.all(chunks.map(([s, e]) =>
      dao.queryFilter(dao.filters.Message(), s, e).catch(() => [])
    ));
    for (const events of results) {
      for (const ev of events) {
        const text = ev.args?.text || '';
        const m = text.match(/<<<COIN_SPAM\s+address="(0x[0-9a-fA-F]{40})"\s*COIN_SPAM>>>/);
        if (m) existing.add(m[1].toLowerCase());
      }
    }
    _spamSet = existing;
    try {
      localStorage.setItem('zfi_spam_cache', JSON.stringify({ addrs: [...existing], block: latestBlock }));
    } catch {}
    return _spamSet;
  } catch {
    return _spamSet;
  }
}

async function flagCoinAsSpam(coinAddr) {
  const s = await connectWallet();
  if (!s) return;
  if (!_userIsVerified) { _spamToast('You need 100k+ zOrg shares to flag coins.'); return; }
  if (!confirm(`Flag ${coinAddr} as spam in the ZORG DAO chat?`)) return;

  // Preflight the on-chain gate so a missing seat surfaces as a fixable prompt
  // rather than an opaque "Unauthorized" revert.
  if (!(await userHasZorgBadge(_connectedAddress))) {
    if (!confirm('Your DAO seat badge is not minted yet, so the flag would revert.\n\nClaim it now? This sends a zero-value zOrg self-transfer that registers your seat, then you can flag.')) return;
    try {
      const shares = new ethers.Contract(ZORG_TOKEN, ZORG_SHARES_ABI, s);
      const seatTx = await shares.transfer(_connectedAddress, 0n);
      await seatTx.wait();
    } catch (e) {
      if (e.code !== 'ACTION_REJECTED' && !(e.message || '').includes('user rejected')) {
        _spamToast('Could not claim seat: ' + (e.shortMessage || e.message || ''));
      }
      return;
    }
    if (!(await userHasZorgBadge(_connectedAddress))) {
      _spamToast('Seat not granted — the top-256 shareholder seats are full at a higher balance than yours.');
      return;
    }
  }

  try {
    const dao = new ethers.Contract(ZORG_DAO, ZORG_CHAT_ABI, s);
    const msg = `<<<COIN_SPAM address="${coinAddr}" COIN_SPAM>>>`;
    const tx = await dao.chat(msg);
    await tx.wait();
    _spamSet.add(coinAddr.toLowerCase());
    try {
      const cached = localStorage.getItem('zfi_spam_cache');
      if (cached) {
        const c = JSON.parse(cached);
        c.addrs = [...new Set([...(c.addrs || []), coinAddr.toLowerCase()])];
        localStorage.setItem('zfi_spam_cache', JSON.stringify(c));
      }
    } catch {}
    // Hide every card for this address immediately (a coin can appear in more
    // than one section, e.g. a DAICO that also has a ZAMM v0 listing).
    const cards = document.querySelectorAll(`.coin-card[data-addr="${coinAddr.toLowerCase()}"]`);
    cards.forEach(card => {
      card.classList.add('coin-spam');
      card.style.display = 'none';
      card.querySelector('.spam-btn')?.remove();
    });
    // Update spam count display
    const countEl = document.getElementById('spamCount');
    if (countEl) {
      const cur = parseInt(countEl.dataset.count || '0') + 1;
      countEl.dataset.count = cur;
      const label = document.getElementById('spamCountLabel');
      if (label) {
        label.textContent = cur + ' flagged';
      }
    }
  } catch(e) {
    if (e.code !== 'ACTION_REJECTED' && !(e.message||'').includes('user rejected')) {
      _spamToast('Failed to flag: ' + (e.shortMessage || e.message || ''));
    }
  }
}

let rpcIdx = 0;
// Reuse RPC providers instead of creating new ones per call
const _rpcProviders = RPCS.map(url => new ethers.JsonRpcProvider(url, 1, { staticNetwork: true }));
// A public RPC that accepts the socket and then goes quiet never rejects, so without a
// deadline the failover loop below never advances and the page sits on "Loading..."
// forever. Each attempt races a timer; a timeout is a failure like any other and moves
// us to the next provider.
const RPC_TIMEOUT_MS = 12000;
function _rpcDeadline(promise, ms) {
  let t;
  return Promise.race([
    promise.finally(() => clearTimeout(t)),
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error('RPC timeout')), ms); })
  ]);
}
async function withRPC(fn, timeoutMs) {
  for (let i = 0; i < _rpcProviders.length; i++) {
    try {
      const rpc = _rpcProviders[(rpcIdx + i) % _rpcProviders.length];
      const result = await _rpcDeadline(Promise.resolve(fn(rpc)), timeoutMs || RPC_TIMEOUT_MS);
      rpcIdx = (rpcIdx + i) % _rpcProviders.length;
      return result;
    } catch(e) { if (i === _rpcProviders.length - 1) throw e; }
  }
}

function resolveIPFS(uri) {
  if (!uri) return '';
  uri = ipfsNormalize(uri);
  if (uri.startsWith('ipfs://')) return IPFS_GW + uri.slice(7);
  return uri;
}

const _metadataCache = {};
async function fetchMetadata(contractURI) {
  if (!contractURI) return {};
  // In-memory cache (survives within session)
  if (_metadataCache[contractURI]) return _metadataCache[contractURI];
  // localStorage cache for IPFS URIs (content-addressed, immutable)
  if (contractURI.startsWith('ipfs://')) {
    try {
      const cached = localStorage.getItem('zfi_meta_' + contractURI.slice(7, 27));
      if (cached) { const m = JSON.parse(cached); _metadataCache[contractURI] = m; return m; }
    } catch {}
  }
  try {
    let metadata;
    if (contractURI.trimStart().startsWith('{')) {
      // Four early ClassicalCurveSale launches (SHIVWEI, SLOPPS, MAYBEWEI, GREGWEI)
      // stored raw JSON with no `data:` prefix. It's on-chain and immutable, so the
      // client has to cope — otherwise they render with no name, logo, or socials.
      metadata = JSON.parse(contractURI);
    } else if (contractURI.startsWith('data:')) {
      const json = contractURI.split(',').slice(1).join(',');
      if (contractURI.startsWith('data:application/json;base64,')) {
        metadata = JSON.parse(atob(json));
      } else {
        // `;utf8,` payloads are NOT percent-encoded, and DUNABrandRenderer emits one.
        // decodeURIComponent() throws on a bare '%' — reachable through any DAO name —
        // and the catch below turns that into {}, which drops the coin to the wrong
        // detail page. Parse as written first, and only percent-decode as a fallback
        // for the genuinely encoded `;charset=utf-8,` documents.
        try { metadata = JSON.parse(json); } catch { metadata = JSON.parse(decodeURIComponent(json)); }
      }
    } else {
      // Walks every gateway before giving up — a single unreachable host used to
      // return {} here, which drops the coin to the wrong detail page.
      metadata = await ipfsFetchJson(contractURI);
    }
    metadata = await mergeCharterMetadata(metadata);
    _metadataCache[contractURI] = metadata;
    if (contractURI.startsWith('ipfs://')) {
      try { localStorage.setItem('zfi_meta_' + contractURI.slice(7, 27), JSON.stringify(metadata)); } catch {}
    }
    return metadata;
  } catch { return {}; }
}

// A DAO rendered by DUNABrandRenderer returns the covenant composed with the few
// branding fields worth putting on-chain (image, launchType) and links the rest —
// banner, description, socials, creator — as `external_url`. Fold that document in so
// every caller sees the same shape it saw when the pin WAS the contractURI.
//
// On-chain fields win: they are what the DAO actually committed to, and the pinned
// document is mutable-by-reupload in a way the renderer's output is not. A pin that
// fails to fetch degrades to the on-chain half rather than to nothing.
async function mergeCharterMetadata(metadata) {
  if (!metadata || metadata.charter !== 'duna') return metadata;
  const pin = metadata.external_url;
  if (!pin || typeof pin !== 'string' || !pin.startsWith('ipfs://')) return metadata;
  try {
    const pinned = await ipfsFetchJson(pin);
    if (!pinned || typeof pinned !== 'object') return metadata;
    // Drop empty on-chain strings so they don't mask a real pinned value.
    const onchain = {};
    for (const [k, v] of Object.entries(metadata)) if (v !== '' && v != null) onchain[k] = v;
    return { ...pinned, ...onchain };
  } catch { return metadata; }
}

function symbolSVG(symbol, size) {
  size = size || 40;
  const letter = (symbol || '?')[0].toUpperCase();
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="var(--surface)"/><text x="${size/2}" y="${size*0.65}" text-anchor="middle" font-size="${size*0.45}" fill="var(--fg)" font-family="Helvetica,Arial,sans-serif" font-weight="700">${escText(letter)}</text></svg>`;
}

// Two glyphs carry the whole cause page: the ETH it is denominated in and the coin
// it is selling. ETH_ICON is already a coloured faceted diamond, which is all the
// colour this layout wants — the brutalism stays, the money gets a face.
function ethGlyph(px) {
  px = px || 13;
  return `<span style="display:inline-flex;vertical-align:-0.15em;width:${px}px;height:${px}px">`
    + ETH_ICON.replace('width="24" height="24"', `width="${px}" height="${px}"`) + `</span>`;
}

// The cause's own logo at glyph scale, for the places that talk about its shares.
function causeGlyph(meta, metadata, px) {
  px = px || 13;
  return `<span style="display:inline-flex;vertical-align:-0.15em;width:${px}px;height:${px}px;`
    + `border-radius:50%;overflow:hidden;flex-shrink:0">${logoHTML(meta, metadata, px)}</span>`;
}

// An ETH amount with its glyph attached, so a column of numbers reads as money.
function ethAmount(text, px) {
  return `<span style="display:inline-flex;align-items:center;gap:4px">${ethGlyph(px)}<span>${text}</span></span>`;
}

function logoHTML(meta, metadata, size) {
  size = size || 40;
  const imgUrl = resolveIPFS(metadata.image);
  // loading="lazy" on small (gallery-card) logos so off-screen tiles don't compete
  // with above-the-fold images for the initial network burst. Detail-page logos
  // (size > 48) still load eagerly since they're always in view.
  if (imgUrl) {
    const lazy = size <= 48 ? ' loading="lazy" decoding="async"' : '';
    return `<img src="${escAttr(imgUrl)}" alt=""${lazy} onerror="if(!ipfsNextGateway(this))this.parentNode.innerHTML=symbolSVG(${escAttr(JSON.stringify(meta.symbol))},${size})">`;
  }
  return symbolSVG(meta.symbol, size);
}

function computePoolId(token0, token1, id0, id1, fee) {
  const [sA, sB] = token0.toLowerCase() < token1.toLowerCase() ? [token0, token1] : [token1, token0];
  const [sId0, sId1] = token0.toLowerCase() < token1.toLowerCase() ? [id0, id1] : [id1, id0];
  return BigInt(ethers.keccak256(ethers.AbiCoder.defaultAbiCoder().encode(
    ['uint256','uint256','address','address','uint256'], [sId0, sId1, sA, sB, fee]
  )));
}

}

function fmtAge(ts) {
  const diff = Math.floor(Date.now() / 1000) - ts;
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

// A sale deadline is a *future* timestamp, so fmtAge() renders it as a negative
// "-2591999s ago". Cause launches default to a 30-day deadline, which means the
// status tile was wrong on essentially every freshly launched cause coin.
function fmtDeadline(ts) {
  const left = ts - Math.floor(Date.now() / 1000);
  if (left <= 0) return 'ended ' + fmtAge(ts);
  if (left < 3600) return Math.max(1, Math.floor(left / 60)) + 'm left';
  if (left < 86400) return Math.floor(left / 3600) + 'h left';
  const days = Math.floor(left / 86400);
  const hours = Math.floor((left % 86400) / 3600);
  return days < 7 && hours > 0 ? `${days}d ${hours}h left` : `${days}d left`;
}

async function loadHolders(daoAddr) {
  const content = $('holdersContent');
  if (!content) return;
  content.innerHTML = `<div class="activity-empty">${zfiLoadingSVG(32)} Loading...</div>`;
  try {
    const result = await withRPC(async rpc => {
      const helper = new ethers.Contract(VIEW_HELPER, GET_DAO_FULL_ABI, rpc);
      return await helper.getDAOWithDAICO(daoAddr, 0, 0, 0, 0, [], [ZERO]);
    });
    const members = result.base.members;
    if (!members || members.length === 0) {
      content.innerHTML = '<div class="activity-empty">No shareholders yet</div>';
      return;
    }
    const totalSupply = result.base.supplies.sharesTotalSupply + result.base.supplies.lootTotalSupply;
    const zammLower = ZAMM.toLowerCase();
    const daoLower = daoAddr.toLowerCase();

    // Sort by shares descending, filter zero balances
    const sorted = [...members]
      .filter(m => (m.shares || 0n) + (m.loot || 0n) > 0n)
      .sort((a, b) => {
        const aTotal = (a.shares || 0n) + (a.loot || 0n);
        const bTotal = (b.shares || 0n) + (b.loot || 0n);
        return bTotal > aTotal ? 1 : bTotal < aTotal ? -1 : 0;
      });

    if (sorted.length === 0) {
      content.innerHTML = '<div class="activity-empty">No shareholders yet</div>';
      return;
    }

    // Render immediately with short addresses
    function renderHolders(names) {
      let html = '';
      const maxHeld = sorted.reduce((mx, m) => {
        const t = (m.shares || 0n) + (m.loot || 0n);
        return t > mx ? t : mx;
      }, 0n);
      sorted.forEach((m, i) => {
        const addr = m.account;
        const addrLower = addr.toLowerCase();
        const total = (m.shares || 0n) + (m.loot || 0n);
        const pctNum = totalSupply > 0n ? Number(total * 10000n / totalSupply) / 100 : 0;
        const pct = pctNum.toFixed(1);
        const short = addr.slice(0, 6) + '\u2026' + addr.slice(-4);
        const displayName = names[i] || short;

        let tag = '';
        if (addrLower === zammLower) tag = '<span class="holder-tag holder-tag-pool">Pool</span>';
        else if (addrLower === daoLower) tag = '<span class="holder-tag holder-tag-dao">DAO</span>';

        const pctColor = pctNum >= 10 ? 'var(--green)' : pctNum >= 1 ? 'var(--fg)' : 'var(--fg-muted)';

        const barW = maxHeld > 0n ? Number(total * 1000n / maxHeld) / 10 : 0;

        html += `<div class="holder-row" style="--w:${barW}%">
          <div class="holder-addr"><a href="https://etherscan.io/address/${addr}" target="_blank" title="${addr}">${escText(displayName)}</a></div>
          ${tag}
          <div class="holder-shares">${fmtShares(total)}</div>
          <div class="holder-pct" style="color:${pctColor}">${pct}%</div>
        </div>`;
      });
      content.innerHTML = html;
    }

    // Show immediately with addresses
    const names = new Array(sorted.length).fill('');
    renderHolders(names);

    // Batch resolve .wei names via multicall
    try {
      const weinsIface = new ethers.Interface(WEINS_ABI);
      const calls = sorted.map(m => ({
        target: WEINS, allowFailure: true,
        callData: weinsIface.encodeFunctionData('reverseResolve', [m.account])
      }));
      const results = await withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(calls);
      });
      const needENS = [];
      for (let i = 0; i < sorted.length; i++) {
        if (results[i].success) {
          try {
            const decoded = weinsIface.decodeFunctionResult('reverseResolve', results[i].returnData);
            if (decoded[0]) { names[i] = decoded[0].toLowerCase(); continue; }
          } catch {}
        }
        needENS.push(i);
      }
      renderHolders(names);

      // Backfill ENS for addresses without .wei names
      if (needENS.length > 0) {
        const ensProvider = new ethers.JsonRpcProvider(RPCS[0], 1, { staticNetwork: true });
        const ensPromises = needENS.map(i =>
          ensProvider.lookupAddress(sorted[i].account).catch(() => null)
        );
        const ensResults = await Promise.all(ensPromises);
        let changed = false;
        ensResults.forEach((name, j) => {
          if (name) { names[needENS[j]] = name; changed = true; }
        });
        if (changed) renderHolders(names);
      }
    } catch (e) {
      console.warn('Name resolution failed:', e);
    }
  } catch (e) {
    console.error('loadHolders error:', e);
    content.innerHTML = '<div class="activity-empty">Failed to load shareholders</div>';
  }
}

// Holder discovery is entirely on-chain: candidates come from the token's own
// Transfer logs (scanned back from launchTime), and balances come from a single
// multicall of balanceOf. There is no off-chain index to fall out of sync — which
// also means the panel is bounded by what the public RPCs will serve for eth_getLogs.
async function loadCurveHolders(tokenAddr) {
  const content = $('curveHoldersContent');
  if (!content) return;
  content.innerHTML = `<div class="activity-empty">${zfiLoadingSVG(32)} Loading...</div>`;

  // Tag map for well-known addresses so users can tell pool/curve/burn balances apart from real holders.
  const curve = _curveData;
  const creatorAddr = curve?.creator ? curve.creator.toLowerCase() : null;
  const TAG = {
    [CURVE_SALE.toLowerCase()]: { label: 'Curve', cls: 'holder-tag-pool' },
    [ZAMM.toLowerCase()]: { label: 'Pool', cls: 'holder-tag-pool' },
    '0x000000000000000000000000000000000000dead': { label: 'Burn', cls: 'holder-tag-dao' },
  };
  if (creatorAddr) TAG[creatorAddr] = { label: 'Creator', cls: 'holder-tag-badge' };

  async function fallbackTransferScan() {
    const latestBlock = await withRPC(async rpc => rpc.getBlockNumber());
    const nowSec = Math.floor(Date.now() / 1000);
    const launchTime = curve ? Number(curve.launchTime) : 0;
    const SEC_PER_BLOCK = 12;
    // Estimate launch block from the on-chain launchTime; cap ~30 days back as a safety bound
    // since public RPCs reject huge ranges, and the curve token couldn't have existed before that.
    const blocksBack = launchTime > 0
      ? Math.min(216000, Math.ceil((nowSec - launchTime) / SEC_PER_BLOCK) + 200)
      : 50000;
    const fromBlock = Math.max(0, latestBlock - blocksBack);
    const transferTopic = ethers.id('Transfer(address,address,uint256)');
    const CHUNK = 9000;
    const ranges = [];
    for (let s = fromBlock; s <= latestBlock; s += CHUNK) {
      ranges.push([s, Math.min(s + CHUNK - 1, latestBlock)]);
    }
    const logsPerChunk = await Promise.all(ranges.map(([s, e]) =>
      withRPC(async rpc => rpc.getLogs({
        address: tokenAddr,
        topics: [transferTopic],
        fromBlock: s,
        toBlock: e
      })).catch(() => [])
    ));
    const ZADDR = ZERO.toLowerCase();
    const recipients = new Set();
    for (const logs of logsPerChunk) {
      for (const log of logs) {
        if (!log.topics || log.topics.length < 3) continue;
        // topics[2] = `to` (32-byte padded). Receivers are the only candidates that may currently hold balance.
        const to = ('0x' + log.topics[2].slice(26)).toLowerCase();
        if (to !== ZADDR) recipients.add(to);
      }
    }
    return [...recipients];
  }

  try {
    // Candidate holders come from the token's own Transfer logs.
    let candidateAddrs = [];
    try { candidateAddrs = await fallbackTransferScan(); }
    catch { candidateAddrs = []; }

    if (candidateAddrs.length === 0) {
      content.innerHTML = '<div class="activity-empty">No holders yet</div>';
      return;
    }

    // Cap candidates so the multicall stays reasonable. Sorting later by balance bubbles real holders up.
    const addrs = candidateAddrs.slice(0, 200);

    // balanceOf for each candidate + totalSupply, all in one multicall.
    const erc20I = new ethers.Interface(ERC20_ABI);
    const calls = addrs.map(a => ({
      target: tokenAddr, allowFailure: true,
      callData: erc20I.encodeFunctionData('balanceOf', [a])
    }));
    calls.push({ target: tokenAddr, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) });
    const mcRes = await withRPC(async rpc => {
      const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
      return await mc.aggregate3(calls);
    });

    let totalSupply = 0n;
    const tsRes = mcRes[mcRes.length - 1];
    if (tsRes.success) {
      try { totalSupply = erc20I.decodeFunctionResult('totalSupply', tsRes.returnData)[0]; } catch {}
    }

    const holders = [];
    for (let i = 0; i < addrs.length; i++) {
      if (!mcRes[i].success) continue;
      try {
        const bal = erc20I.decodeFunctionResult('balanceOf', mcRes[i].returnData)[0];
        if (bal > 0n) holders.push({ addr: addrs[i], bal });
      } catch {}
    }
    holders.sort((a, b) => a.bal > b.bal ? -1 : a.bal < b.bal ? 1 : 0);

    if (holders.length === 0) {
      content.innerHTML = '<div class="activity-empty">No holders yet</div>';
      return;
    }

    function renderCurveHolderRows(names) {
      let html = '';
      const maxBal = holders.reduce((mx, h) => (h.bal > mx ? h.bal : mx), 0n);
      holders.forEach((h, i) => {
        const tag = TAG[h.addr];
        const short = h.addr.slice(0, 6) + '\u2026' + h.addr.slice(-4);
        const display = tag ? tag.label : (names[i] || short);
        const tagHTML = tag ? `<span class="holder-tag ${tag.cls}">${tag.label}</span>` : '';
        const pctNum = totalSupply > 0n ? Number(h.bal * 10000n / totalSupply) / 100 : 0;
        const pctColor = pctNum >= 10 ? 'var(--green)' : pctNum >= 1 ? 'var(--fg)' : 'var(--fg-muted)';
        const barW = maxBal > 0n ? Number(h.bal * 1000n / maxBal) / 10 : 0;
        html += `<div class="holder-row" style="--w:${barW}%">
          <div class="holder-addr"><a href="https://etherscan.io/address/${h.addr}" target="_blank" title="${h.addr}">${escText(display)}</a>${tag ? ' ' + tagHTML : ''}</div>
          <div class="holder-shares">${fmtTokenAmount(h.bal.toString())}</div>
          <div class="holder-pct" style="color:${pctColor}">${pctNum.toFixed(1)}%</div>
        </div>`;
      });
      content.innerHTML = html;
    }

    const names = new Array(holders.length).fill('');
    renderCurveHolderRows(names);

    // Background reverse-resolve .wei names \u2014 only for addresses we don't already have a tag for.
    try {
      const weinsIface = new ethers.Interface(WEINS_ABI);
      const nameCalls = holders.map(h => ({
        target: WEINS, allowFailure: true,
        callData: weinsIface.encodeFunctionData('reverseResolve', [h.addr])
      }));
      const nameRes = await withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(nameCalls);
      });
      for (let i = 0; i < holders.length; i++) {
        if (TAG[holders[i].addr]) continue;
        if (!nameRes[i].success) continue;
        try {
          const decoded = weinsIface.decodeFunctionResult('reverseResolve', nameRes[i].returnData);
          if (decoded[0]) names[i] = decoded[0].toLowerCase();
        } catch {}
      }
      renderCurveHolderRows(names);
    } catch {}
  } catch (e) {
    content.innerHTML = '<div class="activity-empty">Failed to load holders</div>';
  }
}

// ---- LP seed attribution ----
// The LP-fee estimate credits lifetime pool fee growth to the DAO's units, which is only
// right if the DAO's LP dates from the pool's first Mint. That can't be read from state,
// so it's checked once against the seeding log and cached — the answer never changes for a
// given pool, and nothing on the page waits for it.
const LP_SEED_TTL = 30 * 24 * 3600 * 1000;

async function verifyLpSeeder(poolId, daoAddr) {
  const key = `lpSeed:${poolId}`;
  try {
    const hit = JSON.parse(localStorage.getItem(key) || 'null');
    if (hit && Date.now() - hit.ts < LP_SEED_TTL) return hit;
  } catch {}
  if (!window.poolEvents) return null;

  // Walk back until the scan is exhausted (cursor null == reached the zAMM deploy floor).
  // Public RPCs cap log ranges, so a long-lived pool may not be reachable; in that case the
  // oldest Mint seen is NOT necessarily the pool's first, and the answer must stay unknown
  // rather than blaming whoever happens to be oldest in the window.
  const mints = [];
  let cursor = null, exhausted = false;
  for (let i = 0; i < 6; i++) {
    const { events, nextCursor } = await window.poolEvents.load(poolId, {
      limit: 500, before: cursor, maxChunks: 16
    });
    mints.push(...events.filter(e => e.type === 'LIQADD'));
    if (!nextCursor) { exhausted = true; break; }
    cursor = nextCursor;
  }
  if (!exhausted || !mints.length) return { ts: Date.now(), inconclusive: true };
  mints.sort((a, b) => a.blockNumber - b.blockNumber || a.logIndex - b.logIndex);
  const first = mints[0];

  let seeder = (first.maker || '').toLowerCase();
  // Mint records the caller, which may be a router or helper. Fall back to the tx sender.
  let via = null;
  if (seeder && seeder !== daoAddr.toLowerCase()) {
    try {
      const tx = await withRPC(async rpc => await rpc.getTransaction(first.txhash));
      if (tx && tx.from) { via = seeder; seeder = tx.from.toLowerCase(); }
    } catch {}
  }
  const out = {
    ts: Date.now(),
    isDao: seeder === daoAddr.toLowerCase(),
    seeder, via,
    block: first.blockNumber,
    time: first.timestamp || null
  };
  try { localStorage.setItem(key, JSON.stringify(out)); } catch {}
  return out;
}

// Compact duration: "2d 4h", "3h 12m", "45m", "30s"
function fmtDur(secs) {
  secs = Math.max(0, Math.floor(secs));
  const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600);
  const m = Math.floor((secs % 3600) / 60), s = secs % 60;
  if (d > 0) return h > 0 ? `${d}d ${h}h` : `${d}d`;
  if (h > 0) return m > 0 ? `${h}h ${m}m` : `${h}h`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

function fmtAgo(ts) {
  const secs = Math.floor(Date.now() / 1000) - ts;
  if (secs < 60) return 'just now';
  return fmtDur(secs) + ' ago';
}

// Live-tick any [data-deadline] countdowns rendered into the proposals drawer.
let _propTimer = null;
function startPropCountdowns() {
  if (_propTimer) clearInterval(_propTimer);
  const tick = () => {
    const els = document.querySelectorAll('[data-deadline]');
    if (!els.length) { clearInterval(_propTimer); _propTimer = null; return; }
    const now = Math.floor(Date.now() / 1000);
    els.forEach(el => {
      const dl = Number(el.dataset.deadline);
      const left = dl - now;
      if (left <= 0) {
        el.textContent = el.dataset.expiredText || '';
        el.removeAttribute('data-deadline');
      } else {
        el.textContent = (el.dataset.prefix || '') + fmtDur(left);
      }
    });
  };
  tick();
  _propTimer = setInterval(tick, 1000);
}

// Chat is written by humans who paste raw links and 42-character addresses. Both are
// unreadable inline and neither is clickable, so a message that cites a contract or a
// source makes the reader copy it out by hand. Links open; addresses shorten and go to
// Etherscan. Tokenised on the raw text and escaped per-segment, so nothing a message
// contains can escape into markup.
function linkifyChat(text) {
  const PAT = /(https?:\/\/[^\s<>"']+)|(\b0x[0-9a-fA-F]{40}\b)/g;
  let out = '', last = 0, m;
  while ((m = PAT.exec(text)) !== null) {
    out += escText(text.slice(last, m.index));
    if (m[1]) {
      // Trailing punctuation reads as sentence, not URL.
      const url = m[1].replace(/[.,;:)\]]+$/, '');
      const trail = m[1].slice(url.length);
      const shown = url.replace(/^https?:\/\/(www\.)?/, '');
      out += `<a href="${escAttr(url)}" target="_blank" rel="noopener noreferrer" class="prop-chat-link" title="${escAttr(url)}">${escText(shown.length > 48 ? shown.slice(0, 47) + '…' : shown)}</a>${escText(trail)}`;
    } else {
      const a = m[2];
      out += `<a href="https://etherscan.io/address/${escAttr(a)}" target="_blank" rel="noopener noreferrer" class="prop-chat-link" title="${escAttr(a)}">${escText(a.slice(0, 6) + '…' + a.slice(-4))}</a>`;
    }
    last = m.index + m[0].length;
  }
  return out + escText(text.slice(last));
}

// Hide everything past `keep` in a rendered list behind one "show all" button. The
// hidden nodes stay in the DOM so countdowns and expanders wired elsewhere survive.
function collapseList(root, selector, keep, label) {
  const items = [...root.querySelectorAll(selector)];
  if (items.length <= keep + 1) return;
  const hidden = items.slice(keep);
  hidden.forEach(el => { el.style.display = 'none'; });
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'prop-showall';
  btn.textContent = `Show ${hidden.length} older ${label}`;
  btn.addEventListener('click', () => {
    hidden.forEach(el => { el.style.display = ''; });
    btn.remove();
  });
  items[keep - 1].after(btn);
}
