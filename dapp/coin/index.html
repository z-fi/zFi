let _vaultGalleryItems = [];   // { id, name, image } per decoded pass
let _nftLbKeyHandler = null;

function openNftLightbox(i) {
  const it = _vaultGalleryItems[i];
  if (!it) return;
  closeNftLightbox();
  const lb = document.createElement('div');
  lb.className = 'nft-lb';
  lb.id = 'nftLightbox';
  lb.setAttribute('role', 'dialog');
  lb.setAttribute('aria-modal', 'true');
  lb.setAttribute('aria-label', it.name);
  lb.innerHTML = `
    <button type="button" class="nft-lb-close" aria-label="Close" onclick="closeNftLightbox()">&times;</button>
    <div class="nft-lb-inner">
      <img src="${escAttr(it.image)}" alt="${escAttr(it.name)}">
      <div class="nft-lb-meta">
        ${escText(it.name)}
        &middot; <a href="https://opensea.io/item/ethereum/${VAULT_NFT_CONTRACT}/${it.id}" target="_blank" rel="noopener">OpenSea</a>
        &middot; <a href="https://etherscan.io/token/${VAULT_NFT_CONTRACT}?a=${it.id}" target="_blank" rel="noopener">Etherscan</a>
      </div>
    </div>`;
  // Backdrop closes; clicks on the art itself do not.
  lb.addEventListener('click', e => { if (e.target === lb || e.target.closest('.nft-lb-inner') === null) closeNftLightbox(); });
  _nftLbKeyHandler = e => {
    if (e.key === 'Escape') closeNftLightbox();
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const next = (i + (e.key === 'ArrowRight' ? 1 : -1) + _vaultGalleryItems.length) % _vaultGalleryItems.length;
      openNftLightbox(next);
    }
  };
  document.addEventListener('keydown', _nftLbKeyHandler);
  document.body.appendChild(lb);
  lb.querySelector('.nft-lb-close').focus();
}

function closeNftLightbox() {
  const el = $('nftLightbox');
  if (el) el.remove();
  if (_nftLbKeyHandler) { document.removeEventListener('keydown', _nftLbKeyHandler); _nftLbKeyHandler = null; }
}

// ==================== SALE BUY ====================

function updateSaleBtnState() {
  const btn = $('saleBuyBtn');
  if (!btn || !_signer) return;
  const raw = ($('salePayInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    btn.textContent = 'Buy';
    btn.disabled = false;
    return;
  }
  try {
    const payAmt = ethers.parseEther(raw);
    if (payAmt > _ethBalance) {
      btn.textContent = 'Insufficient ETH';
      btn.disabled = true;
      return;
    }
    const isContSale = !!$('app')?.dataset?.contSale;
    if (!isContSale && _saleData && _saleData.remainingSupply <= 0n) {
      btn.textContent = 'Sale ended';
      btn.disabled = true;
      return;
    }
    if (!isContSale && _saleData) {
      const gross = payAmt * _saleData.forAmt / _saleData.tribAmt;
      if (gross > _saleData.remainingSupply) {
        btn.textContent = 'Exceeds remaining';
        btn.disabled = true;
        return;
      }
    }
  } catch {}
  btn.textContent = 'Buy';
  btn.disabled = false;
}

function updateSaleUsd() {
  const el = $('saleUsdEstimate');
  if (!el) return;
  const raw = ($('salePayInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0 || _ethUsdPrice <= 0) {
    el.textContent = '';
    return;
  }
  el.textContent = '~' + fmtUsd(Number(raw) * _ethUsdPrice);
}

// Sale shares are newly minted, so they dilute: the stake is measured against the
// supply this purchase would create.
function updateSaleStake() {
  const el = $('saleStake');
  if (!el) return;
  const raw = ($('saleReceiveInput')?.value || '').trim();
  let shares = 0n;
  if (raw && !isNaN(raw) && Number(raw) > 0) { try { shares = ethers.parseEther(raw); } catch {} }
  el.innerHTML = shares > 0n ? daoStakeHint(shares, true) : '';
}

function onSalePayInput() {
  _saleExactOut = false;
  updateSaleUsd();
  const raw = ($('salePayInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    $('saleReceiveInput').value = '';
    const lpEl = $('saleLpNote'); if (lpEl) lpEl.textContent = '';
    updateSaleStake();
    updateSaleBtnState();
    return;
  }
  const payAmt = ethers.parseEther(raw);

  // Continuous Sale: fixed rate (1 ETH = 1M shares)
  if ($('app').dataset.contSale) {
    const shares = payAmt * BigInt(CONT_SALE_SHARES_PER_ETH);
    $('saleReceiveInput').value = ethers.formatEther(shares);
    const lpEl = $('saleLpNote'); if (lpEl) lpEl.textContent = '';
    updateSaleStake();
    updateSaleBtnState();
    return;
  }

  if (!_saleData || !_saleData.forAmt || !_saleData.tribAmt) return;
  const gross = payAmt * _saleData.forAmt / _saleData.tribAmt;
  const lpBps = BigInt(_saleData.lpBps);
  const lpShares = gross * lpBps / 10000n;
  const net = gross - lpShares;
  $('saleReceiveInput').value = ethers.formatEther(net);
  if (lpBps > 0n) {
    $('saleLpNote').textContent = `~${fmtShares(net)} shares (${Number(lpBps)/100}% to LP)`;
  } else {
    $('saleLpNote').textContent = '';
  }
  updateSaleStake();
  updateSaleBtnState();
}

function onSaleReceiveInput() {
  _saleExactOut = true;
  const raw = ($('saleReceiveInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    $('salePayInput').value = '';
    updateSaleUsd();
    const lpEl = $('saleLpNote'); if (lpEl) lpEl.textContent = '';
    updateSaleStake();
    return;
  }

  // Continuous Sale: fixed rate (1M shares per ETH). Round the ETH up — flooring it
  // would quote a payment that mints fewer shares than the amount just typed.
  if ($('app').dataset.contSale) {
    const shares = ethers.parseEther(raw);
    const rate = BigInt(CONT_SALE_SHARES_PER_ETH);
    const ethNeeded = (shares + rate - 1n) / rate;
    $('salePayInput').value = ethers.formatEther(ethNeeded);
    updateSaleUsd();
    updateSaleStake();
    updateSaleBtnState();
    return;
  }

  if (!_saleData || !_saleData.forAmt || !_saleData.tribAmt) return;
  const buyAmt = ethers.parseEther(raw);
  const lpBps = BigInt(_saleData.lpBps);
  // grossNeeded = ceil(buyAmt * 10000 / (10000 - lpBps))
  const denom = 10000n - lpBps;
  if (denom === 0n) { $('salePayInput').value = ''; $('saleLpNote').textContent = ''; return; }
  const grossNeeded = (buyAmt * 10000n + denom - 1n) / denom;
  // payNeeded = ceil(grossNeeded * tribAmt / forAmt)
  const payNeeded = (grossNeeded * _saleData.tribAmt + _saleData.forAmt - 1n) / _saleData.forAmt;
  $('salePayInput').value = ethers.formatEther(payNeeded);
  updateSaleUsd();
  if (lpBps > 0n) {
    $('saleLpNote').textContent = `~${fmtShares(buyAmt)} shares (${Number(lpBps)/100}% to LP)`;
  } else {
    $('saleLpNote').textContent = '';
  }
  updateSaleStake();
  updateSaleBtnState();
}

function fillSweep() {
  if (!_saleData || !_saleData.forAmt || !_saleData.tribAmt || _saleData.remainingSupply <= 0n) return;
  const lpBps = BigInt(_saleData.lpBps);
  // remainingSupply is gross (includes LP portion), net to buyer = remaining * (10000 - lpBps) / 10000
  const net = _saleData.remainingSupply * (10000n - lpBps) / 10000n;
  // cost = ceil(remainingSupply * tribAmt / forAmt)
  const payNeeded = (_saleData.remainingSupply * _saleData.tribAmt + _saleData.forAmt - 1n) / _saleData.forAmt;
  $('saleReceiveInput').value = ethers.formatEther(net);
  $('salePayInput').value = ethers.formatEther(payNeeded);
  updateSaleUsd();
  _saleExactOut = false;
  if (lpBps > 0n) {
    $('saleLpNote').textContent = `~${fmtShares(net)} shares (${Number(lpBps)/100}% to LP)`;
  } else {
    $('saleLpNote').textContent = '';
  }
}

function copySaleLink() {
  const amt = ($('salePayInput').value || '').trim();
  const dao = $('app')?.dataset?.dao;
  if (!dao) return;
  const base = location.origin + location.pathname;
  const url = amt && Number(amt) > 0
    ? `${base}?amt=${amt}#${dao}`
    : `${base}#${dao}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = $('saleCopyLink');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy share link'; }, 1500); }
  }).catch(() => {});
}

async function onSaleBuyBtn() {
  if (!_signer) { await connectWallet(); return; }
  executeSaleBuy();
}

async function executeSaleBuy() {
  const s = await connectWallet();
  if (!s) return;

  const payRaw = ($('salePayInput').value || '').trim();
  const recvRaw = ($('saleReceiveInput').value || '').trim();
  if (!payRaw || isNaN(payRaw) || Number(payRaw) <= 0) return;

  const daoAddr = $('app').dataset.dao;
  const contSaleAddr = $('app').dataset.contSale;
  const btn = $('saleBuyBtn');
  btn.textContent = 'Confirm in wallet...';
  btn.disabled = true;

  try {
    const payAmt = ethers.parseEther(payRaw);

    // Route to Continuous Sale if available
    if (contSaleAddr) {
      const cs = new ethers.Contract(contSaleAddr, CONTINUOUS_SALE_ABI, s);
      const tx = await cs.buy({ value: payAmt });
      btn.innerHTML = `Confirming... <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px;color:inherit;opacity:0.7">View tx</a>`;
      await tx.wait();
      const quoteEl = $('saleQuote');
      if (quoteEl) quoteEl.innerHTML = `<span style="color:var(--green)">Purchase confirmed!</span> <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px">View tx</a>`;
      $('salePayInput').value = '';
      if ($('saleReceiveInput')) $('saleReceiveInput').value = '';
      btn.textContent = 'Buy';
      btn.disabled = false;
      setTimeout(() => renderCoinPage(daoAddr), 2000);
      return;
    }

    if (!_saleData) return;
    if (!recvRaw || isNaN(recvRaw) || Number(recvRaw) <= 0) return;

    const daico = new ethers.Contract(DAICO_ADDR, DAICO_BUY_ABI, s);
    const netShares = ethers.parseEther(recvRaw);

    let tx;
    if (_saleExactOut) {
      // exact-out: get exact buyAmt, pay up to 5% more
      const maxPay = payAmt * 105n / 100n;
      tx = await daico.buyExactOut(daoAddr, ZERO, netShares, maxPay, { value: maxPay });
    } else {
      // exact-in: pay exact payAmt, get at least 95% of estimate
      const minBuyAmt = netShares * 95n / 100n;
      tx = await daico.buy(daoAddr, ZERO, payAmt, minBuyAmt, { value: payAmt });
    }
    btn.innerHTML = `Confirming... <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px;color:inherit;opacity:0.7">View tx</a>`;
    await tx.wait();

    const quoteEl = $('saleQuote');
    if (quoteEl) quoteEl.innerHTML = `<span style="color:var(--green)">Purchase confirmed!</span> <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px">View tx</a>`;
    $('salePayInput').value = '';
    $('saleReceiveInput').value = '';
    $('saleLpNote').textContent = '';

    setTimeout(() => renderCoinPage(daoAddr), 2000);
  } catch(e) {
    console.error('Sale buy error:', e);
    const quoteEl = $('saleQuote');
    if (e.code === 'ACTION_REJECTED' || (e.message||'').includes('user rejected')) {
      if (quoteEl) quoteEl.textContent = 'Cancelled';
    } else {
      const raw = (e.shortMessage || e.reason || e.message || '').split('\n')[0];
      let msg = raw;
      if (/insufficient funds/i.test(raw)) msg = 'Insufficient ETH balance (including gas)';
      else if (/exceeds balance/i.test(raw)) msg = 'Amount exceeds your ETH balance';
      else if (/allowance|supply/i.test(raw)) msg = 'Exceeds remaining sale supply';
      else if (/deadline|expired/i.test(raw)) msg = 'Sale has ended';
      else if (/slippage|amount/i.test(raw)) msg = 'Price moved — try again';
      if (quoteEl) quoteEl.innerHTML = `<span style="color:var(--red)">Buy failed:</span> ${escText(msg)}`;
    }
  } finally {
    btn.textContent = 'Buy';
    btn.disabled = false;
  }
}

function quoteLpZap(ethAmount) {
  const foh = BigInt($('app').dataset.feeOrHook || '30');
  // If feeOrHook > 10000 it's a hook address, not fee bps — fall back to 30 bps
  const feeBps = foh > 10000n ? 30n : foh;
  const isHooked = foh > 10000n;
  const halfEth = ethAmount / 2n;
  const amtInWithFee = halfEth * (10000n - feeBps);
  const tokensOut = (amtInWithFee * _poolReserve1) / (_poolReserve0 * 10000n + amtInWithFee);
  return { halfEth, tokensOut, feeBps, isHooked };
}

// Max ETH that can be zapped without exceeding slippage tolerance.
// The swap half moves the price; we find the max ethAmount such that
// price impact stays within the user's slippage %.
// After swapping halfEth, new reserve0 = R0 + halfEth, new reserve1 = R1 - tokensOut.
// For the LP add to succeed, the ratio (halfEth / tokensOut) must be close to
// (R0 + halfEth) / (R1 - tokensOut), within slippage.
// Simpler bound: price impact ≈ halfEth / R0, so max halfEth ≈ R0 * slipPct.
// Then max total zap ≈ 2 * R0 * slipPct.
function maxZapETH() {
  if (_poolReserve0 === 0n) return 0n;
  const slip = Number(($('lpZapSlippage')?.value || '5').trim()) || 5;
  // Use slip% of reserve as max for the swap half, then double for total zap
  return _poolReserve0 * BigInt(slip) * 2n / 100n;
}

async function executeSwap() {
  const s = await connectWallet();
  if (!s) return;

  const raw = _exactOut ? $('swapReceiveInput').value.trim() : $('swapPayInput').value.trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) return;

  const shares = $('app').dataset.shares;
  const feeOrHook = BigInt($('app').dataset.feeOrHook || '30');
  const address = await s.getAddress();
  const deadline = Math.floor(Date.now() / 1000) + 600;

  const btn = $('swapBtn');
  const origText = btn.textContent;
  btn.textContent = 'Swapping...';
  btn.disabled = true;

  try {
    const isBuy = _swapDir === 'buy';
    const amount = ethers.parseEther(raw);
    const tokenIn = isBuy ? ZERO : shares;
    const tokenOut = isBuy ? shares : ZERO;

    // Route the buy to whichever source gives more. Decided here rather than trusting the
    // displayed quote, so an amount edited inside the debounce window still routes on its
    // own numbers. Minting is fixed-rate: no slippage, no approval — just send the ETH.
    const contSaleAddr = $('app').dataset.contSale;
    let useMint = false, mintPay = 0n;
    if (isBuy && contSaleAddr) {
      const rate = BigInt(CONT_SALE_SHARES_PER_ETH);
      mintPay = _exactOut ? (amount + rate - 1n) / rate : amount;
      const fresh = _cachedQuote && Date.now() - _cachedQuote.ts < 15000
        && _cachedQuote.exactOut === _exactOut && _cachedQuote.tokenIn === tokenIn
        && _cachedQuote.tokenOut === tokenOut && _cachedQuote.amount === amount
        ? _cachedQuote.result
        : await withRPC(async rpc => {
            const q = new ethers.Contract(ZQUOTER, QUOTE_ABI, rpc);
            return await q.quoteZAMM(_exactOut, feeOrHook, tokenIn, tokenOut, 0, 0, amount);
          }).catch(() => null);
      // No pool quote at all (no liquidity) still leaves the mint as a route.
      useMint = !fresh || (_exactOut ? mintPay < fresh.amountIn : amount * rate > fresh.amountOut);
    }
    if (useMint) {
      const payAmt = mintPay;
      btn.textContent = 'Confirm in wallet...';
      const cs = new ethers.Contract(contSaleAddr, CONTINUOUS_SALE_ABI, s);
      const mintTx = await cs.buy({ value: payAmt });
      btn.innerHTML = `Confirming... <a href="https://etherscan.io/tx/${mintTx.hash}" target="_blank" style="font-size:11px;color:inherit;opacity:0.7">View tx</a>`;
      await mintTx.wait();
      $('swapQuote').innerHTML = `<span style="color:var(--green)">Minted!</span> <a href="https://etherscan.io/tx/${mintTx.hash}" target="_blank" style="font-size:11px">View tx</a>`;
      $('swapPayInput').value = '';
      $('swapReceiveInput').value = '';
      setTimeout(() => renderCoinPage($('app').dataset.dao), 2000);
      return;
    }
    // ZAMM PoolKey: token0=ETH(ZERO), token1=shares. Buy=zeroForOne(true), Sell=zeroForOne(false)
    const poolKey = { id0: 0, id1: 0, token0: ZERO, token1: shares, feeOrHook: feeOrHook };

    // Reuse cached quote if fresh (<15s) and params match, otherwise re-fetch
    let quote;
    if (_cachedQuote && Date.now() - _cachedQuote.ts < 15000
        && _cachedQuote.exactOut === _exactOut
        && _cachedQuote.tokenIn === tokenIn && _cachedQuote.tokenOut === tokenOut
        && _cachedQuote.amount === amount) {
      quote = _cachedQuote.result;
    } else {
      quote = await withRPC(async rpc => {
        const quoter = new ethers.Contract(ZQUOTER, QUOTE_ABI, rpc);
        return await quoter.quoteZAMM(_exactOut, feeOrHook, tokenIn, tokenOut, 0, 0, amount);
      });
    }

    let tx;
    if (!_exactOut) {
      // Exact input: user specifies how much they pay
      const minOut = quote.amountOut * 95n / 100n; // 5% slippage

      if (!isBuy) {
        // Selling shares: approve ZAMM
        const token = new ethers.Contract(shares, ERC20_ABI, s);
        const allow = await token.allowance(address, ZAMM);
        if (allow < amount) {
          btn.textContent = 'Approving...';
          await (await token.approve(ZAMM, ethers.MaxUint256)).wait();
        }
      }

      btn.textContent = 'Confirm in wallet...';
      const pool = new ethers.Contract(ZAMM, ZAMM_ABI, s);
      tx = await pool.swapExactIn(
        poolKey, amount, minOut, isBuy, address, deadline,
        { value: isBuy ? amount : 0n }
      );
    } else {
      // Exact output: user specifies how much they receive
      const maxIn = quote.amountIn * 105n / 100n; // 5% slippage

      if (!isBuy) {
        // Selling shares: approve ZAMM for max input
        const token = new ethers.Contract(shares, ERC20_ABI, s);
        const allow = await token.allowance(address, ZAMM);
        if (allow < maxIn) {
          btn.textContent = 'Approving...';
          await (await token.approve(ZAMM, ethers.MaxUint256)).wait();
        }
      }

      btn.textContent = 'Confirm in wallet...';
      const pool = new ethers.Contract(ZAMM, ZAMM_ABI, s);
      tx = await pool.swapExactOut(
        poolKey, amount, maxIn, isBuy, address, deadline,
        { value: isBuy ? maxIn : 0n }
      );
    }

    btn.innerHTML = `Confirming... <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px;color:inherit;opacity:0.7">View tx</a>`;
    await tx.wait();

    $('swapQuote').innerHTML = `<span style="color:var(--green)">Swap confirmed!</span> <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px">View tx</a>`;
    $('swapPayInput').value = '';
    $('swapReceiveInput').value = '';

    // Refresh page data
    setTimeout(() => renderCoinPage($('app').dataset.dao), 2000);
  } catch(e) {
    if (e.code === 'ACTION_REJECTED' || (e.message||'').includes('user rejected')) {
      $('swapQuote').textContent = 'Cancelled';
    } else {
      $('swapQuote').textContent = 'Swap failed: ' + (e.shortMessage || e.reason || e.message || '').split('\n')[0].slice(0, 80);
    }
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

// ==================== TAP CLAIM ====================

const DAICO_CLAIM_ABI = ['function claimTap(address dao) returns (uint256 claimed)'];

async function onTapClaim() {
  const s = await connectWallet();
  if (!s) return;
  const btn = $('tapClaimBtn');
  if (!btn) return;
  const origText = btn.textContent;
  btn.textContent = 'Claiming...';
  btn.disabled = true;
  try {
    const daico = new ethers.Contract(DAICO_ADDR, DAICO_CLAIM_ABI, s);
    const tx = await daico.claimTap($('app').dataset.dao);
    btn.innerHTML = `Confirming... <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px;color:inherit;opacity:0.7">View tx</a>`;
    await tx.wait();
    btn.textContent = 'Claimed!';
    setTimeout(() => location.reload(), 1500);
  } catch(e) {
    if (e.code === 'ACTION_REJECTED' || (e.message||'').includes('user rejected')) {
      btn.textContent = 'Cancelled';
    } else {
      btn.textContent = 'Failed';
    }
    setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 2000);
  }
}

// ==================== OPS UNLOCK ====================

const OPS_UNLOCK_ABI = ['function unlock(address token, address to, uint256 id, uint256 amount, uint256 unlockTime)'];

async function onOpsUnlock(token, to, coinId, amount, unlockTime) {
  const s = await connectWallet();
  if (!s) return;
  const btn = $('opsUnlockBtn');
  if (!btn) return;
  const origText = btn.textContent;
  btn.textContent = 'Unlocking...';
  btn.disabled = true;
  try {
    const zamm = new ethers.Contract(ZAMM, OPS_UNLOCK_ABI, s);
    const tx = await zamm.unlock(token, to, BigInt(coinId), BigInt(amount), BigInt(unlockTime));
    btn.innerHTML = `Confirming... <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="font-size:11px;color:inherit;opacity:0.7">View tx</a>`;
    await tx.wait();
    btn.textContent = 'Unlocked!';
    setTimeout(() => location.reload(), 1500);
  } catch(e) {
    if (e.code === 'ACTION_REJECTED' || (e.message||'').includes('user rejected')) {
      btn.textContent = 'Cancelled';
    } else {
      btn.textContent = 'Failed';
    }
    setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 2000);
  }
}

// ==================== INIT ====================
// onConnect fires after tryAutoConnect resolves, which happens AFTER the initial
// route()/renderGallery() runs. Without a re-render here, _userIsVerified stays
// false and the spam buttons never paint on cold load.
walletInit({ appName: 'zFi Coins', onConnect: [updateModeButton, loadBalances, () => { const h = location.hash.replace('#','').trim(); if (!(h && h.startsWith('0x') && h.length === 42)) renderGallery(); }], onDisconnect: [updateModeButton, () => { _userIsVerified = false; }] });
route();
