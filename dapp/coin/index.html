      &middot; <a href="https://etherscan.io/address/${curve.creator}" target="_blank" style="color:inherit">Creator</a>
    </div>
  `;

  app.innerHTML = html;

  // Draw price chart in the user-selected mode (curve trajectory or OHLCV candles).
  drawCurveChartActive($('curveChart'), observations);
  // Re-render on viewport changes so the canvas stays sharp on resize / orientation flips.
  _attachCurveChartResize($('curveChart'));

  // Anti-sniper window: the launch fee starts elevated and decays to the base fee
  // over sniperDuration. Quotes already price this in, but nothing explained *why*
  // an early buyer is paying 5% instead of 1%, or that simply waiting is cheaper.
  startCurveSniperNotice(baseFeeBps, sniperFeeBps, sniperDuration, launchTimeSec, graduated);
}

function startCurveSniperNotice(baseFeeBps, sniperFeeBps, sniperDuration, launchTimeSec, graduated) {
  if (_curveSniperTimer) { clearInterval(_curveSniperTimer); _curveSniperTimer = null; }
  const el = $('curveSniperNotice');
  if (!el) return;
  if (graduated || !sniperDuration || sniperFeeBps <= baseFeeBps) { el.style.display = 'none'; return; }

  const tick = () => {
    const node = $('curveSniperNotice');
    if (!node || !node.isConnected) { clearInterval(_curveSniperTimer); _curveSniperTimer = null; return; }
    const left = (launchTimeSec + sniperDuration) - Math.floor(Date.now() / 1000);
    if (left <= 0) {
      node.style.display = 'none';
      clearInterval(_curveSniperTimer);
      _curveSniperTimer = null;
      return;
    }
    // Mirrors ClassicalCurveSale._effectiveFee (and _effFeeAt above).
    const elapsed = sniperDuration - left;
    const feeNow = baseFeeBps + Math.floor((sniperFeeBps - baseFeeBps) * (sniperDuration - elapsed) / sniperDuration);
    const mins = Math.floor(left / 60), secs = left % 60;
    const leftTxt = mins > 0 ? `${mins}m ${String(secs).padStart(2, '0')}s` : `${secs}s`;
    const pct = Math.max(0, Math.min(100, (elapsed / sniperDuration) * 100));
    node.style.display = '';
    node.innerHTML = `
      <div style="margin-bottom:14px;padding:8px 10px;border-radius:6px;background:var(--surface);border-left:3px solid #FF9800">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:600;color:#FF9800">Anti-sniper fee active &mdash; ${(feeNow / 100).toFixed(2)}%</span>
          <span style="font-size:11px;color:var(--fg-muted)">${leftTxt} until ${(baseFeeBps / 100).toFixed(2)}%</span>
        </div>
        <div style="font-family:monospace;font-size:10px;line-height:1;color:var(--fg-dim);display:flex;width:100%;margin-top:5px"><span style="flex:${Math.max(pct, 0.5)};overflow:hidden;white-space:nowrap">${'█'.repeat(200)}</span><span style="flex:${Math.max(100 - pct, 0.5)};overflow:hidden;white-space:nowrap">${'░'.repeat(200)}</span></div>
        <div style="font-size:10px;color:var(--fg-dim);margin-top:4px">Buying now costs more. The fee decays to ${(baseFeeBps / 100).toFixed(2)}% and goes to the creator either way.</div>
      </div>`;
  };
  tick();
  _curveSniperTimer = setInterval(tick, 1000);
}

// ---- Chart ----
// Bonding-curve view: X axis is supply sold (0% → 100%), Y axis is price (start → end).
// The full curve is drawn as the backdrop so the chart is meaningful with zero trades.
// Each historical trade is plotted as a dot at its derived position on the curve, so
// even a coin with one or two buys looks like a real chart — buy positions land where
// the price curve says they should, and the user sees the whole curve they're trading on.
function drawCurveChart(canvas, observations) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const cssW = rect.width || 440, cssH = rect.height || 200;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = cssW, h = cssH;
  const dark = document.documentElement.classList.contains('dark');
  const mutedColor = dark ? '#666' : '#888';
  const dimColor = dark ? '#444' : '#bbb';
  const gridColor = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';
  const bgColor = dark ? '#000' : '#fff';
  const buyColor = '#4CAF50';
  const sellColor = '#EF5350';

  // Curve params from on-chain config. Fall back to a soft message if missing.
  const curve = _curveData;
  if (!curve || !curve.cap || BigInt(curve.cap) === 0n) {
    ctx.fillStyle = mutedColor;
    ctx.font = '12px Helvetica,Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Curve not configured', w / 2, h / 2);
    return;
  }

  // Layout
  const LEFT = Math.max(40, w * 0.10);
  const RIGHT = 14, TOP = 14, BOTTOM = 18;
  const chartH = h - TOP - BOTTOM;
  const chartW = w - LEFT - RIGHT;
  const fontSize = Math.max(8, Math.min(10, w * 0.024));

  // Numeric curve — work in human units (1e18-scaled → float). Loses precision
  // for absurdly large supplies but the curve at 1B token / 1e9-wei start price
  // sits comfortably in float64.
  const cap = Number(BigInt(curve.cap)) / 1e18;
  const sold = Number(BigInt(curve.sold)) / 1e18;
  const startPrice = Number(BigInt(curve.startPrice)) / 1e18;
  const endPrice = Number(BigInt(curve.endPrice)) / 1e18;
  const vr = Number(BigInt(curve.virtualReserve)) / 1e18;
  const flat = endPrice <= startPrice;

  const priceAt = (x) => {
    if (flat) return startPrice;
    const denom = vr - x;
    return denom > 0 ? startPrice * vr * vr / (denom * denom) : endPrice;
  };

  // Y range: full curve span so the curve always fits exactly.
  // Add a small visual headroom so the line doesn't kiss the edges.
  const yMin = startPrice;
  const yMax = flat ? startPrice * 1.001 : endPrice;
  const yPad = (yMax - yMin) * 0.05;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const yToPx = (p) => {
    const t = (p - yLo) / (yHi - yLo);
    return TOP + chartH - Math.max(0, Math.min(1, t)) * chartH;
  };
  const xToPx = (x) => LEFT + (Math.max(0, Math.min(cap, x)) / cap) * chartW;

  // Grid (4 vertical, 3 horizontal)
  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 0.5;
  for (let g = 1; g < 4; g++) {
    const gx = LEFT + (g / 4) * chartW;
    ctx.beginPath(); ctx.moveTo(gx, TOP); ctx.lineTo(gx, h - BOTTOM); ctx.stroke();
  }
  for (let g = 1; g < 3; g++) {
    const gy = TOP + (g / 3) * chartH;
    ctx.beginPath(); ctx.moveTo(LEFT, gy); ctx.lineTo(w - RIGHT, gy); ctx.stroke();
  }
  // Frame
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.moveTo(LEFT, TOP); ctx.lineTo(LEFT, h - BOTTOM); ctx.lineTo(w - RIGHT, h - BOTTOM); ctx.stroke();

  // Sample the curve once and reuse for fill + stroke.
  const N = 96;
  const ptsX = new Array(N + 1), ptsY = new Array(N + 1);
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * cap;
    ptsX[i] = xToPx(x);
    ptsY[i] = yToPx(priceAt(x));
  }
  const soldPx = xToPx(sold);
  const soldPy = yToPx(priceAt(sold));

  // Sold-region fill (under curve, left of current sold)
  if (sold > 0) {
    ctx.fillStyle = buyColor + '18';
    ctx.beginPath();
    ctx.moveTo(LEFT, h - BOTTOM);
    for (let i = 0; i <= N; i++) {
      const x = (i / N) * cap;
      if (x > sold) break;
      ctx.lineTo(ptsX[i], ptsY[i]);
    }
    ctx.lineTo(soldPx, soldPy);
    ctx.lineTo(soldPx, h - BOTTOM);
    ctx.closePath();
    ctx.fill();
  }

  // Curve — unsold portion (dashed, muted)
  ctx.strokeStyle = mutedColor;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  let started = false;
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * cap;
    if (x < sold) continue;
    if (!started) { ctx.moveTo(soldPx, soldPy); started = true; }
    ctx.lineTo(ptsX[i], ptsY[i]);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Curve — sold portion (solid, accent)
  if (sold > 0) {
    ctx.strokeStyle = buyColor;
    ctx.lineWidth = 1.75;
    ctx.beginPath();
    ctx.moveTo(LEFT, yToPx(priceAt(0)));
    for (let i = 0; i <= N; i++) {
      const x = (i / N) * cap;
      if (x > sold) break;
      ctx.lineTo(ptsX[i], ptsY[i]);
    }
    ctx.lineTo(soldPx, soldPy);
    ctx.stroke();
  }

  // Trade markers — derive supply position from price using the inverse curve formula:
  // x = vr · (1 − √(startPrice / price)). For the flat-curve degenerate case we have
  // no positional information from price alone, so trades collapse onto the current sold marker.
  if (observations && observations.length > 0) {
    for (const o of observations) {
      const price = Number(BigInt(o.price)) / 1e18;
      let xPos;
      if (flat) {
        xPos = sold;
      } else {
        const ratio = startPrice / price;
        xPos = ratio > 0 && ratio <= 1 ? vr * (1 - Math.sqrt(ratio)) : sold;
      }
      const mx = xToPx(xPos);
      const my = yToPx(price);
      ctx.fillStyle = o.isSell ? sellColor : buyColor;
      ctx.strokeStyle = bgColor;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(mx, my, 2.75, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  // Current spot marker — slightly larger ring at (sold, current price)
  ctx.fillStyle = buyColor;
  ctx.strokeStyle = bgColor;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(soldPx, soldPy, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Y-axis price labels (start, mid, end) — per 1M tokens, matching the header.
  // Anchor at the actual y-pixel for each value so labels sit on their data point
  // rather than drifting up to the chart edge (yHi/yLo are padded above/below).
  ctx.fillStyle = mutedColor;
  ctx.font = `${fontSize}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(formatEthPrice(yMax * 1e6), LEFT - 4, yToPx(yMax));
  ctx.fillText(formatEthPrice(((yMax + yMin) / 2) * 1e6), LEFT - 4, yToPx((yMax + yMin) / 2));
  ctx.fillText(formatEthPrice(yMin * 1e6), LEFT - 4, yToPx(yMin));
  ctx.fillStyle = dimColor;
  ctx.font = `${Math.max(7, fontSize - 1)}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('ETH/1M', LEFT - 4, TOP);

  // X-axis labels: 0%, 50%, 100% (supply sold)
  ctx.fillStyle = mutedColor;
  ctx.font = `${fontSize}px monospace`;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText('0%', LEFT, h - BOTTOM + 3);
  ctx.textAlign = 'center';
  ctx.fillText('50%', LEFT + chartW / 2, h - BOTTOM + 3);
  ctx.textAlign = 'right';
  ctx.fillText('100%', w - RIGHT, h - BOTTOM + 3);

  // Floating "X.X% sold" label near the spot marker — flips to the other side
  // of the marker so it doesn't run off the right edge as graduation approaches.
  const soldPct = cap > 0 ? (sold / cap * 100) : 0;
  if (soldPct > 0.05) {
    const labelText = soldPct.toFixed(soldPct < 1 ? 2 : 1) + '% sold';
    ctx.font = `bold ${fontSize}px monospace`;
    const labelW = ctx.measureText(labelText).width;
    const onLeft = (soldPx + 8 + labelW) > (w - RIGHT);
    ctx.textAlign = onLeft ? 'right' : 'left';
    const lx = onLeft ? soldPx - 6 : soldPx + 6;
    const ly = Math.max(TOP + 2, soldPy - 10);
    // tiny pill background for readability over the curve
    const padX = 3, padY = 2;
    ctx.fillStyle = dark ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.85)';
    ctx.fillRect(
      onLeft ? lx - labelW - padX : lx - padX,
      ly - padY,
      labelW + padX * 2,
      fontSize + padY * 2
    );
    ctx.fillStyle = buyColor;
    ctx.textBaseline = 'top';
    ctx.fillText(labelText, lx, ly);
  }
}

// Dispatches to the active chart renderer. Both modes share the same canvas so the toggle
// is a swap-in-place — no layout reflow.
function drawCurveChartActive(canvas, observations) {
  if (_curveChartMode === 'price') drawPriceChart(canvas, observations);
  else drawCurveChart(canvas, observations);
}

// Without this, the canvas keeps its initial CSS-pixel size after the user resizes the
// window or rotates the device — the bitmap stretches/blurs because we set width/height
// from getBoundingClientRect() once at draw time.
let _curveChartResizeObserver = null;
function _attachCurveChartResize(canvas) {
  if (_curveChartResizeObserver) { _curveChartResizeObserver.disconnect(); _curveChartResizeObserver = null; }
  if (!canvas || typeof ResizeObserver === 'undefined') return;
  _curveChartResizeObserver = new ResizeObserver(() => {
    if (canvas.isConnected) drawCurveChartActive(canvas, _curveObs);
  });
  _curveChartResizeObserver.observe(canvas);
}

// User-facing chart-mode toggle. Re-renders against cached observations — no extra RPC.
function setCurveChartMode(mode) {
  if (mode !== 'curve' && mode !== 'price') return;
  if (_curveChartMode === mode) return;
  _curveChartMode = mode;
  // Update toggle button styles
  const curveBtn = $('curveChartCurveBtn'), priceBtn = $('curveChartPriceBtn');
  if (curveBtn && priceBtn) {
    curveBtn.style.background = mode === 'curve' ? 'var(--btn-bg)' : 'transparent';
    curveBtn.style.color = mode === 'curve' ? 'var(--btn-fg)' : 'var(--fg-muted)';
    priceBtn.style.background = mode === 'price' ? 'var(--btn-bg)' : 'transparent';
    priceBtn.style.color = mode === 'price' ? 'var(--btn-fg)' : 'var(--fg-muted)';
  }
  // Update the small label above the toggle.
  const labelEl = curveBtn ? curveBtn.parentElement.previousElementSibling : null;
  if (labelEl) labelEl.textContent = mode === 'price' ? 'Price (per 1M)' : 'Bonding curve';
  drawCurveChartActive($('curveChart'), _curveObs);
}

// ---- Price chart (line + trade dots + volume) ----
// Bonding-phase trades are sparse — usually a handful per day — so candlestick bucketing produces
// noisy single-trade dojis that don't communicate anything. Instead we show every individual trade
// as a coloured dot at its (timestamp, price), connect them with a line so the price evolution
// reads at a glance, and display per-trade volume bars below. This works for 1 trade or 500.
function drawPriceChart(canvas, observations) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const cssW = rect.width || 440, cssH = rect.height || 200;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = cssW, h = cssH;
  const dark = document.documentElement.classList.contains('dark');
  const mutedColor = dark ? '#666' : '#888';
  const dimColor = dark ? '#444' : '#bbb';
  const gridColor = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';
  const bgColor = dark ? '#000' : '#fff';
  const buyColor = '#4CAF50';
  const sellColor = '#EF5350';
  const lineColor = dark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.5)';

  // Empty state — brand-new coins with zero trades yet.
  if (!observations || observations.length === 0) {
    ctx.fillStyle = mutedColor;
    ctx.font = '12px Helvetica,Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No trades yet', w / 2, h / 2);
    ctx.fillStyle = dimColor;
    ctx.font = '10px Helvetica,Arial,sans-serif';
    ctx.fillText('Be the first buyer to start the chart', w / 2, h / 2 + 16);
    return;
  }

  // Decode + sort. observe() returns insertion order which is monotonic, but sort defensively.
  const trades = observations.slice().sort((a, b) => a.timestamp - b.timestamp).map(o => ({
    ts: o.timestamp,
    price: Number(BigInt(o.price)) / 1e18,
    volume: Number(BigInt(o.volume)) / 1e18,
    isSell: o.isSell,
  })).filter(t => Number.isFinite(t.price) && t.price > 0);

  if (trades.length === 0) {
    ctx.fillStyle = mutedColor;
    ctx.font = '12px Helvetica,Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No price data', w / 2, h / 2);
    return;
  }

  // Layout: price area top ~75%, volume bars bottom ~20%, gap between.
  const LEFT = Math.max(40, w * 0.10);
  const RIGHT = 14, TOP = 14, BOTTOM = 18;
  const VGAP = 6;
  const usableH = h - TOP - BOTTOM;
  const volH = Math.max(20, usableH * 0.20);
  const priceH = usableH - volH - VGAP;
  const chartW = w - LEFT - RIGHT;
  const fontSize = Math.max(8, Math.min(10, w * 0.024));

  // Y (price) range: trade min/max with 10% padding. Single-price coin gets a synthetic ±5% window.
  let pMin = Infinity, pMax = -Infinity;
  for (const t of trades) { if (t.price > pMax) pMax = t.price; if (t.price < pMin) pMin = t.price; }
  if (pMax === pMin) { const p = pMax || 1; pMax = p * 1.05; pMin = p * 0.95; }
  const pPad = (pMax - pMin) * 0.10;
  const pLo = Math.max(0, pMin - pPad), pHi = pMax + pPad;
  const yToPx = p => TOP + priceH - ((p - pLo) / (pHi - pLo)) * priceH;

  // X (time) range: first trade → last trade with 5% right padding.
  // Only extend to "now" when the last trade is genuinely stale (>24h or >50% past the trade span)
  // — for active coins, hugging the data is more readable than padding to the right edge.
  const tFirst = trades[0].ts;
  const tLast = trades[trades.length - 1].ts;
  const tradeSpan = tLast - tFirst;
  const nowSec = Math.floor(Date.now() / 1000);
  const staleThreshold = Math.max(86400, tradeSpan); // 1d or full span, whichever is larger
  const extendToNow = (nowSec - tLast) > staleThreshold;
  const rightPad = Math.max(60, tradeSpan * 0.05); // ≥60s so single-trade coins don't collapse
  const tMin = tFirst;
  const tMax = extendToNow ? nowSec : (tLast + rightPad);
  const tRange = Math.max(60, tMax - tMin);
  const xToPx = ts => LEFT + ((ts - tMin) / tRange) * chartW;

  // Volume range
  let vMax = 0;
  for (const t of trades) if (t.volume > vMax) vMax = t.volume;
  if (vMax === 0) vMax = 1;
  const vToH = v => (v / vMax) * volH;
  const volTop = TOP + priceH + VGAP;

  // Grid (3 horizontal in price area, 4 vertical across)
  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 0.5;
  for (let g = 1; g < 3; g++) {
    const gy = TOP + (g / 3) * priceH;
    ctx.beginPath(); ctx.moveTo(LEFT, gy); ctx.lineTo(w - RIGHT, gy); ctx.stroke();
  }
  for (let g = 1; g < 4; g++) {
    const gx = LEFT + (g / 4) * chartW;
    ctx.beginPath(); ctx.moveTo(gx, TOP); ctx.lineTo(gx, h - BOTTOM); ctx.stroke();
  }
  // Frame
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.moveTo(LEFT, TOP); ctx.lineTo(LEFT, h - BOTTOM); ctx.lineTo(w - RIGHT, h - BOTTOM); ctx.stroke();
  // Volume separator
  ctx.strokeStyle = gridColor;
  ctx.beginPath(); ctx.moveTo(LEFT, volTop - VGAP / 2); ctx.lineTo(w - RIGHT, volTop - VGAP / 2); ctx.stroke();

  // Filled area beneath the price line — green if final price ≥ first, red otherwise.
  // Gives the chart visual weight even with sparse trades.
  if (trades.length >= 2) {
    const overallUp = trades[trades.length - 1].price >= trades[0].price;
    ctx.fillStyle = (overallUp ? buyColor : sellColor) + '15';
    ctx.beginPath();
    ctx.moveTo(xToPx(trades[0].ts), TOP + priceH);
    for (const t of trades) ctx.lineTo(xToPx(t.ts), yToPx(t.price));
    ctx.lineTo(xToPx(trades[trades.length - 1].ts), TOP + priceH);
    ctx.closePath();
    ctx.fill();

    // Connecting line through trade prices
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.moveTo(xToPx(trades[0].ts), yToPx(trades[0].price));
    for (let i = 1; i < trades.length; i++) ctx.lineTo(xToPx(trades[i].ts), yToPx(trades[i].price));
    ctx.stroke();
  }

  // Volume bars per trade — width is fixed-pixel, color matches the trade direction.
  const volBarW = Math.max(2, Math.min(chartW / Math.max(trades.length, 4) * 0.6, 8));
  for (const t of trades) {
    const vh = vToH(t.volume);
    if (vh <= 0) continue;
    ctx.fillStyle = (t.isSell ? sellColor : buyColor) + 'aa';
    ctx.fillRect(xToPx(t.ts) - volBarW / 2, volTop + (volH - vh), volBarW, vh);
  }

  // Trade dots — drawn last so they sit on top of the line. White ring for contrast.
  for (const t of trades) {
    const cx = xToPx(t.ts), cy = yToPx(t.price);
    ctx.fillStyle = t.isSell ? sellColor : buyColor;
    ctx.strokeStyle = bgColor;
    ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.arc(cx, cy, 3.25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // Last-price dotted line spanning the chart, with a coloured tag on the right edge.
  const last = trades[trades.length - 1];
  const lastY = yToPx(last.price);
  const isUpOverall = trades.length >= 2 ? last.price >= trades[0].price : true;
  ctx.strokeStyle = mutedColor;
  ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.moveTo(LEFT, lastY); ctx.lineTo(w - RIGHT, lastY); ctx.stroke();
  ctx.setLineDash([]);

  // Y-axis price labels (max, mid, min) — per 1M tokens, matching the page header.
  ctx.fillStyle = mutedColor;
  ctx.font = `${fontSize}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(formatEthPrice(pHi * 1e6), LEFT - 4, TOP + 4);
  ctx.fillText(formatEthPrice(((pHi + pLo) / 2) * 1e6), LEFT - 4, TOP + priceH / 2);
  ctx.fillText(formatEthPrice(pLo * 1e6), LEFT - 4, TOP + priceH - 4);

  // Last-price tag (coloured chip on the right)
  const lastLabel = formatEthPrice(last.price * 1e6);
  const tagColor = isUpOverall ? buyColor : sellColor;
  ctx.font = `bold ${fontSize}px monospace`;
  const llW = ctx.measureText(lastLabel).width;
  ctx.fillStyle = tagColor;
  ctx.fillRect(w - RIGHT - llW - 6, lastY - fontSize / 2 - 2, llW + 6, fontSize + 4);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'right';
  ctx.fillText(lastLabel, w - RIGHT - 3, lastY);

  // Unit labels
  ctx.fillStyle = dimColor;
  ctx.font = `${Math.max(7, fontSize - 1)}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('ETH/1M', LEFT - 4, TOP);
  // Volume is gross ETH per trade (pre-fee, same unit the trade-history table shows).
  ctx.fillText('ETH vol', LEFT - 4, volTop);
  // Tag the largest bar with its ETH amount so the absolute scale is visible at a glance.
  // Without this the user can only see relative bar heights, not whether trades are 0.001 or 10 ETH.
  if (vMax > 0) {
    const vMaxLabel = vMax >= 1 ? vMax.toFixed(3)
      : vMax >= 0.001 ? vMax.toFixed(4)
      : vMax >= 0.000001 ? vMax.toFixed(6)
      : vMax.toExponential(1);
    ctx.fillStyle = mutedColor;
    ctx.font = `${Math.max(7, fontSize - 1)}px monospace`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('max ' + vMaxLabel, w - RIGHT, volTop);
  }

  // X-axis time labels — format adapts to the range (HH:MM under 1d, MM-DD beyond).
  const fmtT = (ts) => {
    const d = new Date(ts * 1000);
    const pad = n => String(n).padStart(2, '0');
    return tRange < 86400 ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  ctx.fillStyle = mutedColor;
  ctx.font = `${fontSize}px monospace`;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText(fmtT(tMin), LEFT, h - BOTTOM + 3);
  if (tRange > 60 * 5) {
    ctx.textAlign = 'center';
    ctx.fillText(fmtT(Math.floor((tMin + tMax) / 2)), LEFT + chartW / 2, h - BOTTOM + 3);
    ctx.textAlign = 'right';
    ctx.fillText(fmtT(tMax), w - RIGHT, h - BOTTOM + 3);
  }

  // Trade count + total volume + time-since-last in top-right corner.
  // Total volume is the sum of all gross ETH amounts (matches what's behind the volume bars below).
  const ago = nowSec - tLast;
  const agoLabel = ago < 60 ? ago + 's' : ago < 3600 ? Math.floor(ago / 60) + 'm' : ago < 86400 ? Math.floor(ago / 3600) + 'h' : Math.floor(ago / 86400) + 'd';
  let totalVol = 0;
  for (const t of trades) totalVol += t.volume;
  const totalVolLabel = totalVol >= 1 ? totalVol.toFixed(3)
    : totalVol >= 0.001 ? totalVol.toFixed(4)
    : totalVol >= 0.000001 ? totalVol.toFixed(6)
    : totalVol > 0 ? totalVol.toExponential(1)
    : '0';
  const header = trades.length + (trades.length === 1 ? ' trade' : ' trades')
    + ' · ' + totalVolLabel + ' ETH · last ' + agoLabel + ' ago';
  ctx.fillStyle = dimColor;
  ctx.font = `${Math.max(7, fontSize - 1)}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(header, w - RIGHT, TOP);
}

// ---- Trade helpers ----
function curveSwitchSide(side) {
  const buyBtn = $('curveBuyBtn'), sellBtn = $('curveSellBtn');
  buyBtn.style.background = side === 'buy' ? 'var(--btn-bg)' : 'transparent';
  buyBtn.style.color = side === 'buy' ? 'var(--btn-fg)' : 'var(--fg-muted)';
  sellBtn.style.background = side === 'sell' ? 'var(--red)' : 'transparent';
  sellBtn.style.color = side === 'sell' ? '#fff' : 'var(--fg-muted)';
  $('curveBuyWrap').style.display = side === 'buy' ? '' : 'none';
  $('curveSellWrap').style.display = side === 'sell' ? '' : 'none';
}

function curveSetBuyAmt(amt) {
  $('curveBuyAmount').value = amt;
  curveUpdateBuyQuote();
}

async function curveSetSellPct(pct) {
  // For 100% in particular, _curveBalance is set at render time and may be stale if the user
  // received/transferred tokens since then. Refresh from chain so the displayed quote matches
  // what the contract will actually consume (curveSell caps to bal anyway, so the tx is safe;
  // this is purely UX correctness on the Min-received row).
  if (_signer && _connectedAddress) {
    try {
      const bal = await withRPC(async rpc => {
        const t = new ethers.Contract(_curveTokenAddr, ERC20_ABI, rpc);
        return await t.balanceOf(_connectedAddress);
      });
      _curveBalance = bal;
    } catch {} // fall through to cached balance
  }
  if (_curveBalance <= 0n) return;
  const amt = _curveBalance * BigInt(pct) / 100n;
  $('curveSellAmount').value = ethers.formatEther(amt);
  curveUpdateSellQuote();
}

function curveSetSlippage(pct, btn) {
  _curveSlippageBps = pct * 100;
  btn.parentElement.querySelectorAll('.coin-tpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Refresh the visible quote so the "Min received" row matches the new slippage immediately
  // instead of waiting for the next input change. Debounced inside each quote fn.
  if ($('curveBuyWrap') && $('curveBuyWrap').style.display !== 'none' && $('curveBuyAmount')?.value) {
    curveUpdateBuyQuote();
  } else if ($('curveSellWrap') && $('curveSellWrap').style.display !== 'none' && $('curveSellAmount')?.value) {
    curveUpdateSellQuote();
  } else if ($('curveZammBuyWrap') && $('curveZammBuyWrap').style.display !== 'none' && $('curveZammBuyInput')?.value) {
    curveZammQuote('buy');
  } else if ($('curveZammSellWrap') && $('curveZammSellWrap').style.display !== 'none' && $('curveZammSellInput')?.value) {
    curveZammQuote('sell');
  }
}

// Mirror of ClassicalCurveSale._effectiveFee for client-side fallback. The execution path
// caches the on-chain effectiveFee in _curveEffectiveFee, but quotes can race the trade
// (preset → click Buy before the 300ms debounce fires). Falling back to the static base
// curve.feeBps under-counts the real fee inside the sniper-decay window, which makes
// minOut/minProceeds too tight and the contract reverts with Slippage().
function _effFeeNow(curve) {
  const baseFee = Number(curve.feeBps);
  const sniperFee = Number(curve.sniperFeeBps);
  const sniperDuration = Number(curve.sniperDuration);
  if (sniperFee === 0 || sniperDuration === 0) return baseFee;
  const elapsed = Math.floor(Date.now() / 1000) - Number(curve.launchTime);
  if (elapsed >= sniperDuration) return baseFee;
  if (elapsed <= 0) return sniperFee;
  return baseFee + Math.floor((sniperFee - baseFee) * (sniperDuration - elapsed) / sniperDuration);
}

// On-chain quote via ClassicalCurveSale view functions (authoritative, includes sniper fee)
let _curveQuoteTimer = null;
let _curveSniperTimer = null;
// Bumps every time a new quote is dispatched. Async callbacks that resolve after the user
// changed input or navigated away check against this and skip their DOM write — otherwise
// stale results overwrite fresh ones.
let _curveQuoteGen = 0;
let _curveEffectiveFee = null; // cached for execution path
const CURVE_QUOTE_ABI = [
  'function quote(address token, uint256 amount) view returns (uint256)',
  'function quoteSell(address token, uint256 amount) view returns (uint256)',
  'function effectiveFee(address token) view returns (uint256)'
];
const _cqIface = new ethers.Interface(CURVE_QUOTE_ABI);

// Client-side token estimate (matches contract's buyExactIn) — used to feed into on-chain quote()
function _curveEstTokens(curve, netETH) {
  const vr = BigInt(curve.virtualReserve);
  const sold = BigInt(curve.sold);
  const cap = BigInt(curve.cap);
  const R = vr - sold;
  if (R <= 0n) return 0n;
  const startPrice = BigInt(curve.startPrice);
  const endPrice = BigInt(curve.endPrice);
  if (startPrice <= 0n) return 0n;
  let tokens;
  if (endPrice === startPrice) { tokens = netETH * (10n**18n) / startPrice; }
  else { const A = startPrice * vr * vr / (R * (10n**18n)); tokens = netETH * R / (A + netETH); }
  const remaining = cap - sold;
  if (tokens > remaining) tokens = remaining;
  const maxBuy = BigInt(curve.maxBuyBps);
  if (maxBuy > 0n) { const mx = cap * maxBuy / 10000n; if (tokens > mx) tokens = mx; }
  return tokens;
}

// Render-state helpers for the read-only receive box. Centralising the className/textContent
// pair keeps the empty/quoting/error/quoted transitions consistent across both sides.
function _curveSetOut(outEl, subEl, detEl, state, text, sub) {
  if (!outEl) return;
  outEl.textContent = text || '';
  outEl.className = 'curve-out-amount' + (state === 'idle' ? ' placeholder' : state === 'quoting' || state === 'error' ? ' muted' : '');
  if (subEl) subEl.innerHTML = sub || '&nbsp;';
  if (detEl) detEl.style.display = state === 'quoted' ? '' : 'none';
  // The cap warning belongs to a specific quote — drop it on idle/quoting/error
  // so a stale "this buy is capped" can't outlive the number it described.
  const capEl = $('curveBuyCapNote');
  if (capEl && state !== 'quoted') { capEl.innerHTML = ''; capEl.style.display = 'none'; }
}

// Adaptive ETH formatter — readable across the 7+ orders of magnitude curve trades span.
function _curveFmtEth(n) {
  if (!Number.isFinite(n) || n === 0) return '0';
  if (n < 0.0001) return n.toExponential(2);
  if (n < 1) return n.toFixed(6);
  if (n < 1000) return n.toFixed(4);
  return n.toFixed(2);
}

function curveUpdateBuyQuote() {
  const outEl = $('curveBuyOut'), subEl = $('curveBuyOutSub'), detEl = $('curveBuyDetails');
  if (!outEl || !_curveData) return;
  const v = parseFloat($('curveBuyAmount')?.value || '0');
  if (!v || v <= 0) {
    // Clear any pending quote — otherwise a 300ms-stale callback overwrites the idle state.
    // clearTimeout only stops not-yet-fired timers; bumping the gen is what cancels an
    // already-fired callback that's mid-await on RPC.
    if (_curveQuoteTimer) { clearTimeout(_curveQuoteTimer); _curveQuoteTimer = null; }
    ++_curveQuoteGen;
    _curveSetOut(outEl, subEl, detEl, 'idle', '0');
    return;
  }
  _curveSetOut(outEl, subEl, detEl, 'quoting', 'Quoting...');
  if (_curveQuoteTimer) clearTimeout(_curveQuoteTimer);
  // Generation token: an async quote that resolves after the user has typed something else
  // (or navigated away) skips its DOM write. Without this, the latest displayed numbers can
  // be from the second-to-last input.
  const myGen = ++_curveQuoteGen;
  _curveQuoteTimer = setTimeout(async () => {
    try {
      const tokenAddr = _curveTokenAddr;
      const ethWei = ethers.parseEther(String(v));
      const curve = _curveData;
      // Sniper-aware fallback: during the decay window the real fee is above curve.feeBps,
      // and feeding the lower number into estTokens produces an over-tight minOut downstream.
      const estFee = _curveEffectiveFee != null ? _curveEffectiveFee : _effFeeNow(curve);
      const estNet = ethWei * 10000n / BigInt(10000 + estFee);
      const estTokens = _curveEstTokens(curve, estNet);
      if (estTokens <= 0n) { _curveSetOut(outEl, subEl, detEl, 'error', 'Curve fully sold'); return; }
      const mc3Calls = [
        { target: CURVE_SALE, allowFailure: true, callData: _cqIface.encodeFunctionData('effectiveFee', [tokenAddr]) },
        { target: CURVE_SALE, allowFailure: true, callData: _cqIface.encodeFunctionData('quote', [tokenAddr, estTokens]) }
      ];
      const mcRes = await withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(mc3Calls);
      });
      if (myGen !== _curveQuoteGen) return; // user changed input or navigated since dispatch
      const feeBps = mcRes[0].success ? Number(_cqIface.decodeFunctionResult('effectiveFee', mcRes[0].returnData)[0]) : _effFeeNow(curve);
      _curveEffectiveFee = feeBps;
      if (!mcRes[1].success) { _curveSetOut(outEl, subEl, detEl, 'error', 'Quote unavailable'); return; }
      let cost = _cqIface.decodeFunctionResult('quote', mcRes[1].returnData)[0];
      let tokens = estTokens;
      if (Math.abs(feeBps - estFee) > 10) {
        const netETH = ethWei * 10000n / BigInt(10000 + feeBps);
        tokens = _curveEstTokens(curve, netETH);
        try {
          const reQuoteRes = await withRPC(async rpc => {
            const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
            return await mc.aggregate3([{ target: CURVE_SALE, allowFailure: true, callData: _cqIface.encodeFunctionData('quote', [tokenAddr, tokens]) }]);
          });
          if (myGen !== _curveQuoteGen) return;
          if (reQuoteRes[0].success) cost = _cqIface.decodeFunctionResult('quote', reQuoteRes[0].returnData)[0];
        } catch {}
      }
      const feeEth = cost * BigInt(feeBps) / 10000n;
      const minTokens = tokens * BigInt(10000 - _curveSlippageBps) / 10000n;

      // Avg execution price (cost / tokens) rendered per 1M tokens to match the page header.
      const tokensFloat = Number(tokens) / 1e18;
      const costFloat = Number(cost) / 1e18;
      const feeFloat = Number(feeEth) / 1e18;
      const ethPerMil = tokensFloat > 0 ? (costFloat / tokensFloat) * 1e6 : 0;

      // _curveEstTokens clamps the estimate to maxBuyBps (10% of supply on a
      // standard launch) and to remaining supply. Without a notice, "You pay 1 ETH"
      // sits next to a token count that corresponds to a far smaller spend.
      // Verified against mainnet via eth_simulateV1: buyExactIn does NOT revert
      // past the cap — it fills exactly maxBuyBps and refunds the surplus in the
      // same tx. So this is a "you won't get the size you asked for" notice, not
      // a failure warning.
      const capTokens = BigInt(curve.maxBuyBps) > 0n ? BigInt(curve.cap) * BigInt(curve.maxBuyBps) / 10000n : 0n;
      const leftTokens = BigInt(curve.cap) - BigInt(curve.sold);
      let capNote = '';
      if (capTokens > 0n && tokens >= capTokens) capNote = `max ${(Number(curve.maxBuyBps) / 100).toFixed(0)}% of supply per tx`;
      else if (leftTokens > 0n && tokens >= leftTokens) capNote = 'only ' + fmtTokenAmount(leftTokens.toString()) + ' left on the curve';
      const totalCost = cost + feeEth;
      const capped = !!capNote && totalCost < (ethWei * 99n / 100n);

      outEl.textContent = fmtTokenAmount(tokens.toString());
      outEl.className = 'curve-out-amount';
      subEl.textContent = 'Avg ' + formatEthPrice(ethPerMil) + ' ETH / 1M';

      const capEl = $('curveBuyCapNote');
      if (capEl) {
        const refund = ethWei > totalCost ? ethWei - totalCost : 0n;
        capEl.innerHTML = capped
          ? `Capped &mdash; ${escText(capNote)}. About ${escText(_curveFmtEth(Number(totalCost) / 1e18))} ETH fills; the remaining ~${escText(_curveFmtEth(Number(refund) / 1e18))} ETH is refunded in the same transaction.`
          : '';
        capEl.style.display = capped ? '' : 'none';
      }

      $('curveBuyDetPrice').textContent = formatEthPrice(ethPerMil) + ' ETH / 1M';
      $('curveBuyDetFee').textContent = _curveFmtEth(feeFloat) + ' ETH (' + (feeBps / 100).toFixed(2) + '%)';
      $('curveBuyDetMin').textContent = fmtTokenAmount(minTokens.toString()) + ' (' + (_curveSlippageBps / 100) + '% slip)';
      detEl.style.display = '';
    } catch (e) {
      if (myGen !== _curveQuoteGen) return;
      _curveSetOut(outEl, subEl, detEl, 'error', 'Quote failed');
    }
  }, 300);
}

function curveUpdateSellQuote() {
  const outEl = $('curveSellOut'), subEl = $('curveSellOutSub'), detEl = $('curveSellDetails');
  if (!outEl || !_curveData) return;
  const v = parseFloat($('curveSellAmount')?.value || '0');
  if (!v || v <= 0) {
    // Same idle-clear pattern as the buy side — bump gen to cancel any already-fired
    // callback awaiting RPC, otherwise it'll write stale data over the idle state.
    if (_curveQuoteTimer) { clearTimeout(_curveQuoteTimer); _curveQuoteTimer = null; }
    ++_curveQuoteGen;
    _curveSetOut(outEl, subEl, detEl, 'idle', '0');
    return;
  }
  _curveSetOut(outEl, subEl, detEl, 'quoting', 'Quoting...');
  if (_curveQuoteTimer) clearTimeout(_curveQuoteTimer);
  const myGen = ++_curveQuoteGen;
  _curveQuoteTimer = setTimeout(async () => {
    try {
      const tokenAddr = _curveTokenAddr;
      let amount = ethers.parseEther(String(v));
      let capped = false;
      if (_curveBalance > 0n && amount > _curveBalance) { amount = _curveBalance; capped = true; }
      if (amount <= 0n) { _curveSetOut(outEl, subEl, detEl, 'idle', '0'); return; }
      const mc3Calls = [
        { target: CURVE_SALE, allowFailure: true, callData: _cqIface.encodeFunctionData('quoteSell', [tokenAddr, amount]) },
        { target: CURVE_SALE, allowFailure: true, callData: _cqIface.encodeFunctionData('effectiveFee', [tokenAddr]) }
      ];
      const mcRes = await withRPC(async rpc => {
        const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
        return await mc.aggregate3(mc3Calls);
      });
      if (myGen !== _curveQuoteGen) return;
      if (!mcRes[0].success) { _curveSetOut(outEl, subEl, detEl, 'error', 'Quote unavailable'); return; }
      const gross = _cqIface.decodeFunctionResult('quoteSell', mcRes[0].returnData)[0];
      const feeBps = mcRes[1].success ? Number(_cqIface.decodeFunctionResult('effectiveFee', mcRes[1].returnData)[0]) : _effFeeNow(_curveData);
      _curveEffectiveFee = feeBps;
      const fee = gross * BigInt(feeBps) / 10000n;
      const net = gross - fee;
      const minNet = net * BigInt(10000 - _curveSlippageBps) / 10000n;

      const netFloat = Number(net) / 1e18;
      const grossFloat = Number(gross) / 1e18;
      const feeFloat = Number(fee) / 1e18;
      const amountFloat = Number(amount) / 1e18;
      const ethPerMil = amountFloat > 0 ? (grossFloat / amountFloat) * 1e6 : 0;

      outEl.textContent = _curveFmtEth(netFloat);
      outEl.className = 'curve-out-amount';
      const usdSub = (_curveEthUsd && netFloat > 0) ? '≈ $' + (netFloat * _curveEthUsd).toFixed(2) : '';
      const cappedTag = capped ? ' <span style="color:var(--fg-dim)">(capped to balance)</span>' : '';
      subEl.innerHTML = (usdSub || '&nbsp;') + cappedTag;

      $('curveSellDetPrice').textContent = formatEthPrice(ethPerMil) + ' ETH / 1M';
      $('curveSellDetFee').textContent = _curveFmtEth(feeFloat) + ' ETH (' + (feeBps / 100).toFixed(2) + '%)';
      $('curveSellDetMin').textContent = _curveFmtEth(Number(minNet) / 1e18) + ' ETH (' + (_curveSlippageBps / 100) + '% slip)';
      detEl.style.display = '';
    } catch (e) {
      if (myGen !== _curveQuoteGen) return;
      _curveSetOut(outEl, subEl, detEl, 'error', 'Quote failed');
    }
  }, 300);
}

async function curveBuy() {
  if (_curveTrading) return;
  if (!_signer) { if (typeof connectWallet === 'function') connectWallet(); return; }
  const tokenAddr = _curveTokenAddr;
  // Snapshot _renderGen so we can detect navigation away during the tx and avoid
  // forcing the user back to this coin's detail page when the post-trade re-render fires.
  const _myRenderGen = _renderGen;
  const amtStr = ($('curveBuyAmount')?.value || '').trim();
  if (!amtStr || isNaN(amtStr) || Number(amtStr) <= 0) {
    $('curveTradeStatus').innerHTML = '<div style="color:var(--red);font-size:12px">Enter a valid ETH amount</div>';
    return;
  }
  const ethWei = ethers.parseEther(amtStr);

  // Compute minAmountOut using cached effectiveFee + client estimate + slippage.
  // Sniper-aware fallback (not curve.feeBps) so a click before the quote debounce fires
  // still uses an approximation of the live decay-window fee — otherwise minOut overshoots
  // and the contract reverts with Slippage().
  const curve = _curveData;
  const feeBps = _curveEffectiveFee != null ? _curveEffectiveFee : _effFeeNow(curve);
  const netETH = ethWei * 10000n / BigInt(10000 + feeBps);
  const approxTokens = _curveEstTokens(curve, netETH);
  const minOut = approxTokens * BigInt(10000 - _curveSlippageBps) / 10000n;

  const deadline = BigInt(Math.floor(Date.now() / 1000)) + 600n;
  _curveTrading = true;
  $('curveTradeStatus').innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} Confirming...</div>`;
  try {
    const cs = new ethers.Contract(CURVE_SALE, CURVE_SALE_ABI, _signer);
    const tx = await cs.buyExactIn(tokenAddr, minOut, deadline, { value: ethWei });
    $('curveTradeStatus').innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></div>`;
    const receipt = await tx.wait();

    const purchaseTopic = ethers.id('Purchase(address,address,uint256,uint256,uint256)');
    let tokenAmount = 0n;
    for (const log of receipt.logs) {
      if (log.topics[0] === purchaseTopic && log.address.toLowerCase() === CURVE_SALE.toLowerCase()) {
        const decoded = ethers.AbiCoder.defaultAbiCoder().decode(['uint256','uint256','uint256'], log.data);
        tokenAmount = decoded[0]; break;
      }
    }

    $('curveTradeStatus').innerHTML = `<div style="font-size:12px;color:var(--green)">Bought ${fmtTokenAmount(tokenAmount.toString())} tokens! <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">View tx</a></div>`;
    $('curveBuyAmount').value = '';
    // Re-render immediately so a buy that triggered graduation flips the UI to the post-grad panel
    // before the user can click Buy again on the now-stale form.
    // Await so _curveTrading stays held until the new panel is on screen,
    // preventing a stale-form double-click from hitting Graduated() between completion and re-render.
    // Skip the re-render if the user navigated away during the tx — otherwise we'd force them
    // back to this coin's detail page, with a hash that no longer matches the displayed content.
    if (_myRenderGen === _renderGen) await renderCoinPage(tokenAddr);
  } catch (e) {
    if ((e.message || '').includes('user rejected') || e.code === 'ACTION_REJECTED') {
      $('curveTradeStatus').innerHTML = '<div style="font-size:12px;color:var(--fg-dim)">Cancelled</div>';
    } else {
      $('curveTradeStatus').innerHTML = `<div style="font-size:12px;color:var(--red)">${escText(curveErrText(e))}</div>`;
      // Graduated() — another buyer pushed the curve over the line between
      // our quote and submit. Flip the panel to post-grad so the user can
      // retry on the right path without manually refreshing.
      if (curveIsGraduatedErr(e)) {
        setTimeout(() => renderCoinPage(tokenAddr), 800);
      }
    }
  } finally {
    _curveTrading = false;
  }
}

// ---- zAMM swap for graduated curve coins ----
// Pool key: token0=ETH(zero), token1=token, feeOrHook = uint160(CURVE_SALE) | (1<<255)
const CURVE_HOOK_FEE = BigInt(CURVE_SALE) | (1n << 255n);
let _curveZammQuoteTimer = null;
// Stale-callback guard for the post-grad ZAMM quote (mirrors _curveQuoteGen for the
// pre-grad bonding-curve quote). Bumped on each dispatch and on every nav entry.
let _curveZammQuoteGen = 0;

function curveZammSide(side) {
  const buyBtn = $('curveZammBuyBtn'), sellBtn = $('curveZammSellBtn');
  buyBtn.style.background = side === 'buy' ? 'var(--btn-bg)' : 'transparent';
  buyBtn.style.color = side === 'buy' ? 'var(--btn-fg)' : 'var(--fg-muted)';
  sellBtn.style.background = side === 'sell' ? 'var(--red)' : 'transparent';
  sellBtn.style.color = side === 'sell' ? '#fff' : 'var(--fg-muted)';
  $('curveZammBuyWrap').style.display = side === 'buy' ? '' : 'none';
  $('curveZammSellWrap').style.display = side === 'sell' ? '' : 'none';
}

async function curveZammSellPct(pct) {
  // Refresh balance from chain so the post-grad 100% sell quote matches the actual on-chain
  // amount swapExactIn will consume. _curveBalance from render is stale once the user receives
  // or transfers tokens out-of-band; the swap path itself caps to bal so the tx is safe.
  if (_signer && _connectedAddress) {
    try {
      const bal = await withRPC(async rpc => {
        const t = new ethers.Contract(_curveTokenAddr, ERC20_ABI, rpc);
        return await t.balanceOf(_connectedAddress);
      });
      _curveBalance = bal;
    } catch {} // fall through to cached balance
  }
  if (_curveBalance <= 0n) return;
  const amt = _curveBalance * BigInt(pct) / 100n;
  $('curveZammSellInput').value = ethers.formatEther(amt);
  curveZammQuote('sell');
}

function curveZammQuote(side) {
  const isBuy = side === 'buy';
  const el = $(isBuy ? 'curveZammBuyQuote' : 'curveZammSellQuote');
  if (!el) return;
  const raw = $(isBuy ? 'curveZammBuyInput' : 'curveZammSellInput')?.value || '';
  const v = parseFloat(raw);
  if (!v || v <= 0) {
    // Bump gen alongside clearing the timer so an already-fired callback mid-await
    // can't write stale numbers over the just-set idle text.
    if (_curveZammQuoteTimer) { clearTimeout(_curveZammQuoteTimer); _curveZammQuoteTimer = null; }
    ++_curveZammQuoteGen;
    el.textContent = 'Enter amount to see quote';
    return;
  }
  el.innerHTML = `<span style="opacity:0.5">Quoting...</span>`;
  if (_curveZammQuoteTimer) clearTimeout(_curveZammQuoteTimer);
  // Generation token: a first quote that resolves after the user types a second amount
  // would otherwise overwrite the new "Quoting..." with stale results before the second
  // debounce fires. Latest dispatch wins.
  const myGen = ++_curveZammQuoteGen;
  _curveZammQuoteTimer = setTimeout(async () => {
    try {
      const amount = ethers.parseEther(String(v));
      const tokenAddr = _curveTokenAddr;
      // Read live creator fees alongside the quote so the UI matches what curveZammSwap will
      // compute at submit time. Without this, a creator that updates their fee between render
      // and trade will see displayed quote and on-chain expectedOut diverge by `bps`, and a
      // tight slippage setting reverts with Slippage().
      // Match the contract's routed swap. The fee can be taken from either side per direction:
      //   buyOnInput=true:  ETH tax skimmed before pool sees msg.value
      //   buyOnInput=false: pool sees full ETH, tokens taxed before user receives them
      //   sellOnInput=true: token tax skimmed before pool sees amountIn
      //   sellOnInput=false: pool sees full tokens, ETH taxed before user receives it
      const tokenIn = isBuy ? ZERO : tokenAddr;
      const tokenOut = isBuy ? tokenAddr : ZERO;
      const [cfLive, quote] = await withRPC(async rpc => {
        const cs = new ethers.Contract(CURVE_SALE, CURVE_SALE_ABI, rpc);
        const quoter = new ethers.Contract(ZQUOTER, QUOTE_ABI, rpc);
        // Quote against the post-input-fee amount when the *OnInput flag is true. We have to
        // fetch creatorFees first because swapAmount depends on the *OnInput flag.
        const cf = await cs.creatorFees(tokenAddr);
        const buyOnInputLive = Boolean(cf.buyOnInput);
        const sellOnInputLive = Boolean(cf.sellOnInput);
        const buyBpsLive = BigInt(cf.buyBps || 0);
        const sellBpsLive = BigInt(cf.sellBps || 0);
        const swapAmount = isBuy
          ? (buyOnInputLive ? amount * (10000n - buyBpsLive) / 10000n : amount)
          : (sellOnInputLive ? amount * (10000n - sellBpsLive) / 10000n : amount);
        const q = await quoter.quoteZAMM(false, CURVE_HOOK_FEE, tokenIn, tokenOut, 0, 0, swapAmount);
        return [cf, q];
      });
      if (myGen !== _curveZammQuoteGen) return; // user changed input or navigated since dispatch
      const buyBps = BigInt(cfLive.buyBps || 0);
      const sellBps = BigInt(cfLive.sellBps || 0);
      const buyOnInput = Boolean(cfLive.buyOnInput);
      const sellOnInput = Boolean(cfLive.sellOnInput);
      // Refresh cached state so the next swap submit sees the same numbers we just quoted against.
      _curveCreatorBuyBps = Number(buyBps);
      _curveCreatorSellBps = Number(sellBps);
      _curveCreatorBuyOnInput = buyOnInput;
      _curveCreatorSellOnInput = sellOnInput;
      let out = quote.amountOut;
      // Tax the output side only when the corresponding *OnInput flag is false.
      if (isBuy && !buyOnInput) out = out * (10000n - buyBps) / 10000n;
      if (!isBuy && !sellOnInput) out = out * (10000n - sellBps) / 10000n;
      if (isBuy) {
        el.innerHTML = '~' + fmtTokenAmount(out.toString()) + ' tokens';
      } else {
        el.innerHTML = '~' + (Number(ethers.formatEther(out))).toFixed(4) + ' ETH';
      }
    } catch {
      if (myGen !== _curveZammQuoteGen) return;
      el.textContent = 'Quote failed';
    }
  }, 300);
}

async function curveZammSwap(side) {
  if (_curveTrading) return;
  if (!_signer) { if (typeof connectWallet === 'function') connectWallet(); return; }
  // Set the guard synchronously so a double-click can't fire two concurrent
  // balanceOf+quote paths and submit two routed swaps back-to-back.
  _curveTrading = true;
  const isBuy = side === 'buy';
  const raw = $(isBuy ? 'curveZammBuyInput' : 'curveZammSellInput')?.value || '';
  const v = parseFloat(raw);
  if (!v || v <= 0) {
    $('curveTradeStatus').innerHTML = `<div style="color:var(--red);font-size:12px">Enter a valid amount</div>`;
    _curveTrading = false; return;
  }
  let amount = ethers.parseEther(String(v));
  const tokenAddr = _curveTokenAddr;
  // Snapshot at start so we can skip the post-tx re-render if the user navigated away.
  const _myRenderGen = _renderGen;
  const address = await _signer.getAddress();
  // Cap sell to actual balance
  if (!isBuy) {
    const token = new ethers.Contract(tokenAddr, ERC20_ABI, _signer);
    const bal = await token.balanceOf(address);
    if (bal === 0n) { $('curveTradeStatus').innerHTML = '<div style="color:var(--red);font-size:12px">No tokens to sell</div>'; _curveTrading = false; return; }
    if (amount > bal) amount = bal;
  }
  const tokenIn = isBuy ? ZERO : tokenAddr;
  const tokenOut = isBuy ? tokenAddr : ZERO;
  const poolKey = { id0: 0, id1: 0, token0: ZERO, token1: tokenAddr, feeOrHook: CURVE_HOOK_FEE };
  const deadline = BigInt(Math.floor(Date.now() / 1000)) + 600n;

  $('curveTradeStatus').innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} Quoting...</div>`;
  try {
    // Read live creator fee at submit time. Cached values from the render-time
    // multicall can be stale if the creator updates `creatorFees` between
    // render and confirmation, leading to a Slippage() revert because
    // expectedOut would be computed against the wrong leg.
    const csIfaceLive = new ethers.Interface(CURVE_SALE_ABI);
    const cfLive = await withRPC(async rpc => {
      const cs = new ethers.Contract(CURVE_SALE, CURVE_SALE_ABI, rpc);
      return await cs.creatorFees(tokenAddr);
    });
    const buyBps = BigInt(cfLive.buyBps || 0);
    const sellBps = BigInt(cfLive.sellBps || 0);
    const buyOnInput = Boolean(cfLive.buyOnInput);
    const sellOnInput = Boolean(cfLive.sellOnInput);
    // Refresh cached state so subsequent quote/render reads stay in sync.
    _curveCreatorBuyBps = Number(buyBps);
    _curveCreatorSellBps = Number(sellBps);
    _curveCreatorBuyOnInput = buyOnInput;
    _curveCreatorSellOnInput = sellOnInput;

    // Quote against the amount the pool actually sees, branching on the *OnInput flag for
    // each side. Without this branch, swapping a pool whose creator picked buyOnInput=false
    // or sellOnInput=true produces an expectedOut off by `bps`, making minOut too tight and
    // forcing a Slippage() revert on every routed swap.
    const swapAmount = isBuy
      ? (buyOnInput ? amount * (10000n - buyBps) / 10000n : amount)
      : (sellOnInput ? amount * (10000n - sellBps) / 10000n : amount);
    const quote = await withRPC(async rpc => {
      const quoter = new ethers.Contract(ZQUOTER, QUOTE_ABI, rpc);
      return await quoter.quoteZAMM(false, CURVE_HOOK_FEE, tokenIn, tokenOut, 0, 0, swapAmount);
    });
    // Expected user output after the routed creator fee. Tax the output side only when the
    // corresponding *OnInput flag is false (otherwise the tax was already taken from input).
    let expectedOut = quote.amountOut;
    if (isBuy && !buyOnInput) expectedOut = expectedOut * (10000n - buyBps) / 10000n;
    if (!isBuy && !sellOnInput) expectedOut = expectedOut * (10000n - sellBps) / 10000n;
    const minOut = expectedOut * BigInt(10000 - _curveSlippageBps) / 10000n;

    // No approval: launch() clones exempt the hook (=CURVE_SALE) from the allowance check.
    // CURVE_SALE.swapExactIn pulls tokens with safeTransferFrom, which the clone honours allowance-free.

    $('curveTradeStatus').innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} Confirming...</div>`;
    // Route through CURVE_SALE so the creator fee is paid and the routing-enforcement check passes.
    // Direct ZAMM.swapExactIn would revert with Unauthorized whenever creatorFees[token].beneficiary != 0.
    const cs = new ethers.Contract(CURVE_SALE, CURVE_SALE_ABI, _signer);
    const tx = await cs.swapExactIn(
      poolKey, amount, minOut, isBuy, address, deadline,
      { value: isBuy ? amount : 0n }
    );
    $('curveTradeStatus').innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></div>`;
    await tx.wait();


    $('curveTradeStatus').innerHTML = `<div style="font-size:12px;color:var(--green)">${isBuy ? 'Bought' : 'Sold'}! <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">View tx</a></div>`;
    $(isBuy ? 'curveZammBuyInput' : 'curveZammSellInput').value = '';
    // Await so _curveTrading stays held until the new panel is on screen,
    // preventing a stale-form double-click from hitting Graduated() between completion and re-render.
    // Skip if user navigated away — see curveBuy for rationale.
    if (_myRenderGen === _renderGen) await renderCoinPage(tokenAddr);
  } catch (e) {
    if ((e.message || '').includes('user rejected') || e.code === 'ACTION_REJECTED') {
      $('curveTradeStatus').innerHTML = '<div style="font-size:12px;color:var(--fg-dim)">Cancelled</div>';
    } else {
      $('curveTradeStatus').innerHTML = `<div style="font-size:12px;color:var(--red)">${escText(curveErrText(e))}</div>`;
    }
  } finally {
    _curveTrading = false;
  }
}

// ==================== CAUSE COIN PAGE ====================

async function renderCauseCoinPage(daoAddr, data, metadata, ethUsd, gen) {
  const app = $('app');
  const sharesAddr = data.meta.sharesToken;

  // Fetch ShareSale price + TapVest state + treasury + supply + balance in one multicall
  const ssIface = new ethers.Interface(SHARE_SALE_ABI);
  const soIface = new ethers.Interface(SHARE_OFFERING_ABI);
  const tvIface = new ethers.Interface(TAP_VEST_ABI);
  const erc20I = new ethers.Interface(ERC20_ABI);
  const daoAllowanceABI = ['function allowance(address token, address spender) view returns (uint256)'];
  const daoI = new ethers.Interface(daoAllowanceABI);

  const lootAddr = data.meta.lootToken;
  const mc3Calls = [
    { target: SHARE_SALE, allowFailure: true, callData: ssIface.encodeFunctionData('sales', [daoAddr]) },
    { target: SHARE_OFFERING, allowFailure: true, callData: soIface.encodeFunctionData('sales', [daoAddr]) },
    { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [daoAddr, SHARE_OFFERING]) },
    { target: TAP_VEST, allowFailure: true, callData: tvIface.encodeFunctionData('taps', [daoAddr]) },
    { target: MC3, allowFailure: true, callData: _mc3Iface.encodeFunctionData('getEthBalance', [daoAddr]) },
    { target: sharesAddr, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) },
    // Remaining sale allowance — minting mode uses dao address as sentinel token
    { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [daoAddr, SHARE_SALE]) },
    // Remaining tap allowance = budget remaining
    { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [ZERO, TAP_VEST]) },
    // Loot total supply (needed for ragequit denominator: shares + loot)
    { target: lootAddr, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) }
  ];
  if (_connectedAddress) {
    mc3Calls.push({ target: sharesAddr, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
  }
  // Check for Continuous Sale contract
  const contSaleConfig = CONTINUOUS_SALES[daoAddr.toLowerCase()];
  const contSaleAddr = contSaleConfig?.sale;
  if (contSaleAddr) {
    const csI = new ethers.Interface(CONTINUOUS_SALE_ABI);
    mc3Calls.push({ target: contSaleAddr, allowFailure: true, callData: csI.encodeFunctionData('paused', []) });
  }

  const mcRes = await withRPC(async rpc => {
    const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
    return await mc.aggregate3(mc3Calls);
  }).catch(() => mc3Calls.map(() => ({ success: false })));
  if (gen !== _renderGen) return;

  let saleData = null, offerData = null, tapData = null, treasuryETH = 0n, sharesTotalSupply = 0n,
      lootTotalSupply = 0n, saleAllowance = 0n, offerAllowance = 0n, tapAllowance = 0n, userBalance = 0n;
  const I = { sale: 0, offer: 1, offerAllow: 2, tap: 3, eth: 4, supply: 5, allow: 6, tapAllow: 7, loot: 8, bal: 9 };
  const at = (k, f) => { const r = mcRes[I[k]]; if (r?.success) { try { return f(r.returnData); } catch {} } return undefined; };
  saleData      = at('sale',       d => ssIface.decodeFunctionResult('sales', d)) ?? null;
  offerData     = at('offer',      d => soIface.decodeFunctionResult('sales', d)) ?? null;
  offerAllowance= at('offerAllow', d => daoI.decodeFunctionResult('allowance', d)[0]) ?? 0n;
  tapData       = at('tap',        d => tvIface.decodeFunctionResult('taps', d)) ?? null;
  treasuryETH   = at('eth',        d => _mc3Iface.decodeFunctionResult('getEthBalance', d)[0]) ?? 0n;
  sharesTotalSupply = at('supply', d => erc20I.decodeFunctionResult('totalSupply', d)[0]) ?? 0n;
  saleAllowance = at('allow',      d => daoI.decodeFunctionResult('allowance', d)[0]) ?? 0n;
  tapAllowance  = at('tapAllow',   d => daoI.decodeFunctionResult('allowance', d)[0]) ?? 0n;
  lootTotalSupply = at('loot',     d => erc20I.decodeFunctionResult('totalSupply', d)[0]) ?? 0n;
  if (_connectedAddress) userBalance = at('bal', d => erc20I.decodeFunctionResult('balanceOf', d)[0]) ?? 0n;

  // A cause is on one singleton or the other; whichever names a price owns this sale.
  const usesOffering = !!(offerData && BigInt(offerData.price) > 0n);
  if (usesOffering) { saleData = offerData; saleAllowance = offerAllowance; }
  const saleContract = usesOffering ? SHARE_OFFERING : SHARE_SALE;
  // Continuous Sale state
  let contSaleActive = false;
  const contSaleIdx = contSaleAddr ? (_connectedAddress ? 10 : 9) : -1;
  if (contSaleAddr && contSaleIdx >= 0 && mcRes[contSaleIdx]?.success) {
    try {
      const csI = new ethers.Interface(CONTINUOUS_SALE_ABI);
      const paused = csI.decodeFunctionResult('paused', mcRes[contSaleIdx].returnData)[0];
      contSaleActive = !paused;
    } catch {}
  }

  // Sale state — price/deadline from ShareSale.sales(), cap/sold from DAO allowance + totalSupply
  const price = saleData ? BigInt(saleData.price) : 0n;
  // Minting mode: each buy mints shares. totalSupply = creator's 1 share + sold.
  const creatorShares = ethers.parseEther('1');
  const sold = sharesTotalSupply > creatorShares ? sharesTotalSupply - creatorShares : 0n;
  // Cap = sold + remaining allowance to ShareSale
  // SafeSummoner DAOs may not use DAO-level allowance — if allowance is 0 but sale
  // has a price and no expired deadline, treat as open-ended
  // ShareSale's ceiling is what is left of a draining allowance, so the total is what
  // has sold plus that. ShareOffering states a target SUPPLY outright and grants itself
  // far more allowance than it will use, so the allowance says nothing — subtract the
  // founder share to get a number comparable with `sold`.
  const cap = usesOffering
    ? (BigInt(saleData.cap) > creatorShares ? BigInt(saleData.cap) - creatorShares : 0n)
    : sold + saleAllowance;
  const saleDeadline = saleData ? Number(saleData.deadline) : 0;
  const now = Math.floor(Date.now() / 1000);
  const daicoSaleActive = saleDeadline === 0 || now < saleDeadline;
  const saleActive = daicoSaleActive || contSaleActive;
  // A sold-out sale and a sale that never used DAO allowances both read zero here, and
  // treating the first as the second says "open-ended", drops the goal, keeps the buy
  // form up and sends people at a buy() that reverts on remaining == 0. Shares already
  // minted are the tell: if any exist, the allowance was set and is now spent.
  const isOpenCap = cap >= 2n ** 128n
    || (!usesOffering && saleAllowance === 0n && sold === 0n && price > 0n && daicoSaleActive)
    || contSaleActive;
  const raisedWei = price > 0n ? sold * price / ethers.parseEther('1') : 0n;
  const raisedEth = Number(ethers.formatEther(raisedWei));
  const priceEth = Number(ethers.formatEther(price));
  const soldOut = !isOpenCap && !contSaleActive && cap > 0n && sold >= cap;
  const saleEnded = !saleActive || soldOut;

  // Tap state — rate/beneficiary from TapVest.taps(), budget from DAO allowance
  const hasTap = tapData && BigInt(tapData.ratePerSec) > 0n;
  const tapRate = hasTap ? BigInt(tapData.ratePerSec) : 0n;
  const tapLastClaim = hasTap ? Number(tapData.lastClaim) : 0;
  const tapBeneficiary = hasTap ? tapData.beneficiary : null;
  // Budget = remaining allowance + already claimed. Claimed ≈ rate × elapsed since configure.
  // Remaining allowance = tapAllowance (from DAO.allowance(TAP_VEST, ETH))
  const tapBudget = tapAllowance; // remaining budget
  const tapElapsed = hasTap && tapLastClaim > 0 ? BigInt(Math.floor(Date.now() / 1000) - tapLastClaim) : 0n;
  const tapPending = hasTap ? tapRate * tapElapsed : 0n; // ETH owed since last claim
  const tapOpenBudget = tapBudget >= 2n ** 128n;
  // "Fast" is a statement about how long the remaining budget takes to drain, not
  // about the raw rate. The launcher sets an instant tap to raise/3600, so a fixed
  // rate threshold (the old `>= 0.001 ETH/sec`) called every fast tap under 3.6 ETH a
  // vesting tap — and small causes are the common case. Comparing budget to rate is
  // scale-free, and it stays honest as a real vest winds down: once what is left
  // genuinely is withdrawable within the hour, saying so is correct.
  // Open-ended taps have no budget to divide, so they keep the absolute test.
  const tapInstant = tapOpenBudget
    ? tapRate >= COIN_TAP_FAST_ONGOING_RATE
    : (tapRate > 0n && tapBudget > 0n && tapBudget / tapRate <= 7200n);
  const tapRatePerDay = (hasTap && !tapInstant) ? Number(tapRate) * 86400 / 1e18 : 0;

  // User balance
  const balFmt = userBalance > 0n ? fmtTokenAmount(userBalance.toString()) : '0';

  // Metadata
  const coinName = metadata.name || data.meta.name || 'Unnamed';
  const coinSymbol = metadata.symbol || data.meta.symbol || '???';
  const causeBannerUrl = resolveIPFS(metadata.banner);

  let html = `
    <a href="#" class="back-link">&larr; All Coins</a>
    ${causeBannerUrl ? `<div class="coin-banner"><img src="${escAttr(causeBannerUrl)}" alt="" onerror="if(!ipfsNextGateway(this))this.parentNode.style.display='none'"></div>` : ''}
    <div class="coin-detail-head">
      <div class="coin-detail-logo">${logoHTML(data.meta, metadata, 64)}</div>
      <div class="coin-detail-title" style="flex:1">
        <h2>${escText(coinName)} <span class="coin-tpl-badge coin-tpl-simple" title="DAICO fundraise &middot; ragequittable">cause</span></h2>
        <div class="coin-symbol-row">
          <span>$${escText(coinSymbol)}</span>
          ${_connectedAddress && userBalance > 0n ? `<div class="coin-user-balance">you hold ${balFmt} shares</div>` : ''}
        </div>
        ${metadata.creatorWallet ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:2px">by <a href="https://etherscan.io/address/${metadata.creatorWallet}" target="_blank" style="color:inherit">${metadata.creatorWallet.slice(0,6)}&hellip;${metadata.creatorWallet.slice(-4)}</a></div>` : ''}
      </div>
    </div>
  `;

  // Description + socials
  const causeSocials = metadata.twitter || metadata.telegram || metadata.discord;
  if (metadata.description || causeSocials || contSaleActive) {
    html += `<div class="section-card">`;
    if (metadata.description) html += `<div class="desc-text">${escText(metadata.description)}</div>`;
    if (contSaleActive) html += `<div class="desc-text" style="${metadata.description ? 'margin-top:8px;padding-top:8px;border-top:1px solid var(--border-muted)' : ''}font-size:12px;color:var(--fg-muted)">Continuous sale active &mdash; buy shares with ETH to fund <a href="https://etherscan.io/address/${escAttr(contSaleAddr)}" target="_blank" style="color:inherit;text-decoration:underline">TokenWorks NFT</a> acquisitions for this collector DAO. Shares are ragequittable for a pro-rata refund at any time.</div>`;
    if (causeSocials) html += renderSocials(metadata, !!(metadata.description || contSaleActive));
    html += `</div>`;
  }

  // Raised / treasury header
  const raisedUsd = ethUsd ? ' ($' + (raisedEth * ethUsd).toFixed(2) + ')' : '';
  const treasuryEth = Number(ethers.formatEther(treasuryETH));
  const treasuryUsd = ethUsd ? ' ($' + (treasuryEth * ethUsd).toFixed(2) + ')' : '';
  const treasuryDiffers = Math.abs(treasuryEth - raisedEth) > 0.0001;
  // Target = every share the sale can still mint, at the fixed price. Undefined
  // for open-ended sales, which get a running total instead of a percentage.
  const targetWei = (!isOpenCap && cap > 0n && price > 0n) ? cap * price / ethers.parseEther('1') : 0n;
  const targetEth = Number(ethers.formatEther(targetWei));
  html += `
    <div id="causeRaisedRow" style="margin-bottom:10px">
      <span style="font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:6px">${ethGlyph(17)}${raisedEth.toFixed(raisedEth > 0 && raisedEth < 0.0001 ? 8 : 4)} ETH</span>
      <span style="font-size:11px;color:var(--fg-muted);margin-left:2px">raised${targetWei > 0n ? ' of ' + fmtNum(targetEth) + ' ETH' : ''}</span>
      <span style="font-size:11px;color:var(--fg-muted)">${raisedUsd}</span>
      ${treasuryDiffers ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:2px">${treasuryEth.toFixed(treasuryEth > 0 && treasuryEth < 0.0001 ? 8 : 4)} ETH treasury${treasuryUsd}</div>` : ''}
    </div>
  `;

  // Stats grid
  const capFmt = isOpenCap ? 'Open' : (cap > 0n ? Number(ethers.formatEther(cap)).toLocaleString(undefined, {maximumFractionDigits: 0}) : 'Open');
  const soldFmt = Number(ethers.formatEther(sold)).toLocaleString(undefined, {maximumFractionDigits: 0});
  html += `
    <div id="causeStatsGrid" class="coin-stat-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px;margin-bottom:14px">
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Price</div>
        <div style="font-weight:600">${ethAmount(fmtPriceWei(price), 11)}</div>
        <div style="font-size:9px;color:var(--fg-dim)">per share &middot; ${fmtSharesPerEth(price)}</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Sold</div>
        <div style="font-weight:600;display:inline-flex;align-items:center;gap:5px">${causeGlyph(data.meta, metadata, 11)}<span id="causeSoldVal">${soldFmt}</span></div>
        <div id="causeSoldCap" style="font-size:9px;color:var(--fg-dim)">${(isOpenCap || cap === 0n) ? 'shares' : 'of ' + capFmt}</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Status</div>
        <div id="causeStatusVal" style="font-weight:600;color:${soldOut || !saleEnded ? 'var(--green)' : 'var(--fg-muted)'}">${soldOut ? 'Sold out' : saleEnded ? 'Ended' : 'Active'}</div>
        <div id="causeDeadlineVal" style="font-size:9px;color:${saleDeadline > 0 && !saleEnded && saleDeadline - now < 172800 ? 'var(--red)' : 'var(--fg-dim)'}">${soldOut ? 'every share minted' : saleDeadline > 0 ? fmtDeadline(saleDeadline) : 'no deadline'}</div>
      </div>
    </div>
  `;

  // Charter — a cause that declares the DUNA covenant links the live document.
  // `charter_uri` is present when the DAO is rendered by DUNABrandRenderer (the
  // covenant IS its contractURI); a pinned-metadata cause only declares `charter`,
  // so it links the renderer that generates the covenant for this DAO instead.
  let charterHTML = '';
  if (metadata.charter === 'duna') {
    // charterSource is "eip155:1:0x…" — strip the CAIP-2 prefix for an explorer link.
    const charterRenderer = typeof metadata.charterSource === 'string'
      ? (metadata.charterSource.split(':').pop() || '') : '';
    const charterHref = metadata.charter_uri
      || (ethers.isAddress(charterRenderer) ? `https://etherscan.io/address/${charterRenderer}#readContract` : null);
    // The covenant matters legally and almost never to the person reading the page,
    // so it keeps its place on the record without taking a card's worth of attention
    // above the fold. It sits with the other fine print, at the foot.
    charterHTML = `
      <div style="font-size:10px;color:var(--fg-dim);line-height:1.6;margin-bottom:12px">
        Wyoming Decentralized Unincorporated Nonprofit Association (W.S. 17-32-101 et seq.).
        Members defer to this contract for internal governance and retain ragequit rights.
        ${charterHref ? `<a href="${escAttr(charterHref)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Covenant</a>.` : ''}
      </div>
    `;

  // Progress meters — ETH-denominated funding + funding progress. Shown
  // for open-ended sales too (as a running total), which the old shares-based bar
  // skipped entirely.
  html += causeTokenRow(sharesAddr, coinSymbol);

  html += `<div id="causeMeters" style="margin-bottom:14px">${causeMetersHTML(raisedWei, targetWei, treasuryETH, usesOffering)}</div>`;

  // Buy form (if sale active); a closed sale gets its closing summary in the same place.
  if (saleEnded) html += `<div id="causeSaleClose"></div>`;

  if (!saleEnded) {
    html += `
      <div class="section-card">
        <div class="section-title">Buy Shares</div>
        <div class="coin-side-toggle" style="display:flex;gap:0;margin-bottom:8px;border:1px solid var(--border-muted);overflow:hidden">
          <button id="causeModeShares" onclick="causeSwitchMode('shares')" style="flex:1;padding:8px;background:var(--btn-bg);border:none;color:var(--btn-fg);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px">${causeGlyph(data.meta, metadata, 14)}Shares</button>
          <button id="causeModeEth" onclick="causeSwitchMode('eth')" style="flex:1;padding:8px;background:transparent;border:none;color:var(--fg-muted);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px">${ethGlyph(14)}ETH</button>
        </div>
        <div style="display:flex;gap:4px;margin-bottom:6px">
          <input id="causeBuyAmount" type="text" inputmode="decimal" placeholder="0.00" aria-label="Buy amount" style="flex:1;padding:8px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:16px;outline:none" oninput="causeUpdateBuyQuote()">

          <button class="coin-tpl-btn" onclick="causeSetBuyMax()" style="font-size:10px;padding:4px 8px">Max</button>
        </div>

  }

  // Ragequit — collapsible, understated. Safety net, not a primary action.

    const rqTreasuryFmt = Number(ethers.formatEther(treasuryETH)).toFixed(4);

    const myValue = rqDenom > 0n ? treasuryETH * userBalance / rqDenom : 0n;

            <span style="flex-shrink:0">worth ${ethAmount('~' + fmtEthBal(Number(ethers.formatEther(myValue))) + ' ETH', 11)}</span>
