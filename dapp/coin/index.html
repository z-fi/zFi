  const a0 = lp * _lcLpR0 / _lcLpSupply, a1 = lp * _lcLpR1 / _lcLpSupply;
  setNote(`Returns about ${Number(ethers.formatEther(a0)).toFixed(5)} ETH + ${fmtTokenAmount(a1.toString())} ${escText(_lcInfo?.symbol || '')}.`);
}

function _lcLpSay(m, c) {
  const el = $('lcLpStatus');
  if (el) el.innerHTML = m ? `<div style="font-size:12px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>` : '';
}

// Single-sided deposit. zapIn lives behind the route executor, so it goes out the same
// way the cause page's swaps do: the router is funded by the call and hands the executor
// the encoded route. The pool picks the split itself, which is the whole point — the
// deposit ratio on a concentrated position is not something a user can work out.
async function lcLpZap() {
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const raw = ($('lcLpZapEth')?.value || '').trim();
  if (!raw || !(parseFloat(raw) > 0)) return;
  const btn = $('lcLpZapGo');
  if (btn) btn.disabled = true;
  try {
    const me = await sgn.getAddress();
    let amountIn;
    try { amountIn = ethers.parseEther(raw); } catch { return; }
    // Re-price at send time: the split is only optimal for the state it was read against.
    const pv = await causeZapPreview(_lcPool, ZERO, amountIn);
    if (!pv || pv.lp === 0n) { _lcLpSay('The pool cannot take a zap that size right now.', 'var(--red)'); return; }
    // Never hand funds to an address the factory does not vouch for.
    const okPool = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_ISPOOL + _a(_lcPool) }));
    if (!okPool || _dec1(okPool, 0) !== 1n) { _lcLpSay('That address is not a Precision pool — refusing to send.', 'var(--red)'); return; }

    const minLP = pv.lp - (pv.lp * BigInt(Math.round(_lcSlipPct * 100))) / 10000n;
    const routeData = SEL_ZAPIN + _a(_lcPool) + _a(ZERO) + _w(amountIn) + _w(pv.portion) + _w(minLP) + _a(me) + _a(me);
    const routed = _encSnwap(ZERO, amountIn, me, _lcPool, minLP, PROUTE, routeData);

    _lcLpSay('Confirm in your wallet…');
    const tx = await sgn.sendTransaction({
      to: ZROUTER,
      data: routed.startsWith('0x') ? routed : '0x' + routed,
      value: amountIn
    });
    _lcLpSay(`Zapping… <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    _lcLpSay('Done.', 'var(--green)');
    const el = $('lcLpZapEth'); if (el) el.value = '';
    await renderCoinPage(_lcToken);
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { _lcLpSay(''); return; }
    _lcLpSay(escText(err.shortMessage || err.reason || err.message || 'Failed.'), 'var(--red)');
  } finally {
    const b = $('lcLpZapGo'); if (b) b.disabled = false;
  }
}

async function lcLpAdd() {
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const raw = ($('lcLpEth')?.value || '').trim();
  if (!raw || !(parseFloat(raw) > 0)) return;
  if (!(_lcLpR0 > 0n) || !(_lcLpR1 > 0n)) { _lcLpSay('Pool has no reserves to pair against.', 'var(--red)'); return; }
  const btn = $('lcLpAddGo');
  if (btn) btn.disabled = true;
  try {
    const me = await sgn.getAddress();
    let amount0;
    try { amount0 = ethers.parseEther(raw); } catch { return; }
    // Ratio read at send time, not when the box was typed into: a swap between the two
    // moves the reserves, and a stale pairing is the amount that gets refunded.
    const lpI = new ethers.Interface(PRECISION_LP_ABI);
    const fresh = await mcAggregate([
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('reserve0') },
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('reserve1') }
    ]);
    const r0 = mcDecode(fresh[0], lpI, 'reserve0', [0n])[0];
    const r1 = mcDecode(fresh[1], lpI, 'reserve1', [0n])[0];
    if (!(r0 > 0n)) { _lcLpSay('Pool has no ether to pair against.', 'var(--red)'); return; }
    // A slippage cushion on the coin leg only. The pool pulls what it needs and refunds
    // the rest, so overshooting costs nothing but a larger approval.
    const amount1 = (amount0 * r1 / r0) * (10000n + BigInt(Math.round(_lcSlipPct * 100))) / 10000n;
    if (amount1 > _lcBalance) {
      _lcLpSay(`Not enough ${escText(_lcInfo?.symbol || '')} to pair with that much ETH.`, 'var(--red)');
      return;
    }

    const erc20 = new ethers.Contract(_lcToken, ['function allowance(address,address) view returns (uint256)', 'function approve(address,uint256) returns (bool)'], sgn);
    const allow = await erc20.allowance(me, _lcPool);
    if (allow < amount1) {
      _lcLpSay('Approve the pool to spend your coins…');
      const atx = await erc20.approve(_lcPool, ethers.MaxUint256);
      await atx.wait();
    }

    _lcLpSay('Confirm in your wallet…');
    const pool = new ethers.Contract(_lcPool, PRECISION_LP_ABI, sgn);
    // minLP of 1: the deposit is priced off reserves read one call ago, and the pool
    // refunds rather than reprices, so there is no LP amount to bound meaningfully.
    const tx = await pool.addLiquidityExact(0, amount0, amount1, 1, me, { value: amount0 });
    _lcLpSay(`Adding… <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    _lcLpSay('Done.', 'var(--green)');
    const el = $('lcLpEth'); if (el) el.value = '';
    await renderCoinPage(_lcToken);
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { _lcLpSay(''); return; }
    _lcLpSay(escText(err.shortMessage || err.reason || err.message || 'Failed.'), 'var(--red)');
  } finally {
    const b = $('lcLpAddGo'); if (b) b.disabled = false;
  }
}

async function lcLpRemove() {
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const raw = ($('lcLpBurn')?.value || '').trim();
  if (!raw || !(parseFloat(raw) > 0)) return;
  const btn = $('lcLpRemoveGo');
  if (btn) btn.disabled = true;
  try {
    const me = await sgn.getAddress();
    let lp;
    try { lp = ethers.parseUnits(raw, 18); } catch { return; }
    if (lp > _lcLpBal) { _lcLpSay('More than you hold.', 'var(--red)'); return; }
    const lpI = new ethers.Interface(PRECISION_LP_ABI);
    const fresh = await mcAggregate([
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('reserve0') },
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('reserve1') },
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('totalSupply') }
    ]);
    const r0 = mcDecode(fresh[0], lpI, 'reserve0', [0n])[0];
    const r1 = mcDecode(fresh[1], lpI, 'reserve1', [0n])[0];
    const sup = mcDecode(fresh[2], lpI, 'totalSupply', [0n])[0];
    if (!(sup > 0n)) { _lcLpSay('Pool has no liquidity.', 'var(--red)'); return; }
    const bps = 10000n - BigInt(Math.round(_lcSlipPct * 100));
    const min0 = (lp * r0 / sup) * bps / 10000n;
    const min1 = (lp * r1 / sup) * bps / 10000n;

    _lcLpSay('Confirm in your wallet…');
    const pool = new ethers.Contract(_lcPool, PRECISION_LP_ABI, sgn);
    const tx = await pool.removeLiquidity(lp, min0, min1, me);
    _lcLpSay(`Removing… <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    _lcLpSay('Done.', 'var(--green)');
    const el = $('lcLpBurn'); if (el) el.value = '';
    await renderCoinPage(_lcToken);
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { _lcLpSay(''); return; }
    _lcLpSay(escText(err.shortMessage || err.reason || err.message || 'Failed.'), 'var(--red)');
  } finally {
    const b = $('lcLpRemoveGo'); if (b) b.disabled = false;
  }
}

async function lcRedeem() {
  const status = $('lcRedeemStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:12px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const raw = ($('lcRedeemAmount')?.value || '').trim();
  if (!raw || !(parseFloat(raw) > 0)) return;
  let amount;
  try { amount = ethers.parseUnits(raw, 18); } catch { return; }

  const btn = $('lcRedeemGo');
  if (btn) btn.disabled = true;
  try {
    const me = await sgn.getAddress();
    const iface = new ethers.Interface(LAUNCHER_ABI);
    // Quote at send time so minEthOut reflects the floor as it stands now, not as it
    // stood when the box was typed into. The floor is not a ratchet — a trade landing
    // between the quote and the send can move it either way — so the slippage bound is
    // doing real work here, not just guarding a stale number.
    const quoted = iface.decodeFunctionResult('quoteRedeem',
      await withRPC(rpc => rpc.call({ to: LAUNCHER, data: iface.encodeFunctionData('quoteRedeem', [_lcToken, amount]) })))[0];
    if (quoted === 0n) { say('Nothing to redeem at that size.', 'var(--red)'); return; }
    const minOut = quoted - (quoted * BigInt(Math.round(_lcSlipPct * 100))) / 10000n;

    // redeem() pulls the tokens with transferFrom, so the launcher needs an allowance
    // first. Without one the token reverts with its own InsufficientAllowance(), which
    // is not in LAUNCHER_ABI and so surfaces as "unknown custom error" — a dead end for
    // anyone trying to redeem. Every other spender on this page is approved the same way.
    const erc20 = new ethers.Contract(_lcToken,
      ['function allowance(address,address) view returns (uint256)',
       'function approve(address,uint256) returns (bool)'], sgn);
    if ((await erc20.allowance(me, LAUNCHER)) < amount) {
      say('Approving the launcher…');
      await (await erc20.approve(LAUNCHER, ethers.MaxUint256)).wait();
    }

    say('Confirm in your wallet…');
    const tx = await sgn.sendTransaction({
      to: LAUNCHER,
      data: iface.encodeFunctionData('redeem', [_lcToken, amount, minOut, me])
    });
    say(`Redeeming… <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Done.', 'var(--green)');
    const el = $('lcRedeemAmount'); if (el) el.value = '';
    await renderCoinPage(_lcToken);
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.reason || err.message || 'Failed.'), 'var(--red)');
  } finally {
    const b = $('lcRedeemGo'); if (b) b.disabled = false;
  }
}


// ==================== CAUSE COIN PAGE ====================

// What the sale actually took in, from its own Purchase events.
//
// Everything else here is derived from live supply, which is right for "what is
// outstanding" and wrong for "what was raised": a redemption burns shares, so a figure
// computed from supply walks backwards every time someone exits. CELL sold 9,999,999
// shares for 3.33 ETH and has had 1,891,890 burned since — the page was reporting 2.700
// and calling it the raise. The treasury falls when a holder leaves. The raise does not.
const SALE_PURCHASE_TOPIC = ethers.id('Purchase(address,address,uint256,uint256)');
const SALE_FIRST_BLOCK = 25000000;
const _everRaised = new Map();
async function causeEverRaised(saleAddr, dao) {
  const key = saleAddr.toLowerCase() + ':' + dao.toLowerCase();
  if (_everRaised.has(key)) return _everRaised.get(key);
  const pending = (async () => {
    try {
      const logs = await withRPC(rpc => rpc.getLogs({
        address: saleAddr,
        topics: [SALE_PURCHASE_TOPIC, ethers.zeroPadValue(dao.toLowerCase(), 32)],
        fromBlock: SALE_FIRST_BLOCK, toBlock: 'latest',
      }));
      let shares = 0n, cost = 0n;
      for (const l of logs) {
        const d = l.data.slice(2);
        if (d.length < 128) continue;
        shares += BigInt('0x' + d.slice(0, 64));
        cost += BigInt('0x' + d.slice(64, 128));
      }
      return cost > 0n ? { shares, cost } : null;
    } catch { return null; }   // the supply-derived figures remain the fallback
  })();
  _everRaised.set(key, pending);
  return pending;
}

async function renderCauseCoinPage(daoAddr, data, metadata, ethUsd, gen) {
  const app = $('app');
  const sharesAddr = data.meta.sharesToken;

  // Fetch ShareSale price + TapVest state + treasury + supply + balance in one multicall
  const ssIface = new ethers.Interface(SHARE_SALE_ABI);
  const soIface = new ethers.Interface(SHARE_OFFERING_ABI);
  const tvIface = new ethers.Interface(TAP_VEST_ABI);
  const erc20I = new ethers.Interface(ERC20_ABI);
  const daoAllowanceABI = ['function allowance(address token, address spender) view returns (uint256)'];
  const daoI = new ethers.Interface(daoAllowanceABI);

  const lootAddr = data.meta.lootToken;
  const mc3Calls = [
    { target: SHARE_SALE, allowFailure: true, callData: ssIface.encodeFunctionData('sales', [daoAddr]) },
    { target: SHARE_OFFERING, allowFailure: true, callData: soIface.encodeFunctionData('sales', [daoAddr]) },
    { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [daoAddr, SHARE_OFFERING]) },
    { target: TAP_VEST, allowFailure: true, callData: tvIface.encodeFunctionData('taps', [daoAddr]) },
    { target: MC3, allowFailure: true, callData: _mc3Iface.encodeFunctionData('getEthBalance', [daoAddr]) },
    { target: sharesAddr, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) },
    // Remaining sale allowance — minting mode uses dao address as sentinel token
    { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [daoAddr, SHARE_SALE]) },
    // Remaining tap allowance = budget remaining
    { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [ZERO, TAP_VEST]) },
    // Loot total supply (needed for ragequit denominator: shares + loot)
    { target: lootAddr, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) }
  ];
  if (_connectedAddress) {
    // Both balances: which one is the sale's is not known until sales() decodes, and a
    // second round-trip to find out would paint the panel twice.
    mc3Calls.push({ target: sharesAddr, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
    mc3Calls.push({ target: lootAddr, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
  }
  // Check for Continuous Sale contract
  const contSaleConfig = CONTINUOUS_SALES[daoAddr.toLowerCase()];
  const contSaleAddr = contSaleConfig?.sale;
  if (contSaleAddr) {
    const csI = new ethers.Interface(CONTINUOUS_SALE_ABI);
    mc3Calls.push({ target: contSaleAddr, allowFailure: true, callData: csI.encodeFunctionData('paused', []) });
  }

  const mcRes = await withRPC(async rpc => {
    const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
    return await mc.aggregate3(mc3Calls);
  }).catch(() => mc3Calls.map(() => ({ success: false })));
  if (gen !== _renderGen) return;

  let saleData = null, offerData = null, tapData = null, treasuryETH = 0n, sharesTotalSupply = 0n,
      lootTotalSupply = 0n, saleAllowance = 0n, offerAllowance = 0n, tapAllowance = 0n,
      shareBalance = 0n, lootBalance = 0n;
  const I = { sale: 0, offer: 1, offerAllow: 2, tap: 3, eth: 4, supply: 5, allow: 6, tapAllow: 7, loot: 8, bal: 9, lootBal: 10 };
  const at = (k, f) => { const r = mcRes[I[k]]; if (r?.success) { try { return f(r.returnData); } catch {} } return undefined; };
  saleData      = at('sale',       d => ssIface.decodeFunctionResult('sales', d)) ?? null;
  offerData     = at('offer',      d => soIface.decodeFunctionResult('sales', d)) ?? null;
  offerAllowance= at('offerAllow', d => daoI.decodeFunctionResult('allowance', d)[0]) ?? 0n;
  tapData       = at('tap',        d => tvIface.decodeFunctionResult('taps', d)) ?? null;
  treasuryETH   = at('eth',        d => _mc3Iface.decodeFunctionResult('getEthBalance', d)[0]) ?? 0n;
  sharesTotalSupply = at('supply', d => erc20I.decodeFunctionResult('totalSupply', d)[0]) ?? 0n;
  saleAllowance = at('allow',      d => daoI.decodeFunctionResult('allowance', d)[0]) ?? 0n;
  tapAllowance  = at('tapAllow',   d => daoI.decodeFunctionResult('allowance', d)[0]) ?? 0n;
  lootTotalSupply = at('loot',     d => erc20I.decodeFunctionResult('totalSupply', d)[0]) ?? 0n;
  if (_connectedAddress) {
    shareBalance = at('bal',     d => erc20I.decodeFunctionResult('balanceOf', d)[0]) ?? 0n;
    lootBalance  = at('lootBal', d => erc20I.decodeFunctionResult('balanceOf', d)[0]) ?? 0n;
  }

  // A cause is on one singleton or the other; whichever names a price owns this sale.
  const usesOffering = !!(offerData && BigInt(offerData.price) > 0n);
  if (usesOffering) { saleData = offerData; saleAllowance = offerAllowance; }
  const saleContract = usesOffering ? SHARE_OFFERING : SHARE_SALE;
  // ShareSale predates the loot sentinel, so only an offering can be selling loot.
  const saleIsLoot = !!(usesOffering && lootAddr && lootAddr !== ZERO
    && String(saleData.token).toLowerCase() === LOOT_SENTINEL);
  // Everything below reads "the sold token" rather than "shares": supply, the holder's
  // balance, the word on the buttons, and which argument ragequit burns.
  const soldToken = saleIsLoot ? lootAddr : sharesAddr;
  const UNIT = saleIsLoot ? 'loot' : 'shares';
  const UNIT_TITLE = saleIsLoot ? 'Loot' : 'Shares';
  // Published before the markup is assembled rather than after it is installed, because
  // causeMetersHTML and friends read it back while building — set afterwards, a loot
  // cause painted "shares" once and then corrected itself on the first refresh.
  app.dataset.saleIsLoot = saleIsLoot ? '1' : '';
  app.dataset.soldToken = soldToken;
  app.dataset.unit = UNIT;
  const userBalance = saleIsLoot ? lootBalance : shareBalance;
  // Continuous Sale state
  let contSaleActive = false;
  const contSaleIdx = contSaleAddr ? (_connectedAddress ? 11 : 9) : -1;
  if (contSaleAddr && contSaleIdx >= 0 && mcRes[contSaleIdx]?.success) {
    try {
      const csI = new ethers.Interface(CONTINUOUS_SALE_ABI);
      const paused = csI.decodeFunctionResult('paused', mcRes[contSaleIdx].returnData)[0];
      contSaleActive = !paused;
    } catch {}
  }

  // Sale state — price/deadline from ShareSale.sales(), cap/sold from DAO allowance + totalSupply
  const price = saleData ? BigInt(saleData.price) : 0n;
  // Minting mode: each buy mints shares. totalSupply = creator's 1 share + sold.
  // The founder's share is minted as a share, so a loot sale's supply is sold loot and
  // nothing else — subtracting there would understate every loot raise by one unit.
  const creatorShares = ethers.parseEther('1');
  const soldSupply = saleIsLoot ? lootTotalSupply : sharesTotalSupply;
  const sold = saleIsLoot
    ? soldSupply
    : (soldSupply > creatorShares ? soldSupply - creatorShares : 0n);
  // Cap = sold + remaining allowance to ShareSale
  // SafeSummoner DAOs may not use DAO-level allowance — if allowance is 0 but sale
  // has a price and no expired deadline, treat as open-ended
  // ShareSale's ceiling is what is left of a draining allowance, so the total is what
  // has sold plus that. ShareOffering states a target SUPPLY outright and grants itself
  // far more allowance than it will use, so the allowance says nothing — subtract the
  // founder share to get a number comparable with `sold`.
  const cap = usesOffering
    ? (saleIsLoot ? BigInt(saleData.cap)
       : (BigInt(saleData.cap) > creatorShares ? BigInt(saleData.cap) - creatorShares : 0n))
    : sold + saleAllowance;
  const saleDeadline = saleData ? Number(saleData.deadline) : 0;
  const now = Math.floor(Date.now() / 1000);
  const daicoSaleActive = saleDeadline === 0 || now < saleDeadline;
  const saleActive = daicoSaleActive || contSaleActive;
  // A sold-out sale and a sale that never used DAO allowances both read zero here, and
  // treating the first as the second says "open-ended", drops the goal, keeps the buy
  // form up and sends people at a buy() that reverts on remaining == 0. Shares already
  // minted are the tell: if any exist, the allowance was set and is now spent.
  const isOpenCap = cap >= 2n ** 128n
    || (!usesOffering && saleAllowance === 0n && sold === 0n && price > 0n && daicoSaleActive)
    || contSaleActive;
  // The headline is the raise, so it uses the figure that cannot move under a
  // redemption; the treasury line beneath it stays live. That is the honest split
  // between what came in and what is still here.
  const _ever = await causeEverRaised(usesOffering ? SHARE_OFFERING : SHARE_SALE, daoAddr).catch(() => null);
  const soldEver = _ever && _ever.shares > sold ? _ever.shares : sold;
  const raisedWei = _ever ? _ever.cost
                  : (price > 0n ? sold * price / ethers.parseEther('1') : 0n);
  const raisedEth = Number(ethers.formatEther(raisedWei));
  const priceEth = Number(ethers.formatEther(price));
  const soldOut = !isOpenCap && !contSaleActive && cap > 0n && sold >= cap;
  const saleEnded = !saleActive || soldOut;

  // Tap state — rate/beneficiary from TapVest.taps(), budget from DAO allowance
  const hasTap = tapData && BigInt(tapData.ratePerSec) > 0n;
  const tapRate = hasTap ? BigInt(tapData.ratePerSec) : 0n;
  const tapLastClaim = hasTap ? Number(tapData.lastClaim) : 0;
  const tapBeneficiary = hasTap ? tapData.beneficiary : null;
  // Budget = remaining allowance + already claimed. Claimed ≈ rate × elapsed since configure.
  // Remaining allowance = tapAllowance (from DAO.allowance(TAP_VEST, ETH))
  const tapBudget = tapAllowance; // remaining budget
  const tapElapsed = hasTap && tapLastClaim > 0 ? BigInt(Math.floor(Date.now() / 1000) - tapLastClaim) : 0n;
  const tapPending = hasTap ? tapRate * tapElapsed : 0n; // ETH owed since last claim
  const tapOpenBudget = tapBudget >= 2n ** 128n;
  // "Fast" is a statement about how long the remaining budget takes to drain, not
  // about the raw rate. The launcher sets an instant tap to raise/3600, so a fixed
  // rate threshold (the old `>= 0.001 ETH/sec`) called every fast tap under 3.6 ETH a
  // vesting tap — and small causes are the common case. Comparing budget to rate is
  // scale-free, and it stays honest as a real vest winds down: once what is left
  // genuinely is withdrawable within the hour, saying so is correct.
  // Open-ended taps have no budget to divide, so they keep the absolute test.
  const tapInstant = tapOpenBudget
    ? tapRate >= COIN_TAP_FAST_ONGOING_RATE
    : (tapRate > 0n && tapBudget > 0n && tapBudget / tapRate <= 7200n);
  const tapRatePerDay = (hasTap && !tapInstant) ? Number(tapRate) * 86400 / 1e18 : 0;

  // User balance
  const balFmt = userBalance > 0n ? fmtTokenAmount(userBalance.toString()) : '0';

  // Metadata
  const coinName = metadata.name || data.meta.name || 'Unnamed';
  const coinSymbol = metadata.symbol || data.meta.symbol || '???';
  const causeBannerUrl = resolveIPFS(metadata.banner);

  let html = `
    <a href="#" class="back-link">&larr; All Coins</a>
    ${causeBannerUrl ? `<div class="coin-banner"><img src="${escAttr(causeBannerUrl)}" alt="" onerror="if(!ipfsNextGateway(this))this.parentNode.style.display='none'"></div>` : ''}
    <div class="coin-detail-head">
      <div class="coin-detail-logo">${logoHTML(data.meta, metadata, 64)}</div>
      <div class="coin-detail-title" style="flex:1">
        <h2>${escText(coinName)} <span class="coin-tpl-badge coin-tpl-simple" title="DAICO fundraise &middot; ragequittable${saleIsLoot ? ' &middot; backers hold non-voting loot' : ''}">cause${saleIsLoot ? ' &middot; loot' : ''}</span></h2>
        <div class="coin-symbol-row">
          <span>$${escText(coinSymbol)}</span>
          ${_connectedAddress && userBalance > 0n ? `<div class="coin-user-balance">you hold ${balFmt} ${UNIT}</div>` : ''}
        </div>
        ${metadata.creatorWallet ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:2px">by <a href="https://etherscan.io/address/${metadata.creatorWallet}" target="_blank" style="color:inherit">${metadata.creatorWallet.slice(0,6)}&hellip;${metadata.creatorWallet.slice(-4)}</a></div>` : ''}
      </div>
    </div>
  `;

  // Description + socials
  const causeSocials = metadata.twitter || metadata.telegram || metadata.discord;
  if (metadata.description || causeSocials || contSaleActive) {
    html += `<div class="section-card">`;
    if (metadata.description) html += `<div class="desc-text">${escText(metadata.description)}</div>`;
    if (contSaleActive) html += `<div class="desc-text" style="${metadata.description ? 'margin-top:8px;padding-top:8px;border-top:1px solid var(--border-muted)' : ''}font-size:12px;color:var(--fg-muted)">Continuous sale active &mdash; buy shares with ETH to fund <a href="https://etherscan.io/address/${escAttr(contSaleAddr)}" target="_blank" style="color:inherit;text-decoration:underline">TokenWorks NFT</a> acquisitions for this collector DAO. Shares are ragequittable for a pro-rata refund at any time.</div>`;
    if (causeSocials) html += renderSocials(metadata, !!(metadata.description || contSaleActive));
    html += `</div>`;
  }

  // Raised / treasury header
  const raisedUsd = ethUsd ? ' ($' + (raisedEth * ethUsd).toFixed(2) + ')' : '';
  const treasuryEth = Number(ethers.formatEther(treasuryETH));
  const treasuryUsd = ethUsd ? ' ($' + (treasuryEth * ethUsd).toFixed(2) + ')' : '';
  const treasuryDiffers = Math.abs(treasuryEth - raisedEth) > 0.0001;
  // Target = every share the sale can still mint, at the fixed price. Undefined
  // for open-ended sales, which get a running total instead of a percentage.
  // A cap from current supply can fall under what the events prove was sold, which
  // would render "9,999,999 of 8,108,108". Take the larger: the real ceiling.
  const capEver = cap > soldEver ? cap : soldEver;
  const targetWei = (!isOpenCap && capEver > 0n && price > 0n)
    ? (_ever && capEver === soldEver ? _ever.cost : capEver * price / ethers.parseEther('1'))
    : 0n;
  const targetEth = Number(ethers.formatEther(targetWei));
  html += `
    <div id="causeRaisedRow" style="margin-bottom:10px">
      <span style="font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:6px">${ethGlyph(17)}${raisedEth.toFixed(raisedEth > 0 && raisedEth < 0.0001 ? 8 : 4)} ETH</span>
      <span style="font-size:11px;color:var(--fg-muted);margin-left:2px">raised${targetWei > 0n ? ' of ' + fmtNum(targetEth) + ' ETH' : ''}</span>
      <span style="font-size:11px;color:var(--fg-muted)">${raisedUsd}</span>
      ${treasuryDiffers ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:2px">${treasuryEth.toFixed(treasuryEth > 0 && treasuryEth < 0.0001 ? 8 : 4)} ETH treasury${treasuryUsd}</div>` : ''}
    </div>
  `;

  // Stats grid
  const capFmt = isOpenCap ? 'Open' : (capEver > 0n ? Number(ethers.formatEther(capEver)).toLocaleString(undefined, {maximumFractionDigits: 0}) : 'Open');
  const soldFmt = Number(ethers.formatEther(soldEver)).toLocaleString(undefined, {maximumFractionDigits: 0});
  html += `
    <div id="causeStatsGrid" class="coin-stat-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px;margin-bottom:14px">
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Price</div>
        <div style="font-weight:600">${ethAmount(fmtPriceWei(price), 11)}</div>
        <div style="font-size:9px;color:var(--fg-dim)">per ${saleIsLoot ? 'loot' : 'share'} &middot; ${fmtSharesPerEth(price)}</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Sold</div>
        <div style="font-weight:600;display:inline-flex;align-items:center;gap:5px">${causeGlyph(data.meta, metadata, 11)}<span id="causeSoldVal">${soldFmt}</span></div>
        <div id="causeSoldCap" style="font-size:9px;color:var(--fg-dim)">${(isOpenCap || cap === 0n) ? UNIT : 'of ' + capFmt}</div>
      </div>
      <div style="padding:6px 8px;background:var(--surface);border-radius:6px">
        <div style="color:var(--fg-dim);font-size:9px;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:2px">Status</div>
        <div id="causeStatusVal" style="font-weight:600;color:${soldOut || !saleEnded ? 'var(--green)' : 'var(--fg-muted)'}">${soldOut ? 'Trading' : saleEnded ? 'Ended' : 'Active'}</div>
        <div id="causeDeadlineVal" style="font-size:9px;color:${saleDeadline > 0 && !saleEnded && saleDeadline - now < 172800 ? 'var(--red)' : 'var(--fg-dim)'}">${soldOut ? 'sale complete' : saleDeadline > 0 ? fmtDeadline(saleDeadline) : 'no deadline'}</div>
      </div>
    </div>
  `;

  // Charter — a cause that declares the DUNA covenant links the live document.
  // `charter_uri` is present when the DAO is rendered by DUNABrandRenderer (the
  // covenant IS its contractURI); a pinned-metadata cause only declares `charter`,
  // so it links the renderer that generates the covenant for this DAO instead.
  let charterHTML = '';
  if (metadata.charter === 'duna') {
    // charterSource is "eip155:1:0x…" — strip the CAIP-2 prefix for an explorer link.
    const charterRenderer = typeof metadata.charterSource === 'string'
      ? (metadata.charterSource.split(':').pop() || '') : '';
    const charterHref = metadata.charter_uri
      || (ethers.isAddress(charterRenderer) ? `https://etherscan.io/address/${charterRenderer}#readContract` : null);
    // The covenant matters legally and almost never to the person reading the page,
    // so it keeps its place on the record without taking a card's worth of attention
    // above the fold. It sits with the other fine print, at the foot.
    charterHTML = `
      <div style="font-size:10px;color:var(--fg-dim);line-height:1.6;margin-bottom:12px">
        Wyoming Decentralized Unincorporated Nonprofit Association (W.S. 17-32-101 et seq.).
        Members defer to this contract for internal governance and retain ragequit rights.
        ${charterHref ? `<a href="${escAttr(charterHref)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Covenant</a>.` : ''}
      </div>
    `;
  }

  // Progress meters — ETH-denominated funding + funding progress. Shown
  // for open-ended sales too (as a running total), which the old shares-based bar
  // skipped entirely.
  html += causeTokenRow(soldToken, coinSymbol);

  html += `<div id="causeMeters" style="margin-bottom:14px">${causeMetersHTML(raisedWei, targetWei, treasuryETH, usesOffering)}</div>`;

  // Buy form (if sale active); a closed sale gets its closing summary in the same place.
  if (saleEnded) html += `<div id="causeSaleClose"></div>`;

  if (!saleEnded) {
    html += `
      <div class="section-card">
        <div class="section-title">Buy ${UNIT_TITLE}</div>
        <div class="coin-side-toggle" style="display:flex;gap:0;margin-bottom:8px;border:1px solid var(--border-muted);overflow:hidden">
          <button id="causeModeShares" onclick="causeSwitchMode('shares')" style="flex:1;padding:8px;background:var(--btn-bg);border:none;color:var(--btn-fg);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px">${causeGlyph(data.meta, metadata, 14)}${UNIT_TITLE}</button>
          <button id="causeModeEth" onclick="causeSwitchMode('eth')" style="flex:1;padding:8px;background:transparent;border:none;color:var(--fg-muted);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px">${ethGlyph(14)}ETH</button>
        </div>
        <div style="display:flex;gap:4px;margin-bottom:6px">
          <input id="causeBuyAmount" type="text" inputmode="decimal" placeholder="0.00" aria-label="Buy amount" style="flex:1;padding:8px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:16px;outline:none" oninput="causeUpdateBuyQuote()">
          <span id="causeBuyUnit" style="font-size:12px;color:var(--fg-muted);align-self:flex-end;padding-bottom:10px">${UNIT}</span>
        </div>
        <div id="causeBuyPresets" class="coin-preset-row" style="display:flex;gap:4px;margin-bottom:8px">
          <button class="coin-tpl-btn" onclick="causeSetBuyAmt(100)" style="font-size:10px;padding:4px 8px">100</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyAmt(1000)" style="font-size:10px;padding:4px 8px">1k</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyAmt(10000)" style="font-size:10px;padding:4px 8px">10k</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyAmt(100000)" style="font-size:10px;padding:4px 8px">100k</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyMax()" style="font-size:10px;padding:4px 8px">Max</button>
        </div>
        <div id="causeBuyPresetsEth" class="coin-preset-row" style="display:none;gap:4px;margin-bottom:8px">
          <button class="coin-tpl-btn" onclick="causeSetBuyEth(0.01)" style="font-size:10px;padding:4px 8px">.01</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyEth(0.05)" style="font-size:10px;padding:4px 8px">.05</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyEth(0.1)" style="font-size:10px;padding:4px 8px">.1</button>
          <button class="coin-tpl-btn" onclick="causeSetBuyEth(0.5)" style="font-size:10px;padding:4px 8px">.5</button>
        </div>
        <div id="causeBuyQuote" style="font-size:11px;color:var(--fg-muted);margin-bottom:6px;min-height:16px">Enter amount to see quote</div>
        <button class="swap-btn" id="causeBuyBtn" style="width:100%;font-size:13px" onclick="causeBuy('${daoAddr}')">${_connectedAddress ? 'Buy ' + UNIT_TITLE : 'Connect Wallet'}</button>
        <div id="causeTradeStatus" style="margin-top:8px"></div>
      </div>
    `;
  }

  // Ragequit — collapsible, understated. Safety net, not a primary action.
  //
  // Gated on the treasury alone, not on the holder's balance. It used to require
  // userBalance > 0, which reads as sensible and is not: that number comes out of a
  // multicall entry that yields 0 when the read fails, so a rate-limited RPC deleted the
  // redemption panel rather than showing a stale figure. The one control that guarantees
  // a holder can always get their share of the treasury back is the last thing that
  // should vanish quietly. Disconnected sees it too, since knowing redemption exists is
  // most of why it matters.
  // Rendered unconditionally. Gating it on a number that arrives over the network means a
  // single failed multicall entry — the read yields 0 and `?? 0n` makes that look real —
  // silently removes the one control that guarantees a holder can always take their share
  // of the treasury back. Whether this DAO is ragequittable does not depend on an RPC.
  let redeemHTML = '';
  {
    const rqTreasuryFmt = Number(ethers.formatEther(treasuryETH)).toFixed(4);
    // Redemption uses the same denominator the DAO does: shares + loot.
    const rqDenom = sharesTotalSupply + lootTotalSupply;
    const myValue = rqDenom > 0n ? treasuryETH * userBalance / rqDenom : 0n;
    const myPct = rqDenom > 0n ? Number(userBalance * 10000n / rqDenom) / 100 : 0;
    // The sale price is flat, so what a holder paid is their share count at that price.
    // (The founder's single free share overstates this by one share's worth.) It is the
    // only number that makes the tap legible from a holder's seat: while nothing has
    // been claimed these two are equal to the wei, and every claim moves them apart.
    const myCost = price > 0n ? userBalance * price / ethers.parseEther('1') : 0n;
    const myDelta = myValue - myCost;
    const myDeltaPct = myCost > 0n ? Number(myDelta * 1000000n / myCost) / 10000 : 0;
    // Findable, not offered. It stays a full row rather than the 11px dim line it used to
    // be, because a holder looking for it has to be able to find it — but the bold verb,
    // the token-for-token glyph pair and the running "your share ≈ X ETH" made it read as
    // a trade to consider next to the buy form. Redeeming is a right to exercise if this
    // stops being something you want to fund, not a move to weigh against holding: it
    // takes your money back out of the cause you funded. So it states what it is and
    // keeps its figures inside, where someone who has opened it will see them.
    redeemHTML = `
      <div class="section-card" style="background:transparent;border:1px solid var(--border-muted);margin-bottom:14px;padding:0;overflow:hidden">
        <button class="coin-rq-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'" style="display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;font-size:12px;color:var(--fg-muted);background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left">
          <span style="font-size:10px;color:var(--fg-dim)">&#9654;</span>
          <span>Redemption</span>
          <span style="color:var(--fg-dim);font-size:11px">your ${UNIT} for a pro-rata share of the treasury</span>
        </button>
        <div style="display:none;padding:12px;border:1px solid var(--border-muted);background:var(--surface)">
          <div style="font-size:11px;color:var(--fg-dim);margin-bottom:8px;line-height:1.5">Burns your ${UNIT} for a pro-rata portion of the ${treasuryETH > 0n ? rqTreasuryFmt + ' ETH' : 'DAO'} treasury, paid immediately.${usesOffering
            ? ` Burnt ${UNIT} return their room to the sale, so redeeming costs the raise nothing.`
            : (saleEnded ? ' Burnt shares are not resold, so the sale cannot replace them.'
                         : ' Burnt shares are not returned to the sale for someone else to buy.')}</div>
          ${!_connectedAddress ? `<div style="font-size:11px;color:var(--fg-dim);margin-bottom:8px">Connect a wallet to redeem.</div>` : ''}
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <input id="causeRqAmount" type="text" inputmode="decimal" placeholder="0" aria-label="${UNIT_TITLE} to redeem" style="flex:1;padding:6px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:14px;outline:none" oninput="causeUpdateRqQuote()">
            <span style="font-size:11px;color:var(--fg-muted);align-self:flex-end;padding-bottom:8px">${UNIT}</span>
          </div>
          <div class="coin-preset-row" style="display:flex;gap:4px;margin-bottom:8px">
            <button class="coin-tpl-btn" onclick="causeSetRqPct(25)" style="font-size:9px;padding:3px 6px">25%</button>
            <button class="coin-tpl-btn" onclick="causeSetRqPct(50)" style="font-size:9px;padding:3px 6px">50%</button>
            <button class="coin-tpl-btn" onclick="causeSetRqPct(75)" style="font-size:9px;padding:3px 6px">75%</button>
            <button class="coin-tpl-btn" onclick="causeSetRqPct(100)" style="font-size:9px;padding:3px 6px">100%</button>
          </div>
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--fg-muted);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border-muted)">
            <span>you hold <b style="color:var(--fg);font-weight:600">${fmtTokenAmount(userBalance.toString())}</b> ${UNIT} &middot; ${myPct >= 0.01 ? myPct.toFixed(2) : '<0.01'}% of the DAO</span>
            <span style="flex-shrink:0">worth ${ethAmount('~' + fmtEthBal(Number(ethers.formatEther(myValue))) + ' ETH', 11)}</span>
          </div>
          ${myCost > 0n ? `<div style="display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--fg-dim);margin-top:-4px;margin-bottom:8px">
            <span>paid ~${fmtEthBal(Number(ethers.formatEther(myCost)))} ETH at ${fmtPriceWei(price)}</span>
            <span style="flex-shrink:0;color:${myDelta < 0n ? 'var(--fg-muted)' : 'inherit'}">${
              myDelta === 0n ? 'redeemable in full'
                : (myDelta > 0n ? '+' : '') + myDeltaPct.toFixed(2) + '% \u00b7 the tap has drawn against it'
            }</span>
          </div>` : ''}
          <div id="causeRqQuote" style="font-size:11px;color:var(--fg-muted);margin-bottom:6px;min-height:16px">Enter ${UNIT} to see redemption value</div>
          <button class="swap-btn" style="width:100%;font-size:12px;background:var(--surface);color:var(--fg-muted);border:1px solid var(--border-muted)" onclick="causeRagequit('${daoAddr}')">Redeem</button>
          <div id="causeRqStatus" style="margin-top:8px"></div>
        </div>
      </div>
    `;
  }

  // Tap vesting section
  if (hasTap) {
    // "Remaining" was the DAO's allowance to TapVest — an authorisation ceiling, which the
    // launcher sets from the raise the sale was AIMING for. CELL aimed at 3.33 ETH and took
    // 2.70, so the ceiling has always been above anything that could actually be paid, and
    // reading it as money still owed overstates the tap by the difference. TapVest pays
    // min(vested, budget, treasury), so the binding figure is the smaller of the ceiling
    // and what the DAO actually holds. That is the number a beneficiary can still receive.
    const tapPayable = tapOpenBudget ? treasuryETH : (tapBudget < treasuryETH ? tapBudget : treasuryETH);
    const budgetDisplay = fmtETH(tapPayable);
    const tapCeilingAbove = !tapOpenBudget && tapBudget > treasuryETH;
    // Vesting accrues from the moment the tap was configured, not from the moment the
    // money arrives, so a tap can be owed more than the DAO holds. TapVest pays
    // min(vested, budget, treasury) — the shortfall is not forfeited, it lands the
    // instant the treasury covers it, which is what a backer needs told before buying.
    const vested = tapPending > tapBudget ? tapBudget : tapPending;
    const claimable = vested > treasuryETH ? treasuryETH : vested;
    const unfunded = vested - claimable;
    const pendingEth = fmtEthBal(Number(ethers.formatEther(claimable)));
    const rateDisplay = tapInstant ? 'Instant (all funds to beneficiary)' : `~${tapRatePerDay < 0.0001 ? tapRatePerDay.toPrecision(2) : tapRatePerDay.toFixed(4)} ETH/day`;
    const beneficiaryShort = tapBeneficiary.slice(0, 6) + '\u2026' + tapBeneficiary.slice(-4);
    html += `
      <div class="section-card" style="background:var(--surface)">
        <div class="section-title">Tap Vesting</div>
        ${(!tapInstant && treasuryETH > 0n) ? `<div id="causeTapRunway" style="font-size:11px;color:var(--fg-dim);margin-bottom:8px">${causeRunwayHTML(treasuryETH, tapRate, saleEnded)}</div>` : ''}
        <dl class="coin-summary" style="font-size:12px;line-height:1.8;color:var(--fg-muted)">
          <dt>Rate</dt><dd>${tapInstant ? rateDisplay : ethAmount(rateDisplay, 11)}</dd>
          <dt>Claimable</dt><dd>${ethAmount('~' + pendingEth + ' ETH', 11)}</dd>
          ${unfunded > 0n ? `<dt>Vested, unfunded</dt><dd style="color:var(--red)">${ethAmount(fmtETH(unfunded), 11)}</dd>` : ''}
          <dt>Remaining</dt><dd>${ethAmount(budgetDisplay, 11)}${tapCeilingAbove ? `<span style="color:var(--fg-dim)"> of the treasury</span>` : ''}</dd>
          <dt>Beneficiary</dt><dd><a href="https://etherscan.io/address/${tapBeneficiary}" target="_blank" style="color:inherit">${beneficiaryShort}</a></dd>
        </dl>
        ${(() => {
          // TapVest.claim() takes no caller check at all — it reads the beneficiary out
          // of storage and forwards there, so anyone may trigger it and only the
          // beneficiary can ever receive it. The button was gated to the beneficiary,
          // which was stricter than the contract; a keeper or a supporter can push the
          // vested amount through for them.
          //
          // It is still the one control here that moves money away from the people
          // reading the page: until it is claimed, vested ETH sits in the treasury where
          // ragequit reaches it. So a non-beneficiary is told exactly what the click
          // does and where the money goes, rather than being offered a bare "Claim".
          // TapVest rounds a capped claim down to whole seconds and reverts if that
          // comes to zero, so anything under one second of vesting has no button.
          if (claimable <= 0n || (tapRate > 0n && claimable < tapRate)) return '';
          const isBeneficiary = _connectedAddress
            && _connectedAddress.toLowerCase() === tapBeneficiary.toLowerCase();
          const label = isBeneficiary
            ? `Claim ${pendingEth} ETH`
            : `Send ${pendingEth} ETH to beneficiary`;
          const style = isBeneficiary
            ? 'background:var(--btn-bg);color:var(--btn-fg)'
            : 'background:var(--surface);color:var(--fg-muted);border:1px solid var(--border-muted)';
          return `<button class="swap-btn" style="width:100%;font-size:12px;margin-top:8px;${style}" onclick="causeTapClaim('${daoAddr}')">${label}</button>
        ${isBeneficiary ? '' : `<div style="font-size:10px;color:var(--fg-dim);margin-top:6px;line-height:1.5">Anyone can release vested funds; they can only ever go to the beneficiary. Until then this ETH stays in the treasury, where redeeming still reaches it.</div>`}
        <div id="causeTapStatus" style="margin-top:8px"></div>`;
        })()}
      </div>
    `;
  }

  // Reopening a closed sale is a governance action, so it sits with the governance
  // block at the foot rather than where the buy form used to be — it is not what
  // somebody arriving at a finished cause is here to do. Folded shut for the same
  // reason the redeem panel is: available, not advertised.
  let reopenHTML = '';
  // Only reachable on the legacy singleton: an offering's ceiling survives redemption,
  // so a sale on it never closes short and has nothing to reopen.
  // Not gated on userBalance: that comes from a multicall entry that reads 0 when the
  // request fails, so a dropped read hid the panel entirely rather than showing a button
  // that could explain itself. Proposing needs a share and the button says so when it has
  // to; deciding whether to propose does not need one.
  if (!usesOffering && saleEnded && !isOpenCap && price > 0n) {
    const daysLeft = CAUSE_REOPEN_WINDOW_DAYS;
    reopenHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-muted)">
        <button class="coin-rq-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'" style="display:flex;align-items:center;gap:6px;width:100%;padding:2px 0;font-size:11px;color:var(--fg-dim);background:transparent;border:none;cursor:pointer;font-family:inherit">
          <span style="font-size:10px">&#9654;</span> Reopen the sale
        </button>
        <div style="display:none;padding-top:8px">
          <div style="font-size:10px;color:var(--fg-dim);line-height:1.6;margin-bottom:8px">
            Reopens the sale on ShareOffering, where redeemed shares hand their room back
            instead of closing it early, and runs for ${daysLeft} days from the day the vote executes.
            One proposal: it grants the mint allowance and sets the terms together, so the
            sale either reopens or does not.
          </div>
          <div style="display:flex;gap:10px;align-items:baseline">
            <input id="causeReopenShares" type="text" inputmode="numeric" placeholder="${UNIT} to authorise" aria-label="${UNIT_TITLE} to authorise"
              style="flex:1;min-width:0;padding:5px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:13px;outline:none" oninput="causeReopenQuote()">
            <span style="font-size:10px;color:var(--fg-dim)">at</span>
            <span style="flex:0 0 110px;display:inline-flex;align-items:baseline;gap:4px">
              <input id="causeReopenPrice" type="text" inputmode="decimal" value="${Number(price) / 1e9}" aria-label="Price per share in gwei"
                style="flex:1;min-width:0;padding:5px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:13px;outline:none" oninput="causeReopenQuote()">
              <span style="font-size:10px;color:var(--fg-dim)">gwei</span>
            </span>
          </div>
          <div id="causeReopenQuote" style="font-size:10px;color:var(--fg-muted);margin:6px 0;min-height:26px;line-height:1.5">Enter how many shares to authorise</div>
          <button class="swap-btn" style="width:100%;font-size:11px;background:var(--surface);color:var(--fg-muted);border:1px solid var(--border-muted)" onclick="causeReopenPropose('${daoAddr}')">Open the proposal and vote</button>
          <div id="causeReopenStatus" style="margin-top:6px"></div>
        </div>
      </div>`;
  }

  // Governance info. #causeGovAlert fills in from a second read so the page paints
  // without waiting on it.
  // Below the tap, with governance — the things that describe a holder's standing in the
  // DAO, rather than in among the things a visitor came to do.
  html += redeemHTML;

  html += `
    <div id="causePool"></div>
    <div id="causeGovAlert"></div>
    <div class="section-card" style="background:var(--surface)">
      <div class="section-title">Governance</div>
      <div style="font-size:12px;line-height:1.8;color:var(--fg-muted)">
        10% quorum &middot; 7d voting &middot; 2d timelock &middot; ragequittable<br>
        ${saleIsLoot
          ? 'Loot holders can ragequit at any time for a pro-rata refund. Loot does not vote &mdash; governance sits with the shares.'
          : 'Share holders can ragequit at any time for a pro-rata refund.'}
      </div>
      ${reopenHTML}
      <div style="margin-top:8px">
        <a href="../dao/#/dao/1/${daoAddr}" style="font-size:11px;color:var(--fg-muted);text-decoration:underline">Manage DAO &rarr;</a>
      </div>
    </div>
  `;

  // Proposals & chat — the same drawer the standard DAICO page uses, so a cause gets
  // the discussion list, the vote bars and the quorum readout rather than a second,
  // thinner implementation of the same thing.
  html += `
    <div class="drawer open" id="proposalsDrawer" data-dao="${daoAddr}">
      <button class="drawer-toggle" onclick="toggleProposals()">
        <span>Proposals &amp; Chat</span>
        <span class="arrow">&#9660;</span>
      </button>
      <div class="activity-body">
        <div id="proposalsContent"><div class="activity-empty">Click to load</div></div>
      </div>
    </div>
  `;

  // Holders drawer (reuses loadHolders from the standard DAICO page, which already
  // counts shares + loot per member — so it is right for a loot cause and only the
  // heading was not).
  html += `
    <div class="drawer" id="holdersDrawer" data-dao="${daoAddr}">
      <button class="drawer-toggle" onclick="toggleHolders()">
        <span>Holders</span>
        <span class="arrow">&#9660;</span>
      </button>
      <div class="drawer-body" id="holdersContent"></div>
    </div>
  `;

  // Links
  html += `
    <div style="margin-top:16px;font-size:11px;color:var(--fg-dim)">
      <a href="https://etherscan.io/address/${daoAddr}" target="_blank" style="color:inherit">DAO</a>
      &middot; <a href="https://etherscan.io/address/${sharesAddr}" target="_blank" style="color:inherit">Shares</a>
      ${saleIsLoot ? `&middot; <a href="https://etherscan.io/address/${lootAddr}" target="_blank" style="color:inherit">Loot</a>` : ''}
      &middot; <a href="https://etherscan.io/address/${saleContract}" target="_blank" style="color:inherit">Sale Contract</a>
      ${metadata.creatorWallet ? `&middot; <a href="https://etherscan.io/address/${metadata.creatorWallet}" target="_blank" style="color:inherit">Creator</a>` : ''}
    </div>
  `;

  app.innerHTML = html;

  // Store for buy/ragequit functions
  app.dataset.dao = daoAddr;
  app.dataset.shares = sharesAddr;
  app.dataset.contSale = contSaleActive ? contSaleAddr : '';
  app.dataset.price = price.toString();
  app.dataset.treasury = treasuryETH.toString();
  app.dataset.totalSupply = (sharesTotalSupply + lootTotalSupply).toString();
  app.dataset.userBalance = userBalance.toString();
  app.dataset.tapRate = tapRate.toString();
  app.dataset.saleContract = saleContract;
  app.dataset.saleDeadline = String(saleDeadline);
  // The sale can only mint what is left, and the buy form clamps to it rather than
  // letting someone sign a transaction the contract will revert. On ShareSale that is
  // the undrained allowance; on ShareOffering the allowance is deliberately unbounded
  // and the gap to the supply ceiling is the real number.
  app.dataset.saleRemaining = (isOpenCap ? 0n
    : usesOffering ? (cap > sold ? cap - sold : 0n)
    : saleAllowance).toString();
  app.dataset.sharesSupply = sharesTotalSupply.toString();
  app.dataset.lootSupply = lootTotalSupply.toString();
  app.dataset.sym = coinSymbol;
  _causeGlyph = causeGlyph(data.meta, metadata, 15);

  loadCausePool(daoAddr, soldToken, gen).catch(() => {});

  if (saleEnded && sold > 0n) loadCauseSaleClose(daoAddr, soldToken, gen).catch(() => {});

  // Proposals and chat come from a second read so they cannot delay first paint.
  loadCauseGovernance(daoAddr, gen).catch(() => {});
  causeOpenProposals(daoAddr);

  // Auto-refresh sale stats every 30s (partial update, preserves inputs)
  if (_causeRefreshTimer) clearInterval(_causeRefreshTimer);
  const causeTick = () => {
    if (location.hash.slice(1) !== daoAddr) { clearInterval(_causeRefreshTimer); stopPoller(causeTick); return; }
    refreshCauseStats(daoAddr, metadata);
  };
  _causeRefreshTimer = startPoller(causeTick, 30000);
}

let _causeRefreshTimer = null;
let _causeBuyMode = 'shares'; // 'shares' or 'eth'
async function refreshCauseStats(daoAddr, metadata) {
  const gen = _renderGen;
  try {
    const sharesAddr = $('app')?.dataset?.shares;
    if (!sharesAddr) return;
    // Follow the token the sale actually mints — on a loot cause the shares supply is
    // the founder's single share and never moves, so metering against it would report
    // every raise as stuck at zero.
    const saleIsLoot = !!$('app')?.dataset.saleIsLoot;
    const soldToken = $('app')?.dataset.soldToken || sharesAddr;
    const unit = $('app')?.dataset.unit || 'shares';
    const ssIface = new ethers.Interface(
      ($('app')?.dataset.saleContract || '').toLowerCase() === SHARE_OFFERING.toLowerCase()
        ? SHARE_OFFERING_ABI : SHARE_SALE_ABI);
    const erc20I = new ethers.Interface(ERC20_ABI);
    const daoI = new ethers.Interface(['function allowance(address token, address spender) view returns (uint256)']);
    const mc3Calls = [
      { target: $('app')?.dataset.saleContract || SHARE_SALE, allowFailure: true, callData: ssIface.encodeFunctionData('sales', [daoAddr]) },
      { target: MC3, allowFailure: true, callData: _mc3Iface.encodeFunctionData('getEthBalance', [daoAddr]) },
      { target: soldToken, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) },
      { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [daoAddr, $('app')?.dataset.saleContract || SHARE_SALE]) },
    ];
    if (_connectedAddress) {
      mc3Calls.push({ target: soldToken, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
    }
    const mcRes = await withRPC(async rpc => {
      const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
      return await mc.aggregate3(mc3Calls);
    }).catch(() => []);
    if (gen !== _renderGen) return;

    let saleData = null, treasuryETH = 0n, soldTokenSupply = 0n, saleAllowance = 0n, userBalance = 0n;
    if (mcRes[0]?.success) try { saleData = ssIface.decodeFunctionResult('sales', mcRes[0].returnData); } catch {}
    if (mcRes[1]?.success) try { treasuryETH = _mc3Iface.decodeFunctionResult('getEthBalance', mcRes[1].returnData)[0]; } catch {}
    if (mcRes[2]?.success) try { soldTokenSupply = erc20I.decodeFunctionResult('totalSupply', mcRes[2].returnData)[0]; } catch {}
    if (mcRes[3]?.success) try { saleAllowance = daoI.decodeFunctionResult('allowance', mcRes[3].returnData)[0]; } catch {}
    if (_connectedAddress && mcRes[4]?.success) try { userBalance = erc20I.decodeFunctionResult('balanceOf', mcRes[4].returnData)[0]; } catch {}

    const price = saleData ? BigInt(saleData.price) : 0n;
    const creatorShares = ethers.parseEther('1');
    // The founder's share lands in the shares supply, never the loot supply.
    const sold = saleIsLoot
      ? soldTokenSupply
      : (soldTokenSupply > creatorShares ? soldTokenSupply - creatorShares : 0n);
    const usesOffering = ($('app')?.dataset.saleContract || '').toLowerCase() === SHARE_OFFERING.toLowerCase();
    const cap = usesOffering
      ? (saleData && saleData.cap !== undefined
          ? (saleIsLoot ? BigInt(saleData.cap)
             : (BigInt(saleData.cap) > creatorShares ? BigInt(saleData.cap) - creatorShares : 0n))
          : 0n)
      : sold + saleAllowance;
    const saleDeadline = saleData ? Number(saleData.deadline) : 0;
    const now = Math.floor(Date.now() / 1000);
    // A live continuous sale keeps minting open regardless of the DAICO's own deadline or
    // cap. Without this the 30s refresh flips Status back to "Ended" under an open sale.
    const contSaleLive = !!$('app')?.dataset?.contSale;
    const saleActive = contSaleLive || saleDeadline === 0 || now < saleDeadline;
    // Same reading as the first render: zero allowance with shares already minted is a
    // sold-out sale, not an unmetered one.
    const isOpenCap = contSaleLive || cap >= 2n ** 128n
      || (!usesOffering && saleAllowance === 0n && sold === 0n && price > 0n && saleActive);
    const soldOut = !isOpenCap && cap > 0n && sold >= cap;
    const saleEnded = !saleActive || soldOut;
    const raisedWei = price > 0n ? sold * price / ethers.parseEther('1') : 0n;
    const raisedEth = Number(ethers.formatEther(raisedWei));
    const treasuryEth = Number(ethers.formatEther(treasuryETH));
    const ethUsd = _ethUsdPrice || 0;

    const targetWei = (!isOpenCap && cap > 0n && price > 0n) ? cap * price / ethers.parseEther('1') : 0n;

    // Update raised row
    const raisedEl = $('causeRaisedRow');
    if (raisedEl) {
      const raisedUsd = ethUsd ? ' ($' + (raisedEth * ethUsd).toFixed(2) + ')' : '';
      const treasuryUsd = ethUsd ? ' ($' + (treasuryEth * ethUsd).toFixed(2) + ')' : '';
      const treasuryDiffers = Math.abs(treasuryEth - raisedEth) > 0.0001;
      raisedEl.innerHTML = `
        <span style="font-size:18px;font-weight:700">${raisedEth.toFixed(raisedEth > 0 && raisedEth < 0.0001 ? 8 : 4)} ETH</span>
        <span style="font-size:11px;color:var(--fg-muted);margin-left:2px">raised${targetWei > 0n ? ' of ' + fmtNum(Number(ethers.formatEther(targetWei))) + ' ETH' : ''}</span>
        <span style="font-size:11px;color:var(--fg-muted)">${raisedUsd}</span>
        ${treasuryDiffers ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:2px">${treasuryEth.toFixed(treasuryEth > 0 && treasuryEth < 0.0001 ? 8 : 4)} ETH treasury${treasuryUsd}</div>` : ''}
      `;
    }

    // Update sold count
    const soldEl = $('causeSoldVal');
    if (soldEl) soldEl.textContent = Number(ethers.formatEther(sold)).toLocaleString(undefined, {maximumFractionDigits: 0});
    const capEl = $('causeSoldCap');
    if (capEl) {
      const capFmt = isOpenCap ? 'Open' : (cap > 0n ? Number(ethers.formatEther(cap)).toLocaleString(undefined, {maximumFractionDigits: 0}) : 'Open');
      capEl.textContent = (isOpenCap || cap === 0n) ? unit : 'of ' + capFmt;
    }

    // Update status
    const statusEl = $('causeStatusVal');
    if (statusEl) {
      statusEl.textContent = soldOut ? 'Trading' : saleEnded ? 'Ended' : 'Active';
      statusEl.style.color = (soldOut || !saleEnded) ? 'var(--green)' : 'var(--fg-muted)';
    }
    const dlEl = $('causeDeadlineVal');
    if (dlEl) {
      dlEl.textContent = soldOut ? `every ${saleIsLoot ? 'loot unit' : 'share'} minted` : saleDeadline > 0 ? fmtDeadline(saleDeadline) : 'no deadline';
      dlEl.style.color = (saleDeadline > 0 && !saleEnded && saleDeadline - now < 172800) ? 'var(--red)' : 'var(--fg-dim)';
    }

    // Update user balance
    if (_connectedAddress) {
      const balEl = document.querySelector('.coin-user-balance');
      if (balEl) balEl.textContent = (userBalance > 0n ? fmtTokenAmount(userBalance.toString()) : '0') + ' ' + unit;
    }

    // Update progress meters
    const metersEl = $('causeMeters');
    if (metersEl) metersEl.innerHTML = causeMetersHTML(raisedWei, targetWei, treasuryETH, usesOffering);

    // Runway moves with the treasury, so recompute it from the rate stashed at render
    const runwayEl = $('causeTapRunway');
    if (runwayEl) {
      const rate = BigInt($('app').dataset.tapRate || '0');
      runwayEl.innerHTML = causeRunwayHTML(treasuryETH, rate, saleEnded);
    }

    // Update stored data
    $('app').dataset.treasury = treasuryETH.toString();
    $('app').dataset.userBalance = userBalance.toString();
    $('app').dataset.saleRemaining = (isOpenCap ? 0n
      : usesOffering ? (cap > sold ? cap - sold : 0n)
      : saleAllowance).toString();
    if (saleIsLoot) $('app').dataset.lootSupply = soldTokenSupply.toString();
    else $('app').dataset.sharesSupply = soldTokenSupply.toString();
    causeUpdateBuyQuote();
  } catch (e) { console.warn('Cause stats refresh failed:', e); }
}

// A queued proposal is the only moment ragequit protection has to be used, and it is
// the moment the page said nothing about. Moloch's timelock lets a proposal execute
// two days after it is queued; a holder who objects can leave with their pro-rata
// share, but only if they know it is coming. So the countdown leads, in red, above
// everything else — the drawer below carries the detail, but a holder should not have
// to open a drawer to learn the clock is running.
async function loadCauseGovernance(daoAddr, gen) {
  const alertEl = $('causeGovAlert');
  if (!alertEl) return;
  let view;
  try {
    view = await withRPC(async rpc => {
      const helper = new ethers.Contract(VIEW_HELPER, DAO_VIEW_ABI, rpc);
      return await helper.getDAOWithDAICO(daoAddr, 0, 50, 0, 0, [], [ZERO]);
    });
  } catch { return; }
  if (gen !== _renderGen) return;

  const queued = Array.from(view?.base?.proposals || []).filter(p => Number(p.state) === 2);
  const now = Math.floor(Date.now() / 1000);
  // The DAO's own delay, not the two days the launcher happens to set. setTimelockDelay
  // is onlyDAO, so it can be changed — and a shortened one made this banner promise time
  // that was not there, on the one control whose whole purpose is an accurate deadline.
  // Same positional gov tuple the proposals drawer reads.
  const govDelay = Number(view?.base?.gov?.[4] || 0) || 172800;
  alertEl.innerHTML = queued.map(p => {
    const left = Number(p.queuedAt) + govDelay - now;
    const when = left <= 0 ? 'executable now'
      : left < 3600 ? `in ${Math.ceil(left / 60)} min`
      : left < 86400 ? `in ${Math.floor(left / 3600)}h`
      : `in ${Math.floor(left / 86400)}d ${Math.floor((left % 86400) / 3600)}h`;
    return `<div class="section-card" style="border-color:var(--red);background:var(--surface);margin-bottom:14px">
      <div class="section-title" style="color:var(--red)">Proposal executes ${when}</div>
      <div style="font-size:12px;color:var(--fg-muted);line-height:1.6">
        A passed proposal is in its timelock. Anything the DAO can do to its treasury
        happens when that runs out. If you disagree with it, redeeming your ${$('app')?.dataset.unit || 'shares'} before
        then returns your pro-rata share of the treasury &mdash; afterwards may be too late.
        <div style="margin-top:6px">
          <a href="../dao/#/dao/1/${daoAddr}" style="color:var(--red);text-decoration:underline">Review it &rarr;</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Mints date the sale: the first and last of them are when it opened and when it
// filled. Not every RPC serves logs, so this returns null rather than pretending, and
// the caller simply says less.
async function fetchSaleFillTime(sharesAddr) {
  const iface = new ethers.Interface(['event Transfer(address indexed from, address indexed to, uint256 amount)']);
  const Z32 = ethers.zeroPadValue(ZERO, 32);
  try {
    return await withRPC(async rpc => {
      const head = await rpc.getBlockNumber();
      const logs = await rpc.getLogs({
        address: sharesAddr,
        fromBlock: head - 9000 > 0 ? head - 9000 : 0,
        toBlock: head,
        topics: [iface.getEvent('Transfer').topicHash, Z32]
      });
      if (logs.length < 2) return null;
      const [a, b] = await Promise.all([
        rpc.getBlock(logs[0].blockNumber), rpc.getBlock(logs[logs.length - 1].blockNumber)
      ]);
      return a && b && b.timestamp > a.timestamp ? b.timestamp - a.timestamp : null;
    }, 20000);
  } catch { return null; }
}

// How long a sale took to fill, in words. Four hours against a nine day window is the
// strongest thing this page can say about demand, and nothing was saying it.
function fmtFillTime(sec) {
  if (!sec || sec <= 0) return null;
  if (sec < 5400) return `${Math.max(1, Math.round(sec / 60))} minutes`;
  if (sec < 172800) return `${Math.round(sec / 3600)} hours`;
  return `${Math.round(sec / 86400)} days`;
}

// The closing summary, in the space the buy form used to hold. It states the three
// figures and stops: what came in, what went back, what stayed. An earlier version led
// with the net and then argued the refund was not a shortfall, which is a case nobody
// asked it to make — and making it unprompted is what makes a number look like bad news.
async function loadCauseSaleClose(daoAddr, sharesAddr, gen) {
  const el = $('causeSaleClose');
  if (!el) return;
  const filled = fmtFillTime(await fetchSaleFillTime(sharesAddr));
  if (gen !== _renderGen || !el.isConnected) return;
  // The headline carries what was raised and the SOLD tile the share count. How fast it
  // went is the only thing neither can say, so it is the only thing here.
  el.innerHTML = `<div style="font-size:11px;color:var(--fg-dim);margin-bottom:14px">
    <b style="color:var(--green);font-weight:600">Fully funded</b>${filled ? ` in ${filled}` : ''}
  </div>`;
}

const MOLOCH_PROP_ABI = [
  'function proposalId(uint8 op, address to, uint256 value, bytes data, bytes32 nonce) view returns (uint256)',
  'function castVote(uint256 id, uint8 support)',
  'function setAllowance(address spender, address token, uint256 amount)'
];

// Reopening moves the sale onto ShareOffering rather than refilling the singleton that
// let it close short, because capacity granted there survives redemption. That takes two
// proposals: setAllowance is the DAO acting on itself, configure is a call out to the
// offering, and Moloch's multicall delegatecalls into itself so it cannot reach the
// second. Nonces are derived from their contents, so separate holders proposing the same
// reopening land on the same ids and their votes accumulate.
const CAUSE_REOPEN_WINDOW_DAYS = 45;
function causeReopenSteps(daoAddr, sharesWei, price, deadline, supplyNow) {
  // One proposal, not two. Moloch's multicall delegatecalls into itself so it cannot reach
  // an external contract, which is what sent this down the two-proposal path originally —
  // but batchCalls is the outbound version, onlyDAO, and executeByVotes runs as the DAO.
  //
  // Atomic is also the safer shape, not just the shorter one. Split across two votes, one
  // can pass while the other fails or stalls, leaving the offering holding a mint
  // allowance with no configured sale, or a configured sale it cannot mint for. batchCalls
  // requires every leg, so the DAO either reopens or does not.
  const molochI = new ethers.Interface(MOLOCH_PROP_ABI);
  const offerI = new ethers.Interface([
    'function configure(address token, address payToken, uint256 price, uint40 deadline, uint256 cap)'
  ]);
  const batchI = new ethers.Interface([
    'function batchCalls((address target, uint256 value, bytes data)[] calls) payable'
  ]);
  // configure() wants a target SUPPLY, so it is everything outstanding now plus the room
  // being authorised — not the room on its own.
  const cap = supplyNow + sharesWei;
  // The deadline is baked in at proposal time but only takes effect at execution, which is
  // up to nine days later: seven for the TTL to reach quorum, two more for the timelock.
  // Reusing the sale's existing deadline meant a vote could pass and write a date already
  // in the past, leaving a configured sale that reverts Expired on the first buy. So the
  // window is measured from now and sized to survive the lifecycle with room to sell.
  const freshDeadline = BigInt(Math.floor(Date.now() / 1000)) + BigInt(CAUSE_REOPEN_WINDOW_DAYS) * 86400n;
  const inner = [
    { target: daoAddr, value: 0n,
      data: molochI.encodeFunctionData('setAllowance', [SHARE_OFFERING, daoAddr, ethers.MaxUint256]) },
    { target: SHARE_OFFERING, value: 0n,
      data: offerI.encodeFunctionData('configure', [daoAddr, ZERO, price, freshDeadline, cap]) },
  ];
  return [
    { label: 'reopen the sale',
      to: daoAddr,
      data: batchI.encodeFunctionData('batchCalls', [inner.map(c => [c.target, c.value, c.data])]),
      nonce: ethers.keccak256(ethers.toUtf8Bytes('zfi.cause.reopen.' + cap.toString())) },
  ];
}

function causeReopenQuote() {
  const el = $('causeReopenQuote');
  if (!el) return;
  const ds = $('app')?.dataset || {};
  const raw = ($('causeReopenShares')?.value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) { el.textContent = 'Enter how many shares to authorise'; return; }
  // Whole shares only: parseEther on "1e6" or "1,000" throws, and a fractional share is
  // not a thing anyone means to authorise.
  const n = Math.floor(Number(raw));
  if (!Number.isSafeInteger(n) || n <= 0) { el.textContent = 'Enter a whole number of shares'; return; }
  const gw = parseFloat(($('causeReopenPrice')?.value || '').trim());
  const price = Number.isFinite(gw) && gw > 0 ? BigInt(Math.round(gw * 1e9)) : BigInt(ds.price || '0');
  if (price <= 0n) { el.textContent = 'Enter a price per share'; return; }
  const wei = ethers.parseEther(String(n));
  const eth = wei * price / ethers.parseEther('1');
  const quorum = BigInt(ds.sharesSupply || '0') / 10n;
  const floor = BigInt(ds.floor || '0');
  const spot = _causePoolCache?.spot || 0n;
  el.innerHTML = `Authorises <b style="color:var(--fg)">${fmtEthBal(Number(ethers.formatEther(eth)))} ETH</b> more at ${causeGwei(price)}.
    <div style="margin-top:3px">One proposal, ${fmtTokenAmount(quorum.toString())} ${UNIT} of turnout, then a two day timelock.</div>`
    + (floor > 0n && price < floor
        // Minting under the floor hands the buyer more treasury than they paid in, and the
        // difference comes out of every existing holder's claim.
        ? `<div style="color:var(--red);margin-top:3px">Below the ${causeGwei(floor)} redemption price \u2014 every share sold here dilutes existing holders.</div>`
        : spot > 0n
          ? `<div style="color:var(--fg-dim);margin-top:3px">Floor ${causeGwei(floor)} &middot; market ${causeGwei(spot)}.</div>`
          : '');
}
