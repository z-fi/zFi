// Percentages apply to whichever asset is in the pay field. On the ETH side 100%
// leaves a gas reserve — filling the field with the whole balance produces an amount
// that cannot be sent, which reads as a broken quote rather than as an empty wallet.
const LC_GAS_RESERVE = 2000000000000000n;   // 0.002 ETH
function lcSetSellPct(pct) {
  const bal = _lcSide === 'sell'
    ? _lcBalance
    : (_lcEthBalance > LC_GAS_RESERVE ? _lcEthBalance - LC_GAS_RESERVE : 0n);
  if (bal === 0n) return;
  const amt = pct === 100 ? bal : (bal * BigInt(pct)) / 100n;
  const el = $('lcAmount');
  if (el) { el.value = ethers.formatUnits(amt, 18); lcQuoteDebounced(); }
}

function lcSetOut(text, sub, placeholder) {
  const out = $('lcOut'), subEl = $('lcOutSub');
  if (out) { out.textContent = text; out.classList.toggle('placeholder', !!placeholder); }
  if (subEl) subEl.innerHTML = sub || '&nbsp;';
}

function lcQuoteDebounced() {
  if (_lcQuoteTimer) clearTimeout(_lcQuoteTimer);
  _lcQuoteTimer = setTimeout(lcQuote, 300);
}

// Both sides quote through the same lens call the swap page uses, so the number here
// and the number there come from one source rather than two that can disagree.
async function lcQuote() {
  const my = ++_lcQuoteSeq;
  const raw = ($('lcAmount')?.value || '').trim();
  _lcQuote = null;
  if (!raw || !(parseFloat(raw) > 0)) { lcSetOut('0.0', 'Balance: --', true); return; }

  let amountIn;
  try { amountIn = ethers.parseUnits(raw, 18); } catch { lcSetOut('0', 'Invalid amount', true); return; }
  if (amountIn <= 0n) { lcSetOut('0.0', 'Balance: --', true); return; }

  const buy = _lcSide === 'buy';
  const tokenIn = buy ? ZERO : _lcToken;
  const tokenOut = buy ? _lcToken : ZERO;
  lcSetOut('…', 'Quoting…', true);
  try {
    const [c0, c1] = tokenIn.toLowerCase() < tokenOut.toLowerCase() ? [tokenIn, tokenOut] : [tokenOut, tokenIn];
    const me = _connectedAddress || ZERO;
    const data = SEL_QUOTE_BEST + _a(c0) + _a(c1) + _a(me) + _a(tokenIn) + _w(amountIn) + _w(0) + _w(LQ_SCAN);
    const res = await withRPC(rpc => rpc.call({ to: PPLENS, data }));
    if (my !== _lcQuoteSeq) return;
    if (!res || res.length < 130) { lcSetOut('0', 'No route for that size.', true); return; }
    const h = res.slice(2);
    const pool = '0x' + h.slice(24, 64);
    const out = BigInt('0x' + h.slice(64, 128));
    if (out <= 0n || /^0x0{40}$/i.test(pool)) { lcSetOut('0', 'No route for that size.', true); return; }

    _lcQuote = { pool, out, amountIn, tokenIn, tokenOut };
    const outTxt = buy ? fmtTokenAmount(out.toString()) : fmtNum(Number(ethers.formatEther(out)));
    // Effective price is what this trade actually pays, which matters more than spot.
    const eff = buy ? (amountIn * LQ_WAD) / out : (out * LQ_WAD) / amountIn;
    const usd = _lcEthUsd > 0
      ? (buy ? Number(ethers.formatEther(amountIn)) : Number(ethers.formatEther(out))) * _lcEthUsd : 0;
    lcSetOut(outTxt,
      `${fmtPriceWei(eff)} per token` + (usd > 0 ? ` · ${fmtUsd(usd)}` : '')
      + ` · reverts below ${100 - _lcSlipPct}% of this`, false);
    const go = $('lcGo'); if (go) go.disabled = false;

    // A sell has a second venue that the pool quote knows nothing about: the floor. It
    // pays a rate that does not move with size, so on any sale large enough to walk the
    // curve — and on any coin whose floor has been lifted by burns — redeeming pays more.
    // The page explains that in the redeem drawer; it is worth saying at the moment the
    // choice is actually being made, with this trade's numbers rather than in general.
    lcCompareToFloor(buy, buy ? out : amountIn, out, my).catch(() => {});
  } catch {
    if (my !== _lcQuoteSeq) return;
    lcSetOut('0', 'Could not quote that.', true);
  }
}

/// The floor, priced against the trade on screen. Both sides of a trade have a stake in
/// it and the page only ever spoke to one of them.
///
/// Selling: redemption is a second venue, and the one that wins on any size large enough
/// to walk the curve. Said only when it pays more than the pool.
///
/// Buying: the floor is what the tokens being bought could be burned back for, so the gap
/// is the part of the price with nothing under it. Said always, because a buyer cannot
/// infer it from a quote — and it is not always bad news: a coin whose floor has been
/// lifted above the market by burns is one where the purchase is redeemable for more than
/// it cost, which is the opposite warning and worth as much.
async function lcCompareToFloor(buying, tokenAmt, poolOut, seq) {
  if (!_lcToken || tokenAmt <= 0n) return;
  const iface = new ethers.Interface(LAUNCHER_ABI);
  const redeemOut = await withRPC(rpc => rpc.call({
    to: LAUNCHER, data: iface.encodeFunctionData('quoteRedeem', [_lcToken, tokenAmt])
  })).then(r => iface.decodeFunctionResult('quoteRedeem', r)[0]).catch(() => 0n);
  if (seq !== _lcQuoteSeq) return;              // a newer quote has already answered
  const el = $('lcOutSub');
  if (!el || redeemOut <= 0n) return;

  if (!buying) {
    if (redeemOut <= poolOut) return;           // the pool is the better exit; say nothing
    const better = Number(ethers.formatEther(redeemOut - poolOut));
    const pct = poolOut > 0n ? Number((redeemOut - poolOut) * 10000n / poolOut) / 100 : 0;
    el.innerHTML += `<div style="color:var(--fg-muted);margin-top:3px">Redeeming these pays
      <span style="color:var(--green)">${fmtNum(Number(ethers.formatEther(redeemOut)))} ETH</span>,
      ${pct >= 0.1 ? '+' + pct.toFixed(1) + '%' : '+' + better.toFixed(6) + ' ETH'} on this sale
      &mdash; see “Redeem at the floor” below.</div>`;
    return;
  }

  // `_lcQuote.amountIn` is the ETH going in; redeemOut is what comes back out if the
  // tokens bought were burned immediately.
  const spend = _lcQuote?.amountIn || 0n;
  if (spend <= 0n) return;
  const ratio = Number(redeemOut * 10000n / spend) / 100;
  if (ratio >= 100) {
    el.innerHTML += `<div style="color:var(--fg-muted);margin-top:3px">Redeemable now for
      <span style="color:var(--green)">${fmtNum(Number(ethers.formatEther(redeemOut)))} ETH</span>,
      ${ratio.toFixed(0)}% of what this costs — the floor is above the market.</div>`;
  } else {
    el.innerHTML += `<div style="color:var(--fg-muted);margin-top:3px">Redeemable now for
      ${fmtNum(Number(ethers.formatEther(redeemOut)))} ETH, ${ratio < 1 ? '<1' : ratio.toFixed(0)}%
      of what this costs — the rest is what the market pays above the floor.</div>`;
  }
}

async function lcTrade() {
  if (_lcTrading) return;
  const status = $('lcStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:12px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  if (!_lcQuote) { lcQuote(); return; }

  _lcTrading = true;
  const btn = $('lcGo');
  if (btn) btn.disabled = true;
  const { pool, out, amountIn, tokenIn, tokenOut } = _lcQuote;
  const minOut = out - (out * BigInt(Math.round(_lcSlipPct * 100))) / 10000n;
  try {
    const me = await sgn.getAddress();
    // Never hand tokens to an address the factory does not vouch for.
    const okPool = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_ISPOOL + _a(pool) }));
    if (!okPool || _dec1(okPool, 0) !== 1n) { say('That address is not a Precision pool — refusing to send.', 'var(--red)'); return; }

    const routeData = _encPRoute([pool], tokenIn, tokenOut, amountIn, minOut, me);
    const routed = _encSnwap(tokenIn, amountIn, me, tokenOut, minOut, PROUTE, routeData);
    let data, value;
    if (tokenIn === ZERO) {
      // Native in: the router is funded by the call itself, so one leg and no approval.
      data = routed; value = amountIn;
    } else {
      // Token in: the router pulls, so it needs an allowance, and the checkpoint binds
      // the pull to this exact route so a funded router cannot be spent by another one.
      const token = new ethers.Contract(_lcToken, ERC20_ABI, sgn);
      if ((await token.allowance(me, ZROUTER)) < amountIn) {
        say('Approving…');
        await (await token.approve(ZROUTER, ethers.MaxUint256)).wait();
      }
      const checkpoint = _encSnwap(ZERO, 0n, me, ZERO, 0n, PROUTE,
        SEL_PCHECKPOINT + _a(_lcToken) + ethers.keccak256('0x' + routeData.replace(/^0x/, '')).slice(2) + _a(me));
      data = ROUTER_IFACE.encodeFunctionData('multicall', [['0x' + checkpoint.replace(/^0x/, ''), '0x' + routed.replace(/^0x/, '')]]);
      value = 0n;
    }
    say('Confirm in your wallet…');
    const tx = await sgn.sendTransaction({ to: ZROUTER, data: data.startsWith('0x') ? data : '0x' + data, value });
    say(`Swapping… <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Done.', 'var(--green)');
    const amt = $('lcAmount'); if (amt) amt.value = '';
    _lcQuote = null;
    const myGen = _renderGen;
    if (myGen === _renderGen) await renderCoinPage(_lcToken);
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.reason || err.message || 'Failed.'), 'var(--red)');
  } finally {
    _lcTrading = false;
    const b = $('lcGo'); if (b) b.disabled = false;
  }
}

function lcSetRedeemMax() {
  const el = $('lcRedeemAmount');

async function lcRedeemQuote() {
  const el = $('lcRedeemQuote');
  if (!el) return;
  const raw = ($('lcRedeemAmount')?.value || '').trim();
  if (!raw || !(parseFloat(raw) > 0)) { el.innerHTML = '&nbsp;'; return; }
  let amount;
  try { amount = ethers.parseUnits(raw, 18); } catch { el.textContent = 'Invalid amount'; return; }
  try {
    const iface = new ethers.Interface(LAUNCHER_ABI);
    const res = await withRPC(rpc => rpc.call({ to: LAUNCHER, data: iface.encodeFunctionData('quoteRedeem', [_lcToken, amount]) }));
    const ethOut = iface.decodeFunctionResult('quoteRedeem', res)[0];
    if (ethOut === 0n) { el.textContent = 'Nothing to redeem at that size.'; return; }
    const usd = _lcEthUsd > 0 ? ` · ${fmtUsd(Number(ethers.formatEther(ethOut)) * _lcEthUsd)}` : '';
    el.textContent = `${fmtNum(Number(ethers.formatEther(ethOut)))} ETH${usd}`;
  } catch {
    el.textContent = 'Could not quote that.';
  }
}

// ---- Liquidity on a launched coin's pool ----
// PrecisionPool is its own LP token: `balanceOf`/`totalSupply` are LP shares, and both
// addLiquidityExact and removeLiquidity are permissionless. ETH is token0 in every pool
// the launcher seeds, so amount0 is the ether leg and amount1 the coin leg.
//
// This is not the cause page's LP tab ported over — that one drives zAMM through a pool
// key. A launched coin lives in a PrecisionPool, which takes plain amounts.
const PRECISION_LP_ABI = [
  'function addLiquidityExact(uint256 sqrtPriceInit, uint256 amount0, uint256 amount1, uint256 minLP, address to) payable returns (uint256 lp, uint256 used0, uint256 used1)',
  'function removeLiquidity(uint256 lp, uint256 min0, uint256 min1, address to) returns (uint256 amount0, uint256 amount1)',
  'function reserve0() view returns (uint256)',
  'function reserve1() view returns (uint256)',
  'function balanceOf(address) view returns (uint256)',
  'function totalSupply() view returns (uint256)'
];
let _lcLpSide = 'zap';
let _lcLpBal = 0n, _lcLpSupply = 0n, _lcLpR0 = 0n, _lcLpR1 = 0n;
let _lcZapQuote = null;

function lcLpSwitch(side) {
  _lcLpSide = side;
  for (const [k, tab, pane] of [['zap', 'lcLpZapTab', 'lcLpZapPane'],
                                ['add', 'lcLpAddTab', 'lcLpAddPane'],
                                ['remove', 'lcLpRemoveTab', 'lcLpRemovePane']]) {
    $(tab)?.classList.toggle('active', side === k);
    if ($(pane)) $(pane).style.display = side === k ? '' : 'none';
  }
}

// Reserves and the caller's LP balance in one batch, refreshed when the drawer opens
// rather than on every page render — a shut drawer has nothing to show.
async function lcLpRefresh() {
  const drawer = $('lcLpDrawer');
  if (!drawer || !drawer.classList.contains('open') || !_lcPool) return;
  try {
    const lpI = new ethers.Interface(PRECISION_LP_ABI);
    const calls = [
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('reserve0') },
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('reserve1') },
      { target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('totalSupply') }
    ];
    if (_connectedAddress) {
      calls.push({ target: _lcPool, allowFailure: true, callData: lpI.encodeFunctionData('balanceOf', [_connectedAddress]) });
    }
    const res = await mcAggregate(calls);
    _lcLpR0 = mcDecode(res[0], lpI, 'reserve0', [0n])[0];
    _lcLpR1 = mcDecode(res[1], lpI, 'reserve1', [0n])[0];
    _lcLpSupply = mcDecode(res[2], lpI, 'totalSupply', [0n])[0];
    _lcLpBal = _connectedAddress ? mcDecode(res[3], lpI, 'balanceOf', [0n])[0] : 0n;
  } catch { return; }
  const eth = Number(_lcEthBalance) / 1e18;
  if ($('lcLpEthBal')) $('lcLpEthBal').textContent = _connectedAddress
    ? `Balance: ${eth >= 0.0001 || eth === 0 ? eth.toFixed(4) : eth.toExponential(2)} ETH` : 'Balance: --';
  if ($('lcLpTokBal')) $('lcLpTokBal').textContent = _connectedAddress
    ? `Balance: ${fmtTokenAmount(_lcBalance.toString())}` : 'Balance: --';
  if ($('lcLpZapBal')) $('lcLpZapBal').textContent = $('lcLpEthBal')?.textContent || 'Balance: --';
  if ($('lcLpBal')) $('lcLpBal').textContent = _connectedAddress
    ? `Balance: ${ethers.formatUnits(_lcLpBal, 18)}` : 'Balance: --';
  lcLpPair();
  lcLpQuoteRemove();
}

// The coin leg that pairs with the ether leg is fixed by the reserves — a deposit at any
// other ratio is refunded down to this one, so showing anything else would be a lie about
// what the transaction spends.
// The lens answers what the deposit will actually consume and hand back. The pool
// refunds a deposit that is off-ratio rather than failing, so "you will deposit X and
// get Y back" is not something a UI can work out from reserves alone — which is why
// PrecisionLiquidityLens exposes it.
async function lcLpPreviewAdd(amount0, amount1) {
  try {
    const r = await withRPC(rpc => rpc.call({
      to: PLQLENS, data: SEL_PREVIEW_ADD + _a(_lcPool) + _w(amount0) + _w(amount1) }));
    if (!r || _dec1(r, 0) !== 1n) return null;
    return { lp: _dec1(r, 1), used0: _dec1(r, 2), used1: _dec1(r, 3),
             refund0: _dec1(r, 4), refund1: _dec1(r, 5) };
  } catch { return null; }
}

let _lcZapTimer = null;
function lcLpZapQuoteDebounced() {
  if (_lcZapTimer) clearTimeout(_lcZapTimer);
  _lcZapTimer = setTimeout(lcLpZapQuote, 350);
}

async function lcLpZapQuote() {
  const note = $('lcLpZapNote');
  const raw = ($('lcLpZapEth')?.value || '').trim();
  const say = m => { if (note) note.innerHTML = m; };
  if (!raw || !(parseFloat(raw) > 0)) {
    say(`The pool sells the right portion of your ether for ${escText(_lcInfo?.symbol || '')} and deposits both sides, so you do not have to hold the coin first.`);
    _lcZapQuote = null; return;
  }
  let wei;
  try { wei = ethers.parseEther(raw); } catch { say('Invalid amount.'); _lcZapQuote = null; return; }
  const pv = await causeZapPreview(_lcPool, ZERO, wei);
  if (!pv) { say('<span style="color:var(--red)">The pool cannot take a zap that size right now.</span>'); _lcZapQuote = null; return; }
  _lcZapQuote = { amountIn: wei, portion: pv.portion, lp: pv.lp };
  const sup = _lcLpSupply > 0n ? _lcLpSupply + pv.lp : pv.lp;
  const share = sup > 0n ? Number(pv.lp * 10000n / sup) / 100 : 0;
  say(`Sells ${Number(ethers.formatEther(pv.portion)).toFixed(5)} of your ${Number(ethers.formatEther(wei)).toFixed(5)} ETH for ${escText(_lcInfo?.symbol || '')}, then deposits both sides &mdash; about ${share.toFixed(2)}% of the pool.`);
}

function lcLpPair() {
  const note = $('lcLpAddNote'), out = $('lcLpTok');
  const raw = ($('lcLpEth')?.value || '').trim();
  const setNote = m => { if (note) note.innerHTML = m || '&nbsp;'; };
  if (!raw || !(parseFloat(raw) > 0)) { if (out) { out.textContent = '0.0'; out.classList.add('placeholder'); } setNote(''); return; }
  if (!(_lcLpR0 > 0n) || !(_lcLpR1 > 0n)) { setNote('Pool has no reserves to pair against.'); return; }
  let wei;
  try { wei = ethers.parseEther(raw); } catch { setNote('Invalid amount.'); return; }
  const tok = wei * _lcLpR1 / _lcLpR0;
  if (out) { out.textContent = fmtTokenAmount(tok.toString()); out.classList.remove('placeholder'); }
  if (_connectedAddress && tok > _lcBalance) {
    setNote(`<span style="color:var(--red)">You hold ${fmtTokenAmount(_lcBalance.toString())} ${escText(_lcInfo?.symbol || '')} — not enough for that much ETH.</span>`);
    return;
  }
  setNote('Checking…');
  const cushioned = tok * (10000n + BigInt(Math.round(_lcSlipPct * 100))) / 10000n;
  lcLpPreviewAdd(wei, cushioned).then(pv => {
    if ($('lcLpEth')?.value.trim() !== raw) return;   // the box moved on
    if (!pv) { setNote('The pool cannot take a deposit that size right now.'); return; }
    const sup = _lcLpSupply > 0n ? _lcLpSupply + pv.lp : pv.lp;
    const share = sup > 0n ? Number(pv.lp * 10000n / sup) / 100 : 0;
    const back = pv.refund1 > 0n ? `, ${fmtTokenAmount(pv.refund1.toString())} refunded` : '';
    setNote(`Deposits ${Number(ethers.formatEther(pv.used0)).toFixed(5)} ETH + ${fmtTokenAmount(pv.used1.toString())} ${escText(_lcInfo?.symbol || '')}${back} — about ${share.toFixed(2)}% of the pool.`);
  });
}

function lcLpSetPct(pct) {
  if (_lcLpBal === 0n) return;
  const amt = pct === 100 ? _lcLpBal : (_lcLpBal * BigInt(pct)) / 100n;
  const el = $('lcLpBurn');
  if (el) { el.value = ethers.formatUnits(amt, 18); lcLpQuoteRemove(); }
}

function lcLpQuoteRemove() {
  const note = $('lcLpRemoveNote');
  const raw = ($('lcLpBurn')?.value || '').trim();
  const setNote = m => { if (note) note.innerHTML = m || '&nbsp;'; };
  if (!raw || !(parseFloat(raw) > 0) || !(_lcLpSupply > 0n)) { setNote(''); return; }

  try { lp = ethers.parseUnits(raw, 18); } catch { setNote('Invalid amount.'); return; }
