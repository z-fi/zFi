          ${myCost > 0n ? `<div style="display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--fg-dim);margin-top:-4px;margin-bottom:8px">
            <span>paid ~${fmtEthBal(Number(ethers.formatEther(myCost)))} ETH at ${fmtPriceWei(price)}</span>
            <span style="flex-shrink:0;color:${myDelta < 0n ? 'var(--fg-muted)' : 'inherit'}">${
              myDelta === 0n ? 'redeemable in full'
                : (myDelta > 0n ? '+' : '') + myDeltaPct.toFixed(2) + '% \u00b7 the tap has drawn against it'
            }</span>
          </div>` : ''}
          <div id="causeRqQuote" style="font-size:11px;color:var(--fg-muted);margin-bottom:6px;min-height:16px">Enter shares to see redemption value</div>
          <button class="swap-btn" style="width:100%;font-size:12px;background:var(--surface);color:var(--fg-muted);border:1px solid var(--border-muted)" onclick="causeRagequit('${daoAddr}')">Redeem</button>
          <div id="causeRqStatus" style="margin-top:8px"></div>
        </div>
      </div>
    `;
  }

  // Tap vesting section
  if (hasTap) {
    const budgetDisplay = tapOpenBudget ? 'unlimited' : fmtETH(tapBudget);
    // Vesting accrues from the moment the tap was configured, not from the moment the
    // money arrives, so a tap can be owed more than the DAO holds. TapVest pays
    // min(vested, budget, treasury) — the shortfall is not forfeited, it lands the
    // instant the treasury covers it, which is what a backer needs told before buying.
    const vested = tapPending > tapBudget ? tapBudget : tapPending;
    const claimable = vested > treasuryETH ? treasuryETH : vested;
    const unfunded = vested - claimable;
    const pendingEth = fmtEthBal(Number(ethers.formatEther(claimable)));
    const rateDisplay = tapInstant ? 'Instant (all funds to beneficiary)' : `~${tapRatePerDay < 0.0001 ? tapRatePerDay.toPrecision(2) : tapRatePerDay.toFixed(4)} ETH/day`;
    const beneficiaryShort = tapBeneficiary.slice(0, 6) + '\u2026' + tapBeneficiary.slice(-4);
    html += `
      <div class="section-card" style="background:var(--surface)">
        <div class="section-title">Tap Vesting</div>
        ${(!tapInstant && treasuryETH > 0n) ? `<div id="causeTapRunway" style="font-size:11px;color:var(--fg-dim);margin-bottom:8px">${causeRunwayHTML(treasuryETH, tapRate, saleEnded)}</div>` : ''}
        <dl class="coin-summary" style="font-size:12px;line-height:1.8;color:var(--fg-muted)">
          <dt>Rate</dt><dd>${tapInstant ? rateDisplay : ethAmount(rateDisplay, 11)}</dd>
          <dt>Claimable</dt><dd>${ethAmount('~' + pendingEth + ' ETH', 11)}</dd>
          ${unfunded > 0n ? `<dt>Vested, unfunded</dt><dd style="color:var(--red)">${ethAmount(fmtETH(unfunded), 11)}</dd>` : ''}
          ${tapOpenBudget ? '' : `<dt>Remaining</dt><dd>${tapOpenBudget ? budgetDisplay : ethAmount(budgetDisplay, 11)}</dd>`}
          <dt>Beneficiary</dt><dd><a href="https://etherscan.io/address/${tapBeneficiary}" target="_blank" style="color:inherit">${beneficiaryShort}</a></dd>
        </dl>
        ${(() => {
          // TapVest.claim() takes no caller check at all — it reads the beneficiary out
          // of storage and forwards there, so anyone may trigger it and only the
          // beneficiary can ever receive it. The button was gated to the beneficiary,
          // which was stricter than the contract; a keeper or a supporter can push the
          // vested amount through for them.
          //
          // It is still the one control here that moves money away from the people
          // reading the page: until it is claimed, vested ETH sits in the treasury where
          // ragequit reaches it. So a non-beneficiary is told exactly what the click
          // does and where the money goes, rather than being offered a bare "Claim".
          // TapVest rounds a capped claim down to whole seconds and reverts if that
          // comes to zero, so anything under one second of vesting has no button.
          if (claimable <= 0n || (tapRate > 0n && claimable < tapRate)) return '';
          const isBeneficiary = _connectedAddress
            && _connectedAddress.toLowerCase() === tapBeneficiary.toLowerCase();
          const label = isBeneficiary
            ? `Claim ${pendingEth} ETH`
            : `Send ${pendingEth} ETH to beneficiary`;
          const style = isBeneficiary
            ? 'background:var(--btn-bg);color:var(--btn-fg)'
            : 'background:var(--surface);color:var(--fg-muted);border:1px solid var(--border-muted)';
          return `<button class="swap-btn" style="width:100%;font-size:12px;margin-top:8px;${style}" onclick="causeTapClaim('${daoAddr}')">${label}</button>
        ${isBeneficiary ? '' : `<div style="font-size:10px;color:var(--fg-dim);margin-top:6px;line-height:1.5">Anyone can release vested funds; they can only ever go to the beneficiary. Until then this ETH stays in the treasury, where redeeming still reaches it.</div>`}
        <div id="causeTapStatus" style="margin-top:8px"></div>`;
        })()}
      </div>
    `;
  }

  // Reopening a closed sale is a governance action, so it sits with the governance
  // block at the foot rather than where the buy form used to be — it is not what
  // somebody arriving at a finished cause is here to do. Folded shut for the same
  // reason the redeem panel is: available, not advertised.
  let reopenHTML = '';
  // Only reachable on the legacy singleton: an offering's ceiling survives redemption,
  // so a sale on it never closes short and has nothing to reopen.
  if (!usesOffering && saleEnded && !isOpenCap && price > 0n && userBalance > 0n
      && saleDeadline > 0 && saleDeadline - now > 172800) {
    const daysLeft = Math.floor((saleDeadline - now) / 86400);
    reopenHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-muted)">
        <button class="coin-rq-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'" style="display:flex;align-items:center;gap:6px;width:100%;padding:2px 0;font-size:11px;color:var(--fg-dim);background:transparent;border:none;cursor:pointer;font-family:inherit">
          <span style="font-size:10px">&#9654;</span> Reopen the sale
        </button>
        <div style="display:none;padding-top:8px">
          <div style="font-size:10px;color:var(--fg-dim);line-height:1.6;margin-bottom:8px">
            Reopens the sale on ShareOffering, where redeemed shares hand their room back
            instead of closing it early, and runs to the deadline ${daysLeft} day${daysLeft === 1 ? '' : 's'} away.
            Two proposals.
          </div>
          <input id="causeReopenShares" type="text" inputmode="numeric" placeholder="shares to authorise" aria-label="Shares to authorise"
            style="width:100%;padding:5px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font-size:13px;outline:none;box-sizing:border-box" oninput="causeReopenQuote()">
          <div id="causeReopenQuote" style="font-size:10px;color:var(--fg-muted);margin:6px 0;min-height:26px;line-height:1.5">Enter how many shares to authorise</div>
          <button class="swap-btn" style="width:100%;font-size:11px;background:var(--surface);color:var(--fg-muted);border:1px solid var(--border-muted)" onclick="causeReopenPropose('${daoAddr}')">Open both proposals and vote</button>
          <div id="causeReopenStatus" style="margin-top:6px"></div>
        </div>
      </div>`;
  }

  // Governance info. #causeGovAlert fills in from a second read so the page paints
  // without waiting on it.
  html += `
    <div id="causePool"></div>
    <div id="causeGovAlert"></div>
    <div class="section-card" style="background:var(--surface)">
      <div class="section-title">Governance</div>
      <div style="font-size:12px;line-height:1.8;color:var(--fg-muted)">
        10% quorum &middot; 7d voting &middot; 2d timelock &middot; ragequittable<br>
        Share holders can ragequit at any time for a pro-rata refund.
      </div>
      ${reopenHTML}
      <div style="margin-top:8px">
        <a href="../dao/#/dao/1/${daoAddr}" style="font-size:11px;color:var(--fg-muted);text-decoration:underline">Manage DAO &rarr;</a>
      </div>
    </div>
  `;

  // Proposals & chat — the same drawer the standard DAICO page uses, so a cause gets
  // the discussion list, the vote bars and the quorum readout rather than a second,
  // thinner implementation of the same thing.
  html += `
    <div class="drawer" id="proposalsDrawer" data-dao="${daoAddr}">
      <button class="drawer-toggle" onclick="toggleProposals()">
        <span>Proposals &amp; Chat</span>
        <span class="arrow">&#9660;</span>
      </button>
      <div class="activity-body">
        <div id="proposalsContent"><div class="activity-empty">Click to load</div></div>
      </div>
    </div>
  `;

  // Shareholders drawer (reuses loadHolders from standard DAICO page)
  html += `
    <div class="drawer" id="holdersDrawer" data-dao="${daoAddr}">
      <button class="drawer-toggle" onclick="toggleHolders()">
        <span>Shareholders</span>
        <span class="arrow">&#9660;</span>
      </button>
      <div class="drawer-body" id="holdersContent"></div>
    </div>
  `;

  // Links
  html += `
    <div style="margin-top:16px;font-size:11px;color:var(--fg-dim)">
      <a href="https://etherscan.io/address/${daoAddr}" target="_blank" style="color:inherit">DAO</a>
      &middot; <a href="https://etherscan.io/address/${sharesAddr}" target="_blank" style="color:inherit">Shares</a>
      &middot; <a href="https://etherscan.io/address/${saleContract}" target="_blank" style="color:inherit">Sale Contract</a>
      ${metadata.creatorWallet ? `&middot; <a href="https://etherscan.io/address/${metadata.creatorWallet}" target="_blank" style="color:inherit">Creator</a>` : ''}
    </div>
  `;

  app.innerHTML = html;

  // Store for buy/ragequit functions
  app.dataset.dao = daoAddr;
  app.dataset.shares = sharesAddr;
  app.dataset.contSale = contSaleActive ? contSaleAddr : '';
  app.dataset.price = price.toString();
  app.dataset.treasury = treasuryETH.toString();
  app.dataset.totalSupply = (sharesTotalSupply + lootTotalSupply).toString();
  app.dataset.userBalance = userBalance.toString();
  app.dataset.tapRate = tapRate.toString();
  app.dataset.saleContract = saleContract;
  app.dataset.saleDeadline = String(saleDeadline);
  // The sale can only mint what is left of its allowance; the buy form clamps to it
  // rather than letting someone sign a transaction the contract will revert.
  app.dataset.saleRemaining = (isOpenCap ? 0n : saleAllowance).toString();
  app.dataset.sharesSupply = sharesTotalSupply.toString();
  app.dataset.lootSupply = lootTotalSupply.toString();
  app.dataset.sym = coinSymbol;
  _causeGlyph = causeGlyph(data.meta, metadata, 15);

  loadCausePool(daoAddr, sharesAddr, gen).catch(() => {});

  if (saleEnded && sold > 0n) loadCauseSaleClose(daoAddr, sharesAddr, gen).catch(() => {});

  // Proposals and chat come from a second read so they cannot delay first paint.
  loadCauseGovernance(daoAddr, gen).catch(() => {});

  // Auto-refresh sale stats every 30s (partial update, preserves inputs)
  if (_causeRefreshTimer) clearInterval(_causeRefreshTimer);
  const causeTick = () => {
    if (location.hash.slice(1) !== daoAddr) { clearInterval(_causeRefreshTimer); stopPoller(causeTick); return; }
    refreshCauseStats(daoAddr, metadata);
  };
  _causeRefreshTimer = startPoller(causeTick, 30000);
}

let _causeRefreshTimer = null;
let _causeBuyMode = 'shares'; // 'shares' or 'eth'
async function refreshCauseStats(daoAddr, metadata) {
  const gen = _renderGen;
  try {
    const sharesAddr = $('app')?.dataset?.shares;
    if (!sharesAddr) return;
    const ssIface = new ethers.Interface(
      ($('app')?.dataset.saleContract || '').toLowerCase() === SHARE_OFFERING.toLowerCase()
        ? SHARE_OFFERING_ABI : SHARE_SALE_ABI);
    const erc20I = new ethers.Interface(ERC20_ABI);
    const daoI = new ethers.Interface(['function allowance(address token, address spender) view returns (uint256)']);
    const mc3Calls = [
      { target: $('app')?.dataset.saleContract || SHARE_SALE, allowFailure: true, callData: ssIface.encodeFunctionData('sales', [daoAddr]) },
      { target: MC3, allowFailure: true, callData: _mc3Iface.encodeFunctionData('getEthBalance', [daoAddr]) },
      { target: sharesAddr, allowFailure: true, callData: erc20I.encodeFunctionData('totalSupply', []) },
      { target: daoAddr, allowFailure: true, callData: daoI.encodeFunctionData('allowance', [daoAddr, $('app')?.dataset.saleContract || SHARE_SALE]) },
    ];
    if (_connectedAddress) {
      mc3Calls.push({ target: sharesAddr, allowFailure: true, callData: erc20I.encodeFunctionData('balanceOf', [_connectedAddress]) });
    }
    const mcRes = await withRPC(async rpc => {
      const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
      return await mc.aggregate3(mc3Calls);
    }).catch(() => []);
    if (gen !== _renderGen) return;

    let saleData = null, treasuryETH = 0n, sharesTotalSupply = 0n, saleAllowance = 0n, userBalance = 0n;
    if (mcRes[0]?.success) try { saleData = ssIface.decodeFunctionResult('sales', mcRes[0].returnData); } catch {}
    if (mcRes[1]?.success) try { treasuryETH = _mc3Iface.decodeFunctionResult('getEthBalance', mcRes[1].returnData)[0]; } catch {}
    if (mcRes[2]?.success) try { sharesTotalSupply = erc20I.decodeFunctionResult('totalSupply', mcRes[2].returnData)[0]; } catch {}
    if (mcRes[3]?.success) try { saleAllowance = daoI.decodeFunctionResult('allowance', mcRes[3].returnData)[0]; } catch {}
    if (_connectedAddress && mcRes[4]?.success) try { userBalance = erc20I.decodeFunctionResult('balanceOf', mcRes[4].returnData)[0]; } catch {}

    const price = saleData ? BigInt(saleData.price) : 0n;
    const creatorShares = ethers.parseEther('1');
    const sold = sharesTotalSupply > creatorShares ? sharesTotalSupply - creatorShares : 0n;
    const usesOffering = ($('app')?.dataset.saleContract || '').toLowerCase() === SHARE_OFFERING.toLowerCase();
    const cap = usesOffering
      ? (saleData && saleData.cap !== undefined && BigInt(saleData.cap) > creatorShares
          ? BigInt(saleData.cap) - creatorShares : 0n)
      : sold + saleAllowance;
    const saleDeadline = saleData ? Number(saleData.deadline) : 0;
    const now = Math.floor(Date.now() / 1000);
    // A live continuous sale keeps minting open regardless of the DAICO's own deadline or
    // cap. Without this the 30s refresh flips Status back to "Ended" under an open sale.
    const contSaleLive = !!$('app')?.dataset?.contSale;
    const saleActive = contSaleLive || saleDeadline === 0 || now < saleDeadline;
    // Same reading as the first render: zero allowance with shares already minted is a
    // sold-out sale, not an unmetered one.
    const isOpenCap = contSaleLive || cap >= 2n ** 128n
      || (!usesOffering && saleAllowance === 0n && sold === 0n && price > 0n && saleActive);
    const soldOut = !isOpenCap && cap > 0n && sold >= cap;
    const saleEnded = !saleActive || soldOut;
    const raisedWei = price > 0n ? sold * price / ethers.parseEther('1') : 0n;
    const raisedEth = Number(ethers.formatEther(raisedWei));
    const treasuryEth = Number(ethers.formatEther(treasuryETH));
    const ethUsd = _ethUsdPrice || 0;

    const targetWei = (!isOpenCap && cap > 0n && price > 0n) ? cap * price / ethers.parseEther('1') : 0n;

    // Update raised row
    const raisedEl = $('causeRaisedRow');
    if (raisedEl) {
      const raisedUsd = ethUsd ? ' ($' + (raisedEth * ethUsd).toFixed(2) + ')' : '';
      const treasuryUsd = ethUsd ? ' ($' + (treasuryEth * ethUsd).toFixed(2) + ')' : '';
      const treasuryDiffers = Math.abs(treasuryEth - raisedEth) > 0.0001;
      raisedEl.innerHTML = `
        <span style="font-size:18px;font-weight:700">${raisedEth.toFixed(raisedEth > 0 && raisedEth < 0.0001 ? 8 : 4)} ETH</span>
        <span style="font-size:11px;color:var(--fg-muted);margin-left:2px">raised${targetWei > 0n ? ' of ' + fmtNum(Number(ethers.formatEther(targetWei))) + ' ETH' : ''}</span>
        <span style="font-size:11px;color:var(--fg-muted)">${raisedUsd}</span>
        ${treasuryDiffers ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:2px">${treasuryEth.toFixed(treasuryEth > 0 && treasuryEth < 0.0001 ? 8 : 4)} ETH treasury${treasuryUsd}</div>` : ''}
      `;
    }

    // Update sold count
    const soldEl = $('causeSoldVal');
    if (soldEl) soldEl.textContent = Number(ethers.formatEther(sold)).toLocaleString(undefined, {maximumFractionDigits: 0});
    const capEl = $('causeSoldCap');
    if (capEl) {
      const capFmt = isOpenCap ? 'Open' : (cap > 0n ? Number(ethers.formatEther(cap)).toLocaleString(undefined, {maximumFractionDigits: 0}) : 'Open');
      capEl.textContent = (isOpenCap || cap === 0n) ? 'shares' : 'of ' + capFmt;
    }

    // Update status
    const statusEl = $('causeStatusVal');
    if (statusEl) {
      statusEl.textContent = soldOut ? 'Sold out' : saleEnded ? 'Ended' : 'Active';
      statusEl.style.color = (soldOut || !saleEnded) ? 'var(--green)' : 'var(--fg-muted)';
    }
    const dlEl = $('causeDeadlineVal');
    if (dlEl) {
      dlEl.textContent = soldOut ? 'every share minted' : saleDeadline > 0 ? fmtDeadline(saleDeadline) : 'no deadline';
      dlEl.style.color = (saleDeadline > 0 && !saleEnded && saleDeadline - now < 172800) ? 'var(--red)' : 'var(--fg-dim)';
    }

    // Update user balance
    if (_connectedAddress) {
      const balEl = document.querySelector('.coin-user-balance');
      if (balEl) balEl.textContent = (userBalance > 0n ? fmtTokenAmount(userBalance.toString()) : '0') + ' shares';
    }

    // Update progress meters
    const metersEl = $('causeMeters');
    if (metersEl) metersEl.innerHTML = causeMetersHTML(raisedWei, targetWei, treasuryETH, usesOffering);

    // Runway moves with the treasury, so recompute it from the rate stashed at render
    const runwayEl = $('causeTapRunway');
    if (runwayEl) {
      const rate = BigInt($('app').dataset.tapRate || '0');
      runwayEl.innerHTML = causeRunwayHTML(treasuryETH, rate, saleEnded);
    }

    // Update stored data
    $('app').dataset.treasury = treasuryETH.toString();
    $('app').dataset.userBalance = userBalance.toString();
    $('app').dataset.saleRemaining = (isOpenCap ? 0n : saleAllowance).toString();
    $('app').dataset.sharesSupply = sharesTotalSupply.toString();
    causeUpdateBuyQuote();
  } catch (e) { console.warn('Cause stats refresh failed:', e); }
}

// A queued proposal is the only moment ragequit protection has to be used, and it is
// the moment the page said nothing about. Moloch's timelock lets a proposal execute
// two days after it is queued; a holder who objects can leave with their pro-rata
// share, but only if they know it is coming. So the countdown leads, in red, above
// everything else — the drawer below carries the detail, but a holder should not have
// to open a drawer to learn the clock is running.
async function loadCauseGovernance(daoAddr, gen) {
  const alertEl = $('causeGovAlert');
  if (!alertEl) return;
  let view;
  try {
    view = await withRPC(async rpc => {
      const helper = new ethers.Contract(VIEW_HELPER, DAO_VIEW_ABI, rpc);
      return await helper.getDAOWithDAICO(daoAddr, 0, 50, 0, 0, [], [ZERO]);
    });
  } catch { return; }
  if (gen !== _renderGen) return;

  const queued = Array.from(view?.base?.proposals || []).filter(p => Number(p.state) === 2);
  const now = Math.floor(Date.now() / 1000);
  alertEl.innerHTML = queued.map(p => {
    const left = Number(p.queuedAt) + 172800 - now; // timelockDelay
    const when = left <= 0 ? 'executable now'
      : left < 3600 ? `in ${Math.ceil(left / 60)} min`
      : left < 86400 ? `in ${Math.floor(left / 3600)}h`
      : `in ${Math.floor(left / 86400)}d ${Math.floor((left % 86400) / 3600)}h`;
    return `<div class="section-card" style="border-color:var(--red);background:var(--surface);margin-bottom:14px">
      <div class="section-title" style="color:var(--red)">Proposal executes ${when}</div>
      <div style="font-size:12px;color:var(--fg-muted);line-height:1.6">
        A passed proposal is in its timelock. Anything the DAO can do to its treasury
        happens when that runs out. If you disagree with it, redeeming your shares before
        then returns your pro-rata share of the treasury &mdash; afterwards may be too late.
        <div style="margin-top:6px">
          <a href="../dao/#/dao/1/${daoAddr}" style="color:var(--red);text-decoration:underline">Review it &rarr;</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Mints date the sale: the first and last of them are when it opened and when it
// filled. Not every RPC serves logs, so this returns null rather than pretending, and
// the caller simply says less.
async function fetchSaleFillTime(sharesAddr) {
  const iface = new ethers.Interface(['event Transfer(address indexed from, address indexed to, uint256 amount)']);
  const Z32 = ethers.zeroPadValue(ZERO, 32);
  try {
    return await withRPC(async rpc => {
      const head = await rpc.getBlockNumber();
      const logs = await rpc.getLogs({
        address: sharesAddr,
        fromBlock: head - 9000 > 0 ? head - 9000 : 0,
        toBlock: head,
        topics: [iface.getEvent('Transfer').topicHash, Z32]
      });
      if (logs.length < 2) return null;
      const [a, b] = await Promise.all([
        rpc.getBlock(logs[0].blockNumber), rpc.getBlock(logs[logs.length - 1].blockNumber)
      ]);
      return a && b && b.timestamp > a.timestamp ? b.timestamp - a.timestamp : null;
    }, 20000);
  } catch { return null; }
}

// How long a sale took to fill, in words. Four hours against a nine day window is the
// strongest thing this page can say about demand, and nothing was saying it.
function fmtFillTime(sec) {
  if (!sec || sec <= 0) return null;
  if (sec < 5400) return `${Math.max(1, Math.round(sec / 60))} minutes`;
  if (sec < 172800) return `${Math.round(sec / 3600)} hours`;
  return `${Math.round(sec / 86400)} days`;
}

// The closing summary, in the space the buy form used to hold. It states the three
// figures and stops: what came in, what went back, what stayed. An earlier version led
// with the net and then argued the refund was not a shortfall, which is a case nobody
// asked it to make — and making it unprompted is what makes a number look like bad news.
async function loadCauseSaleClose(daoAddr, sharesAddr, gen) {
  const el = $('causeSaleClose');
  if (!el) return;
  const filled = fmtFillTime(await fetchSaleFillTime(sharesAddr));
  if (gen !== _renderGen || !el.isConnected) return;
  // The headline carries what was raised and the SOLD tile the share count. How fast it
  // went is the only thing neither can say, so it is the only thing here.
  el.innerHTML = `<div style="font-size:11px;color:var(--fg-dim);margin-bottom:14px">
    <b style="color:var(--green);font-weight:600">Sold out</b>${filled ? ` in ${filled}` : ''}
  </div>`;
}

function causeCopyToken(addr, el) {
  navigator.clipboard.writeText(addr).then(() => {
    const t = el.querySelector('.copy-label');
    if (!t) return;
    const was = t.textContent;
    t.textContent = 'copied';
    setTimeout(() => { t.textContent = was; }, 1400);
  }).catch(() => {});
}

function causeTokenRow(sharesAddr, sym) {
  return `<button onclick="causeCopyToken('${sharesAddr}', this)" title="${sharesAddr}"
      style="display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;margin-bottom:14px;
             background:var(--surface);border:1px solid var(--border-muted);border-radius:6px;
             color:var(--fg-muted);font-family:inherit;font-size:10px;cursor:pointer;text-align:left">
    <span style="color:var(--fg-dim);flex-shrink:0">$${escText(sym)}</span>
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sharesAddr}</span>
    <span class="copy-label" style="margin-left:auto;color:var(--fg-dim);flex-shrink:0">copy</span>
  </button>`;
}

const MOLOCH_PROP_ABI = [
  'function proposalId(uint8 op, address to, uint256 value, bytes data, bytes32 nonce) view returns (uint256)',
  'function castVote(uint256 id, uint8 support)',
  'function setAllowance(address spender, address token, uint256 amount)'
];

// Reopening moves the sale onto ShareOffering rather than refilling the singleton that
// let it close short, because capacity granted there survives redemption. That takes two
// proposals: setAllowance is the DAO acting on itself, configure is a call out to the
// offering, and Moloch's multicall delegatecalls into itself so it cannot reach the
// second. Nonces are derived from their contents, so separate holders proposing the same
// reopening land on the same ids and their votes accumulate.
function causeReopenSteps(daoAddr, sharesWei, price, deadline, supplyNow) {
  const molochI = new ethers.Interface(MOLOCH_PROP_ABI);
  const offerI = new ethers.Interface([
    'function configure(address token, address payToken, uint256 price, uint40 deadline, uint256 cap)'
  ]);
  // configure() wants a target SUPPLY, so it is everything outstanding now plus the room
  // being authorised — not the room on its own.
  const cap = supplyNow + sharesWei;
  return [
    { label: 'grant the allowance',
      to: daoAddr,
      data: molochI.encodeFunctionData('setAllowance', [SHARE_OFFERING, daoAddr, ethers.MaxUint256]),
      nonce: ethers.keccak256(ethers.toUtf8Bytes('zfi.cause.reopen.allow.' + SHARE_OFFERING.toLowerCase())) },
    { label: 'set the sale terms',
      to: SHARE_OFFERING,
      data: offerI.encodeFunctionData('configure', [daoAddr, ZERO, price, deadline, cap]),
      nonce: ethers.keccak256(ethers.toUtf8Bytes('zfi.cause.reopen.cfg.' + cap.toString())) }
  ];
}

function causeReopenQuote() {
  const el = $('causeReopenQuote');
  if (!el) return;
  const ds = $('app')?.dataset || {};
  const raw = ($('causeReopenShares')?.value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) { el.textContent = 'Enter how many shares to authorise'; return; }
  // Whole shares only: parseEther on "1e6" or "1,000" throws, and a fractional share is
  // not a thing anyone means to authorise.
  const n = Math.floor(Number(raw));
  if (!Number.isSafeInteger(n) || n <= 0) { el.textContent = 'Enter a whole number of shares'; return; }
  const price = BigInt(ds.price || '0');
  const wei = ethers.parseEther(String(n));
  const eth = price > 0n ? wei * price / ethers.parseEther('1') : 0n;
  const quorum = BigInt(ds.sharesSupply || '0') / 10n;
  el.innerHTML = `Authorises <b style="color:var(--fg)">${fmtEthBal(Number(ethers.formatEther(eth)))} ETH</b> more at ${fmtPriceWei(price)}.
    <div style="margin-top:3px">Two proposals, ${fmtTokenAmount(quorum.toString())} shares of turnout each, then a two day timelock.</div>`;
}

async function causeReopenPropose(daoAddr) {
  const status = $('causeReopenStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const raw = ($('causeReopenShares')?.value || '').trim();
  const n = Math.floor(Number(raw));
  if (!raw || isNaN(raw) || !Number.isSafeInteger(n) || n <= 0) { say('Enter a whole number of shares.'); return; }
  const ds = $('app')?.dataset || {};
  try {
    const steps = causeReopenSteps(
      daoAddr, ethers.parseEther(String(n)),
      BigInt(ds.price || '0'), Number(ds.saleDeadline || '0'), BigInt(ds.sharesSupply || '0')
    );
    const dao = new ethers.Contract(daoAddr, MOLOCH_PROP_ABI, sgn);
    const ids = [];
    for (let i = 0; i < steps.length; i++) {
      const st = steps[i];
      const id = await dao.proposalId(0, st.to, 0n, st.data, st.nonce);
      ids.push(id);
      say(`Proposal ${i + 1} of ${steps.length} &mdash; ${st.label}. Confirm in your wallet.`);
      const tx = await dao.castVote(id, 1);
      say(`Opening: ${st.label}\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
      await tx.wait();
    }
    say(`Both proposals are open and your shares vote for them. Both must pass before the
      sale runs again &mdash; send holders
      <a href="../dao/#/dao/1/${daoAddr}" style="color:inherit;text-decoration:underline">the DAO page</a>.
      <div style="margin-top:4px;font-family:ui-monospace,monospace;font-size:10px;color:var(--fg-dim)">
        #${ids[0].toString().slice(0, 12)}\u2026 &middot; #${ids[1].toString().slice(0, 12)}\u2026</div>`, 'var(--green)');
    loadCauseGovernance(daoAddr, _renderGen).catch(() => {});
  } catch (e) {
    if (e.code === 'ACTION_REJECTED' || (e.message || '').includes('user rejected')) { say(''); return; }
    say(escText(e.shortMessage || e.message || 'Failed.'), 'var(--red)');
  }
}

const PFACTORY = PRECISION_FACTORY;   // modules/precision.js
const PRECISION_FEE = 3000n;            // 0.3%, zSwap's own default
const LQ_WIDTHS = [1000, 100, 10, 2];   // widest first
const LQ_WAD = 10n ** 18n;
const SEL_POOLFOR = PSEL.poolFor;
const SEL_PAIR_COUNT = PSEL.pairCount;
const SEL_CREATE_SEED = PSEL.createSeed;
const ZSWAP_URL = 'https://zswap.wei.limo/';

function causeZSwapLink(sharesAddr, lq) {
  return `${ZSWAP_URL}#token=eth&out=${sharesAddr}${lq ? '&lq=1' : ''}`;
}

const _w = pWord, _a = pAddr;   // modules/precision.js

// price (t1 per t0, human units) -> sqrt price in the factory's fixed-point form
function pxToSqrt(px, d0, d1) {
  const raw = px * 10 ** (d1 - d0);
  if (!isFinite(raw) || raw <= 0) return 0n;
  return BigInt(Math.round(Math.sqrt(raw) * 1e9)) * 10n ** 9n;
}

// The opening price a pair of deposits implies inside a band, by bisection.
function lqSeedPrice(sl, sh, in0, in1) {
  const L = Number(sl), H = Number(sh), x = Number(in0), y = Number(in1), W = 1e18;
  const g = t => (x * t * H * (t - L)) / ((H - t) * W * y * W);
  let lo = L, hi = H;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (g(m) < 1) lo = m; else hi = m; }
  const t = (lo + hi) / 2;
  if (!(t > L && t < H)) return 0n;
  return BigInt(Math.round(t));
}

// token0, token1, sqrtLo, sqrtHi, fee, hook, owner, salt — flattened, as the factory wants it.
function causeMarket(t0, t1, sl, sh) {
  return _a(t0) + _a(t1) + _w(sl) + _w(sh) + _w(PRECISION_FEE) + _a(ZERO) + _a(ZERO) + _w(0);
}

function causeSortedPair(sharesAddr) {
  return ZERO.toLowerCase() < sharesAddr.toLowerCase() ? [ZERO, sharesAddr] : [sharesAddr, ZERO];
}

// Ask the factory where this band would live. Deterministic, so it answers before the
// pool exists — no CREATE2 arithmetic to reimplement or get wrong.
async function causePoolFor(market) {
  try {
    const res = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_POOLFOR + market }));
    const addr = ethers.getAddress('0x' + res.slice(-40));
    return addr === ZERO ? null : addr;
  } catch { return null; }
}

// Build the widest band the factory will actually accept for these amounts.
async function causeBand(sharesAddr, ethAmt, shareAmt, from) {
  const [t0, t1] = causeSortedPair(sharesAddr);
  const ethIs0 = t0 === ZERO;
  const a0 = ethIs0 ? ethAmt : shareAmt;
  const a1 = ethIs0 ? shareAmt : ethAmt;
  const px = Number(ethers.formatEther(a1)) / Number(ethers.formatEther(a0));
  if (!(px > 0)) return null;

  for (const mult of LQ_WIDTHS) {
    const sl = pxToSqrt(px / mult, 18, 18);
    const sh = pxToSqrt(px * mult, 18, 18);
    if (!sl || !sh || sh <= sl) continue;
    const sp = lqSeedPrice(sl, sh, a0, a1);
    if (!sp) continue;
    const market = causeMarket(t0, t1, sl, sh);
    const data = SEL_CREATE_SEED + market + _w(sp) + _w(a0) + _w(a1) + _w(0) + _a(from);
    try {
      // The factory is the authority on whether this seed is admissible. Ask it.
      await withRPC(rpc => rpc.call({ from, to: PFACTORY, data, value: ethers.toBeHex(ethAmt) }));
      return { mult, market, data, sl, sh, sp, px };
    } catch { /* band refused — try a narrower one */ }
  }
  return null;
}

// ---------------------------------------------------------------- market data
// Two lenses and a tape. The lens enumerates a pair's pools with their bounds and
// reserves; PLQLENS prices a deposit; the pool's own tape carries the candles.
const PPLENS = PRECISION_LENS;
const PLQLENS = PRECISION_LQ_LENS;
const SEL_MARKETS = PSEL.markets;
const SEL_TAPE = PSEL.tape;
const SEL_PREVIEW_ADD = PSEL.previewAdd;
const SEL_ADDEXACT = PSEL.addExact;
const SEL_ZAPIN = PSEL.zapIn;
const SEL_PREVIEW_ZAP = PSEL.previewZap;
const SEL_ISPOOL = PSEL.isPool;
const PI_WORDS = 19, PI_POOL = 0, PI_SL = 3, PI_SH = 4, PI_FEE = 5,
      PI_R0 = 6, PI_R1 = 7, PI_PX = 8, PI_LIQ = 9;
const LQ_SCAN = 32;
const _dec1 = (h, i) => BigInt('0x' + h.slice(2).slice(i * 64, (i + 1) * 64));

// Pools for the ETH/shares pair, richest first. Reserves are what the page prices
// against: the tape is executed prices and its own source says not to price on it.
async function causePools(sharesAddr) {
  const [t0, t1] = causeSortedPair(sharesAddr);
  const data = SEL_MARKETS + _a(t0) + _a(t1) + _a(ZERO) + _w(0) + _w(LQ_SCAN) + _w(0);
  let raw;
  try { raw = await withRPC(rpc => rpc.call({ to: PPLENS, data })); } catch { return []; }
  if (!raw || raw.length < 130) return [];
  const h = raw.slice(2);
  const n = Number(BigInt('0x' + h.slice(64, 128)));
  const out = [];
  for (let i = 0; i < n && i < LQ_SCAN; i++) {
    const base = 128 + i * PI_WORDS * 64;
    const at = k => BigInt('0x' + h.slice(base + k * 64, base + (k + 1) * 64));
    out.push({
      pool: '0x' + h.slice(base + PI_POOL * 64 + 24, base + (PI_POOL + 1) * 64),
      sl: at(PI_SL), sh: at(PI_SH), fee: at(PI_FEE),
      r0: at(PI_R0), r1: at(PI_R1), liq: at(PI_LIQ), sqrtP: at(PI_PX),
    });
  }
  return out.sort((x, y) => (y.liq > x.liq ? 1 : y.liq < x.liq ? -1 : 0));
}

// Marginal price: what the next infinitesimal trade pays, which is THE price. PI_PX is
// a sqrt scaled by 1e18, the same convention as the band bounds. This is NOT the reserve
// ratio — in a concentrated position the two differ, here by 17%, and using reserves as
// the price made buys look 11% cheaper than spot when they are really 4% dearer.
// Confirmed by shrinking a quote until it converges: 7,903.7 gwei against 7,880.5 here,
// the gap being the 0.3% fee a quote includes and a marginal price does not.
function causeSpotPrice(pool, sharesAddr) {
  const [t0] = causeSortedPair(sharesAddr);
  const px = pool.sqrtP || 0n;
  if (px <= 0n) return 0n;
  // sqrt is of raw token1-per-token0; both sides here are 18 decimals.
  return t0 === ZERO
    ? (10n ** 54n) / (px * px)      // ETH is token0, so invert
    : (px * px) / (10n ** 18n);     // ETH is token1, already ETH per share
}

// The ratio a deposit must arrive at, which is the reserve ratio and not the price.
// previewAdd on the live pool takes 1 ETH per 108,158.97 CELL, exactly this.
function causePoolPrice(pool, sharesAddr) {
  const [t0] = causeSortedPair(sharesAddr);
  const ethIs0 = t0 === ZERO;
  const eth = ethIs0 ? pool.r0 : pool.r1;
  const sh = ethIs0 ? pool.r1 : pool.r0;
  return sh > 0n ? eth * LQ_WAD / sh : 0n;
}

// The tape packs OHLC into one word per bar as a 24-bit mantissa and an 8-bit
// exponent. Prices are raw token1-per-token0 at 1e18 and decimals are the reader's
// problem; both sides here are 18, so the only work is inverting to wei-per-share.
const _unf = v => (v & 0xffffff) * 2 ** (v >>> 24);
function causeTapeBars(raw, ethIs0) {
  if (!raw || raw.length < 130) return [];
  const h = raw.slice(2);
  const n = Number(BigInt('0x' + h.slice(64, 128)));
  const bars = [];
  for (let j = 0; j < n; j++) {
    const w = BigInt('0x' + h.slice(128 + j * 64, 128 + (j + 1) * 64));
    if (!w) continue;
    const trades = Number((w >> 192n) & 0xffffn);
    if (!trades) continue;
    const f = k => _unf(Number((w >> BigInt(k)) & 0xffffffffn));
    // token1-per-token0 when ETH is token0 inverts; when shares are token0 it is
    // already ETH per share.
    const px = v => (v > 0 ? (ethIs0 ? 1e36 / v : v) : 0);
    bars.push({ b: Number(w & 0xffffffffn), o: px(f(32)), c: px(f(128)),
                hi: px(f(64)), lo: px(f(96)), n: trades });
  }
  // The tape is a ring buffer: slot order is not time order, and it comes back newest
  // first. Sort by bucket so a chart plots left to right in the direction time runs.
  return bars.sort((a, b) => a.b - b.b);
}

async function causeTape(poolAddr, ethIs0) {
  // Fine bars are what a young pool has; the coarse tape only fills once fine bars
  // finish and fold. Take whichever window actually carries prints, preferring the
  // one with more of them rather than discarding a lone fine bar for an empty coarse.
  let best = [];
  for (const win of [300, 14400]) {
    try {
      const raw = await withRPC(rpc => rpc.call({ to: poolAddr, data: SEL_TAPE + _w(win) + _w(256) }));
      const bars = causeTapeBars(raw, ethIs0);
      if (bars.length > best.length) best = bars;
      if (best.length > 1) break;
    } catch {}
  }
  return best;
}


// A young cause coin has a handful of prints, and a tall time-axis chart drawn over
// three of them is mostly empty space with a dot in it. What actually needs saying fits
// on one axis: where the coin trades relative to the floor it can always be redeemed at.
// So this is a price ruler, not a time series — floor on the left, spot on the right,
// fills marked where they landed. Log-spaced, because day one spans 24x.
// Once the tape holds enough distinct bars to have a shape, time is worth an axis and
// the ruler stops being the better picture. Below that it is not: three prints on a time
// axis is a dot and a lot of whitespace, which is what a lone candle looks like too.
function causeTimeChart(bars, floorWei, spotWei) {
  const closes = bars.map(b => b.c).filter(v => v > 0);
  const floor = Number(floorWei || 0), spot = Number(spotWei || 0);
  const all = closes.concat([floor, spot].filter(v => v > 0));
  const lo = Math.min(...all), hi = Math.max(...all);
  const L = Math.log(lo * 0.9), span = Math.log(hi * 1.1) - L || 1;
  const W = 300, H = 74, PAD = 4;
  const y = v => PAD + (1 - (Math.log(v) - L) / span) * (H - PAD * 2);
  const x = i => PAD + (i / (bars.length - 1)) * (W - PAD * 2);

  let svg = '';
  for (const [v, col] of [[floor, 'var(--fg-dim)'], [spot, 'var(--green)']]) {
    if (v > 0) svg += `<line x1="0" y1="${y(v).toFixed(1)}" x2="${W}" y2="${y(v).toFixed(1)}" stroke="${col}" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  }
  svg += `<polyline points="${bars.map((b, i) => `${x(i).toFixed(1)},${y(b.c).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--fg-muted)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  bars.forEach((b, i) => { svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(b.c).toFixed(1)}" r="2" fill="var(--fg-muted)"/>`; });

  const trades = bars.reduce((t, b) => t + b.n, 0);
  return `<div style="margin:2px 0 12px">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:74px;display:block"
      role="img" aria-label="executed price over time against the redemption floor">${svg}</svg>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--fg-dim);margin-top:2px">
      <span>${causeGwei(BigInt(Math.round(floor)))} floor</span>
      <span>${trades} fill${trades === 1 ? '' : 's'} &middot; executed, fee included</span>
      <span style="color:var(--green)">${causeGwei(BigInt(Math.round(spot)))} now</span>
    </div></div>`;
}

// One unit for the whole tile. fmtPriceWei is right on its own — it picks whatever reads
// best for a single number — but a column of prices meant to be compared has to agree,
// and "0.00029868 ETH" above "326 gwei" is two units pretending to be a comparison.
function causeGwei(wei) {
  const v = BigInt(wei || 0);
  if (v <= 0n) return '0';
  const eth = Number(ethers.formatEther(v));
  if (eth >= 1) return fmtNum(eth) + ' ETH';
  const g = Number(v) / 1e9;
  return (g >= 100 ? Math.round(g).toLocaleString()
        : g >= 1 ? Number(g.toPrecision(4)).toString()
        : Number(g.toPrecision(2)).toString()) + ' gwei';
}

// Past about ten-fold a percentage stops being read and starts being counted. 89,594%
// is 897x, and one of those two is a number a person can hold in their head.
function causeVsSale(spot, sale) {
  if (!(spot > 0n) || !(sale > 0n)) return '';
  const r = Number(spot) / Number(sale);
  // A multiple wants significant figures, not decimal places: 897x, 12.4x, 0.08x.
  if (r >= 10) return `${Math.round(r).toLocaleString()}\u00d7 vs sale`;
  if (r >= 2) return `${r.toFixed(1)}\u00d7 vs sale`;
  if (r <= 0.5) return `${Number(r.toPrecision(2))}\u00d7 vs sale`;
  const pct = (r - 1) * 100;
  return `${pct > 0 ? '+' : ''}${pct.toFixed(0)}% vs sale`;
}

function causeChart(bars, floorWei, saleWei, spotWei) {
  const floor = Number(floorWei || 0), spot = Number(spotWei || 0), sale = Number(saleWei || 0);
  // Three bars is the point where a line says more than a ruler does.
  if (bars.filter(b => b.c > 0).length >= 3 && Number(spotWei) > 0) {
    return causeTimeChart(bars.filter(b => b.c > 0), floorWei, spotWei);
  }
  const fills = bars.filter(b => b.c > 0).map(b => b.c);
  const all = [floor, spot, sale, ...fills].filter(v => v > 0);
  if (all.length < 2) return '';
  const lo = Math.min(...all), hi = Math.max(...all);
  const L = Math.log(lo), span = Math.log(hi) - L || 1;
  const W = 300, H = 34, PAD = 4;
  const x = v => PAD + ((Math.log(v) - L) / span) * (W - PAD * 2);
  const AX = 20;

  let svg = `<line x1="${PAD}" y1="${AX}" x2="${W - PAD}" y2="${AX}" stroke="var(--border-muted)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  const tick = (v, col, h) => `<line x1="${x(v).toFixed(1)}" y1="${AX - h}" x2="${x(v).toFixed(1)}" y2="${AX + h}" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  if (floor > 0) svg += tick(floor, 'var(--fg-dim)', 5);
  if (sale > 0 && floor > 0 && Math.abs(sale - floor) / floor > 0.02) svg += tick(sale, 'var(--fg-dim)', 4);
  // Fills sit on the ruler at the price they got, which is the whole point of the tape.
  for (const f of fills) svg += `<circle cx="${x(f).toFixed(1)}" cy="${AX}" r="2.5" fill="var(--fg-muted)"/>`;
  if (spot > 0) svg += tick(spot, 'var(--green)', 7);

  const trades = bars.reduce((t, b) => t + b.n, 0);
  return `<div style="margin:2px 0 12px">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:34px;display:block"
      role="img" aria-label="where the coin trades between its redemption floor and spot">${svg}</svg>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--fg-dim);margin-top:1px">
      <span>${causeGwei(BigInt(Math.round(lo)))} floor</span>
      <span>${trades ? `${trades} fill${trades === 1 ? '' : 's'}` : 'no trades yet'}</span>
      <span style="color:var(--green)">${causeGwei(BigInt(Math.round(spot)))} now</span>
    </div></div>`;
}


// ---------------------------------------------------------------- swap
// zSwap's precision path, narrowed to the one pair this page has: ETH against the
// cause's own shares. The router funds an executor, the executor walks the pools.
const PROUTE = PRECISION_ROUTE;
const SEL_PROUTE = PSEL.route;
const SEL_PCHECKPOINT = PSEL.checkpoint;
const SEL_QUOTE_BEST = PSEL.quoteBest;
// A band holding a fraction of an ETH moves several percent under any trade worth making,
// so a tight tolerance here does not protect anyone — it just reverts and charges gas.
let _causeSlipPct = 5;
const causeSlipBps = () => BigInt(Math.round(Math.min(50, Math.max(0.1, _causeSlipPct)) * 100));

function causeSetSlip(v) {
  const n = parseFloat(v);
  if (!isNaN(n)) _causeSlipPct = Math.min(50, Math.max(0.1, n));
  causeSwapQuote();
}

const _encPRoute = (pools, tokenIn, tokenOut, amountIn, minOut, to) =>
  SEL_PROUTE + _w(192) + _a(tokenIn) + _a(tokenOut) + _w(amountIn)
  + _w(minOut) + _a(to) + _w(pools.length) + pools.map(_a).join('');

function _encSnwap(tokenIn, amountIn, recipient, tokenOut, minOut, executor, data) {
  const d = data.replace(/^0x/, '');
  const body = _w(d.length / 2) + d.padEnd(Math.ceil(d.length / 64) * 64, '0');
  return ROUTER_IFACE.getFunction('snwap').selector + _a(tokenIn) + _w(amountIn)
    + _a(recipient) + _a(tokenOut) + _w(minOut) + _a(executor) + _w(224) + body;
}

let _causeGlyph = '';
let _causeEthBalFetching = false;
// ---------------------------------------------------------------- liquidity mode
// The tile is already a "put this in, get that out" form, and adding liquidity is the
// same shape: one asset in, LP out. So the droplet swaps what the form does rather than
// opening a second one. Zap is what makes that honest — the pool takes a single side and
// sells the right portion itself, so the form never has to ask for two amounts at a ratio
// the user cannot compute.
let _causeMode = 'swap';

function causeSetMode(mode) {
  const entering = mode === 'lq' && _causeMode !== 'lq';
  _causeMode = mode;
  if (entering) _swapSide = 'buy';
  const d = $('causeModeDrop');
  if (d) {
    d.style.color = mode === 'lq' ? 'var(--fg)' : 'var(--fg-dim)';
    d.style.borderColor = mode === 'lq' ? 'var(--fg-muted)' : 'var(--border-muted)';
    d.setAttribute('aria-pressed', mode === 'lq' ? 'true' : 'false');
  }
  causeSwapSide(_swapSide);
}

async function causeZapPreview(pool, tokenIn, amountIn) {
  try {
    const r = await withRPC(rpc => rpc.call({
      to: PLQLENS, data: SEL_PREVIEW_ZAP + _a(pool) + _a(tokenIn) + _w(amountIn) }));
    if (!r || _dec1(r, 0) !== 1n) return null;
    return { portion: _dec1(r, 1), lp: _dec1(r, 2) };
  } catch { return null; }
}

let _swapSide = 'buy';
let _swapSeq = 0;
let _swapQuote = null;

function causeSwapFlip() {
  causeSwapSide(_swapSide === 'buy' ? 'sell' : 'buy');
}

// Paints both halves of the tile from one side value, so the two can never disagree
// about which way the trade runs — which they did when the tabs were markup and the
// direction was a module variable that a repaint did not touch.
function causeSwapSide(side) {
  _swapSide = side;
  const ds = $('app')?.dataset || {};
  const sym = escText(ds.sym || 'shares');
  const held = BigInt(ds.userBalance || '0');
  const bal = _ethBalance || 0n;
  const buying = side === 'buy';

  const ethTag = `${ethGlyph(15)}<span style="margin-left:5px">ETH</span>`;
  const coinTag = `${_causeGlyph}<span style="margin-left:5px">${sym}</span>`;
  const lq = _causeMode === 'lq';
  const inSym = $('causeSwapSym'), outSym = $('causeSwapOutSym');
  if (inSym) inSym.innerHTML = buying ? ethTag : coinTag;
  if (outSym) outSym.innerHTML = lq
    ? `<span style="color:var(--fg-muted)">LP</span>`
    : (buying ? coinTag : ethTag);

  const inp = $('causeSwapAmt');
  if (inp) inp.value = '';
  const out = $('causeSwapOut');
  if (out) out.textContent = '0.0';

  // The pay side carries the balance and its shortcuts; the receive side just says
  // what you already hold, so there is nothing to click that would overwrite a quote.
  const hold = $('causeSwapHold'), outHold = $('causeSwapOutHold');
  const ethLine = _connectedAddress ? `balance ${fmtNum(Number(ethers.formatEther(bal)))} ETH` : 'connect to trade';
  const coinLine = held > 0n ? `you hold ${fmtTokenAmount(held.toString())}` : 'you hold none';
  if (hold) {
    if (buying) {
      // Max keeps a little ETH back: spending the whole balance leaves nothing to pay
      // for the transaction that spends it.
      const GAS_KEEP = 3000000000000000n;
      const max = bal > GAS_KEEP ? bal - GAS_KEEP : 0n;
      hold.innerHTML = `<span>${ethLine}</span>`
        + (max > 0n ? `<a href="#" onclick="causeSwapFill(${max}n);return false" style="color:var(--fg-muted);text-decoration:underline">max</a>` : '');
    } else {
      hold.innerHTML = `<span>${coinLine}</span>`
        + (held > 0n ? `<span><a href="#" onclick="causeSwapFill(${held / 2n}n);return false" style="color:var(--fg-muted);text-decoration:underline">half</a>
           &middot; <a href="#" onclick="causeSwapFill(${held}n,true);return false" style="color:var(--fg-muted);text-decoration:underline">all</a></span>` : '');
    }
  }
  if (outHold) outHold.textContent = lq
    ? (_causePoolCache?.lpSupply > 0n ? `band holds ${fmtNum(Number(ethers.formatEther(_causePoolCache.lpSupply)))} LP` : 'pool shares')
    : (buying ? coinLine : ethLine);

  const go = $('causeSwapGo');
  // Naming the action while disconnected promises something the press cannot do. The
  // rest of this page has always said "Connect Wallet" here; the tile was the exception.
  if (go) go.innerHTML = !_connectedAddress ? 'Connect wallet'
    : lq ? `Add ${buying ? ethGlyph(14) : _causeGlyph} liquidity`
    : (buying ? `Buy ${_causeGlyph} ${sym}` : `Sell ${_causeGlyph} ${sym}`);
  _swapQuote = null;
  causeSwapQuote();
  // _ethBalance is filled by loadBalances, which needs a signer and the coin data and so
  // may not have run when this paints. A connected wallet being told it holds 0 ETH is
  // worse than a blank, so fetch it once and repaint rather than believing the default.
  if (buying && _connectedAddress && bal === 0n && !_causeEthBalFetching) {
    _causeEthBalFetching = true;
    withRPC(rpc => rpc.getBalance(_connectedAddress))
      .then(v => { if (v > 0n) { _ethBalance = v; if ($('causeSwapAmt') && _swapSide === 'buy') causeSwapSide('buy'); } })
      .catch(() => {})
      .finally(() => { _causeEthBalFetching = false; });
  }
}

function causeSwapFill(weiAmt, exact) {
  const box = $('causeSwapAmt');
  if (!box) return;
  const v = BigInt(weiAmt);
  // Trimming rounds DOWN, never up: a shortcut must not ask for more than is held.
  box.value = exact
    ? ethers.formatEther(v).replace(/\.0$/, '')
    : ethers.formatEther(v - (v % 10n ** 12n)).replace(/\.0$/, '').replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  causeSwapQuote();
}

// One quote per keystroke would outrun the RPC and paint answers out of order, so
// each carries a sequence and a stale one is dropped rather than shown.
async function causeSwapQuote() {
  const el = $('causeSwapQuote');
  if (!el || !_causePoolCache) return;
  const my = ++_swapSeq;
  const raw = ($('causeSwapAmt')?.value || '').trim();
  const btn = $('causeSwapGo');
  const amt = parseFloat(raw || '0');
  if (!amt || amt <= 0) {
    el.textContent = _causeMode === 'lq'
      ? (_swapSide === 'buy' ? 'How much ETH to add' : 'How many shares to add')
      : (_swapSide === 'buy' ? 'How much ETH to spend' : 'How many shares to sell');
    _swapQuote = null; if (btn) btn.disabled = !!_connectedAddress;
    const ob = $('causeSwapOut');
    if (ob) { ob.textContent = '0.0'; ob.style.color = 'var(--fg-dim)'; }
    return;
  }
  let amountIn;
  try { amountIn = ethers.parseEther(String(amt)); } catch { el.textContent = 'Enter a valid amount'; return; }

  const shares = _causePoolCache.shares;
  const tokenIn = _swapSide === 'buy' ? ZERO : shares;
  const [c0, c1] = causeSortedPair(shares);
  el.textContent = 'Quoting\u2026';

  if (_causeMode === 'lq') {
    const pv = await causeZapPreview(_causePoolCache.pool, tokenIn, amountIn);
    if (my !== _swapSeq) return;
    if (!pv || pv.lp <= 0n) {
      el.textContent = 'The pool would refuse this deposit.';
      if (btn) btn.disabled = true;
      const ob0 = $('causeSwapOut');
      if (ob0) { ob0.textContent = '0.0'; ob0.style.color = 'var(--fg-dim)'; }
      return;
    }
    _swapQuote = { pool: _causePoolCache.pool, out: pv.lp, amountIn, tokenIn, portion: pv.portion, zap: true };
    if (btn) btn.disabled = false;
    const ob = $('causeSwapOut');
    if (ob) { ob.textContent = fmtNum(Number(ethers.formatEther(pv.lp))); ob.style.color = 'var(--fg)'; }

    // The swap leg runs at minOut = 0 by design, so the portion is the part of this
    // deposit that is exposed to the band's depth. Saying how big it is is the only
    // protection a form can offer against a thin one.
    const supply = _causePoolCache.lpSupply || 0n;
    const share = supply > 0n ? Number(pv.lp * 10000n / (supply + pv.lp)) / 100 : 100;
    const symq = escText(($('app')?.dataset.sym) || 'shares');
    const portTxt = _swapSide === 'buy'
      ? `${fmtNum(Number(ethers.formatEther(pv.portion)))} ETH`
      : `${fmtTokenAmount(pv.portion.toString())} ${symq}`;
    const heavy = amountIn > 0n && pv.portion * 100n / amountIn >= 25n;
    el.innerHTML = `<span>Swaps ${portTxt} into the other side first, then deposits both.</span>`
      + `<div style="margin-top:3px">You would hold ${share.toFixed(share >= 10 ? 0 : 1)}% of the band.</div>`
      + (heavy ? `<div style="color:var(--red);margin-top:3px">That swap is ${Math.round(Number(pv.portion * 100n / amountIn))}% of your deposit and it fills at any price. Consider adding the other side instead.</div>` : '');
    return;
  }
  try {
    const me = _connectedAddress || ZERO;
    const data = SEL_QUOTE_BEST + _a(c0) + _a(c1) + _a(me) + _a(tokenIn) + _w(amountIn) + _w(0) + _w(LQ_SCAN);
    const res = await withRPC(rpc => rpc.call({ to: PPLENS, data }));
    if (my !== _swapSeq) return;
    if (!res || res.length < 130) { el.textContent = 'No route for that size.'; if (btn) btn.disabled = true; return; }
    const h = res.slice(2);
    const pool = '0x' + h.slice(24, 64);
    const out = BigInt('0x' + h.slice(64, 128));
    if (out <= 0n || /^0x0{40}$/i.test(pool)) { el.textContent = 'No route for that size.'; if (btn) btn.disabled = true; return; }

    // Effective price is what this trade actually pays, which in a band this thin is
    // the number that matters far more than spot.
    const eff = _swapSide === 'buy' ? amountIn * LQ_WAD / out : out * LQ_WAD / amountIn;
    const spot = _causePoolCache.spot || 0n;
    const slipPct = spot > 0n ? Number((eff - spot) * 10000n / spot) / 100 : null;
    _swapQuote = { pool, out, amountIn, tokenIn, eff };
    if (btn) btn.disabled = false;
    const outBox = $('causeSwapOut');
    if (outBox) {
      outBox.textContent = _swapSide === 'buy'
        ? fmtTokenAmount(out.toString())
        : fmtNum(Number(ethers.formatEther(out)));
      outBox.style.color = 'var(--fg)';
    }

    const sym = escText(($('app')?.dataset.sym) || 'shares');
    const outTxt = _swapSide === 'buy'
      ? `<span style="display:inline-flex;align-items:center;gap:4px">${_causeGlyph}${fmtTokenAmount(out.toString())} ${sym}</span>`
      : `${ethAmount(fmtNum(Number(ethers.formatEther(out))), 13)} ETH`;
    el.innerHTML = `<span>${fmtPriceWei(eff)} per share effective`
      + (slipPct !== null ? ` &middot; <span style="color:${Math.abs(slipPct) > 10 ? 'var(--red)' : 'var(--fg-dim)'}">${slipPct > 0 ? '+' : ''}${slipPct.toFixed(1)}% vs spot</span>` : '')
      + `</span><div style="color:var(--fg-dim);margin-top:3px">Reverts rather than filling worse than ${_causeSlipPct}%.</div>`;
  } catch {
    if (my !== _swapSeq) return;
    el.textContent = 'Could not quote that.'; if (btn) btn.disabled = true;
  }
}

async function causeSwapGo() {
  const status = $('causeSwapStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  // Connect first: the button says "Connect wallet" when there is no signer, and it has
  // to honour that even with the amount box empty, which is exactly when someone presses it.
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  if (!_causePoolCache) return;
  if (!_swapQuote) { causeSwapSide(_swapSide); return; }
  const { pool, out, amountIn, tokenIn, portion, zap } = _swapQuote;
  const shares = _causePoolCache.shares;
  const tokenOut = tokenIn === ZERO ? shares : ZERO;
  const minOut = out - (out * causeSlipBps()) / 10000n;
  try {
    const me = await sgn.getAddress();
    // Never hand tokens to an address the factory does not vouch for.
    const okPool = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_ISPOOL + _a(pool) }));
    if (!okPool || _dec1(okPool, 0) !== 1n) { say('That address is not a Precision pool \u2014 refusing to send.', 'var(--red)'); return; }
    const routeData = zap
      ? SEL_ZAPIN + _a(pool) + _a(tokenIn) + _w(amountIn) + _w(portion) + _w(minOut) + _a(me) + _a(me)
      : _encPRoute([pool], tokenIn, tokenOut, amountIn, minOut, me);
    const routed = _encSnwap(tokenIn, amountIn, me, zap ? pool : tokenOut, minOut, PROUTE, routeData);

    let data, value;
    if (tokenIn === ZERO) {
      // Native in: the router is funded by the call itself, so one leg and no approval.
      data = routed; value = amountIn;
    } else {
      // Token in: the router pulls, so it needs an allowance, and the checkpoint binds
      // the pull to this exact route so a funded router cannot be spent by another one.
      const token = new ethers.Contract(shares, ERC20_ABI, sgn);
      if ((await token.allowance(me, ZROUTER)) < amountIn) {
        say('Approving shares\u2026');
        await (await token.approve(ZROUTER, ethers.MaxUint256)).wait();
      }
      const checkpoint = _encSnwap(ZERO, 0n, me, ZERO, 0n, PROUTE,
        SEL_PCHECKPOINT + _a(shares) + ethers.keccak256('0x' + routeData.replace(/^0x/, '')).slice(2) + _a(me));
      data = ROUTER_IFACE.encodeFunctionData('multicall', [['0x' + checkpoint.replace(/^0x/, ''), '0x' + routed.replace(/^0x/, '')]]);
      value = 0n;
    }
    say('Confirm in your wallet\u2026');
    const tx = await sgn.sendTransaction({ to: ZROUTER, data: data.startsWith('0x') ? data : '0x' + data, value });
    say(`Swapping\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Done.', 'var(--green)');
    const inp = $('causeSwapAmt'); if (inp) inp.value = '';
    _swapQuote = null;
    await loadCausePool($('app')?.dataset.dao, shares, _renderGen, true).catch(() => {});
    loadBalances?.();
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}

// ---------------------------------------------------------------- order book
// A band prices every trade against its own depth, which is why this coin went 333 gwei
// to 280,287 and back inside a day. A resting order does not: a maker posts a price and
// a holder either takes it or does not, and nothing moves in between. For a coin this
// thin that is the difference between distributing and being volatile at.
//
// Swapboard already abstracts WETH on both sides — fillOrderWithEth when you pay, and
// fillOrderUnwrap when you are paid — so nobody here ever holds or approves WETH.
const SWAPBOARD = '0x000000fF3D7A2d373615141d7489Ca66683DbecF';
const SWAPBOARD_PF = '0x00000000CC3915a0f5F98CBdC558Ac1a8e85B831';
const SWAPBOARD_VIEW = '0x51B33f0dd2680ba3f8C1cF30C33aeD8BFca1DF38';
const BOARD_WETH = '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2';
const BOARD_VIEW_ABI = ['function getAllActiveOrders(address boardV1, address boardV2) view returns (tuple(uint256 orderId, address maker, bool partialFill, address tokenA, uint256 amountA, string symbolA, uint8 decimalsA, address tokenB, uint256 amountB, string symbolB, uint8 decimalsB, address board)[])'];
const BOARD_ABI = [
  'function fillOrder(uint256 orderId, uint256 deadline)',
  'function fillOrderWithEth(uint256 orderId, uint256 deadline) payable',
  'function fillOrderUnwrap(uint256 orderId, uint256 deadline)',
];
const BOARD_PF_ABI = [
  'function fillOrder(uint256 orderId, uint256 deadline, uint256 fillAmountB)',
  'function fillOrderWithEth(uint256 orderId, uint256 deadline) payable',
  'function fillOrderUnwrap(uint256 orderId, uint256 deadline, uint256 fillAmountB)',
];

let _causeBook = [];

// Every resting order on either board where one side is this coin and the other is ETH.
// A bid offers ETH and wants the coin, so a holder fills it to sell; an ask is the reverse.
async function causeBookLoad(sharesAddr) {
  const isEth = a => a.toLowerCase() === BOARD_WETH.toLowerCase() || a === ZERO;
  const isCoin = a => a.toLowerCase() === sharesAddr.toLowerCase();
  let all;
  try {
    all = await withRPC(rpc =>
      new ethers.Contract(SWAPBOARD_VIEW, BOARD_VIEW_ABI, rpc).getAllActiveOrders(SWAPBOARD, SWAPBOARD_PF));
  } catch { return []; }
  const out = [];
  for (const o of all) {
    const bid = isEth(o.tokenA) && isCoin(o.tokenB);
    const ask = isCoin(o.tokenA) && isEth(o.tokenB);
    if (!bid && !ask) continue;
    const ethAmt = bid ? o.amountA : o.amountB;
    const coinAmt = bid ? o.amountB : o.amountA;
    if (coinAmt === 0n) continue;
    out.push({
      id: o.orderId, board: o.board, partial: o.partialFill, maker: o.maker,
      bid, ethAmt, coinAmt,
      // What one whole share costs in this order, which is the only number worth sorting on.
      price: ethAmt * LQ_WAD / coinAmt,
    });
  }
  // Best first from the filler's point of view: highest bid, cheapest ask.
  out.sort((a, b) => (a.bid === b.bid) ? (a.bid ? (b.price > a.price ? 1 : -1) : (a.price > b.price ? 1 : -1)) : (a.bid ? -1 : 1));
  return out;
}

function causeBookHTML(orders, sym) {
  if (!orders.length) {
    return `<div style="font-size:10px;color:var(--fg-dim);line-height:1.6">
      No resting orders. A limit order lets someone name a price and wait, instead of
      taking whatever the band quotes — which for a pool this thin is most of the price.
    </div>`;
  }
  const spot = _causePoolCache?.spot || 0n;
  const row = o => {
    const vs = spot > 0n ? Number((o.price - spot) * 10000n / spot) / 100 : null;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-muted);font-size:11px">
      <span style="width:34px;color:${o.bid ? 'var(--green)' : 'var(--red)'};font-weight:600">${o.bid ? 'BID' : 'ASK'}</span>
      <span style="flex:1;color:var(--fg)">${causeGwei(o.price)}</span>
      <span style="flex:1;color:var(--fg-muted)">${fmtTokenAmount(o.coinAmt.toString())} ${escText(sym)}</span>
      <span style="flex:1;color:var(--fg-dim)">${fmtNum(Number(ethers.formatEther(o.ethAmt)))} ETH</span>
      ${vs !== null ? `<span style="width:52px;text-align:right;color:var(--fg-dim)">${vs > 0 ? '+' : ''}${vs.toFixed(0)}%</span>` : ''}
      <button class="swap-btn" style="font-size:10px;padding:4px 10px;white-space:nowrap"
        onclick="causeBookFill('${o.id}')">${o.bid ? 'Sell into' : 'Buy'}</button>
    </div>`;
  };
  return `<div>${orders.map(row).join('')}</div>`;
}

async function causeBookFill(idStr) {
  const st = $('causeBookStatus');
  const say = (m, c) => { if (st) st.innerHTML = m ? `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>` : ''; };
  const o = _causeBook.find(x => String(x.id) === String(idStr));
  if (!o) return;
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  try {
    const me = await sgn.getAddress();
    const deadline = BigInt(Math.floor(Date.now() / 1000) + 300);
    const pf = o.board.toLowerCase() === SWAPBOARD_PF.toLowerCase();
    const board = new ethers.Contract(o.board, pf ? BOARD_PF_ABI : BOARD_ABI, sgn);
    let tx;
    if (o.bid) {
      // Filling a bid means handing over the coin and being paid in ETH: approve the
      // coin, then take the unwrap variant so no WETH ever reaches the wallet.
      const token = new ethers.Contract(_causePoolCache.shares, ERC20_ABI, sgn);
      if ((await token.allowance(me, o.board)) < o.coinAmt) {
        say('Approving shares\u2026');
        await (await token.approve(o.board, ethers.MaxUint256)).wait();
      }
      say('Confirm in your wallet\u2026');
      tx = pf ? await board.fillOrderUnwrap(o.id, deadline, o.coinAmt)
              : await board.fillOrderUnwrap(o.id, deadline);
    } else {
      // Filling an ask means paying ETH for the coin; the board wraps it for us.
      say('Confirm in your wallet\u2026');
      tx = await board.fillOrderWithEth(o.id, deadline, { value: o.ethAmt });
    }
    say(`Filling\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Filled.', 'var(--green)');
    await loadCausePool($('app')?.dataset.dao, _causePoolCache.shares, _renderGen, true).catch(() => {});
    loadBalances?.();
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}

async function loadCausePool(daoAddr, sharesAddr, gen, knownHasPool) {
  const el = $('causePool');
  if (!el) return;
  const ds = $('app')?.dataset || {};
  const treasury = BigInt(ds.treasury || '0');
  const supply = BigInt(ds.sharesSupply || '0') + BigInt(ds.lootSupply || '0');
  if (supply <= 0n) return;
  const floor = treasury * LQ_WAD / supply;
  // The price buyers actually paid is the honest opening mark: seeding under it sells
  // the pool cheaper than the sale did, seeding over it marks your own book up.
  const salePx = BigInt(ds.price || '0');
  const held = BigInt(ds.userBalance || '0');
  const sym = escText(ds.sym || 'shares');
  $('app').dataset.floor = floor.toString();

  // pairCount answers "is there any pool at all" in one call, which is all the empty
  // state needs. The lens below answers what and where, and only runs once there is one.
  const [t0, t1] = causeSortedPair(sharesAddr);
  let pairPools = 0;
  try {
    const res = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_PAIR_COUNT + _a(t0) + _a(t1) }));
    pairPools = Number(BigInt(res || '0x0'));
  } catch {}
  if (gen !== _renderGen || !el.isConnected) return;
  // A caller who just watched the create confirm knows better than a lagging read. Without
  // this the panel repaints the seed form over a pool that exists, inviting a second one.
  const has = pairPools > 0 || !!knownHasPool;

  // Reserves, bounds and the tape all come from the pool itself once one exists.
  let pool = null, spot = 0n, spark = '';
  if (has) {
    const pools = await causePools(sharesAddr);
    if (gen !== _renderGen || !el.isConnected) return;
    pool = pools[0] || null;
    if (pool) {
      spot = causeSpotPrice(pool, sharesAddr);
      // price is the deposit ratio and spot is the marginal price; the LP form needs the
      // former or the pool refunds the difference, the quote needs the latter.
      // PI_LIQ is the band's LP supply: it matched the pool's own totalSupply exactly
      // on the live pool, which is what makes a "share of the band" figure honest.
      _causePoolCache = { pool: pool.pool, shares: sharesAddr,
                          price: causePoolPrice(pool, sharesAddr), spot, lpSupply: pool.liq };
      const bars = await causeTape(pool.pool, t0 === ZERO);
      if (gen !== _renderGen || !el.isConnected) return;
      spark = causeChart(bars, floor, salePx, spot);
      _causeBook = await causeBookLoad(sharesAddr);
      if (gen !== _renderGen || !el.isConnected) return;
    }
  }

  const ethSide = pool ? (t0 === ZERO ? pool.r0 : pool.r1) : 0n;
  const shSide = pool ? (t0 === ZERO ? pool.r1 : pool.r0) : 0n;
  const vsSale = causeVsSale(spot, salePx);

  el.innerHTML = `<div class="section-card">
    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>Market</span>
      ${has && pool ? `<button id="causeModeDrop" onclick="causeSetMode(_causeMode === 'lq' ? 'swap' : 'lq')"
        aria-pressed="false" title="Add liquidity instead of swapping" aria-label="Add liquidity instead of swapping"
        style="width:24px;height:24px;border-radius:6px;border:1px solid var(--border-muted);background:none;color:var(--fg-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6 6.1 6 10.3a6 6 0 0 1-12 0c0-4.2 6-10.3 6-10.3z"/></svg>
      </button>` : ''}
    </div>
    <dl class="coin-summary" style="font-size:12px;line-height:1.8;color:var(--fg-muted)">
      ${spot > 0n ? `<dt>Price</dt><dd><b style="color:var(--fg)">${ethAmount(causeGwei(spot), 11)}</b>${

// head: 15,000 shares at 333 gwei is 0.004995 ETH, which nobody guesses. So typing one
// side fills the other at the sale price, and typing over that fill takes control back.
let _poolEthTouched = false;

function causePoolFill(weiAmt) {
  const box = $('causePoolShares');
  if (!box) return;
  box.value = ethers.formatEther(BigInt(weiAmt)).replace(/\.0$/, '');
  _poolEthTouched = false;   // a balance shortcut is a fresh start, so re-pair the ETH side
  causePoolQuote('shares');
}

function causePoolQuote(src) {
  const el = $('causePoolQuote');
  if (!el) return;
  if (src === 'eth') _poolEthTouched = true;

  const salePx = BigInt($('app')?.dataset.price || '0');
  const floor = BigInt($('app')?.dataset.floor || '0');
  const shBox = $('causePoolEth') && $('causePoolShares');

  // Typing shares prices them at the sale price, unless the ETH side is being driven by hand.
  if (src === 'shares' && !_poolEthTouched && salePx > 0n && shBox) {
    const raw = $('causePoolShares').value.trim();
    let paired = '';
    if (raw) { try { paired = ethers.formatEther(ethers.parseEther(raw) * salePx / LQ_WAD); } catch {} }
    $('causePoolEth').value = paired;
  }

  const e = parseFloat($('causePoolEth')?.value || '0');
  const sh = parseFloat($('causePoolShares')?.value || '0');
  if (!e || !sh || e <= 0 || sh <= 0) {
    el.innerHTML = salePx > 0n
      ? 'Enter shares &mdash; the ETH side fills at the sale price, and the ratio sets the opening price'
      : 'Enter both sides &mdash; the ratio sets the opening price';
    return;
  }
  let px;
  try { px = ethers.parseEther(String(e)) * LQ_WAD / ethers.parseEther(String(sh)); }
  catch { el.textContent = 'Enter a valid amount'; return; }

  let html = `Opening price ${fmtPriceWei(px)} per share, 0.3% fee, full range.`;
  if (salePx > 0n && px !== salePx) {
    const d = Number((px - salePx) * 10000n / salePx) / 100;
    html += ` ${d > 0 ? '+' : ''}${d.toFixed(1)}% vs the sale.`;
  }
  if (floor > 0n && px < floor) {
    html += `<div style="color:var(--red);margin-top:4px">Below the ${fmtPriceWei(floor)} redemption price &mdash; this band can be bought out and redeemed for the difference.</div>`;
  }
  el.innerHTML = html;
}


// The panel reads pair counts from the public RPCs in withRPC, but a create is confirmed
// on the wallet's own node, and those are not the same machine. Re-reading the instant
// tx.wait() resolves finds pairCount still 0 on a lagging node and repaints the seed form
// over a pool that already exists. So ask the node that mined it — it cannot be behind
// itself — and give the read path a few seconds to agree before painting.
async function causeAwaitPool(sharesAddr, sgn) {
  const [t0, t1] = causeSortedPair(sharesAddr);
  const data = SEL_PAIR_COUNT + _a(t0) + _a(t1);
  const count = async caller => {
    try { return Number(BigInt(await caller({ to: PFACTORY, data }) || '0x0')); } catch { return 0; }
  };
  // The mining node is authoritative and answers immediately.
  if (sgn?.provider && await count(c => sgn.provider.call(c)) > 0) {
    // Then let the public side catch up, so the repaint reads a pool rather than a gap.
    for (let i = 0; i < 8; i++) {
      if (await count(c => withRPC(rpc => rpc.call(c))) > 0) return true;
      await new Promise(r => setTimeout(r, 1500));
    }
    return true;   // it exists; the panel will settle on the next 30s tick regardless
  }
  return false;
}

async function causeCreatePool(sharesAddr) {
  const status = $('causePoolStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const e = parseFloat($('causePoolEth')?.value || '0');
  const sh = parseFloat($('causePoolShares')?.value || '0');
  if (!e || !sh || e <= 0 || sh <= 0) { say('Enter both sides.'); return; }
  try {
    const me = await sgn.getAddress();
    const ethAmt = ethers.parseEther(String(e));
    const shAmt = ethers.parseEther(String(sh));

    const token = new ethers.Contract(sharesAddr, ERC20_ABI, sgn);
    if ((await token.allowance(me, PFACTORY)) < shAmt) {
      say('Approving shares\u2026');
      await (await token.approve(PFACTORY, ethers.MaxUint256)).wait();
    }

    say('Finding the widest band the factory accepts\u2026');
    const band = await causeBand(sharesAddr, ethAmt, shAmt, me);
    if (!band) { say('The factory refuses these amounts at every width. Try a different ratio or more of each side.', 'var(--red)'); return; }

    say(`Confirm in your wallet \u2014 0.3% fee, ${band.mult}\u00d7 either side of ${fmtPriceWei(ethers.parseEther(String(e)) * LQ_WAD / ethers.parseEther(String(sh)))}.`);
    const tx = await sgn.sendTransaction({ to: PFACTORY, data: band.data, value: ethAmt });
    say(`Creating the pool\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Pool created \u2014 loading the market\u2026', 'var(--green)');
    const confirmed = await causeAwaitPool(sharesAddr, sgn);
    await loadCausePool($('app')?.dataset.dao, sharesAddr, _renderGen, confirmed).catch(() => {});
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}
