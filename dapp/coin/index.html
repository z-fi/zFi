async function causeReopenPropose(daoAddr) {
  const status = $('causeReopenStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const raw = ($('causeReopenShares')?.value || '').trim();
  const n = Math.floor(Number(raw));
  if (!raw || isNaN(raw) || !Number.isSafeInteger(n) || n <= 0) { say('Enter a whole number of shares.'); return; }
  const ds = $('app')?.dataset || {};
  // The same figures the quote showed, recomputed here so the published description and
  // the calldata cannot disagree about what was proposed.
  const _g = parseFloat(($('causeReopenPrice')?.value || '').trim());
  const priceWei = Number.isFinite(_g) && _g > 0 ? BigInt(Math.round(_g * 1e9)) : BigInt(ds.price || '0');
  const gweiLabel = Number(priceWei) / 1e9;
  const raiseWei = ethers.parseEther(String(n)) * priceWei / ethers.parseEther('1');
  const UNIT_LABEL = ds.saleUnit || 'shares';
  try {
    const steps = causeReopenSteps(
      daoAddr, ethers.parseEther(String(n)),
      priceWei, Number(ds.saleDeadline || '0'), BigInt(ds.sharesSupply || '0')
    );
    const dao = new ethers.Contract(daoAddr, MOLOCH_PROP_ABI, sgn);
    const ids = [];
    for (let i = 0; i < steps.length; i++) {
      const st = steps[i];
      const id = await dao.proposalId(0, st.to, 0n, st.data, st.nonce);
      ids.push(id);
      say(`${steps.length > 1 ? `Proposal ${i + 1} of ${steps.length} \u2014 ` : ''}${st.label}. Confirm in your wallet.`);
      const tx = await dao.castVote(id, 1);
      say(`Opening: ${st.label}\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
      await tx.wait();
    }
    // A Moloch proposal is a bare intent hash until it executes: Opened carries only the
    // id, and nothing on chain says what the calldata does. Holders were being asked to
    // vote on "Proposal". The DAO page's answer is a chat message carrying the preimage
    // and a description, which both pages already decode and verify by recomputing the
    // id — so the reopen publishes one too, rather than inventing a second convention.
    try {
      const desc = `Reopen the sale on ShareOffering: authorise ${Number(n).toLocaleString()} ${UNIT_LABEL}`
        + ` at ${gweiLabel} gwei (${fmtEthBal(Number(ethers.formatEther(raiseWei)))} ETH), `
        + `${CAUSE_REOPEN_WINDOW_DAYS}-day window. Redeemed ${UNIT_LABEL} return their room to the sale.`;
      const payload = { type: 'PROPOSAL', op: 0, to: steps[0].to, value: '0',
                        data: steps[0].data, nonce: steps[0].nonce, description: desc };
      say('Publishing what the proposal does\u2026 confirm to post it to the DAO chat.');
      const ctx = await dao.chat(`<<<PROPOSAL_DATA\n${JSON.stringify(payload, null, 2)}\nPROPOSAL_DATA>>>`);
      await ctx.wait();
    } catch (_) {
      // A badge is required to post and the vote is already cast; losing the description
      // is worth saying nothing about beyond leaving the proposal listed.
    }

    // Both proposals need other holders, and the moment to ask is now, not after the tab
    // is closed. Hand over a link that is ready to paste rather than a page to describe.
    const voteUrl = new URL('../dao/#/dao/1/' + daoAddr, location.href).href;
    say(`The proposal is open and your shares vote for it. It must reach quorum and clear
      the timelock before the sale runs again, so holders need to vote.
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
        <a href="${voteUrl}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Open the vote</a>
        <button onclick="causeCopyText('${voteUrl}', this)" style="background:none;border:1px solid var(--border-muted);border-radius:5px;color:var(--fg-muted);font:inherit;font-size:10px;padding:3px 8px;cursor:pointer">copy link</button>
      </div>
      <div style="margin-top:4px;font-family:ui-monospace,monospace;font-size:10px;color:var(--fg-dim)">
        ${ids.map(i => '#' + i.toString().slice(0, 12) + '\u2026').join(' &middot; ')}</div>`, 'var(--green)');
    loadCauseGovernance(daoAddr, _renderGen).catch(() => {});
  } catch (e) {
    if (e.code === 'ACTION_REJECTED' || (e.message || '').includes('user rejected')) { say(''); return; }
    say(escText(e.shortMessage || e.message || 'Failed.'), 'var(--red)');
  }
}

const PFACTORY = PRECISION_FACTORY;   // modules/precision.js
const PRECISION_FEE = 3000n;            // 0.3%, zSwap's own default
const LQ_WIDTHS = [1000, 100, 10, 2];   // widest first
const LQ_WAD = 10n ** 18n;
const SEL_PAIR_COUNT = PSEL.pairCount;
const SEL_CREATE_SEED = PSEL.createSeed;
const ZSWAP_URL = 'https://zswap.wei.limo/';

function causeZSwapLink(sharesAddr, lq) {
  return `${ZSWAP_URL}#token=eth&out=${sharesAddr}${lq ? '&lq=1' : ''}`;
}

const _w = pWord, _a = pAddr;   // modules/precision.js

// price (t1 per t0, human units) -> sqrt price in the factory's fixed-point form
function pxToSqrt(px, d0, d1) {
  const raw = px * 10 ** (d1 - d0);
  if (!isFinite(raw) || raw <= 0) return 0n;
  return BigInt(Math.round(Math.sqrt(raw) * 1e9)) * 10n ** 9n;
}

// The opening price a pair of deposits implies inside a band, by bisection.
function lqSeedPrice(sl, sh, in0, in1) {
  const L = Number(sl), H = Number(sh), x = Number(in0), y = Number(in1), W = 1e18;
  const g = t => (x * t * H * (t - L)) / ((H - t) * W * y * W);
  let lo = L, hi = H;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (g(m) < 1) lo = m; else hi = m; }
  const t = (lo + hi) / 2;
  if (!(t > L && t < H)) return 0n;
  return BigInt(Math.round(t));
}

// token0, token1, sqrtLo, sqrtHi, fee, hook, owner, salt — flattened, as the factory wants it.
function causeMarket(t0, t1, sl, sh) {
  return _a(t0) + _a(t1) + _w(sl) + _w(sh) + _w(PRECISION_FEE) + _a(ZERO) + _a(ZERO) + _w(0);
}

function causeSortedPair(sharesAddr) {
  return ZERO.toLowerCase() < sharesAddr.toLowerCase() ? [ZERO, sharesAddr] : [sharesAddr, ZERO];
}


// Build the widest band the factory will actually accept for these amounts.
async function causeBand(sharesAddr, ethAmt, shareAmt, from) {
  const [t0, t1] = causeSortedPair(sharesAddr);
  const ethIs0 = t0 === ZERO;
  const a0 = ethIs0 ? ethAmt : shareAmt;
  const a1 = ethIs0 ? shareAmt : ethAmt;
  const px = Number(ethers.formatEther(a1)) / Number(ethers.formatEther(a0));
  if (!(px > 0)) return null;

  for (const mult of LQ_WIDTHS) {
    const sl = pxToSqrt(px / mult, 18, 18);
    const sh = pxToSqrt(px * mult, 18, 18);
    if (!sl || !sh || sh <= sl) continue;
    const sp = lqSeedPrice(sl, sh, a0, a1);
    if (!sp) continue;
    const market = causeMarket(t0, t1, sl, sh);
    const data = SEL_CREATE_SEED + market + _w(sp) + _w(a0) + _w(a1) + _w(0) + _a(from);
    try {
      // The factory is the authority on whether this seed is admissible. Ask it.
      await withRPC(rpc => rpc.call({ from, to: PFACTORY, data, value: ethers.toBeHex(ethAmt) }));
      return { mult, market, data, sl, sh, sp, px };
    } catch { /* band refused — try a narrower one */ }
  }
  return null;
}

// ---------------------------------------------------------------- market data
// Two lenses and a tape. The lens enumerates a pair's pools with their bounds and
// reserves; PLQLENS prices a deposit; the pool's own tape carries the candles.
const PPLENS = PRECISION_LENS;
const PLQLENS = PRECISION_LQ_LENS;
const SEL_MARKETS = PSEL.markets;
const SEL_TAPE = PSEL.tape;
const SEL_ZAPIN = PSEL.zapIn;
const SEL_PREVIEW_ZAP = PSEL.previewZap;
const SEL_PREVIEW_ADD = PSEL.previewAdd;
const SEL_ISPOOL = PSEL.isPool;
const PI_WORDS = 19, PI_POOL = 0, PI_SL = 3, PI_SH = 4, PI_FEE = 5,
      PI_R0 = 6, PI_R1 = 7, PI_PX = 8, PI_LIQ = 9;
const LQ_SCAN = 32;
const _dec1 = (h, i) => BigInt('0x' + h.slice(2).slice(i * 64, (i + 1) * 64));

// Pools for the ETH/shares pair, richest first. Reserves are what the page prices
// against: the tape is executed prices and its own source says not to price on it.
async function causePools(sharesAddr) {
  const [t0, t1] = causeSortedPair(sharesAddr);
  const data = SEL_MARKETS + _a(t0) + _a(t1) + _a(ZERO) + _w(0) + _w(LQ_SCAN) + _w(0);
  let raw;
  try { raw = await withRPCOnce('pools:' + sharesAddr.toLowerCase(), rpc => rpc.call({ to: PPLENS, data }), 5000); }
  catch { return []; }
  if (!raw || raw.length < 130) return [];
  const h = raw.slice(2);
  const n = Number(BigInt('0x' + h.slice(64, 128)));
  const out = [];
  for (let i = 0; i < n && i < LQ_SCAN; i++) {
    const base = 128 + i * PI_WORDS * 64;
    const at = k => BigInt('0x' + h.slice(base + k * 64, base + (k + 1) * 64));
    out.push({
      pool: '0x' + h.slice(base + PI_POOL * 64 + 24, base + (PI_POOL + 1) * 64),
      sl: at(PI_SL), sh: at(PI_SH), fee: at(PI_FEE),
      r0: at(PI_R0), r1: at(PI_R1), liq: at(PI_LIQ), sqrtP: at(PI_PX),
    });
  }
  return out.sort((x, y) => (y.liq > x.liq ? 1 : y.liq < x.liq ? -1 : 0));
}

// Marginal price: what the next infinitesimal trade pays, which is THE price. PI_PX is
// a sqrt scaled by 1e18, the same convention as the band bounds. This is NOT the reserve
// ratio — in a concentrated position the two differ, here by 17%, and using reserves as
// the price made buys look 11% cheaper than spot when they are really 4% dearer.
// Confirmed by shrinking a quote until it converges: 7,903.7 gwei against 7,880.5 here,
// the gap being the 0.3% fee a quote includes and a marginal price does not.
function causeSpotPrice(pool, sharesAddr) {
  const [t0] = causeSortedPair(sharesAddr);
  const px = pool.sqrtP || 0n;
  if (px <= 0n) return 0n;
  // sqrt is of raw token1-per-token0; both sides here are 18 decimals.
  return t0 === ZERO
    ? (10n ** 54n) / (px * px)      // ETH is token0, so invert
    : (px * px) / (10n ** 18n);     // ETH is token1, already ETH per share
}

// The ratio a deposit must arrive at, which is the reserve ratio and not the price.
// previewAdd on the live pool takes 1 ETH per 108,158.97 CELL, exactly this.
function causePoolPrice(pool, sharesAddr) {
  const [t0] = causeSortedPair(sharesAddr);
  const ethIs0 = t0 === ZERO;
  const eth = ethIs0 ? pool.r0 : pool.r1;
  const sh = ethIs0 ? pool.r1 : pool.r0;
  return sh > 0n ? eth * LQ_WAD / sh : 0n;
}

// The tape packs OHLC into one word per bar as a 24-bit mantissa and an 8-bit
// exponent. Prices are raw token1-per-token0 at 1e18 and decimals are the reader's
// problem; both sides here are 18, so the only work is inverting to wei-per-share.
const _unf = v => (v & 0xffffff) * 2 ** (v >>> 24);
function causeTapeBars(raw, ethIs0) {
  if (!raw || raw.length < 130) return [];
  const h = raw.slice(2);
  const n = Number(BigInt('0x' + h.slice(64, 128)));
  const bars = [];
  for (let j = 0; j < n; j++) {
    const w = BigInt('0x' + h.slice(128 + j * 64, 128 + (j + 1) * 64));
    if (!w) continue;
    const trades = Number((w >> 192n) & 0xffffn);
    if (!trades) continue;
    const f = k => _unf(Number((w >> BigInt(k)) & 0xffffffffn));
    // token1-per-token0 when ETH is token0 inverts; when shares are token0 it is
    // already ETH per share.
    const px = v => (v > 0 ? (ethIs0 ? 1e36 / v : v) : 0);
    bars.push({ b: Number(w & 0xffffffffn), o: px(f(32)), c: px(f(128)),
                hi: px(f(64)), lo: px(f(96)), n: trades });
  }
  // The tape is a ring buffer: slot order is not time order, and it comes back newest
  // first. Sort by bucket so a chart plots left to right in the direction time runs.
  return bars.sort((a, b) => a.b - b.b);
}

async function causeTape(poolAddr, ethIs0) {
  // Fine bars are what a young pool has; the coarse tape only fills once fine bars
  // finish and fold. Take whichever window actually carries prints, preferring the
  // one with more of them rather than discarding a lone fine bar for an empty coarse.
  let best = [];
  for (const win of [300, 14400]) {
    try {
      const raw = await withRPCOnce(`tape:${poolAddr}:${win}`, rpc => rpc.call({ to: poolAddr, data: SEL_TAPE + _w(win) + _w(256) }), 15000);
      const bars = causeTapeBars(raw, ethIs0);
      // The bucket width is what turns bucket indices into a time span on the axis,
      // and only this loop knows which window actually carried the prints.
      if (bars.length > best.length) { bars._win = win; best = bars; }
      if (best.length > 1) break;
    } catch {}
  }
  return best;
}


// A young cause coin has a handful of prints, and a tall time-axis chart drawn over
// three of them is mostly empty space with a dot in it. What actually needs saying fits
// on one axis: where the coin trades relative to the floor it can always be redeemed at.
// So this is a price ruler, not a time series — floor on the left, spot on the right,
// fills marked where they landed. Log-spaced, because day one spans 24x.
// Once the tape holds enough distinct bars to have a shape, time is worth an axis and
// the ruler stops being the better picture. Below that it is not: three prints on a time
// axis is a dot and a lot of whitespace, which is what a lone candle looks like too.
// A real price chart: OHLC candles from the pool's own tape, on a log price scale,
// with the redemption floor drawn across it. The tape already carries open, high, low
// and close per bucket — the old chart threw three of those away and drew a polyline
// through the closes, which is why it read as a squiggle rather than as a market.
//
// Log scale because a coin's first day routinely spans 20x and a linear axis renders
// that as a flat line with one spike. `preserveAspectRatio` stays at the default so
// candle bodies keep their proportions instead of being stretched by the viewport.
function causeTimeChart(bars, floorWei, spotWei, winSecs, fmt) {
  const floor = Number(floorWei || 0), spot = Number(spotWei || 0);
  const vals = [];
  for (const b of bars) { if (b.hi > 0) vals.push(b.hi); if (b.lo > 0) vals.push(b.lo); }
  if (floor > 0) vals.push(floor);
  if (spot > 0) vals.push(spot);
  if (!vals.length) return '';
  const lo = Math.min(...vals), hi = Math.max(...vals);
  // A flat tape has no range to scale to; give it one so the candles land mid-frame.
  const L = Math.log(lo * 0.94), span = (Math.log(hi * 1.06) - L) || Math.log(1.5);

  // The SVG stretches to the container on both axes (preserveAspectRatio="none"), which
  // is what keeps the chart a fixed height instead of growing to a third of the page on
  // a wide screen. Nothing that must not distort is drawn inside it: strokes carry
  // non-scaling-stroke, and every label is HTML positioned over the top. Text in a
  // non-uniformly scaled SVG is text that has been stretched.
  const H = 100, PAD_T = 6, PAD_B = 6;
  const yFrac = v => (PAD_T + (1 - (Math.log(Math.max(v, 1e-30)) - L) / span) * (H - PAD_T - PAD_B)) / H;
  const y = v => yFrac(v) * H;
  const W = 1000;
  const slot = W / bars.length;
  const bodyW = Math.max(2, Math.min(slot * 0.66, 18));

  let svg = '';
  for (const f of [0, 0.5, 1]) {
    const yy = y(Math.exp(L + span * f));
    svg += `<line x1="0" y1="${yy.toFixed(2)}" x2="${W}" y2="${yy.toFixed(2)}" stroke="var(--border-muted)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  if (floor > 0) {
    svg += `<line x1="0" y1="${y(floor).toFixed(2)}" x2="${W}" y2="${y(floor).toFixed(2)}" stroke="var(--fg-dim)" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  }
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    if (!(b.c > 0)) continue;
    const col = b.c >= b.o ? 'var(--green)' : 'var(--red)';
    const x = (i + 0.5) * slot;
    svg += `<line x1="${x.toFixed(2)}" y1="${y(b.hi || b.c).toFixed(2)}" x2="${x.toFixed(2)}" y2="${y(b.lo || b.c).toFixed(2)}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    const yO = y(b.o || b.c), yC = y(b.c);
    // A doji is a zero-height rect, which disappears; floor it at something visible.
    svg += `<rect x="${(x - bodyW / 2).toFixed(2)}" y="${Math.min(yO, yC).toFixed(2)}" width="${bodyW.toFixed(2)}" height="${Math.max(1.2, Math.abs(yC - yO)).toFixed(2)}" fill="${col}"/>`;
  }
  if (spot > 0) {
    svg += `<line x1="0" y1="${y(spot).toFixed(2)}" x2="${W}" y2="${y(spot).toFixed(2)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="2 2" opacity="0.7" vector-effect="non-scaling-stroke"/>`;
  }

  // A launched coin is quoted per 1M tokens everywhere else on the page. Printing the
  // chart's axis per single token put two different gwei figures for the same price on
  // one screen — "4,410 gwei per 1M" in the header over "0.0044 gwei now" on the chart.
  const price = fmt || (v => causeGwei(BigInt(Math.round(v))));

  const lbl = (v, text, col) => {
    const t = yFrac(v);
    // Nudge labels off the very edge so they are not clipped by the container.
    const top = `calc(${(Math.min(0.97, Math.max(0.03, t)) * 100).toFixed(2)}% - 6px)`;
    return `<span style="position:absolute;right:2px;top:${top};font-size:10px;line-height:12px;color:${col};background:var(--bg);padding:0 3px;pointer-events:none">${text}</span>`;
  };
  let labels = '';
  for (const f of [0, 0.5, 1]) {
    const v = Math.exp(L + span * f);
    labels += lbl(v, escText(price(v)), 'var(--fg-dim)');
  }
  if (floor > 0) {
    labels += `<span style="position:absolute;left:2px;top:calc(${(Math.min(0.97, Math.max(0.03, yFrac(floor))) * 100).toFixed(2)}% - 6px);font-size:10px;line-height:12px;color:var(--fg-dim);background:var(--bg);padding:0 3px;pointer-events:none">floor</span>`;
  }

  const trades = bars.reduce((t, b) => t + b.n, 0);
  const spanSecs = winSecs ? (bars[bars.length - 1].b - bars[0].b + 1) * winSecs : 0;
  const spanLabel = spanSecs >= 86400 ? `${Math.round(spanSecs / 86400)}d`
    : spanSecs >= 3600 ? `${Math.round(spanSecs / 3600)}h`
    : spanSecs > 0 ? `${Math.round(spanSecs / 60)}m` : '';

  return `<div style="margin:2px 0 12px">
    <div style="position:relative;height:150px;padding-right:56px">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block"
        role="img" aria-label="executed price per bucket against the redemption floor">${svg}</svg>
      ${labels}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--fg-dim);margin-top:4px">
      <span>${spanLabel ? spanLabel + ' of tape' : 'pool tape'}</span>
      <span>${trades} fill${trades === 1 ? '' : 's'} &middot; executed, fee included</span>
      <span style="color:var(--green)">${escText(price(spot))} now</span>
    </div></div>`;
}

// One unit for the whole tile. fmtPriceWei is right on its own — it picks whatever reads
// best for a single number — but a column of prices meant to be compared has to agree,
// and "0.00029868 ETH" above "326 gwei" is two units pretending to be a comparison.
function causeGwei(wei) {
  const v = BigInt(wei || 0);
  if (v <= 0n) return '0';
  const eth = Number(ethers.formatEther(v));
  if (eth >= 1) return fmtNum(eth) + ' ETH';
  const g = Number(v) / 1e9;
  return (g >= 100 ? Math.round(g).toLocaleString()
        : g >= 1 ? Number(g.toPrecision(4)).toString()
        : Number(g.toPrecision(2)).toString()) + ' gwei';
}

// Past about ten-fold a percentage stops being read and starts being counted. 89,594%
// is 897x, and one of those two is a number a person can hold in their head.
function causeVsSale(spot, sale) {
  if (!(spot > 0n) || !(sale > 0n)) return '';
  const r = Number(spot) / Number(sale);
  // A multiple wants significant figures, not decimal places: 897x, 12.4x, 0.08x.
  if (r >= 10) return `${Math.round(r).toLocaleString()}\u00d7 vs sale`;
  if (r >= 2) return `${r.toFixed(1)}\u00d7 vs sale`;
  if (r <= 0.5) return `${Number(r.toPrecision(2))}\u00d7 vs sale`;
  const pct = (r - 1) * 100;
  return `${pct > 0 ? '+' : ''}${pct.toFixed(0)}% vs sale`;
}

function causeChart(bars, floorWei, saleWei, spotWei, fmt) {
  const floor = Number(floorWei || 0), spot = Number(spotWei || 0), sale = Number(saleWei || 0);
  // Any tape at all gets a real chart. This used to require three buckets and fall back
  // to a one-axis price ruler below that — but a ruler with a knob on it reads as a
  // slider, not as a price, and a trader looking for a chart found a control instead.
  // One candle is a thin chart; it is still a chart, and it is not mistakable for
  // anything else.
  const live = bars.filter(b => b.c > 0);
  if (live.length >= 1 && Number(spotWei) > 0) {
    return causeTimeChart(live, floorWei, spotWei, bars._win, fmt);
  }
  const fills = bars.filter(b => b.c > 0).map(b => b.c);
  const all = [floor, spot, sale, ...fills].filter(v => v > 0);
  if (all.length < 2) return '';
  const lo = Math.min(...all), hi = Math.max(...all);
  const L = Math.log(lo), span = Math.log(hi) - L || 1;
  const W = 300, H = 34, PAD = 4;
  const x = v => PAD + ((Math.log(v) - L) / span) * (W - PAD * 2);
  const AX = 20;

  let svg = `<line x1="${PAD}" y1="${AX}" x2="${W - PAD}" y2="${AX}" stroke="var(--border-muted)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  const tick = (v, col, h) => `<line x1="${x(v).toFixed(1)}" y1="${AX - h}" x2="${x(v).toFixed(1)}" y2="${AX + h}" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  if (floor > 0) svg += tick(floor, 'var(--fg-dim)', 5);
  if (sale > 0 && floor > 0 && Math.abs(sale - floor) / floor > 0.02) svg += tick(sale, 'var(--fg-dim)', 4);
  // Fills sit on the ruler at the price they got, which is the whole point of the tape.
  for (const f of fills) svg += `<circle cx="${x(f).toFixed(1)}" cy="${AX}" r="2.5" fill="var(--fg-muted)"/>`;
  if (spot > 0) svg += tick(spot, 'var(--green)', 7);

  const trades = bars.reduce((t, b) => t + b.n, 0);
  return `<div style="margin:2px 0 12px">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:34px;display:block"
      role="img" aria-label="where the coin trades between its redemption floor and spot">${svg}</svg>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--fg-dim);margin-top:1px">
      <span>${causeGwei(BigInt(Math.round(lo)))} floor</span>
      <span>${trades ? `${trades} fill${trades === 1 ? '' : 's'}` : 'no trades yet'}</span>
      <span style="color:var(--green)">${causeGwei(BigInt(Math.round(spot)))} now</span>
    </div></div>`;
}


// ---------------------------------------------------------------- swap
// zSwap's precision path, narrowed to the one pair this page has: ETH against the
// cause's own shares. The router funds an executor, the executor walks the pools.
const PROUTE = PRECISION_ROUTE;

let _causeSlipPct = 5;

function causeSetSlip(v) {

const _encPRoute = (pools, tokenIn, tokenOut, amountIn, minOut, to) =>

    + _a(recipient) + _a(tokenOut) + _w(minOut) + _a(executor) + _w(224) + body;

let _causeGlyph = '';
let _causeEthBalFetching = false;
// ---------------------------------------------------------------- liquidity mode
// The tile is already a "put this in, get that out" form, and adding liquidity is the
// same shape: one asset in, LP out. So the droplet swaps what the form does rather than
// opening a second one. Zap is what makes that honest — the pool takes a single side and
// sells the right portion itself, so the form never has to ask for two amounts at a ratio
// the user cannot compute.
let _causeMode = 'swap';

function causeSetMode(mode) {
  const entering = mode === 'lq' && _causeMode !== 'lq';
  _causeMode = mode;
  if (entering) _swapSide = 'buy';
  const d = $('causeModeDrop');
  if (d) {
    d.style.color = mode === 'lq' ? 'var(--fg)' : 'var(--fg-dim)';
    d.style.borderColor = mode === 'lq' ? 'var(--fg-muted)' : 'var(--border-muted)';
    d.setAttribute('aria-pressed', mode === 'lq' ? 'true' : 'false');
  }
  causeSwapSide(_swapSide);
}

async function causeZapPreview(pool, tokenIn, amountIn) {
  try {
    const r = await withRPC(rpc => rpc.call({
      to: PLQLENS, data: SEL_PREVIEW_ZAP + _a(pool) + _a(tokenIn) + _w(amountIn) }));
    if (!r || _dec1(r, 0) !== 1n) return null;
    return { portion: _dec1(r, 1), lp: _dec1(r, 2) };

let _swapSide = 'buy';
let _swapSeq = 0;
let _swapQuote = null;

function causeSwapFlip() {
  causeSwapSide(_swapSide === 'buy' ? 'sell' : 'buy');
}

// Paints both halves of the tile from one side value, so the two can never disagree
// about which way the trade runs — which they did when the tabs were markup and the
// direction was a module variable that a repaint did not touch.
function causeSwapSide(side) {
  _swapSide = side;
  const ds = $('app')?.dataset || {};
  const sym = escText(ds.sym || 'shares');
  const held = BigInt(ds.userBalance || '0');
  const bal = _ethBalance || 0n;
  const buying = side === 'buy';

  const ethTag = `${ethGlyph(15)}<span style="margin-left:5px">ETH</span>`;
  const coinTag = `${_causeGlyph}<span style="margin-left:5px">${sym}</span>`;
  const lq = _causeMode === 'lq';
  const inSym = $('causeSwapSym'), outSym = $('causeSwapOutSym');
  if (inSym) inSym.innerHTML = buying ? ethTag : coinTag;
  if (outSym) outSym.innerHTML = lq
    ? `<span style="color:var(--fg-muted)">LP</span>`
    : (buying ? coinTag : ethTag);

  const inp = $('causeSwapAmt');
  if (inp) inp.value = '';
  const out = $('causeSwapOut');
  if (out) out.textContent = '0.0';

  // The pay side carries the balance and its shortcuts; the receive side just says
  // what you already hold, so there is nothing to click that would overwrite a quote.
  const hold = $('causeSwapHold'), outHold = $('causeSwapOutHold');
  const ethLine = _connectedAddress ? `balance ${fmtNum(Number(ethers.formatEther(bal)))} ETH` : 'connect to trade';
  const coinLine = held > 0n ? `you hold ${fmtTokenAmount(held.toString())}` : 'you hold none';
  if (hold) {
    if (buying) {
      // Max keeps a little ETH back: spending the whole balance leaves nothing to pay
      // for the transaction that spends it.
      const GAS_KEEP = 3000000000000000n;
      const max = bal > GAS_KEEP ? bal - GAS_KEEP : 0n;
      hold.innerHTML = `<span>${ethLine}</span>`
        + (max > 0n ? `<a href="#" onclick="causeSwapFill(${max}n);return false" style="color:var(--fg-muted);text-decoration:underline">max</a>` : '');
    } else {
      hold.innerHTML = `<span>${coinLine}</span>`
        + (held > 0n ? `<span><a href="#" onclick="causeSwapFill(${held / 2n}n);return false" style="color:var(--fg-muted);text-decoration:underline">half</a>
           &middot; <a href="#" onclick="causeSwapFill(${held}n,true);return false" style="color:var(--fg-muted);text-decoration:underline">all</a></span>` : '');
    }
  }
  if (outHold) outHold.textContent = lq
    ? (_causePoolCache?.lpSupply > 0n ? `band holds ${fmtNum(Number(ethers.formatEther(_causePoolCache.lpSupply)))} LP` : 'pool shares')
    : (buying ? coinLine : ethLine);

  const go = $('causeSwapGo');
  // Naming the action while disconnected promises something the press cannot do. The
  // rest of this page has always said "Connect Wallet" here; the tile was the exception.
  if (go) go.innerHTML = !_connectedAddress ? 'Connect wallet'
    : lq ? `Add ${buying ? ethGlyph(14) : _causeGlyph} liquidity`
    : (buying ? `Buy ${_causeGlyph} ${sym}` : `Sell ${_causeGlyph} ${sym}`);
  _swapQuote = null;
  causeSwapQuote();
  // _ethBalance is filled by loadBalances, which needs a signer and the coin data and so
  // may not have run when this paints. A connected wallet being told it holds 0 ETH is
  // worse than a blank, so fetch it once and repaint rather than believing the default.
  if (buying && _connectedAddress && bal === 0n && !_causeEthBalFetching) {
    _causeEthBalFetching = true;
    withRPC(rpc => rpc.getBalance(_connectedAddress))
      .then(v => { if (v > 0n) { _ethBalance = v; if ($('causeSwapAmt') && _swapSide === 'buy') causeSwapSide('buy'); } })
      .catch(() => {})
      .finally(() => { _causeEthBalFetching = false; });
  }
}

function causeSwapFill(weiAmt, exact) {
  const box = $('causeSwapAmt');
  if (!box) return;
  const v = BigInt(weiAmt);
  // Trimming rounds DOWN, never up: a shortcut must not ask for more than is held.
  box.value = exact
    ? ethers.formatEther(v).replace(/\.0$/, '')
    : ethers.formatEther(v - (v % 10n ** 12n)).replace(/\.0$/, '').replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  causeSwapQuote();
}

// One quote per keystroke would outrun the RPC and paint answers out of order, so
// each carries a sequence and a stale one is dropped rather than shown.
// Best execution across the two venues this page can reach.
//
// The pool prices a continuous curve; the book is a set of fixed-size orders at fixed
// prices. Comparing them means asking each what THIS trade gets, not what their headline
// price is. A partial-fill order can be taken for any slice up to its size; an
// all-or-nothing one only helps if the trade is at least as large as the order.
function causeBookBest(side, amountIn) {
  if (!Array.isArray(_causeBook) || amountIn <= 0n) return null;
  // Buying takes an ask; selling hits a bid.
  const want = side === 'buy' ? false : true;
  let best = null;
  for (const o of _causeBook) {
    if (o.bid !== want) continue;
    // What the taker supplies, and what the order pays out for it.
    const supply = side === 'buy' ? o.ethAmt : o.coinAmt;
    const payout = side === 'buy' ? o.coinAmt : o.ethAmt;
    if (supply <= 0n || payout <= 0n) continue;
    let spend, out;
    if (amountIn >= supply) { spend = supply; out = payout; }        // fills it entirely
    else if (o.partial) { spend = amountIn; out = payout * amountIn / supply; }
    else continue;                                                   // too small to clear it
    if (!best || out * (best.spend || 1n) > best.out * spend) best = { o, spend, out };
  }
  return best;
}

async function causeSwapQuote() {
  const el = $('causeSwapQuote');
  if (!el || !_causePoolCache) return;
  const my = ++_swapSeq;
  const raw = ($('causeSwapAmt')?.value || '').trim();
  const btn = $('causeSwapGo');

      : (_swapSide === 'buy' ? 'How much ETH to spend' : `How much ${causeUnit()} to sell`);

    const ob = $('causeSwapOut');
    if (ob) { ob.textContent = '0.0'; ob.style.color = 'var(--fg-dim)'; }

    const ob = $('causeSwapOut');
    if (ob) { ob.textContent = fmtNum(Number(ethers.formatEther(pv.lp))); ob.style.color = 'var(--fg)'; }

    // deposit that is exposed to the band's depth. Saying how big it is is the only

      + (heavy ? `<div style="color:var(--red);margin-top:3px">That swap is ${Math.round(Number(pv.portion * 100n / amountIn))}% of your deposit and it fills at any price. Consider adding the other side instead.</div>` : '');

    if (my !== _swapSeq) return;
    if (!res || res.length < 130) { el.textContent = 'No route for that size.'; if (btn) btn.disabled = true; return; }

    const out = BigInt('0x' + h.slice(64, 128));

    // the number that matters far more than spot.
    const eff = _swapSide === 'buy' ? amountIn * LQ_WAD / out : out * LQ_WAD / amountIn;
    const spot = _causePoolCache.spot || 0n;
    const slipPct = spot > 0n ? Number((eff - spot) * 10000n / spot) / 100 : null;
    // Route to whichever venue actually pays more for this trade.

    const outTxt = _swapSide === 'buy'
      ? `<span style="display:inline-flex;align-items:center;gap:4px">${_causeGlyph}${fmtTokenAmount(out.toString())} ${sym}</span>`
      : `${ethAmount(fmtNum(Number(ethers.formatEther(out))), 13)} ETH`;
    // Below a quarter the number is just how a curve works and saying it every time trains
    // people to ignore it. Above, it is the trade eating the band and worth interrupting for.
    const heavy = !_swapQuote.book && slipPct !== null && Math.abs(slipPct) >= 25;
    el.innerHTML = `<span>${fmtPriceWei(_swapQuote.eff)} per ${causeUnitOne()}</span>`
      + (_swapQuote.book
          ? `<div style="color:var(--fg-dim);margin-top:3px">Filling a resting order \u2014 a fixed price, so no slippage and nothing moves.</div>`
          : '')
      + (heavy ? `<div style="color:var(--red);margin-top:3px">This trade moves the price ${slipPct > 0 ? '+' : ''}${slipPct.toFixed(0)}% on its own \u2014 the band is thin at this size.</div>` : '')
      + `<div style="color:var(--fg-dim);margin-top:3px">Reverts rather than filling worse than ${_causeSlipPct}%.</div>`;
  } catch {
    if (my !== _swapSeq) return;
    el.textContent = 'Could not quote that.'; if (btn) btn.disabled = true;
  }
}

async function causeSwapGo() {
  const status = $('causeSwapStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  // Connect first: the button says "Connect wallet" when there is no signer, and it has
  // to honour that even with the amount box empty, which is exactly when someone presses it.
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  if (!_causePoolCache) return;
  if (!_swapQuote) { causeSwapSide(_swapSide); return; }
  if (_swapQuote.book) { await causeBookFill(String(_swapQuote.book.id)); return; }
  const { pool, out, amountIn, tokenIn, portion, zap } = _swapQuote;
  const shares = _causePoolCache.shares;
  const tokenOut = tokenIn === ZERO ? shares : ZERO;
  const minOut = out - (out * causeSlipBps()) / 10000n;
  try {
    const me = await sgn.getAddress();
    // Never hand tokens to an address the factory does not vouch for.
    const okPool = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_ISPOOL + _a(pool) }));
    if (!okPool || _dec1(okPool, 0) !== 1n) { say('That address is not a Precision pool \u2014 refusing to send.', 'var(--red)'); return; }
    const routeData = zap
      ? SEL_ZAPIN + _a(pool) + _a(tokenIn) + _w(amountIn) + _w(portion) + _w(minOut) + _a(me) + _a(me)
      : _encPRoute([pool], tokenIn, tokenOut, amountIn, minOut, me);
    const routed = _encSnwap(tokenIn, amountIn, me, zap ? pool : tokenOut, minOut, PROUTE, routeData);

    let data, value;
    if (tokenIn === ZERO) {
      // Native in: the router is funded by the call itself, so one leg and no approval.
      data = routed; value = amountIn;
    } else {
      // Token in: the router pulls, so it needs an allowance, and the checkpoint binds
      // the pull to this exact route so a funded router cannot be spent by another one.
      const token = new ethers.Contract(shares, ERC20_ABI, sgn);
      if ((await token.allowance(me, ZROUTER)) < amountIn) {
        say(`Approving ${causeUnit()}\u2026`);
        await (await token.approve(ZROUTER, ethers.MaxUint256)).wait();
      }
      const checkpoint = _encSnwap(ZERO, 0n, me, ZERO, 0n, PROUTE,
        SEL_PCHECKPOINT + _a(shares) + ethers.keccak256('0x' + routeData.replace(/^0x/, '')).slice(2) + _a(me));
      data = ROUTER_IFACE.encodeFunctionData('multicall', [['0x' + checkpoint.replace(/^0x/, ''), '0x' + routed.replace(/^0x/, '')]]);
      value = 0n;
    }
    say('Confirm in your wallet\u2026');
    const tx = await sgn.sendTransaction({ to: ZROUTER, data: data.startsWith('0x') ? data : '0x' + data, value });
    say(`Swapping\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Done.', 'var(--green)');
    const inp = $('causeSwapAmt'); if (inp) inp.value = '';
    _swapQuote = null;
    await loadCausePool($('app')?.dataset.dao, shares, _renderGen, true).catch(() => {});
    loadBalances?.();
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}

// ---------------------------------------------------------------- order book
// A band prices every trade against its own depth, which is why this coin went 333 gwei
// to 280,287 and back inside a day. A resting order does not: a maker posts a price and
// a holder either takes it or does not, and nothing moves in between. For a coin this
// thin that is the difference between distributing and being volatile at.
//
// Swapboard already abstracts WETH on both sides — fillOrderWithEth when you pay, and
// fillOrderUnwrap when you are paid — so nobody here ever holds or approves WETH.
const SWAPBOARD = '0x000000fF3D7A2d373615141d7489Ca66683DbecF';
const SWAPBOARD_PF = '0x00000000CC3915a0f5F98CBdC558Ac1a8e85B831';
const SWAPBOARD_VIEW = '0x51B33f0dd2680ba3f8C1cF30C33aeD8BFca1DF38';
const BOARD_WETH = '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2';
const BOARD_VIEW_ABI = ['function getAllActiveOrders(address boardV1, address boardV2) view returns (tuple(uint256 orderId, address maker, bool partialFill, address tokenA, uint256 amountA, string symbolA, uint8 decimalsA, address tokenB, uint256 amountB, string symbolB, uint8 decimalsB, address board)[])'];
const BOARD_ABI = [
  'function fillOrder(uint256 orderId, uint256 deadline)',
  'function fillOrderWithEth(uint256 orderId, uint256 deadline) payable',
  'function fillOrderUnwrap(uint256 orderId, uint256 deadline)',
];
const BOARD_PF_ABI = [
  'function fillOrder(uint256 orderId, uint256 deadline, uint256 fillAmountB)',
  'function fillOrderWithEth(uint256 orderId, uint256 deadline) payable',
  'function fillOrderUnwrap(uint256 orderId, uint256 deadline, uint256 fillAmountB)',
  // Orders are posted on the partial-fill board so a thin coin's large order can be
  // taken in pieces. An all-or-nothing bid for 20,000 shares is a bid almost nobody
  // holds enough to fill.
  'function createOrder(address tokenA, uint256 amountA, address tokenB, uint256 amountB, bool partialFill) returns (uint256)',
  'function createOrderWithEth(address tokenB, uint256 amountB, bool partialFill) payable returns (uint256)',
];

let _orderSide = 'bid';

function causeOrderToggle() {
  const f = $('causeOrderForm');
  if (!f) return;
  const open = f.style.display === 'none';
  f.style.display = open ? '' : 'none';
  const b = $('causeOrderOpen');
  if (b) b.textContent = open ? 'cancel' : '+ post';
  if (open) causeOrderSide(_orderSide);
}

function causeOrderSide(side) {
  _orderSide = side;
  for (const t of ['bid', 'ask']) {
    const b = $('causeOrderTab_' + t);
    if (b) {
      b.style.color = t === side ? 'var(--fg)' : 'var(--fg-dim)';
      b.style.borderBottomColor = t === side ? 'var(--fg)' : 'transparent';
    }
  }
  const go = $('causeOrderGo');
  if (go) go.textContent = !_connectedAddress ? 'Connect wallet'
    : (side === 'bid' ? 'Post bid' : 'Post ask');
  causeOrderQuote();
}

// A limit order is a price and a size; the ETH leg follows from them. Asking for the ETH
// leg directly is how you get orders priced by accident.
function causeOrderQuote() {
  const el = $('causeOrderQuote');
  if (!el) return;
  const sh = parseFloat(($('causeOrderShares')?.value || '').trim() || '0');
  const gw = parseFloat(($('causeOrderPrice')?.value || '').trim() || '0');
  const go = $('causeOrderGo');
  if (!sh || !gw || sh <= 0 || gw <= 0) {
    el.textContent = `How much ${causeUnit()}, and at what price each`;
    if (go) go.disabled = !!_connectedAddress;
    return;
  }
  let ethWei;
  try { ethWei = ethers.parseEther(String(sh)) * BigInt(Math.round(gw * 1e9)) / LQ_WAD; }
  catch { el.textContent = 'Enter a valid amount'; return; }
  if (ethWei <= 0n) { el.textContent = 'Too small to price'; if (go) go.disabled = true; return; }
  if (go) go.disabled = false;
  const floor = BigInt($('app')?.dataset.floor || '0');
  const sym = escText(($('app')?.dataset.sym) || 'shares');
  el.innerHTML = _orderSide === 'bid'
    ? `You lock ${fmtNum(Number(ethers.formatEther(ethWei)))} ETH and receive up to ${fmtTokenAmount(ethers.parseEther(String(sh)).toString())} ${sym} if filled.`
    : `You lock ${fmtTokenAmount(ethers.parseEther(String(sh)).toString())} ${sym} and receive up to ${fmtNum(Number(ethers.formatEther(ethWei)))} ETH if filled.`;
  if (floor > 0n && BigInt(Math.round(gw * 1e9)) < floor) {
    el.innerHTML += `<div style="color:var(--red);margin-top:3px">Below the ${causeGwei(floor)} redemption price. A holder does better burning the ${causeUnit()} than filling this.</div>`;
  }
}

async function causeOrderPost() {
  const st = $('causeBookStatus');
  const say = (m, c) => { if (st) st.innerHTML = m ? `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>` : ''; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const sh = parseFloat(($('causeOrderShares')?.value || '').trim() || '0');
  const gw = parseFloat(($('causeOrderPrice')?.value || '').trim() || '0');
  if (!sh || !gw || sh <= 0 || gw <= 0) { say('Enter a size and a price.'); return; }
  const shares = _causePoolCache?.shares || $('app')?.dataset.shares;
  if (!shares) return;
  try {
    const me = await sgn.getAddress();
    const shWei = ethers.parseEther(String(sh));
    const ethWei = shWei * BigInt(Math.round(gw * 1e9)) / LQ_WAD;
    const board = new ethers.Contract(SWAPBOARD_PF, BOARD_PF_ABI, sgn);
    let tx;
    if (_orderSide === 'bid') {
      // Paying ETH: the board wraps it, so the maker never handles WETH either.
      say('Confirm in your wallet\u2026');
      tx = await board.createOrderWithEth(shares, shWei, true, { value: ethWei });
    } else {
      const token = new ethers.Contract(shares, ERC20_ABI, sgn);
      if ((await token.allowance(me, SWAPBOARD_PF)) < shWei) {
        say(`Approving ${causeUnit()}\u2026`);
        await (await token.approve(SWAPBOARD_PF, ethers.MaxUint256)).wait();
      }
      say('Confirm in your wallet\u2026');
      tx = await board.createOrder(shares, shWei, BOARD_WETH, ethWei, true);
    }
    say(`Posting\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Posted.', 'var(--green)');
    await loadCausePool($('app')?.dataset.dao, shares, _renderGen, true).catch(() => {});
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}

let _causeBook = [];

// Every resting order on either board where one side is this coin and the other is ETH.
// A bid offers ETH and wants the coin, so a holder fills it to sell; an ask is the reverse.
async function causeBookLoad(sharesAddr) {
  const isEth = a => a.toLowerCase() === BOARD_WETH.toLowerCase() || a === ZERO;
  const isCoin = a => a.toLowerCase() === sharesAddr.toLowerCase();
  let all;
  try {
    all = await withRPCOnce('board:all', rpc =>
      new ethers.Contract(SWAPBOARD_VIEW, BOARD_VIEW_ABI, rpc).getAllActiveOrders(SWAPBOARD, SWAPBOARD_PF), 15000);
  } catch { return []; }
  const out = [];
  for (const o of all) {
    const bid = isEth(o.tokenA) && isCoin(o.tokenB);
    const ask = isCoin(o.tokenA) && isEth(o.tokenB);
    if (!bid && !ask) continue;
    const ethAmt = bid ? o.amountA : o.amountB;
    const coinAmt = bid ? o.amountB : o.amountA;
    if (coinAmt === 0n) continue;
    out.push({
      id: o.orderId, board: o.board, partial: o.partialFill, maker: o.maker,
      bid, ethAmt, coinAmt,
      // What one whole share costs in this order, which is the only number worth sorting on.
      price: ethAmt * LQ_WAD / coinAmt,
    });
  }
  // Best first from the filler's point of view: highest bid, cheapest ask.
  out.sort((a, b) => (a.bid === b.bid) ? (a.bid ? (b.price > a.price ? 1 : -1) : (a.price > b.price ? 1 : -1)) : (a.bid ? -1 : 1));
  return out;
}

// Where these orders actually live. An order book with no venue named reads as the page's
// own list; it is Swapboard's, and escrowed there rather than here.
function causeBoardLink(addr) {
  const a = addr || SWAPBOARD_PF;
  const known = a.toLowerCase() === SWAPBOARD_PF.toLowerCase() ? 'Swapboard'
    : a.toLowerCase() === SWAPBOARD.toLowerCase() ? 'Swapboard' : 'board';
  return `<a href="https://etherscan.io/address/${escAttr(a)}" target="_blank" rel="noopener"
    style="color:inherit;text-decoration:underline">${known}</a>`;
}

function causeBookHTML(orders, sym) {
  if (!orders.length) {
    return `<div style="font-size:10px;color:var(--fg-dim);line-height:1.6">
      No resting orders on ${causeBoardLink(SWAPBOARD_PF)}. A limit order names a price and
      waits to be filled, rather than taking whatever the pool quotes at the moment of the
      trade.
    </div>`;
  }
  const spot = _causePoolCache?.spot || 0n;
  // Only half of this comparison can be made honestly from what the page has.
  //
  // `spot` is the pool's MARGINAL price — what an infinitesimal trade gets. A real buy
  // executes at or above it and a real sell at or below it, because size moves the curve.
  // So "cheaper than spot" is a safe verdict: an ask under spot beats the pool at every
  // size. "Dearer than spot" is not, because it depends on depth the page has not read —
  // and CELL is the case that shows why, with three asks for 50K–100K against a pool
  // holding ~13.9K. The pool is not the better venue there; it cannot serve that size at
  // all. Calling those orders "85% worse" was a verdict drawn from a number that knows
  // nothing about size.
  //
  // So: name the winner where the arithmetic proves one, and otherwise state the distance
  // from spot as the fact it is, without dimming an order the pool may be unable to beat.
  const beatsPool = o => spot > 0n && (o.bid ? o.price > spot : o.price < spot);
  // The other half of the comparison, from reserves rather than price: an order the pool
  // cannot fill is not one the pool is beating.
  //
  // Only an all-or-nothing order can be beyond reach that way. A partial-fill order states
  // a MAXIMUM, not a requirement — any slice up to its size can be taken — so the pool
  // competes for every amount it has depth for, and there the price decides. CELL's three
  // asks are all partial fill: 50K–100K listed against an 11,778 reserve, but a buyer who
  // wants 5K can take 5K from either side, and the pool is at 540 gwei against their 1,000.
  const coinRes = _causePoolCache?.coinRes || 0n;
  const ethRes = _causePoolCache?.ethRes || 0n;
  const outsizesPool = o => !o.partial && (o.bid
    ? (ethRes > 0n && o.ethAmt > ethRes)
    : (coinRes > 0n && o.coinAmt > coinRes));
  const anyGood = orders.some(beatsPool);
  const row = o => {
    const vs = spot > 0n ? Number((o.price - spot) * 10000n / spot) / 100 : null;
    const good = beatsPool(o);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-muted);font-size:11px">
      <span style="width:34px;color:${o.bid ? 'var(--green)' : 'var(--red)'};font-weight:600">${o.bid ? 'BID' : 'ASK'}</span>
      <span style="flex:1;color:var(--fg)">${causeGwei(o.price)}</span>
      <span style="flex:1;color:var(--fg-muted)">${fmtTokenAmount(o.coinAmt.toString())} ${escText(sym)}</span>
      <span style="flex:1;color:var(--fg-dim)">${fmtNum(Number(ethers.formatEther(o.ethAmt)))} ETH</span>
      ${vs !== null ? `<span style="width:96px;text-align:right;color:${good ? 'var(--green)' : outsizesPool(o) ? 'var(--fg-muted)' : 'var(--fg-dim)'}"
        title="${good
          ? 'Better than the pool at any size — a pool buy fills at or above spot, a pool sell at or below it'
          : outsizesPool(o)
          ? 'Larger than the pool\u2019s whole reserve on that side, so the pool cannot fill this at any price'
          : 'Against the pool\u2019s marginal price. Whether the pool beats this at this size depends on how far the trade walks the band.'}">${
          good ? `beats pool ${Math.abs(vs).toFixed(0)}%`
          : outsizesPool(o) ? 'beyond pool depth'
          : `${vs > 0 ? '+' : ''}${vs.toFixed(0)}% vs spot`}</span>` : ''}
      <button class="swap-btn" style="font-size:10px;padding:4px 10px;white-space:nowrap${good ? '' : ';background:transparent;color:var(--fg-muted);border:1px solid var(--border-muted)'}"
        onclick="causeBookFill('${o.id}')">${o.bid ? 'Sell into' : 'Buy'}</button>
    </div>`;
  };
  const allBeyond = spot > 0n && orders.length > 0 && orders.every(outsizesPool);
  // Sizes the pool can serve at all — the ceiling under which its price is the one to beat.
  const depthTxt = coinRes > 0n ? fmtTokenAmount(coinRes.toString()) : '';
  const note = allBeyond
    ? `<div style="font-size:10px;color:var(--fg-dim);margin-top:6px;line-height:1.5">
        Every order here is larger than the pool&rsquo;s reserve on that side. The pool cannot
        fill these at any price, so the comparison is not one the swap above can win.
      </div>`
    : (spot > 0n && !anyGood)
    ? `<div style="font-size:10px;color:var(--fg-dim);margin-top:6px;line-height:1.5">
        Nothing here is under the pool&rsquo;s spot price${depthTxt ? `, and the pool has
        ${depthTxt} ${escText(sym)} to sell` : ''}. Up to that, the swap above fills better;
        past it these are the only offers there are. A partial-fill order can be taken for
        any slice, so its size is a ceiling rather than a commitment.
      </div>`
    : '';
  // One line naming the venue, and the escrow fact that goes with it: the maker's tokens
  // are held by the board, so a fill settles against it rather than against a promise.
  const boards = [...new Set(orders.map(o => (o.board || SWAPBOARD_PF).toLowerCase()))];
  const venue = `<div style="font-size:10px;color:var(--fg-dim);margin-top:6px;line-height:1.5">
    Resting on ${boards.map(b => causeBoardLink(b)).join(' and ')}, which escrows the maker&rsquo;s
    ${escText(sym)} until a fill or a cancel.
  </div>`;
  return `<div>${orders.map(row).join('')}</div>${note}${venue}`;
}

async function causeBookFill(idStr) {
  const st = $('causeBookStatus');
  const say = (m, c) => { if (st) st.innerHTML = m ? `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>` : ''; };
  const o = _causeBook.find(x => String(x.id) === String(idStr));
  if (!o) return;
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  try {
    const me = await sgn.getAddress();
    const deadline = BigInt(Math.floor(Date.now() / 1000) + 300);
    const pf = o.board.toLowerCase() === SWAPBOARD_PF.toLowerCase();
    const board = new ethers.Contract(o.board, pf ? BOARD_PF_ABI : BOARD_ABI, sgn);
    let tx;
    if (o.bid) {
      // Filling a bid means handing over the coin and being paid in ETH: approve the
      // coin, then take the unwrap variant so no WETH ever reaches the wallet.
      const token = new ethers.Contract(_causePoolCache.shares, ERC20_ABI, sgn);
      if ((await token.allowance(me, o.board)) < o.coinAmt) {
        say(`Approving ${causeUnit()}\u2026`);
        await (await token.approve(o.board, ethers.MaxUint256)).wait();
      }
      say('Confirm in your wallet\u2026');
      tx = pf ? await board.fillOrderUnwrap(o.id, deadline, o.coinAmt)
              : await board.fillOrderUnwrap(o.id, deadline);
    } else {
      // Filling an ask means paying ETH for the coin; the board wraps it for us.
      say('Confirm in your wallet\u2026');
      tx = await board.fillOrderWithEth(o.id, deadline, { value: o.ethAmt });
    }
    say(`Filling\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Filled.', 'var(--green)');
    await loadCausePool($('app')?.dataset.dao, _causePoolCache.shares, _renderGen, true).catch(() => {});
    loadBalances?.();
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}

async function loadCausePool(daoAddr, sharesAddr, gen, knownHasPool) {
  const el = $('causePool');
  if (!el) return;
  const ds = $('app')?.dataset || {};
  const treasury = BigInt(ds.treasury || '0');
  const supply = BigInt(ds.sharesSupply || '0') + BigInt(ds.lootSupply || '0');
  if (supply <= 0n) return;
  const floor = treasury * LQ_WAD / supply;
  // The price buyers actually paid is the honest opening mark: seeding under it sells
  // the pool cheaper than the sale did, seeding over it marks your own book up.
  const salePx = BigInt(ds.price || '0');
  const held = BigInt(ds.userBalance || '0');
  const sym = escText(ds.sym || 'shares');
  $('app').dataset.floor = floor.toString();

  // pairCount answers "is there any pool at all" in one call, which is all the empty
  // state needs. The lens below answers what and where, and only runs once there is one.
  const [t0, t1] = causeSortedPair(sharesAddr);
  let pairPools = 0;
  try {
    const res = await withRPC(rpc => rpc.call({ to: PFACTORY, data: SEL_PAIR_COUNT + _a(t0) + _a(t1) }));
    pairPools = Number(BigInt(res || '0x0'));
  } catch {}
  if (gen !== _renderGen || !el.isConnected) return;
  // A caller who just watched the create confirm knows better than a lagging read. Without
  // this the panel repaints the seed form over a pool that exists, inviting a second one.
  const has = pairPools > 0 || !!knownHasPool;

  // Reserves, bounds and the tape all come from the pool itself once one exists.
  let pool = null, spot = 0n, spark = '';
  if (has) {
    const pools = await causePools(sharesAddr);
    if (gen !== _renderGen || !el.isConnected) return;
    pool = pools[0] || null;
    if (pool) {
      spot = causeSpotPrice(pool, sharesAddr);
      // price is the deposit ratio and spot is the marginal price; the LP form needs the
      // former or the pool refunds the difference, the quote needs the latter.
      // PI_LIQ is the band's LP supply: it matched the pool's own totalSupply exactly
      // on the live pool, which is what makes a "share of the band" figure honest.
      // Reserves come back in the same lens read and used to be dropped here, which left
      // the book with a price and no way to know whether the pool could serve a size.
      const [pt0] = causeSortedPair(sharesAddr);
      _causePoolCache = { pool: pool.pool, shares: sharesAddr,
                          price: causePoolPrice(pool, sharesAddr), spot, lpSupply: pool.liq,
                          ethRes: pt0 === ZERO ? pool.r0 : pool.r1,
                          coinRes: pt0 === ZERO ? pool.r1 : pool.r0 };
      const bars = await causeTape(pool.pool, t0 === ZERO);
      if (gen !== _renderGen || !el.isConnected) return;
      spark = causeChart(bars, floor, salePx, spot);
      _causeBook = await causeBookLoad(sharesAddr);
      if (gen !== _renderGen || !el.isConnected) return;
    }
  }

// The ratio is the whole decision, and it is the one part a person cannot do in their
// head: 15,000 shares at 333 gwei is 0.004995 ETH, which nobody guesses. So typing one
// side fills the other at the sale price, and typing over that fill takes control back.
let _poolEthTouched = false;

function causePoolFill(weiAmt) {
  const box = $('causePoolShares');
  if (!box) return;
  box.value = ethers.formatEther(BigInt(weiAmt)).replace(/\.0$/, '');
  _poolEthTouched = false;   // a balance shortcut is a fresh start, so re-pair the ETH side
  causePoolQuote('shares');
}

function causePoolQuote(src) {
  const el = $('causePoolQuote');
  if (!el) return;
  if (src === 'eth') _poolEthTouched = true;

  const salePx = BigInt($('app')?.dataset.price || '0');
  const floor = BigInt($('app')?.dataset.floor || '0');
  const shBox = $('causePoolEth') && $('causePoolShares');

  // Typing shares prices them at the sale price, unless the ETH side is being driven by hand.
  if (src === 'shares' && !_poolEthTouched && salePx > 0n && shBox) {
    const raw = $('causePoolShares').value.trim();
    let paired = '';
    if (raw) { try { paired = ethers.formatEther(ethers.parseEther(raw) * salePx / LQ_WAD); } catch {} }
    $('causePoolEth').value = paired;
  }

  const e = parseFloat($('causePoolEth')?.value || '0');
  const sh = parseFloat($('causePoolShares')?.value || '0');
  if (!e || !sh || e <= 0 || sh <= 0) {
    el.innerHTML = salePx > 0n
      ? `Enter ${causeUnit()} &mdash; the ETH side fills at the sale price, and the ratio sets the opening price`
      : 'Enter both sides &mdash; the ratio sets the opening price';
    return;
  }
  let px;
  try { px = ethers.parseEther(String(e)) * LQ_WAD / ethers.parseEther(String(sh)); }
  catch { el.textContent = 'Enter a valid amount'; return; }

  let html = `Opening price ${fmtPriceWei(px)} per ${causeUnitOne()}, 0.3% fee, full range.`;
  if (salePx > 0n && px !== salePx) {
    const d = Number((px - salePx) * 10000n / salePx) / 100;
    html += ` ${d > 0 ? '+' : ''}${d.toFixed(1)}% vs the sale.`;
  }
  if (floor > 0n && px < floor) {
    html += `<div style="color:var(--red);margin-top:4px">Below the ${fmtPriceWei(floor)} redemption price &mdash; this band can be bought out and redeemed for the difference.</div>`;
  }
  el.innerHTML = html;
}


// The panel reads pair counts from the public RPCs in withRPC, but a create is confirmed
// on the wallet's own node, and those are not the same machine. Re-reading the instant
// tx.wait() resolves finds pairCount still 0 on a lagging node and repaints the seed form
// over a pool that already exists. So ask the node that mined it — it cannot be behind
// itself — and give the read path a few seconds to agree before painting.
async function causeAwaitPool(sharesAddr, sgn) {
  const [t0, t1] = causeSortedPair(sharesAddr);
  const data = SEL_PAIR_COUNT + _a(t0) + _a(t1);
  const count = async caller => {
    try { return Number(BigInt(await caller({ to: PFACTORY, data }) || '0x0')); } catch { return 0; }
  };
  // The mining node is authoritative and answers immediately.
  if (sgn?.provider && await count(c => sgn.provider.call(c)) > 0) {
    // Then let the public side catch up, so the repaint reads a pool rather than a gap.
    for (let i = 0; i < 8; i++) {
      if (await count(c => withRPC(rpc => rpc.call(c))) > 0) return true;
      await new Promise(r => setTimeout(r, 1500));
    }
    return true;   // it exists; the panel will settle on the next 30s tick regardless
  }
  return false;
}

async function causeCreatePool(sharesAddr) {
  const status = $('causePoolStatus');
  const say = (m, c) => { if (status) status.innerHTML = `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>`; };
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const e = parseFloat($('causePoolEth')?.value || '0');
  const sh = parseFloat($('causePoolShares')?.value || '0');
  if (!e || !sh || e <= 0 || sh <= 0) { say('Enter both sides.'); return; }
  try {
    const me = await sgn.getAddress();
    const ethAmt = ethers.parseEther(String(e));
    const shAmt = ethers.parseEther(String(sh));

    const token = new ethers.Contract(sharesAddr, ERC20_ABI, sgn);
    if ((await token.allowance(me, PFACTORY)) < shAmt) {
      say(`Approving ${causeUnit()}\u2026`);
      await (await token.approve(PFACTORY, ethers.MaxUint256)).wait();
    }

    say('Finding the widest band the factory accepts\u2026');
    const band = await causeBand(sharesAddr, ethAmt, shAmt, me);
    if (!band) { say('The factory refuses these amounts at every width. Try a different ratio or more of each side.', 'var(--red)'); return; }

    say(`Confirm in your wallet \u2014 0.3% fee, ${band.mult}\u00d7 either side of ${fmtPriceWei(ethers.parseEther(String(e)) * LQ_WAD / ethers.parseEther(String(sh)))}.`);
    const tx = await sgn.sendTransaction({ to: PFACTORY, data: band.data, value: ethAmt });
    say(`Creating the pool\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Pool created \u2014 loading the market\u2026', 'var(--green)');
    const confirmed = await causeAwaitPool(sharesAddr, sgn);
    await loadCausePool($('app')?.dataset.dao, sharesAddr, _renderGen, confirmed).catch(() => {});
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) { say(''); return; }
    say(escText(err.shortMessage || err.message || 'Failed.'), 'var(--red)');
  }
}

// button stands down rather than inventing one.
function causeSetBuyMax() {

function causeSetBuyEth(amt) {

function _causeEthToShares(ethWei, price) {
  // shares = floor(ethWei * 1e18 / price)
  if (price <= 0n) return 0n;
  return ethWei * ethers.parseEther('1') / price;
}

function _causeSharesToCost(shares, price) {
  // Round up to match contract: cost = (shares * price + 1e18 - 1) / 1e18
  return (shares * price + ethers.parseEther('1') - 1n) / ethers.parseEther('1');
}

// What a buyer needs before signing is not just "cost: 0.3330 ETH". It is how much
// of the DAO that buys, what it is worth if they walk away immediately, and whether
// the sale can even mint it. The contract enforces the last one by reverting; the
// form should say so first.
function causeUpdateBuyQuote() {
  const el = $('causeBuyQuote');
  if (!el) return;
  const ds = $('app')?.dataset || {};
  const amt = parseFloat($('causeBuyAmount')?.value || '0');
  if (!amt || amt <= 0) { el.textContent = 'Enter amount to see quote'; return; }
  if (!ds.price) { el.textContent = 'Sale data not loaded'; return; }

  const price = BigInt(ds.price);
  const E = ethers.parseEther('1');
  let shares;
  try {
    shares = _causeBuyMode === 'eth'
      ? _causeEthToShares(ethers.parseEther(String(amt)), price)
      : ethers.parseEther(String(amt));
  } catch { el.textContent = 'Enter a valid amount'; return; }
  if (shares <= 0n || Number(ethers.formatEther(shares)) < 1) { el.textContent = 'Amount too small'; return; }

  // Clamp to what the sale can still mint. 0 means open-ended, so no ceiling.
  const remaining = BigInt(ds.saleRemaining || '0');
  let capped = false;
  if (remaining > 0n && shares > remaining) { shares = remaining; capped = true; }

  const cost = _causeSharesToCost(shares, price);
  const sharesFmt = Number(ethers.formatEther(shares)).toLocaleString(undefined, { maximumFractionDigits: 0 });
  const unit = ds.unit || 'shares';

  // Ownership and redemption share the same denominator the DAO uses for ragequit:
  // shares + loot, after this purchase mints.
  const supplyAfter = BigInt(ds.sharesSupply || ds.totalSupply || '0') + BigInt(ds.lootSupply || '0') + shares;
  const ownPct = supplyAfter > 0n ? Number(shares * 1000000n / supplyAfter) / 10000 : 0;
  const treasury = BigInt(ds.treasury || '0');
  const redeem = supplyAfter > 0n ? (treasury + cost) * shares / supplyAfter : 0n;
  const redeemEth = Number(ethers.formatEther(redeem));

  const rows = [
    `<div style="display:flex;justify-content:space-between;gap:8px">
       <span style="color:var(--fg)"><b style="font-weight:600">${sharesFmt}</b> ${unit}</span>
       <span style="color:var(--fg);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px">${ethGlyph(12)}<b style="font-weight:600">${fmtNum(Number(ethers.formatEther(cost)))}</b> ETH</span>
     </div>`,
    `<div style="color:var(--fg-dim);margin-top:3px">${ownPct >= 0.01 ? ownPct.toFixed(2) : '<0.01'}% of the DAO after this buy</div>`
  ];
  if (treasury >= 0n && redeem > 0n) {
    rows.push(`<div style="color:var(--fg-dim);margin-top:2px">redeemable now for ~${fmtNum(redeemEth)} ETH &middot; falls as the tap draws</div>`);

  }
  if (capped) {
    rows.push(`<div style="color:var(--red);margin-top:3px">only ${sharesFmt} ${unit} left in the sale &mdash; reduced to fit</div>`);
  }
  el.innerHTML = rows.join('');
}

async function causeBuy(daoAddr) {
  if (!_signer) { if (typeof connectWallet === 'function') connectWallet(); return; }
  const amtStr = ($('causeBuyAmount')?.value || '').trim();
  if (!amtStr || isNaN(amtStr) || Number(amtStr) <= 0) {
    $('causeTradeStatus').innerHTML = '<div style="color:var(--red);font-size:12px">Enter a valid amount</div>';
    return;
  }
  const priceStr = $('app')?.dataset.price;
  if (!priceStr) {
    $('causeTradeStatus').innerHTML = `<div style="color:var(--red);font-size:12px">Sale data not loaded <button onclick="renderCoinPage('${escAttr(daoAddr)}')" style="color:var(--fg);background:var(--surface);border:1px solid var(--border-muted);padding:2px 8px;font-size:11px;cursor:pointer;margin-left:4px">Retry</button></div>`;
    return;
  }
  const price = BigInt(priceStr);

  let shareAmt, cost;
  if (_causeBuyMode === 'eth') {
    const ethWei = ethers.parseEther(amtStr);
    shareAmt = _causeEthToShares(ethWei, price);
    if (shareAmt <= 0n) {
      $('causeTradeStatus').innerHTML = `<div style="color:var(--red);font-size:12px">Amount too small for any ${$('app')?.dataset.unit || 'shares'}</div>`;
      return;
    }
    cost = _causeSharesToCost(shareAmt, price);
  } else {
    shareAmt = ethers.parseEther(amtStr);
    cost = _causeSharesToCost(shareAmt, price);
  }

  // Pre-flight balance check
  const statusEl = $('causeTradeStatus');
  try {
    const bal = await _signer.provider.getBalance(await _signer.getAddress());
    if (bal < cost) {
      statusEl.innerHTML = `<div style="font-size:12px;color:var(--red)">Insufficient ETH (need ${fmtNum(Number(ethers.formatEther(cost)))} ETH, have ${fmtNum(Number(ethers.formatEther(bal)))} ETH)</div>`;
      return;
    }
  } catch {}

  statusEl.innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} Confirming...</div>`;
  try {
    // buy() is identical on both singletons; only which one holds this sale differs.
    const ss = new ethers.Contract($('app')?.dataset.saleContract || SHARE_SALE, SHARE_SALE_ABI, _signer);
    const tx = await ss.buy(daoAddr, shareAmt, { value: cost });
    statusEl.innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></div>`;
    await tx.wait();

    statusEl.innerHTML = `<div style="font-size:12px;color:var(--green)">Bought ${Number(ethers.formatEther(shareAmt)).toLocaleString()} ${$('app')?.dataset.unit || 'shares'}! <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">View tx</a></div>`;
    $('causeBuyAmount').value = '';
    setTimeout(() => refreshCauseStats(daoAddr, null), 2000);
  } catch (e) {
    if ((e.message || '').includes('user rejected') || e.code === 'ACTION_REJECTED') {
      $('causeTradeStatus').innerHTML = '<div style="font-size:12px;color:var(--fg-dim)">Cancelled</div>';
    } else {
      const msg = e.shortMessage || e.reason || (e.message || '').split('\n')[0];
      $('causeTradeStatus').innerHTML = `<div style="font-size:12px;color:var(--red)">${escText(msg.length < 100 ? msg : 'Buy failed')}</div>`;
    }
  }
}

/// Cast a vote from the coin page. Weight comes from the snapshot, so this needs no
/// balance read — the contract rejects a zero-weight voter and the message says so.
async function causeVote(daoAddr, idStr, support, btn) {
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  const row = btn?.closest('.prop-vote');
  const restore = row ? row.innerHTML : '';
  const say = (m, c) => { if (row) row.innerHTML = `<span style="font-size:11px;color:${c || 'var(--fg-muted)'}">${m}</span>`; };
  if (row) row.querySelectorAll('button').forEach(b => { b.disabled = true; });
  try {
    say('Confirm in your wallet\u2026');
    const dao = new ethers.Contract(daoAddr, MOLOCH_PROP_ABI, sgn);
    const tx = await dao.castVote(BigInt(idStr), support);
    say(`Voting\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    say('Voted.', 'var(--green)');
    loadCauseGovernance(daoAddr, _renderGen).catch(() => {});
    const drawer = $('proposalsDrawer');
    if (drawer && drawer.classList.contains('open')) loadProposals(daoAddr);
  } catch (e) {
    if (e.code === 'ACTION_REJECTED' || /user rejected/.test(e.message || '')) {
      if (row) row.innerHTML = restore;
      return;
    }
    const msg = e.shortMessage || e.reason || (e.message || '').split('\n')[0] || 'Failed.';
    // Moloch reverts an unweighted voter with Unauthorized, which as raw text tells a
    // holder nothing about why their shares did not count.
    say(/Unauthorized/i.test(msg)
      ? 'No voting weight at this proposal\u2019s snapshot \u2014 shares bought after it opened do not vote on it.'
      : escText(msg.length < 100 ? msg : 'Vote failed.'), 'var(--red)');
  }
}
