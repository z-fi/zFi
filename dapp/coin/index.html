function _causeEthToShares(ethWei, price) {
  // shares = floor(ethWei * 1e18 / price)
  if (price <= 0n) return 0n;
  return ethWei * ethers.parseEther('1') / price;
}

function _causeSharesToCost(shares, price) {
  // Round up to match contract: cost = (shares * price + 1e18 - 1) / 1e18
  return (shares * price + ethers.parseEther('1') - 1n) / ethers.parseEther('1');
}

// What a buyer needs before signing is not just "cost: 0.3330 ETH". It is how much
// of the DAO that buys, what it is worth if they walk away immediately, and whether
// the sale can even mint it. The contract enforces the last one by reverting; the
// form should say so first.
function causeUpdateBuyQuote() {
  const el = $('causeBuyQuote');
  if (!el) return;
  const ds = $('app')?.dataset || {};
  const amt = parseFloat($('causeBuyAmount')?.value || '0');
  if (!amt || amt <= 0) { el.textContent = 'Enter amount to see quote'; return; }
  if (!ds.price) { el.textContent = 'Sale data not loaded'; return; }

  const price = BigInt(ds.price);
  const E = ethers.parseEther('1');
  let shares;
  try {
    shares = _causeBuyMode === 'eth'
      ? _causeEthToShares(ethers.parseEther(String(amt)), price)
      : ethers.parseEther(String(amt));
  } catch { el.textContent = 'Enter a valid amount'; return; }
  if (shares <= 0n || Number(ethers.formatEther(shares)) < 1) { el.textContent = 'Amount too small'; return; }

  // Clamp to what the sale can still mint. 0 means open-ended, so no ceiling.
  const remaining = BigInt(ds.saleRemaining || '0');
  let capped = false;
  if (remaining > 0n && shares > remaining) { shares = remaining; capped = true; }

  const cost = _causeSharesToCost(shares, price);
  const sharesFmt = Number(ethers.formatEther(shares)).toLocaleString(undefined, { maximumFractionDigits: 0 });

  // Ownership and redemption share the same denominator the DAO uses for ragequit:
  // shares + loot, after this purchase mints.
  const supplyAfter = BigInt(ds.sharesSupply || ds.totalSupply || '0') + BigInt(ds.lootSupply || '0') + shares;
  const ownPct = supplyAfter > 0n ? Number(shares * 1000000n / supplyAfter) / 10000 : 0;
  const treasury = BigInt(ds.treasury || '0');
  const redeem = supplyAfter > 0n ? (treasury + cost) * shares / supplyAfter : 0n;
  const redeemEth = Number(ethers.formatEther(redeem));

  const rows = [
    `<div style="display:flex;justify-content:space-between;gap:8px">
       <span style="color:var(--fg)"><b style="font-weight:600">${sharesFmt}</b> shares</span>
       <span style="color:var(--fg);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px">${ethGlyph(12)}<b style="font-weight:600">${fmtNum(Number(ethers.formatEther(cost)))}</b> ETH</span>
     </div>`,
    `<div style="color:var(--fg-dim);margin-top:3px">${ownPct >= 0.01 ? ownPct.toFixed(2) : '<0.01'}% of the DAO after this buy</div>`
  ];
  if (treasury >= 0n && redeem > 0n) {
    rows.push(`<div style="color:var(--fg-dim);margin-top:2px">redeemable now for ~${fmtNum(redeemEth)} ETH &middot; falls as the tap draws</div>`);

  }
  if (capped) {
    rows.push(`<div style="color:var(--red);margin-top:3px">only ${sharesFmt} shares left in the sale &mdash; reduced to fit</div>`);
  }
  el.innerHTML = rows.join('');
}

async function causeBuy(daoAddr) {
  if (!_signer) { if (typeof connectWallet === 'function') connectWallet(); return; }
  const amtStr = ($('causeBuyAmount')?.value || '').trim();
  if (!amtStr || isNaN(amtStr) || Number(amtStr) <= 0) {
    $('causeTradeStatus').innerHTML = '<div style="color:var(--red);font-size:12px">Enter a valid amount</div>';
    return;
  }
  const priceStr = $('app')?.dataset.price;
  if (!priceStr) {
    $('causeTradeStatus').innerHTML = `<div style="color:var(--red);font-size:12px">Sale data not loaded <button onclick="renderCoinPage('${escAttr(daoAddr)}')" style="color:var(--fg);background:var(--surface);border:1px solid var(--border-muted);padding:2px 8px;font-size:11px;cursor:pointer;margin-left:4px">Retry</button></div>`;
    return;
  }
  const price = BigInt(priceStr);

  let shareAmt, cost;
  if (_causeBuyMode === 'eth') {
    const ethWei = ethers.parseEther(amtStr);
    shareAmt = _causeEthToShares(ethWei, price);
    if (shareAmt <= 0n) {
      $('causeTradeStatus').innerHTML = '<div style="color:var(--red);font-size:12px">Amount too small for any shares</div>';
      return;
    }
    cost = _causeSharesToCost(shareAmt, price);
  } else {
    shareAmt = ethers.parseEther(amtStr);
    cost = _causeSharesToCost(shareAmt, price);
  }

  // Pre-flight balance check
  const statusEl = $('causeTradeStatus');
  try {
    const bal = await _signer.provider.getBalance(await _signer.getAddress());
    if (bal < cost) {
      statusEl.innerHTML = `<div style="font-size:12px;color:var(--red)">Insufficient ETH (need ${fmtNum(Number(ethers.formatEther(cost)))} ETH, have ${fmtNum(Number(ethers.formatEther(bal)))} ETH)</div>`;
      return;
    }
  } catch {}

  statusEl.innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} Confirming...</div>`;
  try {
    // buy() is identical on both singletons; only which one holds this sale differs.
    const ss = new ethers.Contract($('app')?.dataset.saleContract || SHARE_SALE, SHARE_SALE_ABI, _signer);
    const tx = await ss.buy(daoAddr, shareAmt, { value: cost });
    statusEl.innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></div>`;
    await tx.wait();

    statusEl.innerHTML = `<div style="font-size:12px;color:var(--green)">Bought ${Number(ethers.formatEther(shareAmt)).toLocaleString()} shares! <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">View tx</a></div>`;
    $('causeBuyAmount').value = '';
    setTimeout(() => refreshCauseStats(daoAddr, null), 2000);
  } catch (e) {
    if ((e.message || '').includes('user rejected') || e.code === 'ACTION_REJECTED') {
      $('causeTradeStatus').innerHTML = '<div style="font-size:12px;color:var(--fg-dim)">Cancelled</div>';
    } else {
      const msg = e.shortMessage || e.reason || (e.message || '').split('\n')[0];
      $('causeTradeStatus').innerHTML = `<div style="font-size:12px;color:var(--red)">${escText(msg.length < 100 ? msg : 'Buy failed')}</div>`;
    }
  }
}

function causeUpdateRqQuote() {
  const el = $('causeRqQuote');
  if (!el) return;
  const raw = ($('causeRqAmount')?.value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) { el.textContent = 'Enter shares to see redemption value'; return; }
  const sharesToBurn = ethers.parseEther(raw);
  const treasury = BigInt($('app')?.dataset.treasury || '0');
  const totalSupply = BigInt($('app')?.dataset.totalSupply || '0');
  if (treasury <= 0n || totalSupply <= 0n) { el.textContent = ''; return; }
  const ethBack = sharesToBurn * treasury / totalSupply;
  el.innerHTML = `&asymp; ${Number(ethers.formatEther(ethBack)).toFixed(4)} ETH back <span style="color:var(--fg-dim)">(pro-rata of ${Number(ethers.formatEther(treasury)).toFixed(4)} ETH treasury)</span>`;
}

async function causeRagequit(daoAddr) {
  if (!_signer) { if (typeof connectWallet === 'function') connectWallet(); return; }
  const raw = ($('causeRqAmount')?.value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    $('causeRqStatus').innerHTML = '<div style="font-size:12px;color:var(--red)">Enter shares to burn</div>';
    return;
  }
  const sharesToBurn = ethers.parseEther(raw);
  const rqQuoteText = $('causeRqQuote')?.textContent || '';
  if (!confirm(`Redeem ${raw} shares? This will permanently burn them.${rqQuoteText ? '\n' + rqQuoteText : ''}`)) return;
  const statusEl = $('causeRqStatus');
  statusEl.innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} Confirming...</div>`;
  try {
    const dao = new ethers.Contract(daoAddr, RAGEQUIT_ABI, _signer);
    const tx = await dao.ragequit([ZERO], sharesToBurn, 0);
    statusEl.innerHTML = `<div style="font-size:12px">${zfiLoadingSVG(14)} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></div>`;
    await tx.wait();

    statusEl.innerHTML = `<div style="font-size:12px;color:var(--green)">Redeemed! <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">View tx</a></div>`;
    $('causeRqAmount').value = '';
    const rqQuote = $('causeRqQuote'); if (rqQuote) rqQuote.textContent = '';
    setTimeout(() => renderCoinPage(daoAddr), 3000);
  } catch (e) {
    if ((e.message || '').includes('user rejected') || e.code === 'ACTION_REJECTED') {
      statusEl.innerHTML = '<div style="font-size:12px;color:var(--fg-dim)">Cancelled</div>';
    } else {
      const msg = e.shortMessage || e.reason || (e.message || '').split('\n')[0];
      statusEl.innerHTML = `<div style="font-size:12px;color:var(--red)">${escText(msg.length < 100 ? msg : 'Ragequit failed')}</div>`;
    }
  }
}

// ==================== DAICO COIN PAGE ====================
async function renderCoinPage(daoAddr) {
  if (_causeRefreshTimer) { clearInterval(_causeRefreshTimer); _causeRefreshTimer = null; }
  if (_saleRefreshInterval) { clearInterval(_saleRefreshInterval); _saleRefreshInterval = null; }
  if (_saleCountdownInterval) { clearInterval(_saleCountdownInterval); _saleCountdownInterval = null; }
  if (_vaultRefreshTimer) { clearInterval(_vaultRefreshTimer); _vaultRefreshTimer = null; }
  _pollers.clear();
  const gen = ++_renderGen;
  // Invalidate any in-flight curve/zamm quote so its async callback can't write into a
  // freshly-rendered detail page. renderCurveCoinPage bumps these on its own, but if we
  // route to a DAICO detail instead, that path never touches them and a mid-await curve
  // quote would null-deref on $('curveBuyDetPrice') etc.
  if (_curveQuoteTimer) { clearTimeout(_curveQuoteTimer); _curveQuoteTimer = null; }
  if (_curveZammQuoteTimer) { clearTimeout(_curveZammQuoteTimer); _curveZammQuoteTimer = null; }
  if (_curveSniperTimer) { clearInterval(_curveSniperTimer); _curveSniperTimer = null; }
  ++_curveQuoteGen;
  ++_curveZammQuoteGen;
  const app = $('app');
  app.innerHTML = `
    <a href="#" class="back-link">&larr; All Coins</a>
    <div class="loading">${zfiLoadingSVG(48)}Loading coin data...</div>
  `;

  // Try ClassicalCurveSale and DAICO path in parallel — use whichever matches
  try {
    const curveIface = new ethers.Interface(CURVE_SALE_ABI);
    const daicoIface = new ethers.Interface(GET_DAICO_ABI);
    const routeRes = await mcAggregate([
      { target: CURVE_SALE, allowFailure: true, callData: curveIface.encodeFunctionData('curves', [daoAddr]) },
      { target: VIEW_HELPER, allowFailure: true, callData: daicoIface.encodeFunctionData('getDAICO', [daoAddr, [ZERO]]) },
    ]).catch(() => []);
    const curveDecoded = mcDecode(routeRes[0], curveIface, 'curves', null);
    const curveData = (curveDecoded && curveDecoded.creator && curveDecoded.creator !== ZERO) ? curveDecoded : null;
    const daicoData = mcDecode(routeRes[1], daicoIface, 'getDAICO', null)?.[0] ?? null;
    if (gen !== _renderGen) return;

    if (curveData) {
      // Return the promise so callers (e.g. curveBuy/curveSell) that `await renderCoinPage(...)`
      // actually wait for the new panel to be on screen before releasing _curveTrading.
      return renderCurveCoinPage(daoAddr, curveData, gen);
    }

    const data = daicoData;
    if (!data) throw new Error('Coin not found');
    if (gen !== _renderGen) return;
    _coinData = data;
    _saleExactOut = false;
    _cachedQuote = null;

    const sale = data.sales && data.sales.length > 0 ? data.sales[0] : null;
    const tap = data.tap;
    const sharesAddr = data.meta.sharesToken;

    // Fetch metadata + pool reserves + ops lockup in parallel
    const feeOrHookVal = sale ? BigInt(sale.feeOrHook) : 30n;
    const poolId = computePoolId(ZERO, sharesAddr, 0n, 0n, feeOrHookVal);
    const tapActive_ = tap && tap.ratePerSec > 0n;
    // Looked up before the fetch so the sale's paused() rides along with it instead of
    // costing this page a second serial round trip.
    const contSaleConfig = CONTINUOUS_SALES[daoAddr.toLowerCase()];
    const contSaleAddr = contSaleConfig?.sale;
    const contVaultAddr = contSaleConfig?.vault;
    const contKeeperAddr = contSaleConfig?.keeper;
    // One multicall for every on-chain read this page needs up front — pool reserves, the
    // DAO's LP balance, the sale's paused flag and (only when its 5-minute cache is stale)
    // the ETH price. Metadata is HTTP, so it stays alongside rather than inside.
    const poolsIface = new ethers.Interface(ZAMM_POOLS_ABI);
    const lpIface = new ethers.Interface(ZAMM_LP_ABI);
    const csIface = new ethers.Interface(CONTINUOUS_SALE_ABI);
    const clIface = new ethers.Interface(CHAINLINK_ABI);
    const cachedUsd = ethUsdCached();
    const detailCalls = [
      { target: ZAMM, allowFailure: true, callData: poolsIface.encodeFunctionData('pools', [poolId]) },
      // LP is ERC6909 on zAMM; a DAO that seeded its own pool owns part of the reserves
      { target: ZAMM, allowFailure: true, callData: lpIface.encodeFunctionData('balanceOf', [daoAddr, poolId]) },
    ];
    const pausedIdx = contSaleAddr ? detailCalls.push(
      { target: contSaleAddr, allowFailure: true, callData: csIface.encodeFunctionData('paused') }) - 1 : -1;
    // Minted shares, for expressing a purchase as a stake in the DAO. The sale's
    // configured supply is not the same number and would understate every stake.
    const supplyIdx = detailCalls.push(
      { target: sharesAddr, allowFailure: true, callData: new ethers.Interface(ERC20_ABI).encodeFunctionData('totalSupply') }) - 1;
    const usdIdx = cachedUsd > 0 ? -1 : detailCalls.push(
      { target: CHAINLINK_ETH_USD, allowFailure: true, callData: clIface.encodeFunctionData('latestAnswer') }) - 1;
    // Cause detection must not depend on metadata alone — see the dispatch below.
    const shareSaleIdx = detailCalls.push(
      { target: SHARE_SALE, allowFailure: true,
        callData: new ethers.Interface(SHARE_SALE_ABI).encodeFunctionData('sales', [daoAddr]) }) - 1;
    const offeringIdx = detailCalls.push(
      { target: SHARE_OFFERING, allowFailure: true,
        callData: new ethers.Interface(SHARE_OFFERING_ABI).encodeFunctionData('sales', [daoAddr]) }) - 1;

    const [metadata, detailRes] = await Promise.all([
      fetchMetadata(data.meta.contractURI),
      mcAggregate(detailCalls).catch(() => []),
    ]);
    const poolResult = mcDecode(detailRes[0], poolsIface, 'pools', null);
    const daoLpBal = mcDecode(detailRes[1], lpIface, 'balanceOf', [0n])[0];
    // null = the read failed, which is not the same as the sale being closed.
    const csPaused = pausedIdx < 0 ? undefined : (mcDecode(detailRes[pausedIdx], csIface, 'paused', null)?.[0] ?? null);
    const ethUsd = usdIdx < 0 ? cachedUsd : setEthUsdFromAnswer(mcDecode(detailRes[usdIdx], clIface, 'latestAnswer', null)?.[0]);
    const sharesMinted = mcDecode(detailRes[supplyIdx], new ethers.Interface(ERC20_ABI), 'totalSupply', [0n])[0];
    if (gen !== _renderGen) return;
    // Override icon for DAOs with configured Continuous Sale icons
    if (contSaleConfig?.icon && metadata && !metadata.image) metadata.image = contSaleConfig.icon;
    _coinMeta = metadata;

    // Cause coin detection — render simplified sale page.
    //
    // `launchType` is the fast path, but it is not evidence: it lives in a document
    // fetched over HTTP, and when that fetch fails fetchMetadata() returns {} and the
    // DAICO silently renders as a generic DAO — no buy form, no funding meter, no tap
    // panel. That has happened once already through a dead IPFS gateway (see IPFS_GWS).
    // A configured ShareSale is the same fact stated on-chain, so ask the chain when
    // the metadata does not say.
    const shareSalePrice = mcDecode(detailRes[shareSaleIdx],
      new ethers.Interface(SHARE_SALE_ABI), 'sales', null)?.price ?? 0n;
    const offeringPrice = mcDecode(detailRes[offeringIdx],
      new ethers.Interface(SHARE_OFFERING_ABI), 'sales', null)?.price ?? 0n;
    const isCauseOnchain = shareSalePrice > 0n || offeringPrice > 0n;
    if (metadata && metadata.launchType === 'cause') {
      renderCauseCoinPage(daoAddr, data, metadata, ethUsd, gen);
      return;
    }
    if (isCauseOnchain && !(metadata && metadata.launchType)) {
      renderCauseCoinPage(daoAddr, data, metadata || {}, ethUsd, gen);
      return;
    }

    if (gen !== _renderGen) return;

    const opsLockup = tapActive_ && tap.ops ? await fetchOpsLockup(sharesAddr, tap.ops, metadata) : null;
    if (gen !== _renderGen) return;

    // Sale stats
    const lpBps = sale ? Number(sale.lpBps) : 0;
    let salePct = 0, sold = 0n, totalSale = 0n, treasuryETH = 0n, saleActive = false, ethRaised = 0n;
    if (sale) {
      const detTeamBps = metadata && metadata.teamBps ? BigInt(metadata.teamBps) : 0n;
      totalSale = detTeamBps > 0n ? sale.totalSupply * (10000n - detTeamBps) / 10000n : sale.totalSupply;
      sold = totalSale > sale.remainingSupply ? totalSale - sale.remainingSupply : 0n;
      if (totalSale > 0n) salePct = Number((sold * 10000n) / totalSale) / 100;
      treasuryETH = sale.treasuryBalance;
      if (sale.forAmt > 0n) ethRaised = sold * sale.tribAmt / sale.forAmt;
      const now = BigInt(Math.floor(Date.now() / 1000));
      saleActive = sale.remainingSupply > 0n && sale.allowance > 0n && sale.forAmt > 0n && (sale.deadline === 0n || now <= BigInt(sale.deadline));
    }

    // Continuous Sale: override saleActive if a continuous sale contract is active
    // Keep the phase-0 answer: the DAICO sale being over is what makes the pool the honest
    // price reference, and a live phase-1 sale must not drag the header back to phase 0's price.
    const daicoSaleActive = saleActive;
    let contSaleActive = false, contSaleUnknown = false;
    if (contSaleAddr) {
      // A failed read is not evidence the sale is closed — say so rather than imply it ended.
      if (csPaused === null) contSaleUnknown = true;
      else contSaleActive = !csPaused;
      if (contSaleActive) saleActive = true;
    }

    // Tap stats
    let tapPct = 0, tapVested = 0, tapTotal = 0, dailyRate = 0, tapActive = false;
    if (tap && tap.ratePerSec > 0n) {
      tapActive = true;
      const budget = tap.tapAllowance;
      // pending = total owed by time (ratePerSec * elapsed), claimable = min(pending, allowance, balance)
      const vested = tap.pending || 0n;
      if (budget > 0n) tapPct = Number((vested * 10000n) / budget) / 100;
      tapVested = Number(ethers.formatEther(vested));
      tapTotal = Number(ethers.formatEther(budget));
      dailyRate = Number(ethers.formatEther(tap.ratePerSec * 86400n));
    }

    // Price per 1M shares
    let priceDisplay = '';
    if (sale && sale.tribAmt > 0n && sale.forAmt > 0n) {
      const pricePer1M = Number(ethers.formatEther(sale.tribAmt)) / Number(ethers.formatEther(sale.forAmt)) * 1e6;
      priceDisplay = pricePer1M >= 1 ? parseFloat(pricePer1M.toFixed(2)).toString() : pricePer1M >= 0.001 ? parseFloat(pricePer1M.toFixed(4)).toString() : pricePer1M.toExponential(2);
    }

    // Market cap (pool price preferred, fallback to sale price)
    let mcapETH = 0;
    const isCollect = metadata.launchType === 'collector' || metadata.type === 'collector' || metadata.type === 'fw-collector' || !!contSaleConfig;

    // Banner + OG meta for social sharing
    const bannerUrl = resolveIPFS(metadata.banner);
    const logoUrl = resolveIPFS(metadata.image);
    const coinName = metadata.name || data.meta.name || 'Unnamed';
    const coinSymbol = data.meta.symbol || '???';
    const ogDesc = metadata.description
      ? metadata.description.slice(0, 200)
      : `$${coinSymbol} on zFi${saleActive ? ' — sale live' : ''}${ethRaised > 0n ? ` — ${fmtETH(ethRaised)} raised` : ''}`;
    updateOGMeta(
      `$${coinSymbol} — ${coinName}`,
      ogDesc,
      bannerUrl || logoUrl || ''
    );
    let bannerHTML = '';
    if (bannerUrl) {
      bannerHTML = `<div class="coin-banner"><img src="${escAttr(bannerUrl)}" alt="" onerror="if(!ipfsNextGateway(this))this.parentNode.style.display='none'"></div>`;
    }

    // LP info
    const feeOrHook = feeOrHookVal;
    const ethIco = `<svg width="10" height="10" viewBox="0 0 256 417" fill="currentColor" opacity="0.5" style="vertical-align:-1px"><path d="M127.961 0l-2.795 9.5v275.668l2.795 2.79 127.962-75.638z"/><path d="M127.962 0L0 212.32l127.962 75.639V154.158z"/><path d="M127.961 312.187l-1.575 1.92V414.55l1.575 4.6L256 236.587z"/><path d="M127.962 419.15V312.187L0 236.587z"/></svg>`;

    // Pool reserves (already fetched in parallel above)
    const reserve0 = poolResult ? (poolResult.reserve0 ?? poolResult[0] ?? 0n) : 0n;
    const reserve1 = poolResult ? (poolResult.reserve1 ?? poolResult[1] ?? 0n) : 0n;
    const hasPool = reserve0 > 0n || reserve1 > 0n;

    // Compute market cap (circulating): price * circulating supply
    // Circulating = total - unsold - team locked
    const detailTeamBps = metadata && metadata.teamBps ? metadata.teamBps : 0;
    const detailTotalSupply = sale ? Number(ethers.formatEther(sale.totalSupply)) : Number(COIN_SUPPLY_TOTAL);
    const detailTeamLocked = detailTeamBps > 0 ? detailTotalSupply * detailTeamBps / 10000 : 0;
    const unsold = sale ? Number(ethers.formatEther(sale.remainingSupply)) : 0;
    const inLp = Number(ethers.formatEther(reserve1));
    // The DAO may own part of its own pool (LP is ERC6909; pools() returns LP supply at
    // index 6). Its slice of the reserves is treasury: the ETH backs shares, and the
    // shares sitting in it are DAO-held, so they are not circulating.
    const lpSupply = poolResult ? (poolResult[6] ?? 0n) : 0n;
    const daoLpFrac = lpSupply > 0n && daoLpBal > 0n
      ? Math.min(1, Number((daoLpBal * 1000000n) / lpSupply) / 1000000)
      : 0;
    const daoPoolEth = Number(ethers.formatEther(reserve0)) * daoLpFrac;
    const daoPoolTokens = inLp * daoLpFrac;

    // LP fees earned. zAMM has no claimable fee accumulator — swap fees compound straight
    // into the reserves — so fees are measured as growth in sqrt(k) per LP unit. That index
    // is unchanged by proportional mints/burns and rises only when a swap pays a fee, and it
    // starts at 1 when a pool is seeded. Applying it to the DAO's current position gives the
    // fee portion of that position, assuming its LP has been in place since inception.
    const lpFeeGrowth = (() => {
      if (lpSupply <= 0n || reserve0 <= 0n || reserve1 <= 0n) return 1;
      const k = reserve0 * reserve1;
      let x = k, y = (x + 1n) / 2n;              // integer sqrt (Newton)
      while (y < x) { x = y; y = (x + k / x) / 2n; }
      const g = Number((x * 1000000n) / lpSupply) / 1000000;
      return g > 1 ? g : 1;
    })();
    // Position is ETH side + token side, both valued at spot, hence the doubling.
    const daoLpFeesEth = daoPoolEth > 0 ? 2 * daoPoolEth * (1 - 1 / lpFeeGrowth) : 0;
    const circulating = detailTotalSupply - unsold - detailTeamLocked - daoPoolTokens;
    // Price: pool spot if sale ended or pool is deep, else sale price
    const poolDeep = hasPool && reserve1 > 0n && inLp > detailTotalSupply * 0.01;
    const usePool = hasPool && (!daicoSaleActive || poolDeep);
    // Spot price per token: pool reserve ratio when the pool is the reference, else sale price
    let priceETH = 0, priceSrc = '';
    if (usePool && inLp > 0) {
      priceETH = Number(ethers.formatEther(reserve0)) / inLp;
      priceSrc = 'pool';
    } else if (contSaleActive) {
      priceETH = 1 / CONT_SALE_SHARES_PER_ETH;
      priceSrc = 'sale';
    } else if (sale && sale.tribAmt > 0n && sale.forAmt > 0n) {
      priceETH = Number(ethers.formatEther(sale.tribAmt)) / Number(ethers.formatEther(sale.forAmt));
      priceSrc = 'sale';
    }
    if (circulating > 0 && priceETH > 0) mcapETH = priceETH * circulating;
    const mcapDisplay = mcapETH > 1e-6 ? fmtMcap(mcapETH) : '';
    const mcapUsd = mcapETH > 1e-6 && ethUsd > 0 ? fmtUsd(mcapETH * ethUsd) : '';
    const priceEthDisplay = priceETH > 0 ? fmtEthPrice(priceETH) : '';
    const priceUsdDisplay = priceETH > 0 && ethUsd > 0 ? fmtUsdPrice(priceETH * ethUsd) : '';
    const priceRowHTML = priceEthDisplay
      ? `<div class="coin-mcap-row" style="font-weight:400;color:var(--fg-dim)" title="${priceSrc === 'pool' ? 'pool reserve ratio (spot)' : 'sale price'}">Price: ${priceEthDisplay}${priceUsdDisplay ? ` <span style="color:var(--fg-muted)">(${priceUsdDisplay})</span>` : ''}${priceSrc === 'sale' ? `<span style="color:var(--fg-muted);font-size:11px"> &middot; sale price</span>` : ''}</div>`
      : '';

    let html = `
      <a href="#" class="back-link">&larr; All Coins</a>
      ${bannerHTML}
      <div class="coin-detail-head">
        <div class="coin-detail-logo">${logoHTML(data.meta, metadata, 64)}</div>
        <div class="coin-detail-title" style="flex:1">
          <h2>${escText(metadata.name || data.meta.name || 'Unnamed')}</h2>
          <div class="coin-symbol-row">
            <span>$${escText(metadata.symbol || data.meta.symbol || '???')}${metadata.launchType === 'curve' ? `<span class="coin-tpl-badge coin-tpl-simple" title="bonding curve &middot; permanent LP">curve</span>` : (metadata.launchType === 'collector' || metadata.type === 'collector' || metadata.type === 'fw-collector') ? `<span class="coin-tpl-badge coin-tpl-simple" title="collector DAO">collect</span>` : metadata.launchType === 'fund' ? `<span class="coin-tpl-badge coin-tpl-simple" title="fund launch &middot; ops allocation &middot; tap vesting &middot; governance">fund</span>` : metadata.template ? `<span class="coin-tpl-badge" title="${escText(metadata.template)} template"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>` : ''}</span>
            <div id="coinUserBalance" class="coin-user-balance" style="display:none"></div>
          </div>
        </div>
        <!-- The trade card sits below the treasury and the collection, so on a long page
             the one thing a visitor came to do is off screen. This carries them to it —
             but only when there is in fact a way to buy. -->
        ${(saleActive || contSaleActive || hasPool) ? `<button type="button" class="coin-buy-cta" onclick="coinQuickBuy()">Buy</button>` : ''}
      </div>
      ${contSaleActive
        ? `<div class="coin-mcap-row" style="color:var(--fg-dim)">Collector DAO &middot; continuous sale</div>`
        : isCollect && treasuryETH > 0n
        ? `<div class="coin-mcap-row">Treasury: ${fmtETH(treasuryETH)} ETH${ethUsd > 0 ? ` <span style="color:var(--fg-muted);font-weight:400">(${fmtUsd(Number(ethers.formatEther(treasuryETH)) * ethUsd)})</span>` : ''}</div>`
        : mcapDisplay ? `<div class="coin-mcap-row" title="Price &times; circulating supply (total less unsold, team-locked, and shares the DAO owns via its own LP). Excludes treasury holdings.">Circ. MCap: ${mcapDisplay}${mcapUsd ? ` <span style="color:var(--fg-muted);font-weight:400">(${mcapUsd})</span>` : ''}</div>` : ''}
      ${priceRowHTML}
    `;

    // Description + socials
    const hasSocials = metadata.twitter || metadata.telegram || metadata.discord;
    // A one-line description in a full bordered card outweighs the treasury visually;
    // drop the card chrome when there's little to hold.
    const terseDesc = !hasSocials && metadata.description && metadata.description.length <= 60;
    // The collector label above already carries this text on FWC-style DAOs; repeating it
    // verbatim one line down is noise, so drop the echo and keep anything else.
    const descEchoesLabel = !!metadata.description && isCollect
      && metadata.description.trim().toLowerCase() === 'collector dao';
    const showDesc = !!metadata.description && !descEchoesLabel;
    if (showDesc || hasSocials) {
      html += terseDesc ? `<div class="coin-desc-inline">` : `<div class="section-card">`;
      if (showDesc) html += `<div class="desc-text">${escText(metadata.description)}</div>`;
      if (hasSocials) {
        html += `<div class="socials-row"${showDesc ? ' style="margin-top:10px"' : ''}>`;
        if (metadata.twitter) {
          const _tw = metadata.twitter.replace(/^@/, '').trim();
          const _twHandle = _tw.replace(/^https?:\/\/(www\.)?(x\.com|twitter\.com)\//, '').replace(/\/.*$/, '');
          const _twUrl = `https://x.com/${encodeURIComponent(_twHandle)}`;
          html += `<a href="${_twUrl}" target="_blank" rel="noopener" title="X / Twitter"><svg width="14" height="14" viewBox="0 0 300 300.251" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;fill:currentColor"><path d="M178.57 127.15 290.27 0h-26.46l-97.03 110.38L89.34 0H0l117.13 166.93L0 300.25h26.46l102.4-116.59 81.8 116.59h89.34M36.01 19.54H76.66l187.13 262.13h-40.66"/></svg> @${escText(_twHandle)}</a>`;
        }
        if (metadata.telegram) html += `<a href="https://t.me/${encodeURIComponent(metadata.telegram)}" target="_blank" rel="noopener" title="Telegram"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle"><path d="M11.99 0C5.37 0 0 5.37 0 12s5.37 12 11.99 12S24 18.63 24 12 18.62 0 11.99 0zm5.9 8.1l-1.93 9.12c-.14.65-.52.81-1.06.5l-2.93-2.16-1.41 1.36c-.16.16-.29.29-.59.29l.21-2.97 5.42-4.9c.24-.21-.05-.33-.37-.12l-6.7 4.22-2.89-.9c-.63-.2-.64-.63.13-.93l11.29-4.35c.52-.2.98.12.81.93z"/></svg> ${escText(metadata.telegram)}</a>`;
        if (metadata.discord) html += `<a href="${escAttr(metadata.discord)}" target="_blank" rel="noopener" title="Discord"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle"><path d="M20.32 4.37a19.8 19.8 0 00-4.89-1.52.07.07 0 00-.08.04c-.21.38-.45.87-.61 1.26a18.27 18.27 0 00-5.49 0 12.64 12.64 0 00-.62-1.26.07.07 0 00-.08-.04 19.74 19.74 0 00-4.89 1.52.07.07 0 00-.03.03C1.07 8.28.32 12.05.7 15.78a.08.08 0 00.03.06 19.9 19.9 0 005.99 3.03.08.08 0 00.08-.03c.46-.63.87-1.3 1.22-2a.08.08 0 00-.04-.11 13.1 13.1 0 01-1.87-.9.08.08 0 01-.01-.12c.13-.09.25-.19.37-.29a.07.07 0 01.08-.01c3.93 1.79 8.18 1.79 12.07 0a.07.07 0 01.08.01c.12.1.25.2.37.29a.08.08 0 01-.01.12c-.6.35-1.22.65-1.87.9a.08.08 0 00-.04.11c.36.7.77 1.37 1.22 2a.08.08 0 00.08.03 19.83 19.83 0 006-3.03.08.08 0 00.03-.05c.44-4.53-.73-8.46-3.1-11.95a.06.06 0 00-.03-.03zM8.02 13.33c-1.03 0-1.89-.95-1.89-2.12s.83-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.83-2.12 1.89-2.12c1.07 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/></svg> Discord</a>`;
        html += `</div>`;
      }
      html += `</div>`;
    }

    // curve launch info
    if (metadata.launchType === 'curve') {
      html += `
        <div class="section-card" style="background:var(--surface)">
          <div class="section-title">bonding curve</div>
          <div style="font-size:12px;line-height:1.8;color:var(--fg-muted)">
            800M on curve &middot; 200M seed LP at graduation<br>
            1% trade fee &middot; permanent LP &middot; 16x price range
          </div>
        </div>
      `;
    }

    // Sale section (drawer if ended, full card if live)
    const hasDaicoSale = sale && sale.forAmt > 0n;
    const saleContent = `
        <div class="stat-row"><span class="stat-label">Sold</span><span class="stat-value" id="saleSoldVal">${fmtShares(sold)} / ${fmtShares(totalSale)} <span style="color:var(--green);font-weight:600">(${salePct.toFixed(1)}%)</span></span></div>
        <div id="salePctBar">${pctBar(salePct, 'var(--green)')}</div>
        <div id="saleRaisedRow">${ethRaised > 0n ? `<div class="stat-row"><span class="stat-label">ETH raised</span><span class="stat-value">${fmtETH(ethRaised)}</span></div>` : ''}</div>
        <div id="saleMintProgress"></div>
        ${priceDisplay ? `<div class="stat-row"><span class="stat-label">Price</span><span class="stat-value">${priceDisplay} ${ethIco}/1M shares</span></div>` : ''}
        ${lpBps > 0 ? `<div class="stat-row"><span class="stat-label">LP seeding</span><span class="stat-value">${lpBps / 100}% of buys &rarr; zAMM${feeOrHook <= 10000n ? ` (${Number(feeOrHook) / 100}% fee)` : ''}</span></div>` : ''}
        ${sale && sale.deadline > 0n ? `<div id="saleDeadlineRow"></div>` : ''}`
    // The DAICO sale is phase 0 of a collector DAO; once it closes a continuous sale can
    // reopen minting as phase 1. When phase 1 is live the phase 0 record still stands, so
    // it stays on the page as a collapsed drawer under the live card rather than vanishing.
    const saleEndedDrawer = `
        <div class="drawer" id="saleDrawer">
          <button class="drawer-toggle" onclick="this.parentElement.classList.toggle('open')">
            <span>${contSaleActive ? 'Phase 0 &middot; Sale (Ended)' : 'Sale (Ended)'}</span>
            <span class="arrow">&#9660;</span>
          </button>
          <div class="drawer-body">
            ${saleContent}
          </div>
        </div>
      `;
    // No price comparison here — the Swap tab quotes mint against pool per trade and routes
    // to whichever is better, which is the comparison that actually decides anything.
    const contSaleTip = 'Fixed mint rate. The Swap tab compares this against the pool for the size you enter and uses whichever gives more shares.';
    // Ragequit pays out of the DAO's *own* ETH. A collector DAO parks its ETH in the vault,
    // where a redemption cannot reach it, so only promise a refund when there is one.
    const rqNote = treasuryETH > 0n
      ? 'Shares are ragequittable for a pro-rata treasury refund.'
      : 'Shares are ragequittable against the DAO’s own ETH; vault holdings are distributed by governance.';
    if (contSaleActive) {
      html += `
        <div class="section-card">
          <div class="section-title">Phase 1 &middot; Continuous Sale (Live)</div>
          <div class="stat-row"><span class="stat-label" title="${escAttr(contSaleTip)}">Rate</span><span class="stat-value">1 ETH = 1M shares</span></div>
          <div id="nextPassProgress" style="display:none;margin:8px 0 10px"></div>
          ${contKeeperAddr ? `<div id="keeperPanel" class="keeper-panel" style="display:none"></div>` : ''}
          <div style="font-size:11px;line-height:1.6;color:var(--fg-muted);margin-top:10px">Buy shares with ETH to fund TokenWorks NFT acquisitions for this collector DAO. ETH flows to the vault, and once it clears a pass price anyone can trigger the purchase &mdash; governance approved the action, not the caller. ${rqNote}</div>
          <div style="font-size:10px;color:var(--fg-dim);margin-top:10px;padding-top:8px;border-top:1px solid var(--border-muted)">
            <a href="https://etherscan.io/address/${contSaleAddr}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Sale ${contSaleAddr.slice(0,6)}&hellip;${contSaleAddr.slice(-4)}</a>${contVaultAddr ? `
            &nbsp;&middot;&nbsp; <a href="https://etherscan.io/address/${contVaultAddr}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Vault ${contVaultAddr.slice(0,6)}&hellip;${contVaultAddr.slice(-4)}</a>` : ''}
          </div>
        </div>
      `;
      if (hasDaicoSale) html += saleEndedDrawer;
    } else if (saleActive && hasDaicoSale) {
      html += `
        <div class="section-card">
          <div class="section-title">Sale (Live)</div>
          ${saleContent}
        </div>
      `;
      // Sale deadline countdown
      if (sale && sale.deadline > 0n) {
        const _saleDl = Number(sale.deadline);
        setTimeout(() => {
          const dlEl = $('saleDeadlineRow');
          if (!dlEl) return;
          const dlDate = new Date(_saleDl * 1000);
          const dlStr = dlDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          function updateSaleCd() {
            const rem = _saleDl - Math.floor(Date.now() / 1000);
            if (rem <= 0) {
              dlEl.innerHTML = `<div class="stat-row"><span class="stat-label">Deadline</span><span class="stat-value">${dlStr} (ended)</span></div>`;
              return;
            }
            const d = Math.floor(rem / 86400);
            const h = Math.floor((rem % 86400) / 3600);
            const m = Math.floor((rem % 3600) / 60);
            const s = rem % 60;
            const timer = d > 0 ? `${d}d ${h}h ${m}m` : h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
            dlEl.innerHTML = `<div class="stat-row"><span class="stat-label">Deadline</span><span class="stat-value">${dlStr}</span></div><div style="font-size:14px;font-weight:600;letter-spacing:0.05em;text-align:center;padding:4px 0;color:var(--fg-muted)">${timer} remaining</div>`;
          }
          updateSaleCd();
          _saleCountdownInterval = setInterval(updateSaleCd, 1000);
        }, 0);
      }
      // Auto-refresh sale stats every 20s while sale is live
      _saleRefreshInterval = startPoller(refreshSaleStats, 20000);
    } else if (hasDaicoSale) {
      html += saleEndedDrawer;
    }
    // The phase-1 status read failed, so the page cannot say whether minting is open.
    // Say that, instead of leaving the ended drawer to imply the sale is over.
    if (contSaleUnknown) {
      html += `
        <div class="section-card" style="background:var(--surface)">
          <div style="font-size:11px;color:var(--fg-muted)">Continuous sale status unavailable &mdash; could not reach the <a href="https://etherscan.io/address/${contSaleAddr}" target="_blank" style="color:inherit;text-decoration:underline">sale contract</a>. Reload to try again.</div>
        </div>
      `;
    }

    // Treasury + Pool reserves + Vault
    if (treasuryETH > 0n || hasPool || contSaleActive) {
      // Backing per share = redeemable-ish ETH / circulating shares, shown against the
      // market price so a premium/discount to NAV is visible. Vault ETH arrives async,
      // so this renders from the DAO balance first and is refreshed below.
      const navRender = (backingEth, note) => {
        if (!(circulating > 0) || !(backingEth > 0)) return '';
        const perShare = backingEth / circulating;
        const noteHTML = note ? ` <span style="color:var(--fg-dim);font-weight:400;font-size:10px">${note}</span>` : '';
        const ratio = priceETH > 0 ? priceETH / perShare : 0;
        const tone = ratio >= 1 ? 'var(--fg-muted)' : 'var(--green)';
        const label = ratio > 0
          ? ` <span style="color:${tone};font-weight:400" title="${ratio >= 1
              ? `The market price is ${ratio.toFixed(2)}&times; the treasury value behind each share — buyers are paying ${((ratio - 1) * 100).toFixed(0)}% above backing.`
              : `The market price is ${(ratio * 100).toFixed(0)}% of the treasury value behind each share — shares trade below backing.`}">(${ratio >= 1 ? ratio.toFixed(2) + '&times; premium' : (1 / ratio).toFixed(2) + '&times; discount'})</span>`
          : '';
        return `${fmtEthPrice(perShare)}${ethUsd > 0 ? ` <span style="color:var(--fg-muted);font-weight:400">(${fmtUsdPrice(perShare * ethUsd)})</span>` : ''}${label}${noteHTML}`;
      };
      const navHTML = navRender(Number(ethers.formatEther(treasuryETH)) + daoPoolEth);

      html += `
        <div class="section-card">
          <div class="section-title">Treasury</div>
          ${treasuryETH > 0n ? `<div class="stat-row"><span class="stat-label">${ethIco} DAO Balance</span><span class="stat-value">${fmtETH(treasuryETH)}</span></div>` : ''}
          ${contVaultAddr ? `<div class="stat-row"><span class="stat-label">${ethIco} Vault</span><span class="stat-value"><span id="vaultEthBal">Loading...</span> <a href="https://etherscan.io/address/${contVaultAddr}" target="_blank" style="font-size:10px;color:var(--fg-muted);text-decoration:underline;margin-left:4px">view</a></span></div>
          <div class="stat-row"><span class="stat-label">NFTs</span><span class="stat-value"><span id="vaultNftBal">Loading...</span></span></div>
          <div class="stat-row" id="vaultFeesRow" style="display:none"><span class="stat-label" title="Everything the vault's passes have earned in fees since they were acquired, whether or not it has been claimed yet. Claimed fees have already been taken into the vault and largely reinvested into further passes; unclaimed fees still sit at the fee accumulator and need a claim to realise.">Fees earned</span><span class="stat-value" id="vaultFeesVal"></span></div>` : ''}
          ${hasPool ? `
            <div class="stat-row"><span class="stat-label">Pool ${ethIco}${saleActive && !contSaleActive && lpBps > 0 ? ' <span style="font-weight:400;font-size:10px;opacity:0.6">(building...)</span>' : ''}</span><span class="stat-value">${fmtETH(reserve0)}</span></div>
            <div class="stat-row"><span class="stat-label">Pool $${escText(data.meta.symbol || '???')}</span><span class="stat-value">${fmtShares(reserve1)}</span></div>
          ` : ''}
          ${(daoLpFrac > 0 || navHTML || contVaultAddr) ? `
          <button class="stat-reveal" onclick="const d=this.nextElementSibling;const o=d.hasAttribute('hidden');o?d.removeAttribute('hidden'):d.setAttribute('hidden','');this.classList.toggle('open',o);this.firstElementChild.textContent=o?'▾':'▸'" aria-label="Toggle backing detail"><span>&#9656;</span> Backing detail</button>
          <div class="stat-reveal-body" hidden>
            ${daoLpFrac > 0 ? `<div class="stat-row" title="The DAO holds ${(daoLpFrac * 100).toFixed(2)}% of this pool's LP, so that share of the reserves is treasury. Its ETH counts toward backing; its $${escText(data.meta.symbol || '???')} is treated as non-circulating."><span class="stat-label">DAO LP share</span><span class="stat-value">${(daoLpFrac * 100).toFixed(1)}% <span style="color:var(--fg-muted);font-weight:400">(${fmtNum(daoPoolEth)} ${ethIco} + ${daoPoolTokens >= 1000 ? (daoPoolTokens / 1000).toFixed(1) + 'K' : daoPoolTokens.toFixed(0)} $${escText(data.meta.symbol || '???')})</span></span></div>` : ''}
            ${daoLpFeesEth > 0 ? `<div class="stat-row" id="lpFeesRow" title="Estimated swap fees earned by the DAO's LP position. zAMM compounds fees into the reserves rather than escrowing them, so this is derived from the growth in sqrt(k) per LP unit (${((lpFeeGrowth - 1) * 100).toFixed(3)}% since the pool was seeded) applied to the DAO's current position. Already included in the LP value above."><span class="stat-label">LP fees earned <span id="lpFeesQualifier" style="font-weight:400;font-size:10px;opacity:0.6">(est.)</span></span><span class="stat-value">${fmtNum(daoLpFeesEth)} ${ethIco}${ethUsd > 0 ? ` <span style="color:var(--fg-muted);font-weight:400">(${fmtUsdPrice(daoLpFeesEth * ethUsd)})</span>` : ''}</span></div>` : ''}
            ${reserve0 > 0n && reserve1 > 0n && priceSrc !== 'pool' ? `<div class="stat-row" title="pool reserve ratio: ${ethers.formatEther(reserve0)} ETH / ${ethers.formatEther(reserve1)} $${escText(data.meta.symbol || '???')}"><span class="stat-label">Pool Price</span><span class="stat-value">${fmtEthPrice(Number(ethers.formatEther(reserve0)) / Number(ethers.formatEther(reserve1)))}${ethUsd > 0 ? ` <span style="color:var(--fg-muted);font-weight:400">(${fmtUsdPrice((Number(ethers.formatEther(reserve0)) / Number(ethers.formatEther(reserve1))) * ethUsd)})</span>` : ''}</span></div>` : ''}
            <div class="stat-row stat-row-nav" id="navRow"${navHTML ? '' : ' style="display:none"'}>
              <span class="stat-label" title="Treasury value divided by circulating shares: ETH held by the DAO and its vault, plus the NFT's refundable ETH and the DAO's share of its own LP. Not currently redeemable — realising it takes governance.">Backing / share</span>
              <span class="stat-value" id="navValue">${navHTML}</span>
            </div>
          </div>` : ''}
        </div>
      `;
      // Gallery of the passes the vault has collected. The art comes from each token's
      // on-chain SVG, so it is filled in by the vault fetch below and stays hidden if
      // the tokenURI reads fail.
      if (contVaultAddr) {
        html += `
          <div class="section-card" id="vaultGalleryCard">
            <div class="section-title">Collection</div>
            <!-- auto-fill with a max track width so a two-pass vault gets two small tiles,
                 not two tiles stretched across the whole card. Seeded with one skeleton per
                 known id so the card holds its space instead of appearing after the read. -->
            <div id="vaultGallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,132px));gap:10px;justify-content:start">${VAULT_NFT_TOKEN_IDS.map(() => '<div class="nft-skel"></div>').join('')}</div>
            <div id="vaultGalleryCaption" style="font-size:10px;color:var(--fg-dim);margin-top:8px"></div>
          </div>
        `;
      }
      // Date the DAO's LP once the page is idle, and say so on the row: confirmed seeder
      // means the fee estimate covers the pool's whole life; anything else is softened.
      if (daoLpFeesEth > 0) {
        const idle = window.requestIdleCallback || (fn => setTimeout(fn, 1500));
        idle(async () => {
          try {
            const seed = await verifyLpSeeder(poolId.toString(), daoAddr);
            if (gen !== _renderGen) return; // navigated away mid-scan
            const q = $('lpFeesQualifier'), row = $('lpFeesRow');
            // Unknown stays "(est.)" — the log scan not reaching inception is not evidence.
            if (!q || !row || !seed || seed.inconclusive) return;
            if (seed.isDao) {
              const when = seed.time ? ` ${new Date(seed.time * 1000).toLocaleDateString()}` : '';
              q.textContent = '(since seed)';
              row.title = `Swap fees earned by the DAO's LP. The DAO seeded this pool${when}${seed.via ? ' (via ' + seed.via.slice(0, 6) + '…' + seed.via.slice(-4) + ')' : ''}, so the full ${((lpFeeGrowth - 1) * 100).toFixed(3)}% growth in sqrt(k) per LP unit since inception applies to its position. Already included in the LP value above.`;
            } else {
              q.textContent = '(est., upper bound)';
              row.title = `Estimated swap fees on the DAO's LP. This pool was seeded by ${seed.seeder.slice(0, 6)}…${seed.seeder.slice(-4)}, not the DAO, so crediting the full ${((lpFeeGrowth - 1) * 100).toFixed(3)}% lifetime fee growth to the DAO's units overstates if they were minted later. Treat as an upper bound. Already included in the LP value above.`;
            }
          } catch {}
        });
      }

      // Fetch vault balances async, then keep them current: a pass purchase or a fee
      // claim while the page sits open should not leave stale numbers on screen.
      if (contVaultAddr) {
        const loadVaultStats = async () => {
          // NOTE: this runs before `content.innerHTML = html` below, so the treasury nodes
          // do not exist yet — every DOM write here must happen after an await.
          try {
            const nftIface = new ethers.Interface(VAULT_NFT_ABI);
            const feeIface = new ethers.Interface(VAULT_NFT_FEES_ABI);
            const keeperIface = new ethers.Interface(KEEPER_ABI);
            const keeperViews = contKeeperAddr
              ? ['canClaim', 'canRemint', 'pendingFees', 'untilNextPass', 'remainingClaims', 'remainingRemints', 'stopped']
              : [];
            const [vaultBal, nftLocked, nftPending, nftClaimed, tokenURIs, keeper] = await withRPC(async rpc => {
              const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
              const res = await mc.aggregate3([
                { target: MC3, allowFailure: true, callData: _mc3Iface.encodeFunctionData('getEthBalance', [contVaultAddr]) },
                // Four groups of one call per pass, each in id order: locked ETH, pending
                // fees, lifetime claimed fees, then the on-chain metadata URI.
                ...VAULT_NFT_TOKEN_IDS.map(id => ({ target: VAULT_NFT_CONTRACT, allowFailure: true, callData: nftIface.encodeFunctionData('getRemainingLockedEth', [id]) })),
                ...VAULT_NFT_TOKEN_IDS.map(id => ({ target: VAULT_NFT_FEES, allowFailure: true, callData: feeIface.encodeFunctionData('pending', [id]) })),
                ...VAULT_NFT_TOKEN_IDS.map(id => ({ target: VAULT_NFT_FEES, allowFailure: true, callData: feeIface.encodeFunctionData('claimed', [id]) })),
                ...VAULT_NFT_TOKEN_IDS.map(id => ({ target: VAULT_NFT_CONTRACT, allowFailure: true, callData: nftIface.encodeFunctionData('tokenURI', [id]) })),
                // Keeper state. Its own canClaim/canRemint decide whether the buttons are
                // live, rather than the page re-deriving the rules and drifting from them.
                ...keeperViews.map(fn => ({ target: contKeeperAddr, allowFailure: true, callData: keeperIface.encodeFunctionData(fn) })),
              ]);
              const n = VAULT_NFT_TOKEN_IDS.length;
              const sum = (offset, iface, fn) => res.slice(offset, offset + n).reduce(
                (acc, r) => acc + (r.success ? iface.decodeFunctionResult(fn, r.returnData)[0] : 0n), 0n);
              return [
                res[0].success ? _mc3Iface.decodeFunctionResult('getEthBalance', res[0].returnData)[0] : 0n,
                sum(1, nftIface, 'getRemainingLockedEth'),
                sum(1 + n, feeIface, 'pending'),
                sum(1 + 2 * n, feeIface, 'claimed'),
                res.slice(1 + 3 * n, 1 + 4 * n).map(r => r.success ? nftIface.decodeFunctionResult('tokenURI', r.returnData)[0] : ''),
                // A failed call leaves the value undefined, and the panel treats a missing
                // read as "cannot act" rather than showing a button that would revert.
                keeperViews.reduce((acc, fn, i) => {
                  const r = res[1 + 4 * n + i];
                  if (r && r.success) { try { acc[fn] = keeperIface.decodeFunctionResult(fn, r.returnData)[0]; } catch {} }
                  return acc;
                }, {}),
              ];
            });
            // Navigating away mid-flight must not paint the old vault's numbers onto the
            // page that replaced it.
            if (gen !== _renderGen) return;
            const el = $('vaultEthBal');
            if (el) el.textContent = fmtETH(vaultBal);
            // Hardcoded NFT holdings for the FWC vault (TokenWorks passes collected so far),
            // annotated with the ETH still refundable across them.
            const nftLockedEth = Number(ethers.formatEther(nftLocked));
            const nftEl = $('vaultNftBal');
            const nftCountHeld = VAULT_NFT_TOKEN_IDS.length;
            if (nftEl) nftEl.innerHTML = `${nftCountHeld} TokenWorks NFT${nftCountHeld > 1 ? 's' : ''} `
              + VAULT_NFT_TOKEN_IDS.map(id => `<a href="https://opensea.io/item/ethereum/${VAULT_NFT_CONTRACT}/${id}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">#${id}</a>`).join(' ')
              + (nftLockedEth > 0 ? ` <span style="color:var(--fg-dim);font-size:10px">${fmtEthBal(nftLockedEth)} ETH locked</span>` : '');
            // Gallery: the pass art is a base64 data URI inside base64 JSON, both on-chain,
            // so the image can go straight into an <img> with no gateway in the path.
            const galleryEl = $('vaultGallery'), galleryCard = $('vaultGalleryCard');
            if (galleryEl && galleryCard) {
              _vaultGalleryItems = (tokenURIs || []).map((uri, i) => {
                const id = VAULT_NFT_TOKEN_IDS[i];
                let meta = null;
                try {
                  const b64 = String(uri).split('base64,')[1];
                  if (b64) meta = JSON.parse(decodeURIComponent(escape(atob(b64))));
                } catch {}
                return (meta && meta.image) ? { id, name: meta.name || ('#' + id), image: meta.image } : null;
              }).filter(Boolean);
              // Tiles open the art in-page rather than jumping straight to a marketplace —
              // the outbound links live in the lightbox, one step further in.
              const cards = _vaultGalleryItems.map((it, i) => `
                  <button type="button" class="nft-tile" onclick="openNftLightbox(${i})" aria-label="View ${escAttr(it.name)}">
                    <img src="${escAttr(it.image)}" alt="${escAttr(it.name)}" loading="lazy" decoding="async">
                    <div class="nft-tile-label">#${it.id}</div>
                  </button>`);
              if (!cards.length) { galleryCard.style.display = 'none'; }
              else {
                // The 30s refresh re-reads the same art; rewriting it would re-decode a few
                // hundred KB of inline SVG and flicker. Only touch the DOM when the set changes.
                const sig = _vaultGalleryItems.map(it => it.id).join(',');
                if (galleryEl.dataset.sig !== sig) {
                  galleryEl.dataset.sig = sig;
                  galleryEl.innerHTML = cards.join('');
                }
                // Summarise what the collection is worth in ETH terms, so the art is not the
                // only thing the card says.
                const capEl = $('vaultGalleryCaption');
                if (capEl) capEl.textContent = `${cards.length} pass${cards.length > 1 ? 'es' : ''}`

                claimedEth > 0 ? `${fmtEthBal(claimedEth)} claimed &amp; reinvested` : '',

let _lastQuoteId = 0;
let _quoteDebounce = null;
let _cachedQuote = null; // { exactOut, tokenIn, tokenOut, amount, result, ts }
let _bestRoute = 'pool'; // 'pool' | 'mint' — which source the last buy quote picked

function onPayInput() {
  _exactOut = false;
  $('swapReceiveInput').value = '';
  scheduleQuote();
}

function onReceiveInput() {
  _exactOut = true;
  $('swapPayInput').value = '';
  scheduleQuote();
}

function scheduleQuote() {
  clearTimeout(_quoteDebounce);
  _quoteDebounce = setTimeout(fetchQuote, 300);
}

async function fetchQuote() {
  const raw = _exactOut ? $('swapReceiveInput').value.trim() : $('swapPayInput').value.trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) { $('swapQuote').textContent = ''; _bestRoute = 'pool'; return; }

  const quoteId = ++_lastQuoteId;
  const shares = $('app').dataset.shares;
  const feeOrHook = BigInt($('app').dataset.feeOrHook || '30');
  // Buying is a choice between two sources of shares: the pool, and the DAO's own mint
  // at a fixed rate. Quote both and take whichever hands the user more. Selling has no
  // second route — the sale only mints.
  const isBuy = _swapDir === 'buy';
  const canMint = isBuy && !!$('app').dataset.contSale;
  _bestRoute = 'pool';

  let amount;
  try { amount = ethers.parseEther(raw); } catch { return; }
  const tokenIn = isBuy ? ZERO : shares;
  const tokenOut = isBuy ? shares : ZERO;

  const result = await withRPC(async rpc => {
    const quoter = new ethers.Contract(ZQUOTER, QUOTE_ABI, rpc);
    return await quoter.quoteZAMM(_exactOut, feeOrHook, tokenIn, tokenOut, 0, 0, amount);
  }).catch(() => null);
  if (quoteId !== _lastQuoteId) return;
  if (result) _cachedQuote = { exactOut: _exactOut, tokenIn, tokenOut, amount, result, ts: Date.now() };

  if (!result && !canMint) { $('swapQuote').textContent = 'No liquidity yet'; return; }

  const rate = BigInt(CONT_SALE_SHARES_PER_ETH);
  const sym = '$' + (_coinData?.meta?.symbol || '???');
  const fmtEthAmt = v => Number(ethers.formatEther(v)).toLocaleString(undefined, {maximumFractionDigits: 6});

  if (_exactOut) {
    // Cheapest way to end up with the requested shares. The mint has no slippage or fee,
    // so its cost is exact; round the ETH up so the mint covers the full amount.
    const mintIn = canMint ? (amount + rate - 1n) / rate : 0n;
    const poolIn = result ? result.amountIn : 0n;
    const useMint = canMint && (!result || mintIn < poolIn);
    const payIn = useMint ? mintIn : poolIn;
    _bestRoute = useMint ? 'mint' : 'pool';
    $('swapPayInput').value = ethers.formatEther(payIn);
    const alt = (canMint && result)
      ? ` <span style="color:var(--fg-dim)">(${useMint ? 'pool' : 'mint'}: ~${fmtEthAmt(useMint ? poolIn : mintIn)} ETH)</span>`
      : '';
    $('swapQuote').innerHTML = `Cost: ~${fmtEthAmt(payIn)} ETH via ${useMint ? 'mint' : 'pool'}${alt}` + (_swapDir === 'buy' ? daoStakeHint(amount, useMint) : '');
  } else {
    // Most shares for the ETH being spent.
    const mintOut = canMint ? amount * rate : 0n;
    const poolOut = result ? result.amountOut : 0n;
    const useMint = canMint && mintOut > poolOut;
    const out = useMint ? mintOut : poolOut;
    _bestRoute = useMint ? 'mint' : 'pool';
    $('swapReceiveInput').value = ethers.formatEther(out);
    const alt = (canMint && result)
      ? ` <span style="color:var(--fg-dim)">(${useMint ? 'pool' : 'mint'}: ~${fmtShares(useMint ? poolOut : mintOut)})</span>`
      : '';
    // Selling pays out ETH, not shares. Labelling it with the share symbol and running
    // it through fmtShares reported a real sale of 50K shares as "~0 $FWC".
    const outText = _swapDir === 'buy'
      ? `${fmtShares(out)} ${escText(sym)}`
      : `${fmtEthAmt(out)} ETH`;
    $('swapQuote').innerHTML = `~${outText} via ${useMint ? 'mint' : 'pool'}${alt}` + (_swapDir === 'buy' ? daoStakeHint(out, useMint) : '');
  }
  updateModeButton();
}


let _payBalance = 0n; // raw wei balance of pay-side token
let _ethBalance = 0n;
let _sharesBalance = 0n;
let _ragequitTotalSupply = 0n; // shares + loot (for pro-rata ragequit)

async function loadBalances() {
  if (!_signer || !_coinData) return;
  const addr = await _signer.getAddress();
  const shares = _coinData.meta.sharesToken;
  const loot = _coinData.meta.lootToken;
  const daoAddr = $('app').dataset.dao;
  try {
    const erc20 = new ethers.Interface(ERC20_ABI);
    const mc3i = _mc3Iface;
    const calls = [
      { target: MC3, allowFailure: false, callData: mc3i.encodeFunctionData('getEthBalance', [addr]) },
      { target: shares, allowFailure: true, callData: erc20.encodeFunctionData('balanceOf', [addr]) },
      { target: shares, allowFailure: true, callData: erc20.encodeFunctionData('totalSupply') },
      { target: loot, allowFailure: true, callData: erc20.encodeFunctionData('totalSupply') },
      { target: MC3, allowFailure: false, callData: mc3i.encodeFunctionData('getEthBalance', [daoAddr]) },
      { target: ZORG_TOKEN, allowFailure: true, callData: erc20.encodeFunctionData('balanceOf', [addr]) }
    ];
    const results = await withRPC(async rpc => {
      const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
      return await mc.aggregate3(calls);
    });
    const decode = (abi, fn, r) => r.success ? abi.decodeFunctionResult(fn, r.returnData)[0] : 0n;
    const ethBal = decode(mc3i, 'getEthBalance', results[0]);
    const tokenBal = decode(erc20, 'balanceOf', results[1]);
    const sharesTotalSupply = decode(erc20, 'totalSupply', results[2]);
    const lootTotalSupply = decode(erc20, 'totalSupply', results[3]);
    const treasuryBal = decode(mc3i, 'getEthBalance', results[4]);
    _userIsVerified = decode(erc20, 'balanceOf', results[5]) >= ZORG_VERIFY_THRESHOLD;
    _ethBalance = ethBal;
    _sharesBalance = tokenBal;
    _ragequitTotalSupply = sharesTotalSupply + lootTotalSupply;

    // User balance display
    const balEl = $('coinUserBalance');
    if (balEl) {
      const sym = _coinData?.meta?.symbol || '???';
      if (tokenBal > 0n) {
        balEl.textContent = `Your balance: ${fmtShares(tokenBal)} $${sym}`;
        balEl.style.display = '';
      } else {
        balEl.style.display = 'none';
      }
    }

    // Swap mode balance
    const isBuy = _swapDir === 'buy';
    _payBalance = isBuy ? ethBal : tokenBal;
    const payEl = $('swapPayBal');
    if (payEl) {
      const payFmt = isBuy
        ? Number(ethers.formatEther(ethBal)).toLocaleString(undefined, {maximumFractionDigits:6}) + ' ETH'
        : fmtShares(tokenBal) + ' $' + (_coinData.meta.symbol || '???');
      payEl.textContent = payFmt;
      payEl.onclick = () => fillPct(100);
    }

    // Sale mode balance — follows whichever asset the Sale tab is paying with.
    const salePayEl = $('salePayBal');
    if (salePayEl) {
      if (_salePayToken.address === ZERO) {
        _salePayBalance = ethBal;
        salePayEl.textContent = Number(ethers.formatEther(ethBal)).toLocaleString(undefined, {maximumFractionDigits:6}) + ' ETH';
      } else {
        refreshSalePayBalance();
      }
      salePayEl.onclick = () => fillPct(100);
    }

    // Ragequit mode balance (shares)
    const rqEl = $('rqSharesBal');
    if (rqEl) {
      rqEl.textContent = fmtShares(tokenBal) + ' $' + (_coinData.meta.symbol || '???');
      rqEl.onclick = () => fillPct(100);
    }

    // LP mode balances
    const ethFmt = Number(ethers.formatEther(ethBal)).toLocaleString(undefined, {maximumFractionDigits:6}) + ' ETH';
    const tokenFmtLp = fmtShares(tokenBal) + ' $' + (_coinData.meta.symbol || '???');
    const lpZapBal = $('lpZapBal');
    if (lpZapBal) { lpZapBal.textContent = ethFmt; lpZapBal.onclick = () => fillLpPct(100); }
    const lpPairEthBal = $('lpPairEthBal');
    if (lpPairEthBal) { lpPairEthBal.textContent = ethFmt; lpPairEthBal.onclick = () => fillLpPct(100); }
    const lpPairTokenBal = $('lpPairTokenBal');
    if (lpPairTokenBal) { lpPairTokenBal.textContent = tokenFmtLp; lpPairTokenBal.onclick = () => fillLpPairTokenMax(); }

    // Store treasury balance for ragequit estimate
    _coinData._treasuryEthBal = treasuryBal;

  } catch {}
}

function fillPct(pct) {
  if (_tradeMode === 'sale') {
    const isEth = _salePayToken.address === ZERO;
    const bal = isEth ? _ethBalance : _salePayBalance;
    if (bal <= 0n) return;
    let amt = bal * BigInt(pct) / 100n;
    // Only native ETH needs gas held back; spending 100% of an ERC-20 is fine.
    if (isEth && pct === 100 && amt > ethers.parseEther('0.005')) amt -= ethers.parseEther('0.005');
    if (amt <= 0n) return;
    $('salePayInput').value = ethers.formatUnits(amt, _salePayToken.decimals);
    onSalePayInput();
  } else if (_tradeMode === 'ragequit') {
    if (_sharesBalance <= 0n) return;
    let amt = _sharesBalance * BigInt(pct) / 100n;
    if (amt <= 0n) return;
    $('rqSharesInput').value = ethers.formatEther(amt);
    onRagequitInput();
  } else {
    // swap mode
    if (_payBalance <= 0n) return;
    let amt = _payBalance * BigInt(pct) / 100n;
    if (_swapDir === 'buy' && pct === 100 && amt > ethers.parseEther('0.005')) {
      amt -= ethers.parseEther('0.005');
    }
    if (amt <= 0n) return;
    $('swapPayInput').value = ethers.formatEther(amt);
    _exactOut = false;
    $('swapReceiveInput').value = '';
    scheduleQuote();
  }
}

let _vaultGalleryItems = [];   // { id, name, image } per decoded pass
let _nftLbKeyHandler = null;

function openNftLightbox(i) {
  const it = _vaultGalleryItems[i];
  if (!it) return;
  closeNftLightbox();
  const lb = document.createElement('div');

  lb.setAttribute('aria-modal', 'true');
  lb.setAttribute('aria-label', it.name);
  lb.innerHTML = `
    <button type="button" class="nft-lb-close" aria-label="Close" onclick="closeNftLightbox()">&times;</button>
    <div class="nft-lb-inner">
      <img src="${escAttr(it.image)}" alt="${escAttr(it.name)}">
      <div class="nft-lb-meta">
        ${escText(it.name)}
        &middot; <a href="https://opensea.io/item/ethereum/${VAULT_NFT_CONTRACT}/${it.id}" target="_blank" rel="noopener">OpenSea</a>
        &middot; <a href="https://etherscan.io/token/${VAULT_NFT_CONTRACT}?a=${it.id}" target="_blank" rel="noopener">Etherscan</a>
      </div>
    </div>`;
  // Backdrop closes; clicks on the art itself do not.
  lb.addEventListener('click', e => { if (e.target === lb || e.target.closest('.nft-lb-inner') === null) closeNftLightbox(); });
  _nftLbKeyHandler = e => {
    if (e.key === 'Escape') closeNftLightbox();
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const next = (i + (e.key === 'ArrowRight' ? 1 : -1) + _vaultGalleryItems.length) % _vaultGalleryItems.length;
      openNftLightbox(next);
    }
  };
  document.addEventListener('keydown', _nftLbKeyHandler);
  document.body.appendChild(lb);
  lb.querySelector('.nft-lb-close').focus();
}

function closeNftLightbox() {
  const el = $('nftLightbox');
  if (el) el.remove();
  if (_nftLbKeyHandler) { document.removeEventListener('keydown', _nftLbKeyHandler); _nftLbKeyHandler = null; }
}

function updateSaleBtnState() {
  const btn = $('saleBuyBtn');
  if (!btn || !_signer) return;
  const raw = ($('salePayInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    btn.textContent = 'Buy';
    btn.disabled = false;
    return;
  }
  try {
    const isEth = _salePayToken.address === ZERO;
    const payAmt = ethers.parseUnits(raw, _salePayToken.decimals);
    if (payAmt > (isEth ? _ethBalance : _salePayBalance)) {
      btn.textContent = `Insufficient ${_salePayToken.sym}`;
      btn.disabled = true;
      return;
    }
    // A token purchase cannot be sent until its route has been quoted.
    if (!isEth && !_salePlan) {
      btn.textContent = 'Finding route…';
      btn.disabled = true;
      return;
    }
    const isContSale = !!$('app')?.dataset?.contSale;
    if (!isContSale && _saleData && _saleData.remainingSupply <= 0n) {
      btn.textContent = 'Sale ended';
      btn.disabled = true;
      return;
    }
    if (!isContSale && _saleData) {
      const gross = payAmt * _saleData.forAmt / _saleData.tribAmt;
      if (gross > _saleData.remainingSupply) {
        btn.textContent = 'Exceeds remaining';
        btn.disabled = true;
        return;
      }
    }
  } catch {}
  btn.textContent = 'Buy';
  btn.disabled = false;
}

function updateSaleUsd() {
  const el = $('saleUsdEstimate');
  if (!el) return;
  const raw = ($('salePayInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0 || _ethUsdPrice <= 0) {
    el.textContent = '';
    return;
  }
  el.textContent = '~' + fmtUsd(Number(raw) * _ethUsdPrice);
}

// Sale shares are newly minted, so they dilute: the stake is measured against the
// supply this purchase would create.
function updateSaleStake() {
  const el = $('saleStake');
  if (!el) return;
  const raw = ($('saleReceiveInput')?.value || '').trim();
  let shares = 0n;
  if (raw && !isNaN(raw) && Number(raw) > 0) { try { shares = ethers.parseEther(raw); } catch {} }
  el.innerHTML = shares > 0n ? daoStakeHint(shares, true) : '';
}

function toggleSalePayMenu(ev) {
  if (ev) ev.stopPropagation();
  const menu = $('salePayMenu'), btn = $('salePayTokenBtn');
  if (!menu) return;
  const open = menu.hasAttribute('hidden');
  if (open) {
    menu.removeAttribute('hidden');
    for (const o of menu.querySelectorAll('.sale-pay-option')) {
      o.setAttribute('aria-selected', String(o.dataset.sym === _salePayToken.sym));
    }
    // One-shot: dismiss on the next click anywhere else.
    setTimeout(() => document.addEventListener('click', closeSalePayMenu, { once: true }), 0);
  } else {
    menu.setAttribute('hidden', '');
  }
  if (btn) btn.setAttribute('aria-expanded', String(open));
}

function closeSalePayMenu() {
  const menu = $('salePayMenu'), btn = $('salePayTokenBtn');
  if (menu) menu.setAttribute('hidden', '');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function pickSalePayToken(sym) {
  closeSalePayMenu();
  const next = SALE_PAY_TOKENS.find(t => t.sym === sym);
  if (!next || next.sym === _salePayToken.sym) return;
  const icon = $('salePayTokenIcon'), label = $('salePayTokenSym');
  if (icon) icon.innerHTML = next.icon;
  if (label) label.textContent = next.sym;
  onSalePayTokenChange(next);
}

// Switching the pay asset resets the amount: the old number was denominated in
// the old token, and silently reinterpreting "100" from USDC to ETH is how a
// user buys a thousand times what they meant to.
async function onSalePayTokenChange(next) {
  _salePayToken = next || SALE_PAY_TOKENS[0];

  _salePlan = null;
  $('salePayInput').value = '';
  $('saleReceiveInput').value = '';
  const q = $('saleQuote'); if (q) q.textContent = '';
  await refreshSalePayBalance();
  updateSaleBtnState();
}

async function refreshSalePayBalance() {
  const el = $('salePayBal');
  if (!el) return;
  if (_salePayToken.address === ZERO) {
    _salePayBalance = _ethBalance;
  } else if (_connectedAddress) {
    _salePayBalance = await withRPC(async rpc => {
      const t = new ethers.Contract(_salePayToken.address, ERC20_ABI, rpc);
      return await t.balanceOf(_connectedAddress);
    }).catch(() => 0n);
  } else {
    _salePayBalance = 0n;
  }
  el.textContent = _connectedAddress
    ? `Balance: ${fmtUnits(_salePayBalance, _salePayToken.decimals)} ${_salePayToken.sym}`
    : '';
}

function fmtUnits(v, dec) {
  const n = Number(ethers.formatUnits(v, dec));
  if (n === 0) return '0';
  if (n < 0.0001) return n.toExponential(2);
  return n.toLocaleString(undefined, { maximumFractionDigits: n < 1 ? 6 : 4 });
}

// Quote a non-ETH purchase: hop to ETH, then let the lens split that ETH between
// the flat mint and the pool. Sequenced so a slow response cannot overwrite a
// newer one - the displayed number and `_salePlan` must always agree.
async function quoteSalePayToken() {
  const raw = ($('salePayInput').value || '').trim();
  const recvEl = $('saleReceiveInput'), quoteEl = $('saleQuote');
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    _salePlan = null;
    if (recvEl) recvEl.value = '';
    updateSaleBtnState();
    return;
  }
  const seq = ++_salePlanSeq;
  const cfg = CONTINUOUS_SALES[$('app').dataset.dao?.toLowerCase()];
  const saleAddr = $('app').dataset.contSale;
  const shares = $('app').dataset.shares;
  if (!cfg || !saleAddr || !shares) return;

  const amountIn = ethers.parseUnits(raw, _salePayToken.decimals);
  if (quoteEl) quoteEl.textContent = 'Finding best route…';
  try {
    const plan = await withRPC(async rpc => {
      const deadline = BigInt(Math.floor(Date.now() / 1000) + 600);
      const lens = new ethers.Contract(COLLECTOL_LENS, COLLECTOL_LENS_IFACE, rpc);
      const cap = await lens.maxSaleEth(saleAddr, cfg.saleRate).catch(() => 0n);

      let ethBudget, legCalls = [], needsWrap = true, spend = amountIn;
      if (_salePayToken.address === WETH) {
        // Already WETH: no hop, and no wrap either - snwap sweeps it straight in.
        ethBudget = amountIn;
        needsWrap = false;
      } else {
        const q = new ethers.Contract(ZQUOTER_FULL, ZQUOTER_BUILD_IFACE, rpc);
        const r = await q.buildBestSwapViaETHMulticall(
          ZROUTER, _connectedAddress || ZERO, false,
          _salePayToken.address, ZERO, amountIn, SALE_SLIP_BPS, deadline);
        const gross = r.b.amountOut > 0n ? r.b.amountOut : r.a.amountOut;
        if (gross === 0n) throw new Error('no route to ETH');
        // Plan on the floor leg 1 is held to, never its estimate: the forwarder
        // spends what actually arrives, and the excess is refunded.
        ethBudget = gross * (10000n - SALE_SLIP_BPS) / 10000n;
        legCalls = Array.from(r.calls);
      }
      // snwap forwards `balance - 1` when it funds an executor from the router's
      // own token balance, so the forwarder always lands one wei short of what
      // was wrapped. Solve for what arrives.
      const planned = await lens.planExactIn(
        shares, cfg.feeOrHook ?? 30n, ethBudget - 1n, cfg.saleRate, cap, SALE_SLIP_BPS);
      return { planned, legCalls, ethBudget, needsWrap, amountIn: spend, deadline };
    });
    if (seq !== _salePlanSeq) return; // a newer keystroke won
    _salePlan = plan;
    if (recvEl) recvEl.value = ethers.formatEther(plan.planned.totalOut);
    if (quoteEl) {
      const mint = plan.planned.ethToSale, pool = plan.planned.poolAmount;
      const via = mint > 0n && pool > 0n ? 'sale + pool'
                : pool > 0n ? 'zAMM pool' : 'continuous sale';
      quoteEl.textContent = `${raw} ${_salePayToken.sym} → ${fmtETH(plan.ethBudget)} via ${via}`;
    }
  } catch (e) {
    if (seq !== _salePlanSeq) return;
    _salePlan = null;
    if (recvEl) recvEl.value = '';
    if (quoteEl) quoteEl.textContent = 'No route for that amount';
  }
  updateSaleBtnState();
}

function onSalePayInput() {
  _saleExactOut = false;
  updateSaleUsd();
  if (_salePayToken.address !== ZERO) { quoteSalePayToken(); return; }
  const raw = ($('salePayInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    $('saleReceiveInput').value = '';
    const lpEl = $('saleLpNote'); if (lpEl) lpEl.textContent = '';
    updateSaleStake();
    updateSaleBtnState();
    return;
  }
  const payAmt = ethers.parseEther(raw);

  // Continuous Sale: fixed rate (1 ETH = 1M shares)
  if ($('app').dataset.contSale) {
    const shares = payAmt * BigInt(CONT_SALE_SHARES_PER_ETH);
    $('saleReceiveInput').value = ethers.formatEther(shares);
    const lpEl = $('saleLpNote'); if (lpEl) lpEl.textContent = '';
    updateSaleStake();
    updateSaleBtnState();
    return;
  }

  if (!_saleData || !_saleData.forAmt || !_saleData.tribAmt) return;
  const gross = payAmt * _saleData.forAmt / _saleData.tribAmt;
  const lpBps = BigInt(_saleData.lpBps);
  const lpShares = gross * lpBps / 10000n;
  const net = gross - lpShares;
  $('saleReceiveInput').value = ethers.formatEther(net);
  if (lpBps > 0n) {
    $('saleLpNote').textContent = `~${fmtShares(net)} shares (${Number(lpBps)/100}% to LP)`;
  } else {
    $('saleLpNote').textContent = '';
  }
  updateSaleStake();
  updateSaleBtnState();
}

function onSaleReceiveInput() {
  _saleExactOut = true;
  const raw = ($('saleReceiveInput').value || '').trim();
  if (!raw || isNaN(raw) || Number(raw) <= 0) {
    $('salePayInput').value = '';
    updateSaleUsd();
    const lpEl = $('saleLpNote'); if (lpEl) lpEl.textContent = '';
    updateSaleStake();
    return;
  }

  // Continuous Sale: fixed rate (1M shares per ETH). Round the ETH up — flooring it
  // would quote a payment that mints fewer shares than the amount just typed.
  if ($('app').dataset.contSale) {
    const shares = ethers.parseEther(raw);
    const rate = BigInt(CONT_SALE_SHARES_PER_ETH);
    const ethNeeded = (shares + rate - 1n) / rate;
    $('salePayInput').value = ethers.formatEther(ethNeeded);
    updateSaleUsd();
    updateSaleStake();
    updateSaleBtnState();
    return;
  }

  if (!_saleData || !_saleData.forAmt || !_saleData.tribAmt) return;
  const buyAmt = ethers.parseEther(raw);
  const lpBps = BigInt(_saleData.lpBps);
  // grossNeeded = ceil(buyAmt * 10000 / (10000 - lpBps))
  const denom = 10000n - lpBps;
  if (denom === 0n) { $('salePayInput').value = ''; $('saleLpNote').textContent = ''; return; }
  const grossNeeded = (buyAmt * 10000n + denom - 1n) / denom;
  // payNeeded = ceil(grossNeeded * tribAmt / forAmt)
  const payNeeded = (grossNeeded * _saleData.tribAmt + _saleData.forAmt - 1n) / _saleData.forAmt;
  $('salePayInput').value = ethers.formatEther(payNeeded);
  updateSaleUsd();
  if (lpBps > 0n) {
    $('saleLpNote').textContent = `~${fmtShares(buyAmt)} shares (${Number(lpBps)/100}% to LP)`;
  } else {
    $('saleLpNote').textContent = '';
  }
  updateSaleStake();
  updateSaleBtnState();
}

function fillSweep() {
  if (!_saleData || !_saleData.forAmt || !_saleData.tribAmt || _saleData.remainingSupply <= 0n) return;
  const lpBps = BigInt(_saleData.lpBps);
  // remainingSupply is gross (includes LP portion), net to buyer = remaining * (10000 - lpBps) / 10000
  const net = _saleData.remainingSupply * (10000n - lpBps) / 10000n;
  // cost = ceil(remainingSupply * tribAmt / forAmt)
  const payNeeded = (_saleData.remainingSupply * _saleData.tribAmt + _saleData.forAmt - 1n) / _saleData.forAmt;
  $('saleReceiveInput').value = ethers.formatEther(net);
  $('salePayInput').value = ethers.formatEther(payNeeded);
  updateSaleUsd();
  _saleExactOut = false;
  if (lpBps > 0n) {
    $('saleLpNote').textContent = `~${fmtShares(net)} shares (${Number(lpBps)/100}% to LP)`;
  } else {
    $('saleLpNote').textContent = '';
  }
}
