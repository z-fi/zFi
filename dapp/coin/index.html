  if (!canPost) {
    box.innerHTML = `<div style="font-size:11px;color:var(--fg-dim);line-height:1.5">
      The chatroom is open to badge holders. Holding ${causeUnit()} alone does not carry one.</div>`;
    return;
  }
  box.innerHTML = `
    <div style="display:flex;gap:8px;align-items:flex-end">
      <textarea id="causeChatInput" rows="1" placeholder="Say something to the DAO" aria-label="Message"
        style="flex:1;padding:6px 0;background:none;border:none;border-bottom:1px solid var(--border-muted);color:var(--fg);font:inherit;font-size:12px;outline:none;resize:none;overflow:hidden"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();causeChatSend('${daoAddr}')}"></textarea>
      <button id="causeChatGo" class="swap-btn" style="font-size:11px;padding:5px 12px;white-space:nowrap" onclick="causeChatSend('${daoAddr}')">Post</button>
    </div>
    <div id="causeChatStatus" style="margin-top:6px"></div>`;
}

async function causeChatSend(daoAddr) {
  const input = $('causeChatInput'), btn = $('causeChatGo'), st = $('causeChatStatus');
  const say = (m, c) => { if (st) st.innerHTML = m ? `<div style="font-size:11px;color:${c || 'var(--fg-muted)'};line-height:1.5">${m}</div>` : ''; };
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const sgn = _signer || await connectWallet();
  if (!sgn) return;
  // The message goes on chain, so a double press would post it twice and pay twice.
  if (btn?.disabled) return;
  if (btn) btn.disabled = true;
  input.disabled = true;
  try {
    say('Confirm in your wallet\u2026');
    const tx = await new ethers.Contract(daoAddr, CAUSE_CHAT_ABI, sgn).chat(text);
    say(`Posting\u2026 <a href="https://etherscan.io/tx/${tx.hash}" target="_blank" style="color:inherit">view</a>`);
    await tx.wait();
    input.value = '';
    say('');
    await loadProposals(daoAddr);
  } catch (err) {
    if (err.code === 'ACTION_REJECTED' || (err.message || '').includes('user rejected')) say('');
    else say(escText(err.shortMessage || err.message || 'Failed to post.'), 'var(--red)');
  } finally {
    if ($('causeChatGo')) $('causeChatGo').disabled = false;
    if ($('causeChatInput')) $('causeChatInput').disabled = false;
  }
}

async function loadProposals(daoAddr) {
  const content = $('proposalsContent');
  if (!content) return;
  content.innerHTML = `<div class="activity-empty">${zfiLoadingSVG(32)} Loading...</div>`;
  try {
    const PROP_ABI = [
      'function getDAOWithDAICO(address dao, uint256 propStart, uint256 propCount, uint256 msgStart, uint256 msgCount, address[] treasuryTokens, address[] tribTokens) view returns (tuple(tuple(address dao, tuple(string,string,string,address,address,address,address) meta, tuple(uint96,uint96,uint96,uint64,uint64,uint16,bool,uint256,uint256,address) gov, tuple(uint256,uint256,uint256,uint256) supplies, tuple(tuple(address,uint256)[]) treasury, tuple(address,uint256,uint256,uint16,uint256,address[],uint32[])[] members, tuple(uint256 id, address proposer, uint8 state, uint48 snapshotBlock, uint64 createdAt, uint64 queuedAt, uint256 supplySnapshot, uint96 forVotes, uint96 againstVotes, uint96 abstainVotes, tuple(bool,address,uint256,bool,uint8,uint256,uint256) futarchy, tuple(address,uint8,uint256)[] voters)[] proposals, tuple(uint256 index, string text)[] messages) base, tuple(address,uint256,uint256,address,uint40,uint256,uint256,uint256,uint256,uint16,uint16,uint256)[] sales, tuple(address,address,uint128,uint64,uint256,uint256,uint256,uint256) tap))'
    ];
    // Both reads ride in one aggregate3 rather than two parallel eth_calls, each of which
    // would walk the RPC fallback list on its own.
    const helperIface = new ethers.Interface(PROP_ABI);
    const cfgIface = new ethers.Interface(['function config() view returns (uint64)']);
    const propRes = await mcAggregate([
      { target: VIEW_HELPER, allowFailure: true, callData: helperIface.encodeFunctionData('getDAOWithDAICO', [daoAddr, 0, 50, 0, 200, [], [ZERO]]) },
      { target: daoAddr, allowFailure: true, callData: cfgIface.encodeFunctionData('config') },
    ]);
    const result = mcDecode(propRes[0], helperIface, 'getDAOWithDAICO', null)?.[0];
    if (!result) throw new Error('DAO read failed');
    const daoConfig = mcDecode(propRes[1], cfgIface, 'config', [0n])[0];
    const proposals = result.base.proposals || [];
    const messages = result.base.messages || [];
    const currentConfig = Number(daoConfig);


    // Decode proposal messages to get descriptions
    function decodePropMsg(text) {
      const m = text.match(/<<<PROPOSAL_DATA\n([\s\S]*?)\nPROPOSAL_DATA>>>/);
      if (!m) return null;
      try {
        const d = JSON.parse(m[1]);
        if (d.type === 'PROPOSAL' && /^0x[0-9a-fA-F]{64}$/.test(d.nonce)) return d;
      } catch {}
      return null;
    }

    function computePropId(op, to, value, data, nonce, cfg) {
      const ac = new ethers.AbiCoder();
      const dh = ethers.keccak256(data);
      const enc = ac.encode(
        ['address','uint8','address','uint256','bytes32','bytes32','uint256'],
        [daoAddr, op, to, value, dh, nonce, cfg]
      );
      return BigInt(ethers.keccak256(enc));
    }

    // Build verification map
    const verMap = new Map();
    for (const msg of messages) {
      const pd = decodePropMsg(msg.text);
      if (!pd) continue;
      try {
        for (let c = currentConfig; c >= 0; c--) {
          const id = computePropId(pd.op, pd.to, BigInt(pd.value), pd.data, pd.nonce, BigInt(c));
          if (!verMap.has(id.toString())) verMap.set(id.toString(), pd.description);
        }
      } catch {}
    }

    const STATES = ['Unopened','Active','Queued','Succeeded','Defeated','Expired','Executed'];
    // gov tuple is positional: [threshold, minYes, quorumAbs, proposalTTL, timelockDelay, quorumBps, ...]
    const gov = result.base.gov || [];
    const propTTL = Number(gov[3] || 0);
    const timelockDelay = Number(gov[4] || 0);
    const quorumBps = Number(gov[5] || 0);
    // Reverse to show newest first
    const sorted = [...proposals].reverse();

    let propHtml = '';
    for (const p of sorted) {
      const id = p.id;
      const proposer = p.proposer;
      const state = Number(p.state);
      const forV = p.forVotes;
      const againstV = p.againstVotes;
      const abstainV = p.abstainVotes;

      const stateText = STATES[state] || `State ${state}`;
      const stateClass = stateText.toLowerCase();
      const desc = verMap.get(id.toString()) || `Proposal`;
      // Decimal proposal ids are unreadable; hex short-form matches how they appear elsewhere
      const idHex = '0x' + BigInt(id).toString(16).padStart(64, '0');
      const shortId = idHex.slice(0, 6) + '…' + idHex.slice(-4);

      const forF = parseFloat(ethers.formatUnits(forV, 18));
      const againstF = parseFloat(ethers.formatUnits(againstV, 18));
      const abstainF = parseFloat(ethers.formatUnits(abstainV, 18));
      const total = forF + againstF + abstainF;
      const forPct = total > 0 ? forF / total * 100 : 0;
      const againstPct = total > 0 ? againstF / total * 100 : 0;
      const abstainPct = total > 0 ? abstainF / total * 100 : 0;

      const proposerShort = proposer ? `${proposer.slice(0,6)}...${proposer.slice(-4)}` : '';

      // Bar is scaled to the snapshot supply, not to votes cast — a lone voter should
      // read as a sliver, not a full green bar.
      const snapshot = parseFloat(ethers.formatUnits(p.supplySnapshot || 0n, 18));
      const scale = snapshot > 0 ? snapshot : total;
      const w = v => scale > 0 ? (v / scale * 100) : 0;
      const turnoutPct = scale > 0 ? total / scale * 100 : 0;
      const quorumPct = quorumBps / 100;

      // Deadline: Active counts down to end of voting, Queued to end of timelock.
      const createdAt = Number(p.createdAt || 0);
      const queuedAt = Number(p.queuedAt || 0);
      const nowSec = Math.floor(Date.now() / 1000);
      let timeHTML = '';
      if (state === 1 && createdAt > 0 && propTTL > 0) {
        const ends = createdAt + propTTL;
        timeHTML = ends > nowSec
          ? `<span class="prop-clock" data-deadline="${ends}" data-prefix="Voting ends in " data-expired-text="Voting ended">Voting ends in ${fmtDur(ends - nowSec)}</span>`
          : `<span class="prop-clock">Voting ended</span>`;
      } else if (state === 2 && queuedAt > 0 && timelockDelay > 0) {
        const unlock = queuedAt + timelockDelay;
        timeHTML = unlock > nowSec
          ? `<span class="prop-clock" data-deadline="${unlock}" data-prefix="Executable in " data-expired-text="Ready to execute">Executable in ${fmtDur(unlock - nowSec)}</span>`
          : `<span class="prop-clock prop-clock-ready">Ready to execute</span>`;
      } else if (state === 2) {
        timeHTML = `<span class="prop-clock prop-clock-ready">Ready to execute</span>`;
      } else if (state === 3 && timelockDelay > 0 && queuedAt === 0) {
        timeHTML = `<span class="prop-clock">Awaiting queue</span>`;
      }

      // Long descriptions are clamped so one verbose proposal cannot bury the rest of
      // the list. The threshold is roughly three lines at this width.
      const isLong = desc.length > 180;

      // "0.6% turnout / 5% quorum" makes the reader do the comparison that decides the
      // proposal. State the verdict instead.
      const quorumMet = quorumPct > 0 && turnoutPct >= quorumPct;
      const turnoutText = quorumPct > 0
        ? (quorumMet
            ? `quorum met &middot; ${turnoutPct.toFixed(1)}% turnout`
            : `${turnoutPct.toFixed(1)}% of ${quorumPct}% quorum`)
        : `${turnoutPct.toFixed(1)}% turnout`;

      const tally = (label, v, cls) =>
        `<span class="${v > 0 ? '' : 'zero'}">${cls ? `<span class="${cls}">${label}</span>` : label} ${v.toLocaleString(undefined,{maximumFractionDigits:0})}</span>`;

      // Voting, where the proposal is rather than on another page. `voters` comes back in
      // the same read that drew the bar, so whether this wallet has already voted is known
      // without asking the chain again — and a holder who has voted is shown what they
      // voted rather than a pair of buttons that would revert.
      const mine = _connectedAddress
        ? Array.from(p.voters || []).find(v => String(v[0]).toLowerCase() === _connectedAddress.toLowerCase())
        : null;
      const myWeight = mine ? Number(ethers.formatEther(mine[2] ?? 0n)) : 0;
      const SUPPORT = { 0: 'against', 1: 'for', 2: 'abstain' };
      let voteHTML = '';
      if (state === 1) {                       // Active: the only state a vote lands in
        if (mine) {
          voteHTML = `<div class="prop-voted">You voted <b class="${SUPPORT[Number(mine[1])] || ''}">${SUPPORT[Number(mine[1])] || 'unknown'}</b>${myWeight > 0 ? ` with ${myWeight.toLocaleString(undefined, { maximumFractionDigits: 0 })}` : ''}</div>`;
        } else {
          const idStr = id.toString();
          voteHTML = `<div class="prop-vote">
            <button type="button" class="prop-vote-btn for" onclick="causeVote('${daoAddr}','${idStr}',1,this)">For</button>
            <button type="button" class="prop-vote-btn against" onclick="causeVote('${daoAddr}','${idStr}',0,this)">Against</button>
            <button type="button" class="prop-vote-btn" onclick="causeVote('${daoAddr}','${idStr}',2,this)">Abstain</button>
          </div>`;
        }
      }

      const metaBits = [];
      if (timeHTML) metaBits.push(timeHTML);
      if (createdAt > 0) metaBits.push(`<span title="${new Date(createdAt * 1000).toLocaleString()}">${fmtAgo(createdAt)}</span>`);
      if (proposerShort) metaBits.push(`<a href="https://etherscan.io/address/${proposer}" target="_blank">${proposerShort}</a>`);

      propHtml += `<div class="prop-item${state === 1 || state === 2 ? ' is-live' : ''}">
        <div class="prop-head">
          <div class="prop-desc">
            <div class="prop-desc-body${isLong ? ' clamped' : ''}">${escText(desc)}</div>
            ${isLong ? `<button type="button" class="prop-more" data-prop-more>Show more</button>` : ''}
          </div>
          <span class="prop-state ${stateClass}">${stateText}</span>
        </div>
        ${scale > 0 ? `<div class="prop-bar" title="${turnoutPct.toFixed(1)}% of ${fmtShares(p.supplySnapshot || 0n)} shares voted${quorumPct > 0 ? ` &middot; ${quorumPct}% quorum` : ''}">
          ${forF > 0 ? `<div class="prop-bar-for" style="width:${w(forF)}%"></div>` : ''}
          ${againstF > 0 ? `<div class="prop-bar-against" style="width:${w(againstF)}%"></div>` : ''}
          ${abstainF > 0 ? `<div class="prop-bar-abstain" style="width:${w(abstainF)}%"></div>` : ''}
          ${quorumPct > 0 && quorumPct < 100 ? `<div class="prop-bar-quorum" style="left:${quorumPct}%" title="${quorumPct}% quorum"></div>` : ''}
        </div>` : ''}
        <div class="prop-votes">
          ${tally('For', forF, 'for')}
          ${tally('Against', againstF, 'against')}
          ${tally('Abstain', abstainF, '')}
          ${scale > 0 ? `<span class="prop-turnout${quorumMet ? ' met' : ''}" title="${turnoutPct.toFixed(1)}% of ${fmtShares(p.supplySnapshot || 0n)} shares voted">${turnoutText}</span>` : ''}
        </div>
        ${voteHTML}
        <div class="prop-meta">
          ${metaBits.join('<span class="sep">&middot;</span>')}
          <span class="prop-id" title="Proposal ID ${id.toString()}">#${shortId}</span>
        </div>
      </div>`;
    }

    if (!propHtml) propHtml = '<div class="activity-empty">No proposals yet</div>';

    // Discussion — the same response already carried the DAO's messages, so this is free.
    // Messages that are proposal payloads are skipped: each is already on screen below as
    // the proposal it encodes, and its raw JSON is several hundred characters of noise.
    const chat = messages.filter(m => !/<<<PROPOSAL_DATA[\s\S]*PROPOSAL_DATA>>>/.test(m.text || ''));
    let chatHtml = '';
    for (const m of [...chat].reverse()) {
      // Strip machine-readable tags; they are UI plumbing, not something to read.
      const body = String(m.text || '').replace(/<<<[\s\S]*?>>>/g, '').trim();
      if (!body) continue;
      chatHtml += `<div class="prop-chat-item"><span class="prop-chat-idx">#${Number(m.index)}</span><div class="prop-chat-main"><div class="prop-chat-body">${linkifyChat(body)}</div></div></div>`;
    }

    // Chat first: it is what someone opening the drawer is here to read, and it dates the
    // proposals underneath. Each message clamps to three lines so a long thread cannot
    // bury them.
    let html = '';
    html += `<div class="prop-sec-head prop-sec-first">Discussion <span>${chat.length}</span></div>`;
    // The drawer could read the room and not speak in it, which sent anyone with something
    // to say to the DAO page for one line of text. Moloch gates chat() on a badge rather
    // than on shares, so the box asks that question and says so when the answer is no.
    html += `<div id="causeChatBox" style="margin:0 14px 10px"></div>`;
    if (chatHtml) html += `<div class="prop-chat-list">${chatHtml}</div>`;
    html += `<div class="prop-sec-head${chatHtml ? '' : ' prop-sec-first'}">Proposals <span>${proposals.length}</span></div>`;
    html += propHtml;
    html += `<div style="text-align:center;margin-top:14px"><a href="../dao/#/dao/1/${daoAddr}" style="font-size:11px;color:var(--fg-muted)">Open, queue and execute in the DAO page</a></div>`;
    content.innerHTML = html;
    // Fills #causeChatBox, which only exists in the markup above. The badge read runs
    // after the paint so a slow lookup delays the compose box and never the messages.
    causeChatCompose(daoAddr).catch(() => {});

    // Wired after render because the list is rebuilt wholesale via innerHTML, which
    // discards any handler attached to the previous nodes.

    // A message only gets an expander if its text actually overflows the clamp —
    // measured, because the text length that overflows depends on the rendered width.
    content.querySelectorAll('.prop-chat-main').forEach(main => {
      const body = main.querySelector('.prop-chat-body');
      if (!body || body.scrollHeight <= body.clientHeight + 1) return;
      main.classList.add('has-more');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'prop-more';
      btn.textContent = 'Show more';
      btn.addEventListener('click', () => {
        btn.textContent = main.classList.toggle('open') ? 'Show less' : 'Show more';
      });
      main.appendChild(btn);
    });

    content.querySelectorAll('[data-prop-more]').forEach(btn => {
      const body = btn.previousElementSibling;
      if (!body) return;
      btn.addEventListener('click', () => {
        btn.textContent = body.classList.toggle('clamped') ? 'Show more' : 'Show less';
      });
    });

    // Fifteen settled proposals push the live one off the screen and make the drawer
    // scroll for a page. Show the recent ones, keep the rest one click away.
    collapseList(content, '.prop-chat-item', 4, 'discussion messages');
    collapseList(content, '.prop-item', 5, 'proposals');

    startPropCountdowns();
  } catch (e) {
    console.error('loadProposals error:', e);
    content.innerHTML = '<div class="activity-empty">Failed to load proposals</div>';
  }
}

// What a buy actually buys: a share of the DAO. The quote answers "how many tokens",
// which is the wrong unit for a collective that votes and holds a treasury — a number
// with no denominator tells you nothing about what you would own.
//
// Minting dilutes, so the new shares enlarge the supply they are measured against; a
// pool buy moves existing shares and leaves supply alone. Getting that wrong would
// overstate a mint, which is the route most buys here take.
function daoStakeHint(sharesWei, minting) {
  try {
    if (!sharesWei || sharesWei <= 0n) return '';
    const supply = BigInt($('app')?.dataset?.totalSupply || '0');
    if (supply <= 0n) return '';
    const after = minting ? supply + sharesWei : supply;
    const pct = Number((sharesWei * 1000000n) / after) / 10000;
    if (!isFinite(pct) || pct <= 0) return '';
    const fmtPct = p => p >= 1 ? p.toFixed(2) + '%' : p >= 0.01 ? p.toFixed(3) + '%' : '<0.01%';
    // If they already hold shares, the number that matters is where they land, not the
    // size of this one purchase.
    const held = _sharesBalance || 0n;
    const total = held > 0n ? Number(((held + sharesWei) * 1000000n) / after) / 10000 : 0;
    return `<div class="swap-stake">&asymp; ${fmtPct(pct)} of the DAO`
      + (held > 0n ? ` &middot; you would hold ${fmtPct(total)}` : '')
      + `</span><div style="color:var(--fg-dim);margin-top:3px">Reverts rather than filling worse than ${_causeSlipPct}%.</div>`;
  } catch { return ''; }
}

// Jump to the trade card with a starter amount already in it. A visitor who taps Buy
// has decided to buy; landing them on an empty input to type a number they have no
// reference for is a second decision they did not ask for. 0.01 ETH is small enough to
// be a try rather than a commitment, and it is theirs to edit before confirming.
const QUICK_BUY_ETH = '0.01';
function coinQuickBuy() {
  const tile = document.querySelector('.swap-tile');
  if (!tile) return;
  // The sale tab exists only while a DAICO sale is open; otherwise buying is the Swap
  // tab, which routes between the continuous mint and the pool on its own.
  const useSale = !!$('modeTabSale');
  if (typeof setTradeMode === 'function') setTradeMode(useSale ? 'sale' : 'swap');
  if (!useSale && typeof setSwapDir === 'function') setSwapDir('buy');

  const input = $(useSale ? 'salePayInput' : 'swapPayInput');
  if (input) {
    if (!input.value) {
      input.value = QUICK_BUY_ETH;
      if (typeof (useSale ? onSalePayInput : onPayInput) === 'function') (useSale ? onSalePayInput : onPayInput)();
    }
  }
  tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
  tile.classList.remove('flash');
  void tile.offsetWidth;   // restart the animation on a repeat tap
  tile.classList.add('flash');
  // Focus after the scroll settles: focusing first makes the browser jump instantly and
  // fight the smooth scroll. Selected, so typing over the starter amount is one action.
  setTimeout(() => { if (input) { input.focus({ preventScroll: true }); input.select?.(); } }, 450);
}

// ---- Keeper panel ----
// Renders the two permissionless chores and, when one is unavailable, why. A greyed
// button with no reason attached is just a dead end; the reason is the useful half.
let _keeperAddr = '';
function renderKeeperPanel(keeperAddr, k, vaultBal) {
  const el = $('keeperPanel');
  if (!el || !keeperAddr || !k) return;
  _keeperAddr = keeperAddr;

  const pending = k.pendingFees ?? 0n;
  const short = k.untilNextPass ?? 0n;
  const claimsLeft = k.remainingClaims ?? 0n;
  const remintsLeft = k.remainingRemints ?? 0n;
  const stopped = !!k.stopped;
  const canClaim = !!k.canClaim, canRemint = !!k.canRemint;

  // A goal or a shortfall wants round numbers, not a balance's full precision.
  const eth4 = wei => Number(ethers.formatEther(wei)).toFixed(4).replace(/0+$/, '').replace(/\.$/, '');

  // Why not, in the order a reader would hit them: paused beats spent permits beats
  // "nothing to do yet".
  const claimWhy = stopped ? 'Paused by the guardian'
    : claimsLeft === 0n ? 'No claim permits left — needs a new grant'
    : pending === 0n ? 'No fees have accrued since the last claim'
    : `Sweeps pass #156 fees into the vault. You pay gas only.`;
  const remintWhy = stopped ? 'Paused by the guardian'
    : remintsLeft === 0n ? 'No remint permits left — needs a new grant'
    : short > 0n ? `Vault needs ${eth4(short)} ETH more`
    : `Spends 1 ETH of the vault on another pass. You pay gas only.`;

  const action = (id, label, ok, why, fn, left) => `
    <div class="keeper-action">
      <button type="button" class="keeper-btn${ok ? ' ready' : ''}" id="${id}" ${ok ? '' : 'disabled'} onclick="${fn}()">${label}</button>
      <div class="keeper-why">${why}${left > 0n && left < 1000n ? ` &middot; ${left} use${left === 1n ? '' : 's'} left` : ''}</div>
    </div>`;

  el.innerHTML = `
    <div class="keeper-head">
      <a href="https://etherscan.io/address/${escAttr(keeperAddr)}" target="_blank" rel="noopener" title="FWCKeeper — holds the DAO's fee-claim and remint permits">Keeper</a>
      <span>&middot; anyone can run these</span>
    </div>
    <div class="keeper-actions">
      ${action('keeperClaimBtn', pending > 0n ? `Claim ${eth4(pending)} ETH fees` : 'Claim fees', canClaim, claimWhy, 'keeperClaimFees', claimsLeft)}
      ${action('keeperRemintBtn', 'Buy next pass', canRemint, remintWhy, 'keeperRemint', remintsLeft)}
    </div>
    <div class="keeper-status" id="keeperStatus"></div>`;
  el.style.display = '';
}

async function _keeperSend(fnName, label) {
  if (!_signer) { if (typeof connectWallet === 'function') connectWallet(); return; }
  const statusEl = $('keeperStatus');
  const set = html => { if (statusEl) statusEl.innerHTML = html; };
  set(`<span>${zfiLoadingSVG(14)} Confirming...</span>`);
  try {
    const keeper = new ethers.Contract(_keeperAddr, KEEPER_ABI, _signer);
    // Simulated first: both calls revert on a condition the panel already reads, so a
    // stale button costs the reader a rejected wallet prompt instead of a failed tx.
    await keeper[fnName].staticCall();
    const tx = await keeper[fnName]();
    set(`<span>${zfiLoadingSVG(14)} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></span>`);
    await tx.wait();
    set(`<span style="color:var(--green)">${label} <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">View tx</a></span>`);
    // The vault balance, the pass count and the progress bar all just moved.
    setTimeout(() => { if (typeof _refreshVaultStats === 'function') _refreshVaultStats(); }, 2000);
  } catch (e) {
    if ((e.message || '').includes('user rejected') || e.code === 'ACTION_REJECTED') {
      set('<span style="color:var(--fg-dim)">Cancelled</span>');
    } else {
      const msg = e.shortMessage || e.reason || (e.message || '').split('\n')[0] || '';
      const known = /NothingPending/.test(msg) ? 'Nothing has accrued yet'
        : /VaultUnderfunded/.test(msg) ? 'The vault is short of a full pass price'
        : /NoPermit/.test(msg) ? 'The permit is spent — governance must grant another'
        : /Stopped/.test(msg) ? 'The keeper is paused by the guardian'
        : msg.length < 100 ? msg : 'Transaction failed';
      set(`<span style="color:var(--red)">${escText(known)}</span>`);
    }
  }
}
function keeperClaimFees() { return _keeperSend('claimFees', 'Fees claimed into the vault.'); }
function keeperRemint() { return _keeperSend('remint', 'Pass purchased for the vault.'); }

function pctBar(pct, color) {
  color = color || 'var(--green)';
  return `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pct,100).toFixed(1)}%;background:${color}"></div></div>`;
}



// Inner HTML of #causeMeters. Shared by first render and the live refresh so the
// two can never drift.
function causeMeter(label, value, pct, full) {
  return `<div class="cause-meter">
    <div class="cause-meter-head"><span>${label}</span><span>${value}</span></div>
    <div class="cause-meter-track"><div class="cause-meter-fill${full ? ' is-full' : ''}" style="width:${Math.max(Math.min(pct, 100), 0)}%"></div></div>
  </div>`;
}

// Inner HTML of #causeMeters. Shared by first render and the live refresh so the
// two can never drift.
function causeMetersHTML(raisedWei, targetWei, treasuryWei, healing) {
  // A ShareSale ceiling is what is left of a draining allowance, so redeeming lowers it.
  // An offering's is a supply target the sale keeps whatever holders do.
  const capNote = healing
    ? `The total this sale may raise, at the fixed price. Redeemed ${causeUnit()} return their room to it, so it does not move.`
    : 'What the sale can still reach: shares already sold plus every share it may still mint, at the fixed price. Redeeming burns shares, and the sale cannot re-mint them, so this can fall.';
  const raisedEth = Number(ethers.formatEther(raisedWei));
  let html = '';

  if (targetWei > 0n) {
    const pct = Number(raisedWei * 10000n / targetWei) / 100;
    const targetEth = Number(ethers.formatEther(targetWei));
    if (pct >= 100) {
      // A bar with nowhere left to go is a progress meter reporting that there is no
      // progress to make. What is true of a funded cause is that it has its money and is
      // getting on with it — the treasury is live, the tap is running, the token trades.
      // So it states the raise and stands down, rather than drawing a finished race.
      html += `<div style="font-size:11px;color:var(--fg-muted);margin-bottom:14px">
        <b style="color:var(--fg)">${fmtNum(raisedEth)}</b> ETH raised &middot; fully funded</div>`;
    } else {
      html += causeMeter(
        `<span title="${capNote}">funded</span>`,
        `<b>${fmtNum(raisedEth)}</b> / ${fmtNum(targetEth)} ETH &middot; ${pct.toFixed(1)}%`,
        pct, false
      );
    }
  } else if (raisedWei > 0n) {
    html += causeMeter('funded', `<b>${fmtNum(raisedEth)}</b> ETH &middot; open-ended`, 100, false);
  }

  // Only the funding bar earns its space: the headline already carries the treasury,
  // and how much the tap has drawn is the difference between the tap panel's budget and
  // its Remaining. A second bar sitting at ~100% until late in a vest said neither.

  return html;
}

// How long what is in the treasury lasts at the current tap rate.
//
// This is NOT runway while the sale is still filling: a cause that has raised 1% of
// its goal will always show a short number, because the rate is sized to the whole
// raise and the treasury only holds the part that has arrived. Calling that "runway"
// and painting it red reads as "this project is dying" when it actually means "the
// tap is faster than the money in the door" — true of every healthy cause on day one.
// So the alarm is reserved for a sale that has finished, where the figure really is
// how long the beneficiary can keep going.
function causeRunwayHTML(treasuryWei, ratePerSec, saleEnded) {
  if (ratePerSec <= 0n || treasuryWei <= 0n) return '';
  const days = Number(treasuryWei / ratePerSec) / 86400;
  if (!isFinite(days) || days <= 0) return '';
  const txt = days >= 365 ? '>1 year' : days >= 1 ? `~${Math.round(days)} days` : 'under a day';
  const label = saleEnded
    ? `${txt} of runway at this rate`
    : `treasury covers ${txt} at this rate &middot; grows as the sale fills`;
  return `<span style="color:${saleEnded && days < 14 ? 'var(--red)' : 'inherit'}">${label}</span>`;
}

// A balance is read, not computed against: six decimals of ETH is noise nobody acts on,
// and it fights the four-decimal figures the progress bar and the keeper panel show for
// the same money. Dust still gets the precision it needs, or it would read as zero.
function fmtEthBal(v) {
  if (v >= 0.0001) return v.toFixed(4);
  return fmtNum(v);
}
function fmtETH(wei) {
  return fmtEthBal(Number(ethers.formatEther(wei))) + ' ETH';
}
// A share price is quoted, read aloud and compared — so it has to be a number a
// person can hold in their head. Sub-microether prices fall off fmtNum's exponential
// cliff and render as "3.33e-7 ETH", which tells a buyer nothing about what a share
// costs. Gwei carries the same value in two friendly digits.
function fmtPriceWei(wei) {
  if (wei <= 0n) return '0 ETH';
  const eth = Number(ethers.formatEther(wei));
  if (eth >= 0.0001) return fmtNum(eth) + ' ETH';
  const gwei = Number(wei) / 1e9;
  if (gwei >= 0.01) return (gwei >= 100 ? Math.round(gwei).toLocaleString() : Number(gwei.toPrecision(3)).toString()) + ' gwei';
  return wei.toString() + ' wei';
}

// The other half of a price: how much of the thing one ETH actually buys.
function fmtSharesPerEth(price) {
  if (price <= 0n) return '';
  const per = Number(ethers.formatEther(ethers.parseEther('1') * ethers.parseEther('1') / price));
  if (per >= 1e6) return (per / 1e6).toFixed(per >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M per ETH';
  if (per >= 1e3) return Math.round(per / 1e3) + 'k per ETH';
  if (per >= 1) return Math.round(per).toLocaleString() + ' per ETH';
  return '';
}

function fmtNum(v) {
  if (v >= 1) return v.toFixed(4);
  if (v >= 0.001) return v.toFixed(6);
  if (v >= 0.000001) return v.toFixed(8);
  if (v > 0) return v.toExponential(2);
  return '0';
}

function fmtShares(wei) {
  const v = Number(ethers.formatEther(wei));
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function fmtMcap(ethVal) {
  if (ethVal >= 1000) return (ethVal / 1000).toFixed(1) + 'K ETH';
  if (ethVal >= 1) return ethVal.toFixed(2) + ' ETH';
  if (ethVal >= 0.01) return ethVal.toFixed(4) + ' ETH';
  return ethVal.toFixed(6) + ' ETH';
}

function fmtUsd(val) {
  if (val >= 1e6) return '$' + (val / 1e6).toFixed(2) + 'M';
  if (val >= 1e3) return '$' + (val / 1e3).toFixed(1) + 'K';
  if (val >= 1) return '$' + val.toFixed(2);
  return '$' + val.toFixed(2);
}

// Per-token prices are tiny — keep significant digits instead of flooring to $0.00
function fmtUsdPrice(val) {
  if (!(val > 0)) return '';
  if (val >= 1) return '$' + val.toFixed(2);
  if (val >= 0.01) return '$' + val.toFixed(4);
  if (val >= 1e-8) return '$' + val.toPrecision(3).replace(/0+$/, '').replace(/\.$/, '');
  return '$' + val.toExponential(2);
}

function fmtEthPrice(v) {
  if (!(v > 0)) return '';
  if (v >= 1) return v.toFixed(4) + ' ETH';
  if (v >= 0.000001) return v.toFixed(9).replace(/0+$/, '') + ' ETH';
  return v.toExponential(2) + ' ETH';
}

let _ethUsdPrice = 0;
let _ethUsdTs = 0;
// Every read below is an eth_call, so they belong in one aggregate3 rather than as
// separate requests that each walk the RPC fallback list independently.
async function mcAggregate(calls) {
  if (!calls.length) return [];
  return await withRPC(async rpc => {
    const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
    return await mc.aggregate3(calls);
  });
}
// Run `fn` over `items` with at most `n` in flight. Chunked reads used to run one
// batch per round trip in a `for` loop, so a gallery of 200 was 40 sequential RPC
// waits; the chunking is there to bound response size, not to serialise it.
async function poolMap(items, n, fn) {
  const out = new Array(items.length);
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    for (let i = next++; i < items.length; i = next++) out[i] = await fn(items[i], i);
  }));
  return out;
}

// Gallery metadata is best-effort: a card whose document never arrives still has its
// name, symbol and both prices from the LaunchInfo row, and falls back to a generated
// mark. ipfsFetchJson walks every gateway before giving up, so without a bound one
// unreachable pin holds the whole grid for as long as that walk takes. The fetch is
// left running — it fills the cache for the next visit.
function metaSoon(p, ms) {
  return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]).catch(() => null);
}

// Decode one aggregate3 slot, or fall back if the call reverted.
function mcDecode(res, iface, fn, fallback) {
  try {
    return (res && res.success) ? iface.decodeFunctionResult(fn, res.returnData) : fallback;
  } catch { return fallback; }
}

// Read the cached ETH price without issuing a call (0 when stale), and fill the cache
// from an answer the page already fetched in a batch.
function ethUsdCached() {
  return (_ethUsdPrice > 0 && Date.now() - _ethUsdTs < 5 * 60 * 1000) ? _ethUsdPrice : 0;
}
function setEthUsdFromAnswer(answer) {
  if (answer === null || answer === undefined) return _ethUsdPrice;
  _ethUsdPrice = Number(answer) / 1e8;
  _ethUsdTs = Date.now();
  return _ethUsdPrice;
}

async function getEthUsd() {
  if (_ethUsdPrice > 0 && Date.now() - _ethUsdTs < 5 * 60 * 1000) return _ethUsdPrice;
  try {
    const price = await withRPC(async rpc => {
      const cl = new ethers.Contract(CHAINLINK_ETH_USD, CHAINLINK_ABI, rpc);
      return await cl.latestAnswer();
    });
    _ethUsdPrice = Number(price) / 1e8;
    _ethUsdTs = Date.now();
  } catch(e) {}
  return _ethUsdPrice;
}

// ==================== ROUTER ====================

let _renderGen = 0;
let _saleRefreshInterval = null;
let _vaultRefreshTimer = null;
// Set by the collector page so a keeper action can re-read the vault immediately.
let _refreshVaultStats = null;
let _saleCountdownInterval = null;

// Polling that only runs while the tab is on screen. A backgrounded coin page used to
// keep spending its RPC budget on stats nobody was looking at, and the resulting
// rate-limiting is what made reads start failing once the tab came back. Skipping the
// hidden ticks and doing one catch-up refresh on re-show keeps the display just as
// current from the user's point of view.
const _pollers = new Set();
function startPoller(fn, ms) {
  const id = setInterval(() => { if (!document.hidden) fn(); }, ms);
  _pollers.add(fn);
  return id;
}
function stopPoller(fn) { _pollers.delete(fn); }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) for (const fn of _pollers) { try { fn(); } catch {} }
});

async function refreshSaleStats() {
  const daoAddr = $('app')?.dataset?.dao;
  if (!daoAddr || !_coinData) return;
  const gen = _renderGen;
  try {
    const data = await withRPC(async rpc => {
      const helper = new ethers.Contract(VIEW_HELPER, GET_DAICO_ABI, rpc);
      return await helper.getDAICO(daoAddr, [ZERO]);
    });
    if (gen !== _renderGen) return; // navigated away
    const sale = data.sales && data.sales.length > 0 ? data.sales[0] : null;
    if (!sale) return;
    _coinData = data;
    _saleData = sale;
    const refTeamBps = _coinMeta && _coinMeta.teamBps ? BigInt(_coinMeta.teamBps) : 0n;
    const totalSale = refTeamBps > 0n ? sale.totalSupply * (10000n - refTeamBps) / 10000n : sale.totalSupply;
    const sold = totalSale > sale.remainingSupply ? totalSale - sale.remainingSupply : 0n;
    const salePct = totalSale > 0n ? Number((sold * 10000n) / totalSale) / 100 : 0;
    const treasuryETH = sale.treasuryBalance;
    const ethRaised = sale.forAmt > 0n ? sold * sale.tribAmt / sale.forAmt : 0n;
    const ethIco = `<svg width="10" height="10" viewBox="0 0 256 417" fill="currentColor" opacity="0.5" style="vertical-align:-1px"><path d="M127.961 0l-2.795 9.5v275.668l2.795 2.79 127.962-75.638z"/><path d="M127.962 0L0 212.32l127.962 75.639V154.158z"/><path d="M127.961 312.187l-1.575 1.92V414.55l1.575 4.6L256 236.587z"/><path d="M127.962 419.15V312.187L0 236.587z"/></svg>`;
    const soldEl = $('saleSoldVal');
    if (soldEl) soldEl.innerHTML = `${fmtShares(sold)} / ${fmtShares(totalSale)} <span style="color:var(--green);font-weight:600">(${salePct.toFixed(1)}%)</span>`;
    const barEl = $('salePctBar');
    if (barEl) barEl.innerHTML = pctBar(salePct, 'var(--green)');
    const rEl = $('saleRaisedRow');
    if (rEl) rEl.innerHTML = ethRaised > 0n ? `<div class="stat-row"><span class="stat-label">ETH raised</span><span class="stat-value">${fmtETH(ethRaised)}</span></div>` : '';
    // Refresh mint progress for FW Collector
    const tap = data.tap;
    const minterAddr = tap && tap.ops && tap.ops !== ZERO ? tap.ops : null;
    if (minterAddr) {
      try {
        // One multicall instead of three separate reads: this runs on a 20s timer, and
        // going through withRPC means a dead provider fails over instead of throwing
        // every tick the way a single pinned provider did.
        const minterI = new ethers.Interface(['function nftCount() view returns (uint256)', 'function totalLockedEth() view returns (uint256)']);
        const [nftCount, lockedEth, minterBal] = await withRPC(async rpc => {
          const mc = new ethers.Contract(MC3, MC3_ABI, rpc);
          const res = await mc.aggregate3([
            { target: minterAddr, allowFailure: true, callData: minterI.encodeFunctionData('nftCount', []) },
            { target: minterAddr, allowFailure: true, callData: minterI.encodeFunctionData('totalLockedEth', []) },
            { target: MC3, allowFailure: true, callData: _mc3Iface.encodeFunctionData('getEthBalance', [minterAddr]) },
          ]);
          return [
            res[0].success ? minterI.decodeFunctionResult('nftCount', res[0].returnData)[0] : 0n,
            res[1].success ? minterI.decodeFunctionResult('totalLockedEth', res[1].returnData)[0] : 0n,
            res[2].success ? _mc3Iface.decodeFunctionResult('getEthBalance', res[2].returnData)[0] : 0n,
          ];
        });
        if (gen !== _renderGen) return;
        const mintProgress = $('saleMintProgress');
        if (mintProgress) {
          const MINT_PRICE = ethers.parseEther('1');
          const available = minterBal + treasuryETH - lockedEth;
          const progressETH = available > 0n ? available : 0n;
          const progressPct = Number(progressETH * 10000n / MINT_PRICE) / 100;
          const nfts = Number(nftCount);
          const nextN = nfts + 1;
          mintProgress.innerHTML = `
            <div style="margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--surface-raised, var(--surface))">
              <div class="stat-row"><span class="stat-label" style="font-size:12px">Progress to NFT #${nextN}</span><span class="stat-value" style="font-size:12px;color:var(--green)">${fmtETH(progressETH)} / ${ethers.formatEther(MINT_PRICE)} ${ethIco}</span></div>
              ${pctBar(Math.min(progressPct, 100), 'var(--green)')}
              <div style="font-size:10px;color:var(--fg-dim);margin-top:4px">${nfts > 0 ? `${nfts} NFT${nfts > 1 ? 's' : ''} minted` : 'Treasury ETH flows to minter to purchase FW S02 NFTs'}</div>
            </div>`;
        }
        const tmEl = $('treasuryMinterBal');
        if (tmEl) tmEl.innerHTML = `${fmtETH(minterBal)}`;
      } catch (e) { console.error('Mint progress refresh failed:', e); }
    }
    loadBalances();
    updateSaleBtnState();
  } catch {}
}

function route() {
  // NOTE: an `_activityInterval` clear used to live here. Its declaration went away
  // with the indexer-backed Pool Activity table, but this reference didn't — and an
  // undeclared identifier throws ReferenceError rather than reading as undefined,
  // so route() died before rendering and every coin page came up blank.
  // A route change must not leave the gallery overlay pinned over the next page.
  closeNftLightbox();
  _vaultGalleryItems = [];
  if (_vaultRefreshTimer) { clearInterval(_vaultRefreshTimer); _vaultRefreshTimer = null; }
  _refreshVaultStats = null;
  if (_saleRefreshInterval) { clearInterval(_saleRefreshInterval); _saleRefreshInterval = null; }
  if (_saleCountdownInterval) { clearInterval(_saleCountdownInterval); _saleCountdownInterval = null; }
  if (_causeRefreshTimer) { clearInterval(_causeRefreshTimer); _causeRefreshTimer = null; }
  _pollers.clear();
  _causeBuyMode = 'shares';
  if (_lcQuoteTimer) { clearTimeout(_lcQuoteTimer); _lcQuoteTimer = null; }
  ++_lcQuoteSeq;
  const hash = location.hash.replace('#','').trim();
  if (hash && hash.startsWith('0x') && hash.length === 42) {
    renderCoinPage(hash);
  } else {
    renderGallery();
  }
}

window.addEventListener('hashchange', route);

// ==================== GALLERY ====================

// Stale-while-revalidate cache. Gallery state changes slowly (minutes), but the cold-load
// pipeline (RPCs + IPFS metadata) takes 1-3s. We snapshot the rendered
// HTML keyed by the connected wallet so revisits paint instantly, then fetch fresh in the
// background.
const GALLERY_CACHE_KEY = 'zfi_gallery_cache_v1';
const GALLERY_CACHE_TTL = 5 * 60 * 1000; // 5 minutes

function _galleryCacheLoad() {
  try {
    const c = JSON.parse(localStorage.getItem(GALLERY_CACHE_KEY) || 'null');
    if (!c || !c._ts || (Date.now() - c._ts) > GALLERY_CACHE_TTL) return null;
    return c;
  } catch { return null; }
}
function _galleryCacheSave(html, connectedAddress, userVerified) {
  // Skip save when wallet isn't connected. The render that runs before wallet
  // auto-connect resolves would otherwise overwrite a prior connected snapshot
  // with a null-keyed one, forcing another cache miss the next time the wallet
  // reconnects (and dropping the spam-button paint until the next refresh).
  if (!connectedAddress) return;
  try {
    localStorage.setItem(GALLERY_CACHE_KEY, JSON.stringify({
      _ts: Date.now(),
      connectedAddress: connectedAddress || null,
      // Persist verification so the cache-hit path matches the spam-button HTML it
      // restores. Without this, _userIsVerified resets to false on fresh page load
      // and the verified user sees buttons that respond with the "need 100k+ ZORG"
      // toast until the background refresh re-verifies.
      userVerified: !!userVerified,
      html,
    }));
  } catch {} // quota exceeded etc. — non-fatal, just skip caching
}

async function renderGallery() {
  const gen = ++_renderGen;
  // Invalidate any in-flight pool quote so its async callback can't write into the
  // newly-rendered gallery DOM. _renderGen guards _galleryRenderFresh; this guards the
  // already-fired quote setTimeout body that is mid-await on RPC.
  if (_lcQuoteTimer) { clearTimeout(_lcQuoteTimer); _lcQuoteTimer = null; }
  ++_lcQuoteSeq;
  updateOGMeta('COIN', 'Trade coins on zFi - the most secure-by-default exchange', '');
  const app = $('app');

  // Try the SWR cache. Wallet must match — spam buttons are gated on _userIsVerified
  // which depends on the connected address, and rendering cached buttons for a different
  // wallet would let the wrong user flag coins until the background refresh lands.
  const cached = _galleryCacheLoad();
  const currentAddr = _connectedAddress || null;
  const cacheUsable = cached && cached.connectedAddress === currentAddr && cached.html;

  if (cacheUsable) {
    // Re-hydrate state that the cached HTML depends on but doesn't carry on its own:
    //   _spamSet — the .coin-spam classes are baked in but flagCoinAsSpam reads/writes
    //              the in-memory Set on click; an unloaded Set would lose the user's
    //              prior flags until the background refresh runs loadSpamListFresh.
    //   _userIsVerified — see comment in _galleryCacheSave.
    loadSpamListCached();
    if (typeof cached.userVerified === 'boolean') _userIsVerified = cached.userVerified;
    app.innerHTML = cached.html;
    // Background refresh: don't await. The gen check inside _galleryRenderFresh prevents
    // a stale resolve from clobbering the DOM if the user navigated away.
    _galleryRenderFresh(gen).catch(() => {});
    return;
  }

  // Keep existing gallery on screen during the SWR refresh. Without this, the
  // wallet-auto-connect path wipes the just-painted (no-wallet) gallery back to
  // a loading screen before the verified re-render completes.
  if (!$('coinGrid')) {
    app.innerHTML = `
      <div class="header">
        <h1>Coins</h1>
        <div><a href="../" class="nav-link">Swap</a> &middot; <a href="../dao/" class="nav-link">DAO</a></div>
      </div>
      <div class="loading">${zfiLoadingSVG(48)}Scanning for coins...</div>
    `;
  }
  await _galleryRenderFresh(gen);
}

async function _galleryRenderFresh(gen) {
  const app = $('app');

  try {
    // Launched coins, causes and NFT auctions. ZAMM v0 coins stay out of the list.
    // A cause failing to load must not take the launched coins with it — they come from
    // a different contract and have no reason to disappear together, which is the rule
    // the old DAICO scan was given for the same reason.
    // The ETH price and the ZORG balance gate what the cards render but depend on
    // none of the coin data, so they ride along with the discovery reads instead of
    // adding a round trip after them.
    const [launchRowsAll, causeRows, daicoRows, nftAuctions, ethUsd, zorgRes] = await Promise.all([
      fetchLaunchedCoins(),
      fetchCauses().catch(() => []),
      fetchDaicos().catch(() => []),
      fetchNftAuctions(),
      getEthUsd(),
      _connectedAddress
        ? mcAggregate([{ target: ZORG_TOKEN, allowFailure: true,
            callData: new ethers.Interface(ERC20_ABI).encodeFunctionData('balanceOf', [_connectedAddress]) }])
            .catch(() => [])
        : Promise.resolve([])
    ]);

    if (launchRowsAll.length === 0 && causeRows.length === 0 && daicoRows.length === 0 && nftAuctions.length === 0) {
      if (gen !== _renderGen) return;
      app.innerHTML = `
        <div class="header">
          <h1>Coins</h1>
          <div><a href="../" class="nav-link">Swap</a> &middot; <a href="../dao/" class="nav-link">DAO</a></div>
        </div>
        <div class="loading">No coins found yet. <a href="../#coin">Launch one</a>.</div>
      `;
      return;
    }

    // Exclude test coins
    const EXCLUDED_COINS = new Set([
      '0xd77F85a19D242391CeEf95e2D7fe35E251593f28',
      '0x816f6f801a525eef715BF015704C2672A0abf018',
      '0x729B47e8e4fBE54268E70a169398E7a5DCA579d1',
      '0xC455Dc876E1cF371cFf6ef5af85dA7675E3d2281',
      '0x7dDECc13905448159d5462bF49ac7C48f348d18C',
      '0xF792394938E553eA4cdbFa984509550A5fe335e5'
    ].map(a => a.toLowerCase()));
    // Load cached spam list synchronously (zero latency), refresh in background
    loadSpamListCached();
    loadSpamListFresh(); // fire-and-forget; updates _spamSet + localStorage for next visit

    const launchRows = launchRowsAll.filter(r => !EXCLUDED_COINS.has(r.token));

    // Spam flagging is gated on holding enough ZORG, so the buttons a card renders
    // depend on this and it has to land before the cards are built.
    if (_connectedAddress && zorgRes[0]?.success) {
      try {
        const bal = new ethers.Interface(ERC20_ABI).decodeFunctionResult('balanceOf', zorgRes[0].returnData)[0];
        _userIsVerified = bal >= ZORG_VERIFY_THRESHOLD;
      } catch { _userIsVerified = false; }
    }
    if (gen !== _renderGen) return;

    const cards = [];
    let testCount = 0;
    let spamCount = 0;

    // ── Launched coin cards ──
    // Everything a card needs — name, symbol, supply, both prices — already came
    // back in the LaunchInfo rows, so the only extra read is contractURI for the
    // logo. That one is batched in FIVES rather than all at once: a coin whose
    // image lives on-chain returns a ~44 KB inline document, and thirty of those
    // in one multicall is a response big enough to fail.
    if (launchRows.length > 0) {
      const uriI = new ethers.Interface(['function contractURI() view returns (string)']);
      const chunks = [];
      for (let b = 0; b < launchRows.length; b += 5) chunks.push(launchRows.slice(b, b + 5));
      const uris = (await poolMap(chunks, 6, async batch => {
        const res = await mcAggregate(batch.map(r => ({
          target: r.token, allowFailure: true, callData: uriI.encodeFunctionData('contractURI')
        }))).catch(() => batch.map(() => null));
        return res.map(one => {
          try { return one?.success ? uriI.decodeFunctionResult('contractURI', one.returnData)[0] : ''; }
          catch { return ''; }
        });
      })).flat();
      if (gen !== _renderGen) return;
      const launchMetas = await Promise.all(uris.map(u => u ? metaSoon(fetchMetadata(u), 4000) : Promise.resolve(null)));
      if (gen !== _renderGen) return;

      for (let i = 0; i < launchRows.length; i++) {
        const row = launchRows[i];
        const meta = launchMetas[i] || {};
        const lName = row.name || meta.name || 'Unknown';
        const lSym = row.symbol || meta.symbol || '???';
        const fdvEth = Number(row.fullyDilutedWei) / 1e18;
        const backingEth = Number(row.backingEth) / 1e18;

        const cardName = lName.toLowerCase();
        const cardSym = lSym.toLowerCase();
        const cardAddr = row.token;
        const isTest = cardName === 'test';
        if (isTest) testCount++;

        const isSpam = _spamSet.has(cardAddr);
        if (isSpam) spamCount++;

        // What a buyer gets back if the market walks away: the redemption floor as a
        // fraction of the price they would pay for the same tokens.
        //
        // This used to divide the pot by FDV, which is the wrong denominator and made
        // every coin look unbacked. `redeem()` pays pro-rata against circulating supply
        // and explicitly excludes the tokens sitting inside the pool — and on a young
        // launch that is most of the supply. ZCAT read "12.8% backed" while its floor
        // was 93% of spot, because 86% of its supply had no claim to begin with.
        const marketPer = Number(row.marketPrice), floorPer = Number(row.floorPrice);
        const backedRatio = marketPer > 0 ? (floorPer / marketPer) : 0;
        const backedPct = backedRatio * 100;
        // The bar is a 0–100% meter and stays clamped; the WORDS below it are not, because
        // a floor above the price is a different situation from a floor exactly at it and
        // the clamp made the two identical. Burns lift the floor without moving the market,
        // and in that state redeeming beats selling — which a holder cannot act on if the
        // card rounds it away to "100% backed".
        const bars = Math.round(Math.min(100, backedPct) / 10);

        // The pool's ether is what a trader can actually get in and out against, and it
        // is what the gallery is ranked by — so the card shows it next to the valuation
        // rather than leaving FDV to speak alone.
        const liqDisplay = backingEth >= 0.01 ? backingEth.toFixed(2)
          : backingEth > 0 ? backingEth.toFixed(4) : '0';
        const mcapDisplay = fdvEth > 1e-6 ? fmtMcap(fdvEth) : '';
        const mcapUsd = fdvEth > 1e-6 && ethUsd > 0 ? fmtUsd(fdvEth * ethUsd) : '';
        const statusText = row.floorPrice > 0n
          ? (backedRatio > 1.005
              ? `Floor ${((backedRatio - 1) * 100).toFixed(0)}% above price`
              : `${backedPct < 1 ? '<1' : backedPct.toFixed(0)}% backed by ether`)
          : 'No buys yet';
        const allocPct = Number(row.allocBps) / 100;
        const badgeTitle = 'single-sided full-range pool, liquidity locked in the launcher'
          + (row.allocBps ? ` \u00b7 creator kept ${allocPct}%` : '');

        const logoImg = meta.image ? resolveIPFS(meta.image) : null;
        const logoEl = logoImg
          ? `<img src="${escAttr(logoImg)}" alt="" loading="lazy" decoding="async" style="width:40px;height:40px;border-radius:50%;object-fit:cover" onerror="if(!ipfsNextGateway(this))this.parentNode.innerHTML=symbolSVG(${escAttr(JSON.stringify(lSym))},40)">`
          : symbolSVG(lSym, 40);

        const cardHTML = `
          <a href="#${row.token}" class="coin-card${isTest ? ' coin-test' : ''}${isSpam ? ' coin-spam' : ''}" data-name="${escText(cardName)}" data-symbol="${escText(cardSym)}" data-addr="${cardAddr}" style="position:relative">
            ${spamBtnHTML(cardAddr, isSpam)}
            <div class="coin-card-head">
              <div class="coin-logo">${logoEl}</div>
              <div>
                <div class="coin-card-name">${escText(lName)}</div>
                <div class="coin-card-symbol">$${escText(lSym)}<span class="coin-tpl-badge coin-tpl-simple" title="${escAttr(badgeTitle)}">simple</span></div>
              </div>
            </div>
            <div class="coin-card-bar" title="How much of the price is ether locked in the pool rather than speculation. The rest is what the market is paying over the redemption floor.">${'█'.repeat(bars)}${'░'.repeat(10 - bars)}</div>
            <div class="coin-card-stat" title="Burn the coin back to the launcher for its share of the pool's ether, at any time and at any size. This is that floor against the market price — the gap is the premium.">${statusText}</div>
            <div class="coin-card-mcap"><span title="Ether in the pool — what you can trade in and out against.">${liqDisplay} &Xi; pool</span>${mcapDisplay ? ` &middot; <span title="Spot price times total supply.">FDV ${mcapDisplay}</span>${mcapUsd ? ` <span class="usd">${mcapUsd}</span>` : ''}` : ''}</div>
          </a>
        `;
        // Ranked on liquidity, not FDV. FDV is spot price times full supply, so a coin
        // whose pool has never been traded still reports whatever tick it was seeded at
        // and outranks coins with real ether behind them. `backingEth` is what the
        // locked position would actually release.
        cards.push({ html: cardHTML, key: cardName + '|' + cardSym, mcap: fdvEth,
                     sortKey: backingEth, isTest, isSpam });
      }
    }

    // ── Cause cards ──
    // A cause has no pool and no FDV; what it has is a treasury that holders can redeem
    // against, so that is what the card reports and what it sorts on. It is never bucketed
    // as dust: a small cause is a small cause, not a coin nobody wants, and hiding it
    // behind "show low liquidity" was how these went missing in the first place.
    if (causeRows.length > 0) {
      const causeMetas = await Promise.all(causeRows.map(c =>
        c.contractURI ? metaSoon(fetchMetadata(c.contractURI), 4000) : Promise.resolve(null)));
      if (gen !== _renderGen) return;
      for (let i = 0; i < causeRows.length; i++) {
        const c = causeRows[i];
        const md = causeMetas[i] || {};
        const cName = md.name || c.name || 'Unnamed';
        const cSym = md.symbol || c.symbol || '???';
        const addr = c.dao.toLowerCase();
        if (EXCLUDED_COINS.has(addr)) continue;
        const isSpam = _spamSet.has(addr);
        if (isSpam) spamCount++;
        const raisedEth = Number(ethers.formatEther(c.raised));
        const treasuryEth = Number(ethers.formatEther(c.treasury));
        const now = Math.floor(Date.now() / 1000);
        const live = c.deadline === 0 || now < c.deadline;
        const unit = c.saleIsLoot ? 'loot' : 'shares';
        const logoImg = md.image ? resolveIPFS(md.image) : null;
        const logoEl = logoImg
          ? `<img src="${escAttr(logoImg)}" alt="" loading="lazy" decoding="async" style="width:40px;height:40px;border-radius:50%;object-fit:cover" onerror="if(!ipfsNextGateway(this))this.parentNode.innerHTML=symbolSVG(${escAttr(JSON.stringify(cSym))},40)">`
          : symbolSVG(cSym, 40);
        // Against the cap where there is one; a running total where there is not.
        const capUnits = c.usesOffering && c.cap > 0n && c.cap < 2n ** 128n ? c.cap : 0n;
        const pct = capUnits > 0n && c.sold > 0n
          ? Math.min(100, Number(c.sold * 10000n / capUnits) / 100) : 0;
        const bars = Math.round(pct / 10);
        const cardHTML = `
          <a href="#${c.dao}" class="coin-card${isSpam ? ' coin-spam' : ''}" data-name="${escText(cName.toLowerCase())}" data-symbol="${escText(cSym.toLowerCase())}" data-addr="${addr}" style="position:relative">
            ${spamBtnHTML(addr, isSpam)}
            <div class="coin-card-head">
              <div class="coin-logo">${logoEl}</div>
              <div>
                <div class="coin-card-name">${escText(cName)}</div>
                <div class="coin-card-symbol">$${escText(cSym)}<span class="coin-tpl-badge coin-tpl-simple" title="DAICO fundraise &middot; ragequittable${c.saleIsLoot ? ' &middot; backers hold non-voting loot' : ''}">cause${c.saleIsLoot ? ' &middot; loot' : ''}</span></div>
              </div>
            </div>
            ${capUnits > 0n ? `<div class="coin-card-bar">${'█'.repeat(bars)}${'░'.repeat(10 - bars)}</div>` : ''}
            <div class="coin-card-stat">${raisedEth > 0 ? fmtEthBal(raisedEth) + ' ETH raised' : 'No backers yet'}${live ? '' : (raisedEth > 0 ? ' &middot; trading' : ' &middot; closed')}</div>
            ${treasuryEth > 0 ? `<div class="coin-card-mcap">Treasury ${fmtMcap(treasuryEth)}${ethUsd > 0 ? ` <span class="usd">${fmtUsd(treasuryEth * ethUsd)}</span>` : ''}</div>` : ''}
          </a>
        `;
        cards.push({ html: cardHTML, key: cName.toLowerCase() + '|' + cSym.toLowerCase(),
                     mcap: treasuryEth, sortKey: treasuryEth, isTest: false, isSpam });
      }
    }

    // ── DAICO cards ──
    // Collector DAOs, fund launches and the older templates. Priced off the pool once one
    // is seeded, off the sale price before that, and off the treasury for a collector DAO,
    // where redeemable ether is the honest valuation.
    const causeAddrs = new Set(causeRows.map(c => c.dao.toLowerCase()));
    const daicos = daicoRows.filter(d =>
      !causeAddrs.has(d.dao.toLowerCase()) && !EXCLUDED_COINS.has(d.dao.toLowerCase()));
    if (daicos.length > 0) {
      const zammI = new ethers.Interface(ZAMM_POOLS_ABI);
      // A collector DAO keeps almost nothing at its own address — it converts ether into
      // the things it collects, and holds the rest in a vault. Its ether has to be looked
      // for where it actually is, or the metric punishes it for doing its job.
      const vaultOf = d => CONTINUOUS_SALES[d.dao.toLowerCase()]?.vault || null;
      const [daicoMetas, poolRes, vaultRes] = await Promise.all([
        Promise.all(daicos.map(d => fetchMetadata(d.meta.contractURI).catch(() => null))),
        mcAggregate(daicos.map(d => {
          const sale = d.sales && d.sales.length > 0 ? d.sales[0] : null;
          const poolId = computePoolId(ZERO, d.meta.sharesToken, 0n, 0n, sale ? BigInt(sale.feeOrHook) : 30n);
          return { target: ZAMM, allowFailure: true, callData: zammI.encodeFunctionData('pools', [poolId]) };
        })).catch(() => daicos.map(() => null)),
        mcAggregate(daicos.map(d => ({
          target: MC3, allowFailure: true,
          callData: _mc3Iface.encodeFunctionData('getEthBalance', [vaultOf(d) || d.dao])
        }))).catch(() => daicos.map(() => null))
      ]);
      if (gen !== _renderGen) return;
      const nowSec = BigInt(Math.floor(Date.now() / 1000));
      for (let i = 0; i < daicos.length; i++) {
        const d = daicos[i];
        const md = daicoMetas[i] || {};
        const _cs = CONTINUOUS_SALES[d.dao.toLowerCase()];
        if (_cs?.icon && !md.image) md.image = _cs.icon;
        const sale = d.sales && d.sales.length > 0 ? d.sales[0] : null;

        let salePct = 0;
        if (sale && sale.totalSupply > 0n) {
          const teamBpsB = md.teamBps ? BigInt(md.teamBps) : 0n;
          const alloc = teamBpsB > 0n ? sale.totalSupply * (10000n - teamBpsB) / 10000n : sale.totalSupply;
          const soldSh = alloc > sale.remainingSupply ? alloc - sale.remainingSupply : 0n;
          if (alloc > 0n) salePct = Number((soldSh * 10000n) / alloc) / 100;
        }
        const hasContSale = !!_cs;
        const saleActive = hasContSale || !!(sale && sale.remainingSupply > 0n && sale.allowance > 0n
          && sale.forAmt > 0n && (sale.deadline === 0n || nowSec <= BigInt(sale.deadline)));

        let poolR0 = 0n, poolR1 = 0n;
        const pr = poolRes[i];
        if (pr && pr.success) {
          try { const dec = zammI.decodeFunctionResult('pools', pr.returnData); poolR0 = dec[0]; poolR1 = dec[1]; } catch {}
        }
        const totalSupplyN = sale ? Number(ethers.formatEther(sale.totalSupply)) : Number(COIN_SUPPLY_TOTAL);
        const vaultETH = vaultOf(d) ? (mcDecode(vaultRes[i], _mc3Iface, 'getEthBalance', [0n])[0] ?? 0n) : 0n;
        // What the DAO can actually reach, wherever it is kept.
        const treasuryETH = (sale ? sale.treasuryBalance : 0n) + vaultETH;
        const teamLocked = md.teamBps ? totalSupplyN * Number(md.teamBps) / 10000 : 0;
        const unsold = sale ? Number(ethers.formatEther(sale.remainingSupply)) : 0;
        const circulating = totalSupplyN - unsold - teamLocked;
        const lpTokens = Number(ethers.formatEther(poolR1));
        const hasPool = poolR0 > 0n && poolR1 > 0n;
        const usePool = hasPool && (!saleActive || lpTokens > totalSupplyN * 0.01);
        let mcapETH = 0;
        if (circulating > 0) {
          if (hasContSale && treasuryETH > 0n) mcapETH = Number(ethers.formatEther(treasuryETH));
          else if (usePool) mcapETH = (Number(ethers.formatEther(poolR0)) / lpTokens) * circulating;
          else if (sale && sale.tribAmt > 0n && sale.forAmt > 0n) {
            mcapETH = (Number(ethers.formatEther(sale.tribAmt)) / Number(ethers.formatEther(sale.forAmt))) * circulating;
          }
        }
        const mcapDisplay = mcapETH > 1e-6 ? fmtMcap(mcapETH) : '';
        const mcapUsd = mcapETH > 1e-6 && ethUsd > 0 ? fmtUsd(mcapETH * ethUsd) : '';

        const cardName = (md.name || d.meta.name || '').toLowerCase();
        const cardSym = (md.symbol || d.meta.symbol || '').toLowerCase();
        const cardAddr = d.dao.toLowerCase();
        const isTest = cardName === 'test';
        if (isTest) testCount++;
        const isSpam = _spamSet.has(cardAddr);
        if (isSpam) spamCount++;
        const isCollect = md.launchType === 'collector' || md.type === 'collector' || md.type === 'fw-collector';
        const badge = isCollect
          ? `<span class="coin-tpl-badge coin-tpl-simple" title="collector DAO">collect</span>`
          : md.launchType === 'fund'
          ? `<span class="coin-tpl-badge coin-tpl-simple" title="fund launch &middot; ops allocation &middot; tap vesting &middot; governance">fund</span>`
          : `<span class="coin-tpl-badge coin-tpl-simple" title="DAICO &middot; shares minted against a sale">daico</span>`;
        const bars = Math.round(Math.min(salePct, 100) / 10);
        const cardHTML = `
          <a href="#${d.dao}" class="coin-card${isTest ? ' coin-test' : ''}${isSpam ? ' coin-spam' : ''}" data-name="${escText(cardName)}" data-symbol="${escText(cardSym)}" data-addr="${cardAddr}" style="position:relative">
            ${spamBtnHTML(cardAddr, isSpam)}
            <div class="coin-card-head">
              <div class="coin-logo">${logoHTML(d.meta, md)}</div>
              <div>
                <div class="coin-card-name">${escText(d.meta.name || 'Unnamed')}</div>
                <div class="coin-card-symbol">$${escText(d.meta.symbol || '???')}${badge}</div>
              </div>
            </div>
            <div class="coin-card-bar">${'█'.repeat(bars)}${'░'.repeat(10 - bars)}</div>
            <div class="coin-card-stat">${hasContSale ? 'Continuous sale' : saleActive ? `${salePct.toFixed(1)}% sold` : 'Sale ended'}</div>
            ${hasContSale
              ? `<div class="coin-card-mcap">${treasuryETH > 0n ? `Treasury ${fmtMcap(Number(ethers.formatEther(treasuryETH)))}${ethUsd > 0 ? ` <span class="usd">${fmtUsd(Number(ethers.formatEther(treasuryETH)) * ethUsd)}</span>` : ''}` : `<span style="color:var(--fg-muted);font-weight:400">Collector DAO</span>`}</div>`
              : (isCollect && treasuryETH > 0n)
              ? `<div class="coin-card-mcap">Treasury ${fmtMcap(Number(ethers.formatEther(treasuryETH)))}${ethUsd > 0 ? ` <span class="usd">${fmtUsd(Number(ethers.formatEther(treasuryETH)) * ethUsd)}</span>` : ''}</div>`
              : mcapDisplay ? `<div class="coin-card-mcap">MCap ${mcapDisplay}${mcapUsd ? ` <span class="usd">${mcapUsd}</span>` : ''}</div>` : ''}
          </a>
        `;
        // Ranked on the ether behind it, like everything else here — a launched coin by
        // what its pool holds, a cause and a DAICO by their treasury, counting a collector
        // DAO's vault as part of that. Market cap is what the card SHOWS; it is not what
        // the page sorts on, and letting a DAICO fall back to it ranked a speculative
        // valuation against other coins' redeemable ether.
        cards.push({ html: cardHTML, key: cardName + '|' + cardSym, mcap: mcapETH,
                     sortKey: Number(ethers.formatEther(treasuryETH)), isTest, isSpam });
      }
    }

    // Group by name|symbol, stack duplicates (spam and dust are hidden, not grouped)
    const groups = new Map();
    const spamCards = [];
    for (const c of cards) {
      // Test coins are hidden by CSS, not removed, so they stay searchable. Left inside a
      // group they can end up leading it — and a stack led by a hidden card renders as an
      // empty cell with a "+1 more" badge floating in it. They go beside the spam ones,
      // appended on their own, where being hidden costs nothing.
      if (c.isSpam || c.isTest) { spamCards.push(c); continue; }
      if (!groups.has(c.key)) groups.set(c.key, []);
      groups.get(c.key).push(c);
    }
    let stackedCount = 0;
    let grid = '';
    const allGroups = [...groups.values()];
    const _rank = c => (c.sortKey ?? c.mcap ?? 0);
    for (const group of allGroups) group.sort((a, b) => _rank(b) - _rank(a));
    // One section and one sort, because there is one question worth ranking on: how much
    // ether is actually behind this. A launched coin answers with its pool's backing, a
    // cause and a DAICO with their treasury. Kinds sit together rather than in separate
    // lists, which only works while they are all measured the same way.
    allGroups.sort((a, b) => _rank(b[0]) - _rank(a[0]));

    function renderGroup(group) {
      if (group.length === 1) return group[0].html;
      const extra = group.length - 1;
      stackedCount += extra;
      let out = `<div class="coin-stack">`;
      out += `<span class="coin-stack-badge" onclick="event.preventDefault();toggleStack(this)">+${extra} more</span>`;
      out += group[0].html;
      for (let j = 1; j < group.length; j++) {
        out += group[j].html.replace('class="coin-card', 'class="coin-card coin-stacked');
      }
      out += `</div>`;
      return out;
    }

    if (allGroups.length > 0) {
      const n = allGroups.reduce((s, g) => s + g.length, 0);
      grid += `<div class="coin-grid-section" data-section="launched">Coins <span class="count">${n}</span></div>`;
      for (const group of allGroups) grid += renderGroup(group);
    }
    // Append hidden cards individually (hidden by CSS, searchable)
    for (const c of spamCards) grid += c.html;

    // NFT auctions: enrich via one batched multicall3 instead of N×3 RPC reads per
    // auction. For ~60 auctions this drops the load from O(180) RPC calls to O(1)
    // before the IPFS layer.
    // Time-sensitive listings get prepended above the rest. Failures per auction fall
    // back to a generic "NFT #id" card rather than dropping the whole row.
    // Auction enrichment used to be awaited here, which meant the coin grid — already
    // built and holding nothing back — waited on an IPFS document per NFT. Every one of
    // those walks the gateway list before giving up, so a handful of dead pins held the
    // whole page for as long as that walk took. The auctions are injected above the
    // coins when they arrive; see _galleryInjectAuctions below.
    const _coinTotal = [...groups.values()].reduce((n, g) => n + g.length, 0);
    const _countLabel = `${_coinTotal}`;
    // Final gen check before writing: a background refresh that finishes after the user
    // navigated away to a coin detail page would otherwise replace the detail with the gallery.
    if (gen !== _renderGen) return;
    const _galleryHtml = `
      <div class="header">
        <h1>Coins <span style="font-weight:400;color:var(--fg-muted)">(${_countLabel})</span></h1>
        <div><a href="../#coin" class="nav-link">Launch</a><span class="nav-sep">&middot;</span><a href="../" class="nav-link">Swap</a><span class="nav-sep">&middot;</span><a href="../dao/" class="nav-link">DAO</a></div>
      </div>
      <input type="text" class="coin-search" id="coinSearch" placeholder="Search by name, symbol, or address..." oninput="filterCoins()">
      <div class="coin-grid" id="coinGrid">${grid}</div>
      ${(() => {
        const parts = [];
        if (spamCount > 0) parts.push(`<span class="spam-toggle" onclick="toggleSpamCoins()" id="spamCountLabel">${spamCount} flagged</span>`);
        const total = spamCount;
        return total > 0 ? `<div style="text-align:center;font-size:11px;color:var(--fg-muted);margin-top:16px">${total} coins hidden (${parts.join(' · ')})</div>` : '';
      })()}
      <div id="spamCount" data-count="${spamCount}" style="display:none"></div>
      <div style="text-align:center;font-size:10px;color:var(--fg-dim);margin-top:20px;padding-top:12px;border-top:1px solid var(--border-muted)">100k <a href="https://zfi.wei.is/?from=eth&to=zorg" target="_blank" style="color:inherit;text-decoration:underline">$zOrg</a> holders can flag spam</div>
    `;
    // Preserve user state across the cache→fresh swap. Without this, a user who started
    // searching/scrolling the cached view loses their input + scroll position 1-2s later
    // when fresh data lands and replaces innerHTML.
    const _prevSearch = $('coinSearch')?.value || '';
    const _prevScrollY = window.scrollY;
    app.innerHTML = _galleryHtml;
    if (_prevSearch) {
      const _newSearch = $('coinSearch');
      if (_newSearch) { _newSearch.value = _prevSearch; filterCoins(); }
    }
    if (_prevScrollY > 0) window.scrollTo(0, _prevScrollY);
    // Snapshot for instant first paint on the next visit. Keyed by wallet so spam-button
    // visibility doesn't leak between accounts; userVerified rides along so the restored
    // buttons match the in-memory verification flag.
    _galleryCacheSave(_galleryHtml, _connectedAddress, _userIsVerified);
    // Not awaited: the grid is on screen and the auctions land above it when ready.
    _galleryInjectAuctions(nftAuctions, gen, _coinTotal).catch(() => {});
  } catch(e) {
    // Don't replace the page with a failure banner if the user already navigated
    // away — the cached gallery (or detail page) on screen is more useful than
    // an error from a stale background refresh.
    if (gen !== _renderGen) return;
    app.innerHTML = `
      <div class="header">
        <h1>Coins</h1>
        <div><a href="../" class="nav-link">Swap</a> &middot; <a href="../dao/" class="nav-link">DAO</a></div>
      </div>
      <div class="loading">Failed to load coins: ${escText(e.message || '')}</div>
    `;
  }
}

// Renders the auction row and slots it above the coins, then re-snapshots the gallery
// so the next visit paints with the auctions already in place.
async function _galleryInjectAuctions(nftAuctions, gen, coinTotal) {
  if (!nftAuctions || nftAuctions.length === 0) return;
  const enriched = await batchEnrichNftAuctions(nftAuctions);
  if (gen !== _renderGen) return;
  const grid = $('coinGrid');
  if (!grid || !enriched.length) return;
  // Newest first — getListings already returns in id order, so reverse.
  enriched.reverse();
  const html = `<div class="coin-grid-section" data-section="auctions">Auctions <span class="count">${enriched.length}</span></div>`
    + enriched.map(({ a, meta }) => renderNftAuctionCard(a, meta)).join('');
  grid.insertAdjacentHTML('afterbegin', html);
  const h1 = document.querySelector('.header h1 span');
  if (h1) h1.textContent = `(${coinTotal} coins \u00b7 ${enriched.length} auction${enriched.length === 1 ? '' : 's'})`;
  _galleryCacheSave($('app').innerHTML, _connectedAddress, _userIsVerified);
}

function toggleStack(el) {
  const stack = el.closest('.coin-stack');
  const wasExpanded = stack.classList.toggle('expanded');
  // Toggle the badge label so users know how to collapse it again.
  const extra = stack.querySelectorAll('.coin-card.coin-stacked').length;
  el.textContent = wasExpanded ? 'collapse' : `+${extra} more`;
}

function filterCoins() {
  const q = ($('coinSearch')?.value || '').toLowerCase().trim();
  const stacks = document.querySelectorAll('#coinGrid .coin-stack');
  stacks.forEach(s => {
    if (q) s.classList.add('expanded');
    else s.classList.remove('expanded');
  });
  // Section headers are organizational, not search-relevant — collapse them
  // while a query is active so the result list doesn't have orphan headings.
  document.querySelectorAll('#coinGrid .coin-grid-section').forEach(h => {
    h.style.display = q ? 'none' : '';
  });
  const cards = document.querySelectorAll('#coinGrid .coin-card');
  cards.forEach(c => {
    const isTest = c.classList.contains('coin-test');
    const isSpam = c.classList.contains('coin-spam');
    const isSpamVisible = c.classList.contains('coin-spam-visible');
    if (!q) { c.style.display = isTest ? 'none' : (isSpam && !isSpamVisible) ? 'none' : ''; return; }
    const match = c.dataset.name.includes(q) || c.dataset.symbol.includes(q) || c.dataset.addr.includes(q);
    c.style.display = match ? 'block' : 'none';
  });
}

// ==================== COIN FORMATTERS ====================

function formatEthPrice(val) {
  if (val === 0) return '0';
  if (val < 0.0001) return val.toExponential(2);
  if (val < 0.01) return val.toFixed(6);
  if (val < 1) return val.toFixed(4);
  if (val < 1000) return val.toFixed(3);
  if (val < 1000000) return (val / 1000).toFixed(2) + 'k';
  return (val / 1000000).toFixed(2) + 'M';
}


// A per-1M price in the unit a person can read. Below 0.0001 ETH the ETH figure goes
// scientific — "4.41e-6 ETH" is a number most people have to decode rather than see —
// and gwei carries the same value in plain digits. Above that ETH stays the better unit:
// 0.0410 ETH is clearer than 41,000,000 gwei.
function fmtPer1M(eth) {
  if (!(eth > 0)) return { v: '0', unit: 'ETH' };
  if (eth >= 0.0001) return { v: formatEthPrice(eth), unit: 'ETH' };
  const g = eth * 1e9;
  const v = g >= 100 ? Math.round(g).toLocaleString()
          : g >= 1 ? Number(g.toPrecision(4)).toString()
          : Number(g.toPrecision(2)).toString();
  return { v, unit: 'gwei' };
}

function formatPct(pct) {
  const abs = Math.abs(pct);
  const sign = pct > 0 ? '+' : '';
  if (abs >= 1000) return sign + (pct / 1000).toFixed(1) + 'k%';
  if (abs >= 100) return sign + pct.toFixed(0) + '%';
  return sign + pct.toFixed(1) + '%';
}

function fmtTokenAmount(weiStr) {
  const v = Number(BigInt(weiStr)) / 1e18;
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(2);
}

async function loadLaunchedChart(info, gen) {
  try {
    const bars = await causeTape(info.pool, true);
    if (gen !== _renderGen) return;
    const el = $('lcChart');
    if (!el) return;
    // No sale price on a launched coin — it never had a fixed-price phase — so the
    // ruler marks the floor and spot only.
    // Same unit as the header: wei-per-token scaled to a 1M lot, ETH or gwei by size.
    const per1M = wei => { const f = fmtPer1M(wei / 1e18 * 1e6); return `${f.v} ${f.unit}`; };
    el.innerHTML = causeChart(bars, info.floorPrice, 0n, info.marketPrice, per1M);
  } catch { /* a chart is not worth an error banner */ }
}
