async function doNewOrder() {
  const statusEl = $('newOrderStatus');
  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status-msg show ' + type;
  }

  if (!_signer) { showWalletModal(); return; }

  const tA = _obTokens[_newTokenA];
  const tB = _obTokens[_newTokenB];
  if (!tA) { showStatus('Select a token to send', 'error'); return; }
  if (!tB) { showStatus('Select a token to receive', 'error'); return; }

  const rawA = $('newAmountA').value;
  const rawB = $('newAmountB').value;
  if (!rawA || !rawB || parseFloat(rawA) <= 0 || parseFloat(rawB) <= 0) {
    showStatus('Enter valid amounts', 'error'); return;
  }

  let amountA, amountB;
  try {
    amountA = safeParseUnits(rawA, tA.decimals, 'Send amount (' + tA.symbol + ')');
    amountB = safeParseUnits(rawB, tB.decimals, 'Receive amount (' + tB.symbol + ')');
  } catch (e) {
    showStatus(e.message || 'Invalid amount', 'error'); return;
  }
  if (amountA === 0n || amountB === 0n) { showStatus('Amount too small', 'error'); return; }

  // Same-token check (compare after ETH→WETH mapping)
  const effA = tA.address === ZERO ? SWAPBOARD_WETH.toLowerCase() : tA.address.toLowerCase();
  const effB = tB.address === ZERO ? SWAPBOARD_WETH.toLowerCase() : tB.address.toLowerCase();
  if (effA === effB) {
    showStatus('Cannot create order with the same token on both sides', 'error'); return;
  }

  const isPayingEth = tA.address === ZERO;
  const contractA = tA.address === ZERO ? SWAPBOARD_WETH : tA.address;
  const contractB = tB.address === ZERO ? SWAPBOARD_WETH : tB.address;
  const isPF = _newOrderVenue === 'swapboard-pf';
  const contractAddr = isPF ? SWAPBOARD_PF : SWAPBOARD;
  const btn = $('newOrderSubmitBtn');

  try {
    btn.disabled = true;
    showStatus('Preparing transaction...', 'info');
    const contract = isPF
      ? (_swapboardPF || (_swapboardPF = new ethers.Contract(SWAPBOARD_PF, SWAPBOARD_PF_ABI, _signer)))
      : (_swapboard || (_swapboard = new ethers.Contract(SWAPBOARD, SWAPBOARD_ABI, _signer)));
    const addr = await _signer.getAddress();

    if (isPayingEth) {
      showStatus('Confirm in wallet...', 'info');
      const tx = isPF
        ? await contract.createOrderWithEth(contractB, amountB, true, { value: amountA })
        : await contract.createOrderWithEth(contractB, amountB, { value: amountA });
      showStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    } else {
      const token = new ethers.Contract(contractA, ERC20_ABI, _signer);
      const allowance = await token.allowance(addr, contractAddr);
      if (allowance < amountA) {
        showStatus('Approving token spend...', 'info');
        const approveTx = await token.approve(contractAddr, ethers.MaxUint256);
        await approveTx.wait();
      }
      showStatus('Confirm in wallet...', 'info');
      const tx = isPF
        ? await contract.createOrder(contractA, amountA, contractB, amountB, true)
        : await contract.createOrder(contractA, amountA, contractB, amountB);
      showStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    }
    showStatus('Order created!', 'success');
    setTimeout(() => { closeNewOrderModal(); refresh(); }, 2000);
  } catch (e) {
    showStatus(txError(e), 'error');
  } finally {
    btn.disabled = false;
  }
}

// ---- Fill order ----
function _fillStatus(msg, type) {
  const el = $('fillStatus');
  if (!el) return;
  el.textContent = msg;
  el.className = 'status-msg show ' + type;
}

async function doFillOrder(orderId) {
  if (!_signer) { showWalletModal(); return; }

  const o = _allOrders.find(x => x.id === orderId);
  if (!o) { _fillStatus('Order not found', 'error'); return; }

  if (o._source === 'swapboard') {
    return doFillSwapboardOrder(o);
  }
  if (o._source === 'swapboard-pf') {
    return doFillSwapboardPFOrder(o);
  }
}

// ---- Fill Swapboard order (all-or-nothing) ----
async function doFillSwapboardOrder(o) {
  if (!_swapboard) { _swapboard = new ethers.Contract(SWAPBOARD, SWAPBOARD_ABI, _signer); }
  const oid = BigInt(o._orderId);
  const wethLower = SWAPBOARD_WETH.toLowerCase();
  const tokenB = o.tokenOut.toLowerCase();
  const tokenA = o.tokenIn.toLowerCase();
  const isPayingEth = tokenB === wethLower;
  const isReceivingEth = tokenA === wethLower;
  const deadline = Math.floor(Date.now() / 1000) + 300;

  const btn = $('fillOrderBtn');
  try {
    if (btn) btn.disabled = true;
    _fillStatus('Preparing...', 'info');
    const addr = await _signer.getAddress();

    if (isPayingEth) {
      _fillStatus('Confirm in wallet...', 'info');
      const tx = await _swapboard.fillOrderWithEth(oid, deadline, { value: BigInt(o.amtOut) });
      _fillStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    } else if (isReceivingEth) {
      const token = new ethers.Contract(o.tokenOut, ERC20_ABI, _signer);
      const allowance = await token.allowance(addr, SWAPBOARD);
      if (allowance < BigInt(o.amtOut)) {
        _fillStatus('Approving token spend...', 'info');
        const approveTx = await token.approve(SWAPBOARD, ethers.MaxUint256);
        await approveTx.wait();
      }
      _fillStatus('Confirm in wallet...', 'info');
      const tx = await _swapboard.fillOrderUnwrap(oid, deadline);
      _fillStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    } else {
      const token = new ethers.Contract(o.tokenOut, ERC20_ABI, _signer);
      const allowance = await token.allowance(addr, SWAPBOARD);
      if (allowance < BigInt(o.amtOut)) {
        _fillStatus('Approving token spend...', 'info');
        const approveTx = await token.approve(SWAPBOARD, ethers.MaxUint256);
        await approveTx.wait();
      }
      _fillStatus('Confirm in wallet...', 'info');
      const tx = await _swapboard.fillOrder(oid, deadline);
      _fillStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    }
    closeFillModal();
    setTimeout(refresh, 4000);
  } catch (e) {
    _fillStatus(txError(e), 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ---- Fill Swapboard PF order (partial fill) ----
async function doFillSwapboardPFOrder(o) {
  if (!_swapboardPF) { _swapboardPF = new ethers.Contract(SWAPBOARD_PF, SWAPBOARD_PF_ABI, _signer); }
  const oid = BigInt(o._orderId);
  const wethLower = SWAPBOARD_WETH.toLowerCase();
  const tokenB = o.tokenOut.toLowerCase();
  const tokenA = o.tokenIn.toLowerCase();
  const isPayingEth = tokenB === wethLower;
  const isReceivingEth = tokenA === wethLower;
  const deadline = Math.floor(Date.now() / 1000) + 300;

  const remaining = BigInt(o.amtOut) - BigInt(o.outDone);
  const outDec = coinLabelForOrder(o, 'out').decimals;
  // Always send an explicit amount. Zero is a full-fill sentinel only for NFT
  // legs; for a fungible order the board rejects it (ZeroFillAmount) so the
  // maker cannot reprice under a taker who signed an open-ended amount.
  let fillAmountB = remaining;

  const fillInput = $('fillAmtInput');
  if (o.partialFill && fillInput && fillInput.value) {
    let parsed;
    try {
      parsed = safeParseUnits(fillInput.value, outDec, 'Fill amount');
    } catch (e) {
      _fillStatus(e.message || 'Enter a valid fill amount', 'error'); return;
    }
    if (parsed <= 0n) { _fillStatus('Enter a valid fill amount', 'error'); return; }
    fillAmountB = parsed > remaining ? remaining : parsed;
  }

  const btn = $('fillOrderBtn');
  try {
    if (btn) btn.disabled = true;
    _fillStatus('Preparing...', 'info');
    const addr = await _signer.getAddress();
    const payAmount = fillAmountB;

    if (isPayingEth) {
      _fillStatus('Confirm in wallet...', 'info');
      const tx = await _swapboardPF.fillOrderWithEth(oid, deadline, { value: payAmount });
      _fillStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    } else if (isReceivingEth) {
      const token = new ethers.Contract(o.tokenOut, ERC20_ABI, _signer);
      const allowance = await token.allowance(addr, SWAPBOARD_PF);
      if (allowance < payAmount) {
        _fillStatus('Approving token spend...', 'info');
        const approveTx = await token.approve(SWAPBOARD_PF, ethers.MaxUint256);
        await approveTx.wait();
      }
      _fillStatus('Confirm in wallet...', 'info');
      const tx = await _swapboardPF.fillOrderUnwrap(oid, deadline, fillAmountB);
      _fillStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    } else {
      const token = new ethers.Contract(o.tokenOut, ERC20_ABI, _signer);
      const allowance = await token.allowance(addr, SWAPBOARD_PF);
      if (allowance < payAmount) {
        _fillStatus('Approving token spend...', 'info');
        const approveTx = await token.approve(SWAPBOARD_PF, ethers.MaxUint256);
        await approveTx.wait();
      }
      _fillStatus('Confirm in wallet...', 'info');
      const tx = await _swapboardPF.fillOrder(oid, deadline, fillAmountB);
      _fillStatus('Tx sent: ' + tx.hash.slice(0, 10) + '...', 'info');
      await tx.wait();
    }
    closeFillModal();
    setTimeout(refresh, 4000);
  } catch (e) {
    _fillStatus(txError(e), 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ---- Cancel order ----
async function doCancelOrder(orderId) {
  if (!_signer) { showWalletModal(); return; }

  const o = _allOrders.find(x => x.id === orderId);
  if (!o) { toast('That order is no longer available'); refresh(); return; }

  const statusEl = $('cancelStatus');

  }

    showStatus('Order cancelled!', 'success');
    setTimeout(refresh, 4000);
  } catch (e) {
    showStatus(txError(e), 'error');
  }
}

async function _cancelSwapboardOrder(o) {
  const oid = BigInt(o._orderId);
  const tokenA = o.tokenIn.toLowerCase();
  const isWeth = tokenA === SWAPBOARD_WETH.toLowerCase();
  if (o._source === 'swapboard-pf') {
    if (!_swapboardPF) { _swapboardPF = new ethers.Contract(SWAPBOARD_PF, SWAPBOARD_PF_ABI, _signer); }
    return isWeth ? _swapboardPF.cancelOrderUnwrap(oid) : _swapboardPF.cancelOrder(oid);
  }
  if (!_swapboard) { _swapboard = new ethers.Contract(SWAPBOARD, SWAPBOARD_ABI, _signer); }
  return isWeth ? _swapboard.cancelOrderUnwrap(oid) : _swapboard.cancelOrder(oid);
}

// Cancel from fill modal — uses fillStatus for feedback, closes modal on success
async function doCancelOrderFromModal(orderId) {
  if (!_signer) { showWalletModal(); return; }

  const o = _allOrders.find(x => x.id === orderId);

    const tx = await _cancelSwapboardOrder(o);
    _fillStatus('Tx sent...', 'info');
    await tx.wait();
    closeFillModal();
    setTimeout(refresh, 4000);
  } catch (e) {
    _fillStatus(txError(e), 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ---- Global orders view ----

// Display-aware label: for Swapboard orders, shows WETH as ETH
function coinLabelForOrder(o, field) {
  const token = field === 'in' ? o.tokenIn : o.tokenOut;
  const id = field === 'in' ? o.idIn : o.idOut;
  if (o._source === 'swapboard' || o._source === 'swapboard-pf') {
    const sym = field === 'in' ? o._symIn : o._symOut;
    const dec = field === 'in' ? o._decIn : o._decOut;
    if (sym) return { symbol: sym, decimals: dec || 18 };
  }
  return coinLabel(token, id);
}

function coinLabel(token, id) {
  if (token === ZERO) return { symbol: 'ETH', decimals: 18 };
  // Known ERC20 tokens by address
  const known = KNOWN_TOKENS[token.toLowerCase()];
  if (known) return known;
  // Synthetic pool label hints (URL params take priority for the current pair view)
  if (_poolData) {
    const _t = token.toLowerCase();
    if (_poolData.token0 === _t && _poolData.coin0 && _poolData.coin0.id === id && _poolData.coin0.symbol)
      return { symbol: _poolData.coin0.symbol, decimals: _poolData.coin0.decimals || 18 };
    if (_poolData.token1 === _t && _poolData.coin1 && _poolData.coin1.id === id && _poolData.coin1.symbol)
      return { symbol: _poolData.coin1.symbol, decimals: _poolData.coin1.decimals || 18 };
  }
  return { symbol: shortAddr(token), decimals: 18 };
}

function iconForToken(token, id, order) {
  // Use order-aware label for Swapboard (shows WETH as ETH etc)
  const label = order ? coinLabelForOrder(order, token === order.tokenIn ? 'in' : 'out') : coinLabel(token, id);
  // Built-in SVG icons for known tokens
  if (TOKEN_ICONS[label.symbol]) {
    return TOKEN_ICONS[label.symbol];
  }
  // Logo URL from synthetic pool data (passed via URL params)
  const _t = token.toLowerCase();
  const poolCoin = _poolData
    ? ((_poolData.token0 === _t && _poolData.coin0 && _poolData.coin0.id === id) ? _poolData.coin0
      : (_poolData.token1 === _t && _poolData.coin1 && _poolData.coin1.id === id) ? _poolData.coin1 : null)
    : null;
  if (poolCoin?.logoUrl) {
    return `<img src="${escAttr(poolCoin.logoUrl)}" width="24" height="24" style="border-radius:50%" onerror="this.outerHTML=makeLetterIcon('${escAttr(label.symbol)}')">`;
  }
  // Fallback: letter icon
  return iconForSymbol(label.symbol);
}

let _renderedGlobalOrders = []; // cached for filtering
let _activePairFilter = null;

function _normAddr(addr) {
  // Normalize WETH to ETH zero address for grouping
  const a = addr.toLowerCase();
  return a === SWAPBOARD_WETH.toLowerCase() ? ZERO : a;
}

function orderPairKey(o) {
  const a = _normAddr(o.tokenIn), b = _normAddr(o.tokenOut);
  return a < b ? a + ':' + b : b + ':' + a;
}

function orderPairLabel(o) {
  const a = _normAddr(o.tokenIn), b = _normAddr(o.tokenOut);
  const la = coinLabelForOrder(o, 'in').symbol;
  const lb = coinLabelForOrder(o, 'out').symbol;
  return a < b ? la + '/' + lb : lb + '/' + la;
}

function orderRate(o) {
  const inL = coinLabelForOrder(o, 'in');
  const outL = coinLabelForOrder(o, 'out');
  const inAmt = Number(BigInt(o.amtIn)) / (10 ** (inL.decimals || 18));
  const outAmt = Number(BigInt(o.amtOut)) / (10 ** (outL.decimals || 18));
  if (inAmt <= 0) return 0;
  return outAmt / inAmt;
}

function renderGlobalOrders() {
  const now = Math.floor(Date.now() / 1000);
  _renderedGlobalOrders = _allOrders.filter(o => o.status === "ACTIVE" && Number(o.deadline) > now);

  // Build pair filter chips
  const pairCounts = new Map();
  for (const o of _renderedGlobalOrders) {
    const key = orderPairKey(o);
    pairCounts.set(key, (pairCounts.get(key) || 0) + 1);
  }
  // Sort pairs by order count desc, show top pairs
  const topPairs = [...pairCounts.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8);

  let chipHtml = '<span class="pair-chip' + (!_activePairFilter ? ' active' : '') + '" data-pair="" onclick="setPairFilter(null)">All</span>';
  for (const [key, count] of topPairs) {
    if (count < 2) continue;
    const sample = _renderedGlobalOrders.find(o => orderPairKey(o) === key);
    const label = orderPairLabel(sample);
    const active = _activePairFilter === key ? ' active' : '';
    chipHtml += `<span class="pair-chip${active}" data-pair="${escAttr(key)}" onclick="setPairFilter('${escAttr(key)}')">${escText(label)} (${count})</span>`;
  }
  $('pairFilters').innerHTML = chipHtml;

  filterGlobalOrders();
}

function setPairFilter(key) {
  _activePairFilter = key;
  const chips = $('pairFilters').querySelectorAll('.pair-chip');
  chips.forEach(c => c.classList.toggle('active', key === null ? !c.dataset.pair : c.dataset.pair === key));
  filterGlobalOrders();
}

function filterGlobalOrders() {
  const q = ($('globalSearch')?.value || '').toLowerCase().trim();
  const sort = $('globalSort')?.value || 'newest';

  let orders = _renderedGlobalOrders;

  // Pair filter
  if (_activePairFilter) {
    orders = orders.filter(o => orderPairKey(o) === _activePairFilter);
  }

  // Text search
  if (q) {
    orders = orders.filter(o => {
      const inL = coinLabelForOrder(o, 'in');
      const outL = coinLabelForOrder(o, 'out');
      const searchable = [
        inL.symbol, outL.symbol,
        o.tokenIn, o.tokenOut,
        o.maker, o._source, 'otc'
      ].filter(Boolean).join(' ').toLowerCase();
      return searchable.includes(q);
    });
  }

  // Sort
  if (sort === 'expiring') {
    orders = [...orders].sort((a, b) => Number(a.deadline) - Number(b.deadline));
  } else if (sort === 'largest') {
    orders = [...orders].sort((a, b) => {
      const aD = coinLabelForOrder(a, 'in').decimals || 18;
      const bD = coinLabelForOrder(b, 'in').decimals || 18;
      const aIn = Number(BigInt(a.amtIn)) / (10 ** aD);
      const bIn = Number(BigInt(b.amtIn)) / (10 ** bD);
      return bIn - aIn;
    });
  }
  // 'newest' keeps indexer order (createdAt desc)

  const filtered = q || _activePairFilter;
  $('globalOrderCount').textContent = orders.length + ' order' + (orders.length !== 1 ? 's' : '')
    + (filtered ? ' matching' : '');

  if (orders.length === 0) {
    $('globalOrdersList').innerHTML = `<div class="empty-msg">${filtered ? 'No orders match your search' : 'No active orders'}</div>`;
    return;
  }

  const userAddr = _connectedAddress?.toLowerCase() || '';
  let html = '';
  for (const o of orders) {
    const inL = coinLabelForOrder(o, 'in');
    const outL = coinLabelForOrder(o, 'out');
    const pctLabel = fillPctLabel(o);
    const tl = timeLeft(o.deadline);
    const inIcon = iconForToken(o.tokenIn, o.idIn, o);
    const outIcon = iconForToken(o.tokenOut, o.idOut, o);
    const rate = orderRate(o);
    const rateStr = rate > 0 ? fmtCompact(rate) + ' ' + escText(outL.symbol) + '/' + escText(inL.symbol) : '';
    const aon = o.partialFill ? '' : ' <span class="aon-tag" title="All-or-nothing">AON</span>';
    const isMine = userAddr && o.maker.toLowerCase() === userAddr;
    const yoursTag = isMine ? ' <span class="yours-tag">Yours</span>' : '';
    const expiry = o.deadline === '9999999999' ? 'no expiry' : escText(tl) + ' left';
    html += `<div class="global-order-item${isMine ? ' is-mine' : ''}" onclick="showFillModal('${escAttr(o.id)}')">
      <div class="order-token-pair">
        <span class="token-icon">${inIcon}</span>
        <span class="order-arrow">&rarr;</span>
        <span class="token-icon">${outIcon}</span>
      </div>
      <div class="order-info">
        <div class="amounts">${escText(fmt(o.amtIn, inL.decimals))} ${escText(inL.symbol)} &rarr; ${escText(fmt(o.amtOut, outL.decimals))} ${escText(outL.symbol)}${aon}${srcTag(o)}${yoursTag}</div>
        <div class="meta">${rateStr}${rateStr ? ' &middot; ' : ''}${escText(shortAddr(o.maker))}${pctLabel ? ' &middot; ' + pctLabel + ' filled' : ''} &middot; ${expiry}</div>
      </div>
      ${pctLabel ? `<div class="order-fill-badge"><span class="pct">${pctLabel}</span><br>filled</div>` : ''}
    </div>`;
  }
  $('globalOrdersList').innerHTML = html;
}

// ---- Fill confirmation modal ----
function showFillModal(orderId) {
  const o = _allOrders.find(x => x.id === orderId);
  // The book is a 30s snapshot, so a row can outlive its order. Say so in the
  // page and re-sync rather than firing a modal dialog at the trader.
  if (!o) { toast('That order is no longer available'); refresh(); return; }

  const remaining = BigInt(o.amtOut) - BigInt(o.outDone);
  if (remaining <= 0n) { toast('That order has already been filled'); refresh(); return; }

  const inL = coinLabelForOrder(o, 'in');
  const outL = coinLabelForOrder(o, 'out');
  const inIcon = iconForToken(o.tokenIn, o.idIn, o);
  const outIcon = iconForToken(o.tokenOut, o.idOut, o);
  const pctLabel = fillPctLabel(o);
  const tl = timeLeft(o.deadline);
  const isMine = _connectedAddress && o.maker.toLowerCase() === _connectedAddress.toLowerCase();

  // What the filler pays (tokenOut side) and receives (tokenIn side)
  const remainingIn = BigInt(o.amtIn) - BigInt(o.inDone);
  const youPay = fmt(remaining.toString(), outL.decimals);
  const youGet = fmt(remainingIn.toString(), inL.decimals);

  const body = $('fillModalBody');
  const canPartial = o.partialFill;
  const remainingStr = ethers.formatUnits(remaining, outL.decimals);

  // Compute rate for display
  const inAmt = Number(remainingIn) / (10 ** inL.decimals);
  const outAmt = Number(remaining) / (10 ** outL.decimals);
  const rate = inAmt > 0 ? outAmt / inAmt : 0;
  const rateStr = rate > 0 ? fmtCompact(rate) + ' ' + escText(outL.symbol) + ' per ' + escText(inL.symbol) : '';

  body.innerHTML = `
    ${isMine ? '<div style="padding:10px 12px;margin-bottom:12px;background:rgba(255,180,50,0.08);border:1px solid rgba(255,180,50,0.25);font-size:12px;text-align:center;color:var(--fg-muted)">This is your order</div>' : ''}
    <div class="fill-modal-pair">
      <div class="fill-modal-token">
        <span class="sym">${isMine ? 'Escrowed' : 'You pay'}</span>
        <span class="icon">${isMine ? inIcon : outIcon}</span>
        <span class="amt" id="fillPayAmt">${escText(isMine ? fmt(remainingIn.toString(), inL.decimals) : youPay)}</span>
        <span class="sym">${escText(isMine ? inL.symbol : outL.symbol)}</span>
      </div>
      <span class="fill-modal-arrow">&rarr;</span>
      <div class="fill-modal-token">
        <span class="sym">${isMine ? 'Requesting' : 'You get'}</span>
        <span class="icon">${isMine ? outIcon : inIcon}</span>
        <span class="amt" id="fillGetAmt">${escText(isMine ? fmt(remaining.toString(), outL.decimals) : youGet)}</span>
        <span class="sym">${escText(isMine ? outL.symbol : inL.symbol)}</span>
      </div>
    </div>
    ${rateStr ? `<div style="text-align:center;font-size:11px;color:var(--fg-muted);margin:-8px 0 16px;font-family:monospace">${rateStr}</div>` : ''}
    ${!isMine && canPartial ? `
    <div class="fill-amt-row">
      <input type="number" id="fillAmtInput" step="any" min="0" placeholder="Amount (${escAttr(outL.symbol)})" value="${escAttr(remainingStr)}">
      <button class="max-btn" onclick="document.getElementById('fillAmtInput').value='${escAttr(remainingStr)}';updateFillPreview()">MAX</button>
    </div>` : ''}
    <div class="fill-modal-details">
      <div class="row"><span class="label">Maker</span><span class="value">${escText(shortAddr(o.maker))}${isMine ? ' (you)' : ''}</span></div>
      <div class="row"><span class="label">Type</span><span class="value">${o.partialFill ? 'Partial fill' : 'All or nothing'}</span></div>
      <div class="row"><span class="label">Expires</span><span class="value">${o.deadline === '9999999999' ? 'Never' : escText(tl)}</span></div>
      ${!isMine ? `<div class="row"><span class="label">Your balance</span><span class="value" id="fillBalance">&hellip;</span></div>` : ''}
      ${o.txHash ? `<div class="row"><span class="label">Tx</span><span class="value"><a href="https://etherscan.io/tx/${escAttr(o.txHash)}" target="_blank" rel="noopener" style="color:inherit">${escText(o.txHash.slice(0,10))}&hellip;</a></span></div>` : ''}
    </div>
    ${_globalMode && !isMine ? `<a href="?token0=${encodeURIComponent(o.tokenIn)}&token1=${encodeURIComponent(o.tokenOut)}&id0=${encodeURIComponent(o.idIn)}&id1=${encodeURIComponent(o.idOut)}&label0=${encodeURIComponent(inL.symbol)}&label1=${encodeURIComponent(outL.symbol)}" style="display:block;text-align:center;font-size:11px;color:var(--fg-muted);margin-bottom:12px;text-decoration:underline">View ${escText(inL.symbol)}/${escText(outL.symbol)} orderbook &rarr;</a>` : ''}
    ${isMine
      ? `<button class="submit-btn" id="fillOrderBtn" onclick="doCancelOrderFromModal('${escAttr(o.id)}')" style="width:100%;background:var(--red-bg);color:var(--red);border:1px solid var(--red)">Cancel Order</button>`
      : `${canPartial ? '<div class="fill-modal-note">Enter amount or fill the full remaining order</div>' : ''}
         <button class="submit-btn buy" id="fillOrderBtn" onclick="doFillOrder('${escAttr(o.id)}')" style="width:100%">Fill Order</button>`}
    <div class="status-msg" id="fillStatus" style="margin-top:8px"></div>
  `;

  // The preview and the balance check both need the order's live numbers, and
  // an all-or-nothing order still needs the check even without an input box.
  window._fillOrder = { remaining, remainingIn, outDecimals: outL.decimals, inDecimals: inL.decimals, outSymbol: outL.symbol, payToken: o.tokenOut };
  if (!isMine && canPartial) {
    $('fillAmtInput').addEventListener('input', updateFillPreview);
  }
  if (!isMine) checkFillBalance();

  $('fillModal').classList.add('active');
  document.body.classList.add('modal-open');
}

// Tell the taker up front that they cannot afford this fill. Swapboard holds
// tokenB in WETH, so a native-ETH filler is really spending their ETH balance.
async function checkFillBalance() {
  const f = window._fillOrder;
  const el = $('fillBalance');
  if (!f || !el) return;
  if (!_connectedAddress) { el.textContent = 'not connected'; return; }
  const payingEth = f.payToken.toLowerCase() === SWAPBOARD_WETH.toLowerCase();
  try {
    const provider = _walletProvider || new ethers.JsonRpcProvider(RPC_URL);
    const wei = payingEth
      ? await provider.getBalance(_connectedAddress)
      : await new ethers.Contract(f.payToken, ERC20_BAL_ABI, provider).balanceOf(_connectedAddress);
    if (window._fillOrder !== f) return; // modal moved on
    f.balance = wei;
    el.textContent = fmt(wei.toString(), f.outDecimals) + ' ' + f.outSymbol;
    updateFillAffordability();
  } catch {
    el.textContent = 'unavailable';
  }
}

function updateFillAffordability() {
  const f = window._fillOrder;
  const btn = $('fillOrderBtn');
  if (!f || !btn || f.balance == null || btn.dataset.busy === '1') return;
  const input = $('fillAmtInput');
  let need = f.remaining;
  if (input && input.value) {
    try {
      const parsed = ethers.parseUnits(toDecimalString(input.value, f.outDecimals), f.outDecimals);
      if (parsed > 0n) need = parsed > f.remaining ? f.remaining : parsed;
    } catch { /* mid-typing; fall back to the full remaining */ }
  }
  if (f.balance < need) {
    btn.disabled = true;
    btn.textContent = 'Insufficient ' + f.outSymbol;
  } else {
    btn.disabled = false;
    btn.textContent = 'Fill Order';
  }
}

function updateFillPreview() {
  const f = window._fillOrder;
  if (!f) return;
  const val = $('fillAmtInput').value;
  if (!val || parseFloat(val) <= 0) {
    $('fillPayAmt').textContent = '--';
    $('fillGetAmt').textContent = '--';
    return;
  }
  let fillWei;
  // Typing "0.0000001" against a 6-decimal token used to throw straight out of
  // this input handler and freeze the preview at a stale number.
  try {
    fillWei = ethers.parseUnits(toDecimalString(val, f.outDecimals), f.outDecimals);
  } catch { return; }
  const clamped = fillWei > f.remaining ? f.remaining : fillWei;
  const proportionalIn = (f.remainingIn * clamped) / f.remaining;
  updateFillAffordability();
  $('fillPayAmt').textContent = fmt(clamped.toString(), f.outDecimals);
  $('fillGetAmt').textContent = fmt(proportionalIn.toString(), f.inDecimals);
}

function closeFillModal() {
  window._fillOrder = null;
  $('fillModal').classList.remove('active');
  document.body.classList.remove('modal-open');
}

// ---- Refresh loop ----
let _pendingFill = new URLSearchParams(location.search).get('fill');

const REFRESH_SECONDS = 30;
let _refreshing = false;

// Re-render whatever view is on screen from the orders already in memory.
function renderAll() {
  if (_globalMode) {
    renderGlobalOrders();
  } else {
    renderBook();
    renderPriceHints();
    if (_activeTab === 'mine') renderMyOrders();
  }
}

async function refresh() {
  // The countdown ticks every second but a fetch can take several. Resetting it
  // up front (and latching _refreshing) stops the timer from stacking a new RPC
  // round-trip on top of every second the previous one is still in flight.
  if (_refreshing) return;
  _refreshing = true;
  _refreshCountdown = REFRESH_SECONDS;
  try {
    _allOrders = await fetchOrders();
    renderAll();
    // Auto-open fill modal if deep-linked
    if (_pendingFill) {
      const id = _pendingFill;
      _pendingFill = null;
      if (_allOrders.find(o => o.id === id)) showFillModal(id);
    }
  } catch (e) {
    console.error('Refresh failed:', e);
    const el = $(_globalMode ? 'globalRefreshCountdown' : 'refreshCountdown');
    if (el) el.textContent = 'offline';
  } finally {
    _refreshing = false;
    _refreshCountdown = REFRESH_SECONDS;
  }
}

function startRefreshLoop() {
  refresh();
  setInterval(() => {
    if (_refreshing) return;
    _refreshCountdown--;
    if (_refreshCountdown <= 0) { refresh(); return; }
    const el = $(_globalMode ? 'globalRefreshCountdown' : 'refreshCountdown');
    if (el) el.textContent = _refreshCountdown + 's';
  }, 1000);
  // A trader who tabs away comes back to a stale book; catch up immediately.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh();
  });
}

// Connecting or disconnecting changes what the whole page should show — which
// rows are yours, whether balances exist, whether the book can be cancelled
// from. Re-render everything rather than only the (often hidden) orders tab.
function onWalletChange() {
  if (_signer) {
    _swapboard = new ethers.Contract(SWAPBOARD, SWAPBOARD_ABI, _signer);
    _swapboardPF = new ethers.Contract(SWAPBOARD_PF, SWAPBOARD_PF_ABI, _signer);
  } else {
    _swapboard = null;
    _swapboardPF = null;
    _balances = { buy: null, sell: null };
  }
  renderAll();
  if (!_globalMode) refreshBalances();
}

// ---- Build synthetic pool data from token addresses ----
function buildSyntheticPool(token0, token1, id0, id1, labelHint0, labelHint1, logoHint0, logoHint1) {
  // Normalize WETH address to ETH zero address
  const wethLower = SWAPBOARD_WETH.toLowerCase();
  const t0 = token0.toLowerCase() === wethLower ? ZERO : token0.toLowerCase();
  const t1 = token1.toLowerCase() === wethLower ? ZERO : token1.toLowerCase();
  const k0 = KNOWN_TOKENS[t0];
  const k1 = KNOWN_TOKENS[t1];
  const dec0 = k0 ? k0.decimals : 18;
  const dec1 = k1 ? k1.decimals : 18;
  // Use label hints if provided, else known token symbol, else short address
  let label0 = labelHint0 || (k0 ? k0.symbol : shortAddr(t0));
  let label1 = labelHint1 || (k1 ? k1.symbol : shortAddr(t1));
  // When both tokens are the same ERC6909 contract, disambiguate by coin ID
  if (t0 === t1 && id0 !== id1 && !labelHint0 && !labelHint1) {
    const base = k0 ? k0.symbol : shortAddr(t0);
    label0 = base + ' #' + id0.toString().slice(0, 6);
    label1 = base + ' #' + id1.toString().slice(0, 6);
  }
  return {
    token0: t0, token1: t1,
    coin0: { id: id0, decimals: dec0, symbol: label0, logoUrl: logoHint0 || null },
    coin1: { id: id1, decimals: dec1, symbol: label1, logoUrl: logoHint1 || null },
    reserve0: null, reserve1: null
  };
}

// ---- Init ----
async function init() {
  $('poolMeta').innerHTML = zfiLoadingSVG(28) + 'Loading...';
  const poolId = getPoolId();
  const tokenParams = !poolId ? getTokenParams() : null;

  if (!poolId && !tokenParams) {
    _globalMode = true;
    $('pairName').textContent = 'Orderbook';
    $('poolMeta').innerHTML = 'All active orders &middot; <a href="https://etherscan.io/address/' + SWAPBOARD + '" target="_blank" rel="noopener">Swapboard</a> &middot; <a href="https://etherscan.io/address/' + SWAPBOARD_PF + '" target="_blank" rel="noopener">Swapboard PF</a>';
    document.title = 'ORDER';
    $('allOrdersLink').style.display = 'none';
    document.querySelector('.tab-row').style.display = 'none';
    $('tab-book').style.display = 'none';
    $('priceBanner').style.display = 'none';
    $('globalView').style.display = '';
    startRefreshLoop();
    walletInit({ appName: 'zFi Orderbook', onConnect: [onWalletChange], onDisconnect: [onWalletChange] });
    return;
  }

  if (poolId) {
    $('chartLink').href = '../chart/#/' + poolId;
    $('chartLink').style.display = 'inline-flex';
    $('lpLink').href = '../liquidity/#/' + poolId;
    $('lpLink').style.display = 'inline-flex';

    try {
      _poolData = await fetchPool(poolId);
    } catch (e) {
      console.error('Pool fetch failed:', e);
    }
  }

  // Fallback: build synthetic pool from query params
  if (!_poolData && tokenParams) {
    _poolData = buildSyntheticPool(tokenParams.token0, tokenParams.token1, tokenParams.id0, tokenParams.id1, tokenParams.label0, tokenParams.label1, tokenParams.logo0, tokenParams.logo1);
  }

  if (_poolData) {
    const label0 = tokenLabel(_poolData, 0);
    const label1 = tokenLabel(_poolData, 1);
    const id0 = _poolData.coin0 ? String(_poolData.coin0.id) : '0';
    const id1 = _poolData.coin1 ? String(_poolData.coin1.id) : '0';
    const icon0 = iconForToken(_poolData.token0, id0);
    const icon1 = iconForToken(_poolData.token1, id1);
    $('pairIcons').innerHTML = '<span class="icon-0">' + icon0 + '</span><span class="icon-1">' + icon1 + '</span>';
    $('pairName').textContent = label0 + ' / ' + label1;
    $('poolMeta').innerHTML = (poolId ? 'Pool ' + poolId.slice(0, 16) + '... &middot; ' : '')
      + '<a href="https://etherscan.io/address/' + SWAPBOARD + '" target="_blank" rel="noopener">Swapboard</a>'
      + ' &middot; <a href="https://etherscan.io/address/' + SWAPBOARD_PF + '" target="_blank" rel="noopener">Swapboard PF</a>';
    document.title = label0 + '/' + label1 + ' ORDER';

    // Show AMM price in quote/base (token1 per token0), matching book convention
    if (_poolData.reserve0 && _poolData.reserve1 && BigInt(_poolData.reserve0) > 0n) {
      const d0 = _poolData.coin0?.decimals || 18;
      const d1 = _poolData.coin1?.decimals || 18;
      const r0 = Number(BigInt(_poolData.reserve0)) / (10 ** d0);
      const r1 = Number(BigInt(_poolData.reserve1)) / (10 ** d1);
      if (r0 > 0) {
        const ammPx = r1 / r0;
        _ammPrice = ammPx;
        $('ammPrice').textContent = fmtCompact(ammPx);
        $('ammPriceLabel').textContent = label1 + ' per ' + label0 + ' (AMM)';
        $('priceBanner').style.display = '';
      }
      $('ammReserves').innerHTML = fmt(_poolData.reserve0, d0) + ' ' + esc(label0) + '<br>' + fmt(_poolData.reserve1, d1) + ' ' + esc(label1);
    }

    setSide('buy');

    // Pre-fill price from URL param
    const urlPrice = tokenParams ? tokenParams.price : new URLSearchParams(location.search).get('price');
    if (urlPrice) {
      $('orderPrice').value = urlPrice;
      updateOrderTotal();
    }
  } else {
    $('pairName').textContent = 'Orderbook';
    $('poolMeta').textContent = 'Pool ' + (poolId || '').slice(0, 20) + '... (metadata unavailable)';
    console.warn('[orderbook] Pool not found for id:', poolId);
  }

  startRefreshLoop();
  walletInit({ appName: 'zFi Orderbook', onConnect: [onWalletChange], onDisconnect: [onWalletChange] });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('obTokenModal').classList.contains('active')) closeOrderTokenModal();
    else if ($('fillModal').classList.contains('active')) closeFillModal();
    else if ($('newOrderModal').classList.contains('active')) closeNewOrderModal();
  }
});

window.addEventListener('hashchange', () => location.reload());
init();
</script>
