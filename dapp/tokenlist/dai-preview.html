document.write("<h2>The full list as a gallery shows it</h2><div class='grid'>"+parsed.map(card).join('')+"</div>");
function card(t){
  const j=t.json;
  const traits=(j.attributes||[]).map(a=>`<span class='tr'>${esc(a.trait_type)} <b>${esc(a.value)}</b></span>`).join('');
  const link=j.external_url?` &middot; <a href='${esc(j.external_url)}'>site</a>`:'';
  return `<div class='card${t.isNew?' new':''}'><img class='art' src='${j.image}' alt='${esc(j.name)}'>`+
    `<div class='meta'><div class='nm'>${esc(j.name)}${t.isNew?"<span class='tag'>new</span>":''}</div>`+
    `<div class='ds'>${esc(j.description||'')}</div>`+
    `<div class='traits'>${traits}</div>`+
    `<div class='addr' style='margin-top:10px'>asset ${t.asset==ZERO?'0x0 (native ETH)':short(t.asset)}`+
    ` &middot; card held by ${short(t.holder)}${link}</div>`+
    `</div></div>`;
}
document.write("<h2>As an explorer shows it (token row)</h2>"+
  "<table><tr><th>Token</th><th>Asset address</th><th>Card held by</th><th>Rank</th><th>Source</th></tr>"+
  parsed.map(t=>{
    const j=t.json, sym=(j.attributes.find(a=>a.trait_type=='Symbol')||{}).value;
    const dec_=(j.attributes.find(a=>a.trait_type=='Decimals')||{}).value;
    const standard=(j.attributes.find(a=>a.trait_type=='Token Standard')||{}).value||'Unknown';
    return `<tr class='${t.isNew?'new':''}'><td><div class='tk'><img src='${t.logo}' alt=''>`+
      `<div><div>${esc(sym)}</div><div class='addr'>${esc(standard)}${standard=='ERC-20'||standard=='Native'?` &middot; ${esc(dec_)} decimals`:''}</div></div></div></td>`+
      `<td class='addr'>${t.asset==ZERO?'0x0 (native)':short(t.asset)}</td>`+
      `<td class='addr'>${short(t.holder)}</td><td>${t.rank}</td>`+
      `<td><span class='pill ${t.synced?'ok':''}'>${t.synced?'onchain':'attested'}</span></td></tr>`;
  }).join('')+"</table>");
