services:
  - type: worker
    name: slow-keeper
    runtime: node
    plan: starter
    region: oregon
    rootDir: slow-keeper
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    envVars:
      # OPTIONAL. The built-in endpoint pool is entirely keyless, so this can be
      # left unset. If set, it is tried first and must support unrestricted
      # eth_getLogs ranges. Comma-separated extras go in RPC_URLS.
      - key: RPC_URL
        sync: false
      - key: RPC_URLS
        sync: false
      # Keeper EOA key. Fund with gas only -- claims pay the underlying to the
      # transfer recipient, never to this address, so exposure is the gas float.
      - key: PRIVATE_KEY
        sync: false
      - key: SEND_RPC_URL
        value: https://rpc.flashbots.net/fast
      - key: MARGIN_MULTIPLE
        value: "1.25"
      - key: PRIORITY_GWEI
        value: "0.05"
      - key: MAX_FEE_GWEI
        value: "50"
      - key: MAX_BATCH
        value: "10"
      - key: POLL_MS
        value: "180000"

  # Alternative to the worker above -- run ONE of the two, not both.
  #
  # At observed tip volume (single digits since deploy) a 24/7 poller is heavy
  # machinery. SLOW's delays are hours to days, so an hourly pass settles just
  # as reliably, costs a fraction, and cuts RPC usage ~300x. It also fails
  # loudly: a non-zero exit lands in the scheduler's run history, whereas a
  # wedged worker just goes quiet.
  - type: cron
    name: slow-keeper-cron
    runtime: node
    region: oregon
    rootDir: slow-keeper
    schedule: "0 * * * *"   # hourly; nothing here is in a hurry
    buildCommand: npm install
    startCommand: npm run once
    autoDeploy: false
    envVars:
      - key: RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: SEND_RPC_URL
        value: https://rpc.flashbots.net/fast
      - key: MARGIN_MULTIPLE
        value: "1.25"
      - key: PRIORITY_GWEI
        value: "0.05"
      - key: MAX_FEE_GWEI
        value: "50"
      - key: MAX_BATCH
        value: "10"
