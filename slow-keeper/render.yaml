services:
  - type: worker
    name: slow-keeper
    runtime: node
    plan: starter
    region: oregon
    rootDir: slow-keeper
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    envVars:
      # Primary endpoint, tried first. Must support unrestricted eth_getLogs
      # ranges -- it has to be able to carry the boot backfill on its own.
      # Set in the Render dashboard.
      - key: RPC_URL
        sync: false
      # Optional extra endpoints ahead of the built-in public fallbacks.
      # Comma-separated. The bot already falls back to a vetted public pool
      # without this, so it is only needed for a second paid provider.
      - key: RPC_URLS
        sync: false
      # Keeper EOA key. Fund with gas only -- claims pay the underlying to the
      # transfer recipient, never to this address, so exposure is the gas float.
      - key: PRIVATE_KEY
        sync: false
      - key: SEND_RPC_URL
        value: https://rpc.flashbots.net/fast
      - key: MARGIN_MULTIPLE
        value: "1.25"
      - key: PRIORITY_GWEI
        value: "0.05"
      - key: MAX_FEE_GWEI
        value: "50"
      - key: MAX_BATCH
        value: "10"
      - key: POLL_MS
        value: "12000"
