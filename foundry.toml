[profile.default]
solc = "0.8.36"
via_ir = true
optimizer = true
optimizer_runs = 9_999_999

# Pinned, not inherited. Forge's default tracks the newest mainnet fork, so an
# unpinned build changes target with the toolchain - and CREATE2 artifacts in
# `deploy/` commit to an exact initcode hash, which a silent target change would
# invalidate. "prague" is what the default already resolved to when this was
# pinned, so pinning is bytecode-neutral today and load-bearing tomorrow.
#
# The floor is CANCUN: PrecisionPool, PrecisionRoute and PrecisionPoolFactory
# all guard reentrancy with `tstore`/`tload`, which do not exist before it. A
# pre-Cancun target does not degrade the guards, it fails to compile - but only
# if someone overrides this, which is the case the comment is here for. Do not
# deploy this repo to a chain that has not activated Cancun.
evm_version = "prague"

# Must be an ARCHIVE endpoint: the pin below is far enough back that pruning
# full nodes (1rpc.io, flashbots, cloudflare) return "historical state is not
# available" and every forked test errors before its first assertion.
# Override with FOUNDRY_ETH_RPC_URL env var for a faster/paid RPC.
#
# Probed 2026-07-31 for archive state at block 24_880_000:
#   eth.drpc.org                        OK   but see 2026-08-03 below
#   eth.merkle.io                       OK   but rate-limits forge's request volume
#   gateway.tenderly.co/public/mainnet  OK   but see below
#   eth.llamarpc.com                    HTTP 521
#   rpc.ankr.com/eth                    -32000 (no archive on the free tier)
#   ethereum-rpc.publicnode.com         HTTP 403
#
# Re-probed 2026-08-03 for archive state at the current pin of 25_640_000, during the
# TokenList re-mine. The list above had rotted, and the failures are worth naming
# because two of them do NOT look like infrastructure:
#   eth-mainnet.public.blastapi.io      OK   <- current default
#   mainnet.gateway.tenderly.co         OK   (still fine for a single suite)
#   eth.drpc.org                        HTTP 408 "upgrade to paid plan" on connect
#   ethereum-rpc.publicnode.com         serves recent state, then 403s on ARCHIVE
#                                       reads mid-test - so most suites pass and only
#                                       the ones touching old accounts fail
#   rpc.flashbots.net                   -32603 "state at block ... is pruned"
#   eth.llamarpc.com / rpc.payload.de   HTTP 521 / connection error
#
# The publicnode mode is the nasty one: a suite fails with a plausible-looking EVM
# error on one specific test while everything around it passes, which reads as a
# contract bug rather than a pruned node. `TokenListMinedDeploy` is the canary — it
# staticcalls SafeSummoner, deployed long before the pin.
#
# Tenderly was the default until it stopped being viable under whole-suite load: a full
# `forge test` produced ~142 "operation timed out" / "connection reset" database errors,
# and a single isolated fork suite made no progress in 29 minutes. Those surface as test
# FAILURES rather than infrastructure errors, so a saturated endpoint is indistinguishable
# from a broken contract until you read the message — budget a re-run before believing any
# fork-test failure.
#
# NOTE: several suites hardcode their own URL in vm.createSelectFork instead of reading
# this key, so FOUNDRY_ETH_RPC_URL does not reach them. zQuoterFullMatrix reads
# vm.envOr("ETH_RPC_URL", ...) and does. Grep before assuming an override took effect.
eth_rpc_url = "https://eth-mainnet.public.blastapi.io"
# Must be AFTER the deployments the quoter depends on. zQuoter staticcalls the V4 helper
# at 0x00005d8a3675b7b00BA172Aa85485Fc5D23121B6, and at the previous pin of 24_880_000 that
# address had ZERO bytes of code (as did the live zQuoter at 0x0000002d...). A staticcall to
# a codeless address succeeds with empty returndata, so V4 legs decoded to garbage: a
# WBTC->ETH quote came back as 4.5e37 wei instead of ~3.2e18, won venue selection with the
# bogus number, and then reverted with Slippage() against its own impossible minimum.
#
# That produced four "exec failed via UNI_V4" failures in zQuoterForkExec plus the 1:1
# wstETH assertion in zQuoterFork, all of which look exactly like a broken quoter and are
# really a fork pinned before its dependencies existed. Verified 2026-07-31: those tests
# pass at 25_640_000 and fail at 24_880_000 with no source change.
#
# 25_640_000 also sits after Uniswap enabled V4 protocol fees at 25_623_201, so the
# protocol-fee composition documented in src/zQuoterV4.sol is actually exercised rather
# than trivially correct. It matches the block the newer suites already self-pin to
# (zQuoterFullMatrix, zQuoterPerVenueExec), so the repo now forks one consistent state.
fork_block_number = 25_640_000
no_rpc_rate_limit = true

# Foundry's default per-test gas cap is 2^30. test/zQuoterFullMatrix.t.sol quotes AND
# executes every ordered pair of an 8-token set — 56 forked round trips in a single test
# body — and lands just over that, failing with OutOfGas before it can assert anything.
# The cap is a harness artifact rather than a property of the code under test, and the
# suite's whole point is that a quote which cannot execute is a bug, so the matrix has to
# run to completion to be worth anything. Tests that care about gas measure it explicitly
# (see test/DutchboardBundleGas.t.sol) rather than relying on this ceiling.
gas_limit = "18446744073709551615"

fs_permissions = [
    { access = "read", path = "./zSwap.html" },
    # zSwap.t.sol reads its own source to check the chunk count in this test
    # file still matches the constructor arity AND the `lt(i, N)` bound inside
    # `_html`'s assembly. The compiler catches the first if they drift; nothing
    # catches the second, and a mismatch there serves a page missing a chunk.
    { access = "read", path = "./src/zSwap.sol" },
    { access = "read", path = "./firstfruits.html" },
    { access = "read", path = "./script/zSwapRegistry-setHtmlAsTarget.calldata.txt" },
    # The TokenList suites read the frozen deterministic artifacts and write the
    # preview page. Both paths are repo-local, and both tests fail closed without
    # these - `vm.readFileBinary` and `vm.writeFile` are denied by default.
    # Write, not just read: `TokenListPostDeploy` regenerates the owner calldata for
    # the seven listings that no longer fit the constructor, so the file that gets
    # broadcast is produced by the same test that proves it yields the right list.
    { access = "read-write", path = "./deploy" },
    { access = "read-write", path = "./out" },
    # `TokenListMinedDeploy` hashes the sources its salts were mined for, so the
    # staleness check is a question about the source rather than about whichever
    # build happens to be in `out/`. Read-only.
    { access = "read", path = "./src/utils" },
    { access = "read", path = "./src/dao" },
    { access = "read-write", path = "./dapp" },
    # The seed-preview fixture. Written by script/PrecisionSeedFixture.s.sol and
    # read back by test/PrecisionSeedPreviewFixture.t.sol, so the lens is checked
    # against the same bytes test/ui/liquidity.test.mjs checks the page against.
    { access = "read-write", path = "./test/fixtures" },
]

# DIFFERENTIAL COMPILATION
#
# SwapboardView exceeds EIP-170 (24,576 B) under the default settings: 25,372 B before
# the Dutchboard reader was added, 26,325 B with it. Nothing has to be removed to fix
# that. The default `optimizer_runs = 9_999_999` trades bytecode size for runtime gas,
# and the lens is the one contract in this repo where that trade is backwards — its own
# header says it is "intended for `eth_call` only — not meant to be called on-chain in
# transactions", so runtime gas is nearly free while size is the binding constraint.
# At 200 runs the current source compiles to 24,048 B, leaving 528 B below
# EIP-170 with every feature intact. Treat that margin as a release invariant:
# any lens edit must be followed by an explicit deployed-bytecode size check.
#
# MEASURE WITH `forge build --force`. A plain `forge test` can leave `out/`
# holding artifacts compiled WITHOUT these restrictions - SwapboardView reads
# 28,608 B that way and 24,048 B for real. A size check against stale artifacts
# will report a deployable contract as over EIP-170, or worse, an over-limit one
# as fine. The restriction below is only meaningful alongside a forced build.
#
# This is expressed as a per-file compiler profile rather than a whole-repo `[profile.*]`
# so a plain `forge build` produces the deployable artifact. A separate profile would
# only be applied when someone remembered to pass FOUNDRY_PROFILE, which is exactly the
# kind of thing that gets forgotten at deploy time and silently ships a 26 KB contract
# that cannot be deployed at all.
#
# Note the settings differ from the zquoter profile below in one respect that matters:
# yul must stay ENABLED here. With `yul = false` the lens fails to compile at all —
# _sweepPlanOut is stack-too-deep — so the two contracts genuinely need different
# compiler treatment rather than a single shared "small" profile.
# The restriction states the REQUIREMENT; the additional profile SATISFIES it. Both are
# needed — a restriction with no matching profile is a hard "Missing profile satisfying
# settings restrictions" build error, which is the desired failure mode: the constraint
# cannot silently lapse.
[[profile.default.additional_compiler_profiles]]
name = "lens"
via_ir = true
optimizer = true
optimizer_runs = 200

# TokenList sits within a few hundred bytes of EIP-170 and the via_ir optimizer
# moves that figure NON-MONOTONICALLY with unrelated source edits - the same
# contract measured 23,962 B with eleven constructor seeds, 24,268 B with three
# and 24,854 B with four, none of which changes a line of runtime logic. 20 runs
# is the floor of that sweep and buys ~350 B over 200. Runtime gas is the right
# thing to trade here: the registry is read through eth_call and written a
# handful of times per listing.
[[profile.default.additional_compiler_profiles]]
name = "tokenlist"
via_ir = true
optimizer = true
optimizer_runs = 20

[[profile.default.compilation_restrictions]]
paths = "src/SwapboardView.sol"
max_optimizer_runs = 200

# Dutchboard and Floorboard both carry several public entry points over one
# shared internal body - the listing/bid creators, their `For` variants, and on
# Dutchboard the expiry-bearing overloads. At the default runs the optimizer
# inlines that body into every one of them, which is what pushed both contracts
# over EIP-170 (Dutchboard 25,539 B, Floorboard 33,253 B). Runtime gas is the
# right thing to give up here: the duplicated code is creation-path, paid once
# per listing, while the fill path that actually runs hot is thin.
#
# Same release invariant as the lens above: any edit to either board must be
# followed by a deployed-size check, because the headroom is now a build
# setting rather than slack in the source.
[[profile.default.compilation_restrictions]]
paths = "src/Dutchboard.sol"
# Dropped from 200 to 20 when the receipt gained the price a closed listing
# settled at (`_priceAt`) and the quote-symbol snapshot: at 200 the contract
# measured 24,637 B, 61 B OVER EIP-170. Same trade as the entries above and the
# same release invariant - the headroom here is a build setting, so any edit
# must be followed by `forge build --force --sizes`.
#
# Then 84 B for the push payload's magic word (`PUSH_TERMS_MAGIC`), which this
# board needed more than Swapboard did: it discriminates its two term structs
# BY LENGTH, so an unrelated 160- or 192-byte blob attached to a transfer had
# two sizes to collide with rather than one.
#
# Margin: 309 B on a clean `--force` build (an incremental build reads ~100 B
# larger; the clean number is the one that ships). The way it was won is worth
# recording, because the obvious lever turned out not to be one. Adding the already-credited guard to
# `afterOrderProceeds` cost 144 B and put the contract 59 B OVER. Lowering runs
# recovered almost nothing - the floor of a 1..200 sweep is 24,621 B, still over,
# and via_ir moves NON-MONOTONICALLY along the way (40 runs is larger than 60,
# and hoisting three loop-invariant mapping lookups made the contract 18 B
# BIGGER). What actually paid was shared code: binding a nested mapping once and
# using the pointer twice, and factoring the payout-destination guard repeated at
# four call sites into `_checkPayee` - that one alone was 212 B. So measure; do
# not reason about size from the shape of the source.
#
# If it gets tight again, the lever Swapboard used is still available - `tokenURI`
# assembles a twenty-three-field `RenderParams` in this contract - but it is a
# larger move, because the renderer would also need the price and progress
# helpers exposed.
max_optimizer_runs = 20

[[profile.default.compilation_restrictions]]
paths = "src/Floorboard.sol"
max_optimizer_runs = 200

# PrecisionPool is pinned so it has ONE build, not one per compilation unit.
#
# The factory takes the pool's creation code as a CONSTRUCTOR ARGUMENT and
# stores it with SSTORE2, which writes the blob as contract code - so it is
# bounded by EIP-170 less the leading STOP byte, 24,575 B. At 200 runs the pool
# is 20,418 B and fits with 4,157 B to spare; at the default 9,999,999 it is
# 24,657 B and does NOT, making the factory unconstructable.
#
# (20,341 B / 4,234 B before the checked-accrual and hoisted-resolution edits;
# those cost 77 B. Measure the BLOB, i.e. the initcode column of
# `forge build --force --sizes`, not the runtime column - the runtime figure is
# 19,228 B and is not what the SSTORE2 bound applies to.)
#
# Without an entry of its own the pool inherited whichever setting its
# compilation unit happened to carry: 200 when pulled in through the factory
# below, the default when compiled standalone. Both artifacts then existed in
# out/ at once, under different paths, and picking between them was a coin
# flip. Since `poolInitCodeHash` is a CREATE2 input, that coin flip decided
# every market address - and no test can catch the wrong choice, because forge
# runs with `code_size_limit = None` and this repo ignores `code-size`.
#
# 200 is what the entire suite has always exercised. Raising it is a runtime-gas
# optimisation that spends SSTORE2 headroom on the contract most likely to grow;
# do not raise it without re-measuring the blob and re-emitting every artifact.
# See test/PrecisionDeployConstraints.t.sol and deploy/Precision.md.
[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionPool.sol"
max_optimizer_runs = 200

# The factory itself. Runtime gas here is cheap to give up: createPool is once
# per market and the per-swap path is thin dispatch. Note it does NOT embed the
# pool's creation code - an older revision did, and the pin predates the change
# to passing it in - but the pin is kept because the size relationship above
# only holds if both files compile at the same setting.
[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionPoolFactory.sol"
max_optimizer_runs = 200

# The rest of the deployable suite, pinned for the same reason and to the same
# value. None of these had an entry, so each inherited whatever compilation unit
# it landed in: Route, Zap and the hook import the factory and so picked up 200,
# while the lens ALSO appeared at 20 runs because some unit pulls it in beside
# TokenList, which is pinned there. Two builds of the lens existed in out/ at
# once.
#
# That is the same ambiguity documented above for the pool, and it matters for
# the same reason: these are CREATE2 deployments whose salts are mined against
# one exact payload. A second build of the same source is a second address, and
# nothing warns you which artifact the mining script picked up.
#
# 200 across the board, matching what they already resolved to in their own
# units and what the tests exercise. PrecisionPoolPolicy is included even though
# it was unambiguous - it only touches interfaces, so nothing pulled it into a
# restricted unit - because relying on that staying true is the same bet that
# produced the two lens artifacts.
[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionPoolLens.sol"
max_optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionLiquidityLens.sol"
max_optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionRoute.sol"
max_optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionZap.sol"
max_optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/pools/ConstantSurchargeHook.sol"
max_optimizer_runs = 200

# Same reason as the entries above - it imports the factory, so without a pin
# of its own it inherits whichever compilation unit it lands in. It also embeds
# LaunchToken's creation code, so a differently-optimized LaunchToken moves this
# contract's initcode and therefore its mined CREATE2 address.
[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionLauncher.sol"
max_optimizer_runs = 200

# eth_call only, like the other lenses, so runtime gas is nearly free. Pinned
# for the same ambiguity reason as the entries above rather than for size: it
# imports the launcher AND the factory, so without an entry it would inherit
# whichever compilation unit it happened to land in.
[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionLauncherLens.sol"
max_optimizer_runs = 200

# The fee splitter. Pinned for the same reason as everything above it - its
# salt is mined against one exact payload - even though nothing pulls it into a
# restricted unit today. Relying on that staying true is the bet that produced
# two builds of the lens.
[[profile.default.compilation_restrictions]]
paths = "src/pools/FeeSplitter.sol"
max_optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionPoolPolicy.sol"
max_optimizer_runs = 200

# The launcher and its lens, pinned for the same reason as the rest of the
# suite above: they import the factory and so already resolve to 200 in their
# own compilation unit, but "already resolves to" is not a guarantee - it is a
# property of whichever unit happens to pull them in. These are CREATE2
# deployments whose salts are mined against one exact payload, so the setting
# has to be stated rather than inherited.
[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionLauncher.sol"
max_optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/pools/PrecisionLauncherLens.sol"
max_optimizer_runs = 200

# TokenList and its renderer are pinned to 200 runs by their deployment manifest
# (deploy/TokenList.md), and B-01 in audit/TokenList/gpt5.6-sol-pro.md is the
# reason: at the default runs the pair does not fit under EIP-170 at all, and the
# headroom it appears to have at other settings is an optimizer artifact rather
# than real margin. The mined salts are only valid for initcode built at these
# settings, so expressing it here - rather than in a profile someone has to
# remember to pass - is what keeps `forge build` producing the payload the salt
# was actually mined for. Both files, because the renderer address is baked into
# TokenList's creation code and a differently-optimized renderer moves it.
[[profile.default.compilation_restrictions]]
paths = "src/utils/TokenList.sol"
max_optimizer_runs = 20

[[profile.default.compilation_restrictions]]
paths = "src/utils/TokenListRenderer.sol"
max_optimizer_runs = 20

# ZorgConvictionRenderer is pure string concatenation that returns an HTML page,
# reachable only through `eth_call` (ZorgConviction.html()). Runtime gas is
# therefore free and size is the sole binding constraint - the same trade the
# lens and TokenList entries make above. Most of the contract is literal page
# text the optimizer cannot compress, so this buys hundreds of bytes rather than
# thousands; the release invariant is the same either way, and any edit to the
# page must be followed by a `forge build --force --sizes` check.
[[profile.default.compilation_restrictions]]
paths = "src/dao/ZorgConvictionRenderer.sol"
max_optimizer_runs = 200

# Swapboard was the tightest contract in the repo: 135 B under EIP-170, then
# 346 B OVER once the escrow registry landed (see `escrowedNFT`, which fixes a
# push path that could mint an order over another order's backing).
#
# The headroom came from `tokenURI`. It used to assemble SwapboardMetadata's
# twenty-field `RenderParams` here and encode it - two dynamic strings included
# - into the call. That was 1,242 B of runtime code on the contract with none
# to spare, spent so the RENDERER, which has thousands, would not have to read.
# The board now exposes its snapshots as getters and the renderer does its own
# reading; `tokenURI` is three lines. Net 636 B after the four new getters, and
# it bought back the two checks the registry could not afford at the time (the
# duplicate check on the pull path, and the push payload's magic word) AND the
# return from runs=50 to runs=200.
#
# Runs is still the right dial if more is ever needed - its per-call gas is
# dominated by storage and transfers rather than by inlining, and the same
# restriction on the pool factory measured LOWER runtime gas, not higher. Note
# that runs=10 and runs=1 do not resolve to a profile at all ("Missing profile
# satisfying settings restrictions"); 20 does, which is where Dutchboard sits.
#
# Margin: 290 B. Same release invariant as the entries above - any edit here
# must be followed by `forge build --force --sizes`.
[[profile.default.compilation_restrictions]]
paths = "src/Swapboard.sol"
max_optimizer_runs = 200

# NOTE: zQuoter deliberately does NOT get the same treatment, even though it has the same
# size problem. Its artifact needs yul = false, and `compilation_restrictions` cannot
# express that — restricting max_optimizer_runs alone still leaves the Yul optimizer on and
# yields 26,684 B, over the limit. So zQuoter's shippable artifact can only come from
# `FOUNDRY_PROFILE=zquoter` and a plain `forge build` produces an oversized one. Tests that
# do `new zQuoter()` therefore exercise a differently-optimized build; they check behaviour,
# which is unaffected, not bytecode.

# zQuoter needs low runs + yul=false to stay under EIP-170 (24,576 bytes). Both settings
# are load-bearing and the margin is thin: runs=20 with yul=false gives 24,438 B, 138 B
# under the limit. Dropping yul=false alone pushes it to 26,684 B, and the default profile
# yields 32,359 B — neither is deployable.
#
# Verified 2026-07-31 against the live deployment at
# 0x0000002d9a651b729e3aFBE57Fc84FFDa4a98a13: this profile reproduces the deployed contract
# exactly. All 24,438 bytes agree except the trailing 43-byte CBOR metadata, which differs
# only because the deployment was built with solc 0.8.34 and this repo now pins 0.8.36.
# That check was made out-of-band, not in CI: the test suite compiles under the default
# profile, so it has no access to this artifact and cannot reproduce the comparison.
# test/zQuoterPerVenueExec.t.sol instead asserts behavioural equivalence — same venue and
# same amountOut from the live contract and a local build — which is what the bytecode
# hash was standing in for, and which survives a compiler bump.
#
# Caveat: this profile cannot build the repo as a whole, because it sets src = "src" and so
# applies yul = false to every contract — src/dao/ClassicalCurveSale.sol then hits
# stack-too-deep. Build zQuoter with `--contracts src/zQuoter.sol --skip 'test/**'`.
[profile.zquoter]
src = "src"
test = "test"
via_ir = true
optimizer = true
optimizer_runs = 20

[profile.zquoter.optimizer_details]
yul = false

# ZorgConviction carries ~40 public/external entry points over shared internal
# bodies, and the default runs inline those bodies into every one of them. The
# receipt metadata already moved to ZorgReceiptArt (see its header); this is the
# rest of the gap. Runtime gas is the right thing to trade: the hot paths here
# are dominated by storage writes and token transfers, not by inlining. Same
# release invariant as the entries above - any edit must be followed by an
# explicit `forge build --force --sizes` check.
[[profile.default.compilation_restrictions]]
paths = "src/dao/ZorgConviction.sol"
max_optimizer_runs = 200

# zQuoterBase carries six venue families, the twenty-slot sweep, hub routing and
# split routing in one contract. At the default 9,999,999 runs it measures
# 28,913 B, 4,337 OVER EIP-170; the optimizer is inlining the shared
# concentrated-liquidity engine into every venue that calls it. Same trade as the
# boards above: pay runtime gas to keep a shippable artifact. The headroom here is
# a build setting, so any edit that grows this file must re-check `--sizes`.
[[profile.default.compilation_restrictions]]
paths = "src/zQuoterBase.sol"
max_optimizer_runs = 200

# zQuoterRobinhood is the same shape with three venues instead of six, and fits
# at the default. Pinned anyway so the two chains' quoters are built alike and a
# size regression on one is visible on the other.
[[profile.default.compilation_restrictions]]
paths = "src/zQuoterRobinhood.sol"
max_optimizer_runs = 200

# Fork tests against a remote node need throttling, not a faster node. The Base
# hub and split builders read tens of thousands of slots per test; run in
# parallel with the default retry budget, the provider drops the connection and
# forge reports it as a test failure indistinguishable from a real one. Three
# providers, an anvil fork and cache warming all failed until these were set.
# On the command line the equivalent is:
#   --threads 1 --fork-retries 20 --fork-retry-backoff 3000 --compute-units-per-second 100
compute_units_per_second = 100
