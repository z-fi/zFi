// not swappable, so they sit under their own heading instead of being interleaved
// with tokens the router can actually quote. `select.options` still enumerates
// options inside an optgroup, so `syncDisabled` is unaffected.
const optsHtml=()=>{
const opt=(t,i)=>`<option value="${i}">${t.sym}</option>`;
const ft=TOKENS.map((t,i)=>[t,i]).filter(([t])=>t.std!=="nft");
const nft=TOKENS.map((t,i)=>[t,i]).filter(([t])=>t.std==="nft");
return ft.map(([t,i])=>opt(t,i)).join("")
+(nft.length?`<optgroup label="NFT collections — auction only">${nft.map(([t,i])=>opt(t,i)).join("")}</optgroup>`:"")
+`<option value="__custom">+ Custom token…</option>`;
};
const rebuild=()=>{for(const s of[fromSel,toSel]){const v=s.value;s.innerHTML=optsHtml();s.value=v}};
// A SELECTION IS AN INDEX, AND THE LIST UNDERNEATH IT CAN BE REPLACED.
// `loadTokenList` swaps TOKENS wholesale for the onchain registry, whose order
// is the registry's, not the built-in list's. `rebuild` faithfully preserves
// `select.value` - which is the POSITION, not the token - so a pair chosen
// before the swap silently becomes whatever now sits at those positions. It
// reads as the page changing your mind: pick ETH -> FWA, and a moment later the
// tile says ETH -> USDC with a perfectly good quote for it.
//
// So remember WHAT was selected, not WHERE, across any reload. Capture before,
// restore after; both are no-ops when the order did not change.
const pairAddrs=()=>({fa:TOKENS[fromSel.value]?.addr,ta:TOKENS[toSel.value]?.addr,
fi:String(fromSel.value),ti:String(toSel.value)});
// Restores ONLY a selection nobody else touched. The load is awaited, and a
// deep link can resolve a token during that gap - including one it introduces
// itself, which never existed when the snapshot was taken. Repositioning by
// address would then faithfully undo the link. So the indices are part of the
// snapshot: if either side moved while the list was loading, that side was
// chosen deliberately and is left exactly where it is.
const restorePair=k=>{
if(!k)return;
const at=a=>a?TOKENS.findIndex(t=>t.addr.toLowerCase()===a.toLowerCase()):-1;
// "Did this side move while the list loaded?" A side that moved was chosen
// deliberately and is left alone. But rebuild() re-creates the options and
// re-assigns the old index, and assigning an index the shorter list does not
// have leaves the select BLANK - which is not a move, and reading it as one
// silently discarded the pair a shared link had just named.
const held=(cur,want)=>String(cur)===want||!TOKENS[cur];
if(held(fromSel.value,k.fi)){const i=at(k.fa);if(i>=0)fromSel.value=i}
if(held(toSel.value,k.ti)){const i=at(k.ta);if(i>=0&&String(i)!==String(fromSel.value))toSel.value=i}
};
// Each swap side excludes the other's pick. Send has no output token, and
// leaving the hidden pick disabled made that token impossible to send.
const isNft=v=>TOKENS[v]?.std==="nft";

// still showing a guess and is free to replace it with a better one.
let pairChosen=false;
// The registry arrives in conviction order - `rankedIds()` is strictly
// descending - so the landing pair is just its top two, and curation moves the
// dapp without a redeploy. The one exception is a wrapped twin: ETH and WETH
// are the same asset, and opening on a wrap rather than a market is not a
// default anyone wants, so the output takes the next distinct asset down.
const wrapTwin=(a,b)=>{
const x=(a||"").toLowerCase(),y=(b||"").toLowerCase(),w=WETH.toLowerCase();

};
// Output candidates in rank order, so a dead one can step aside for the next.
const rankedOutputs=fi=>TOKENS.map((t,i)=>i)
  .filter(i=>i!==fi&&!isNft(String(i))&&!wrapTwin(TOKENS[i].addr,TOKENS[fi]?.addr));

const deadOutputs=new Set();
let pairAuto=false;
const rankedDefaults=()=>{
if(TOKENS.length<2)return;
const fi=TOKENS.findIndex((t,i)=>!isNft(String(i)));

const ti=rankedOutputs(fi).find(i=>!deadOutputs.has(TOKENS[i].addr.toLowerCase()));

fromSel.dataset.prev=fromSel.value;toSel.dataset.prev=toSel.value;

};
// Conviction ranks listings, not liquidity, so the top of it can be a token
// with no market at all - ZORG and ZAMM both rank high and neither quotes.
// Landing there means the first amount a stranger types answers "No route",
// which reads as a broken page rather than a thin token.
//
// So the ranking still chooses, and a choice that cannot trade steps aside for
// the next one down. Only ever the pair the PAGE picked: a pair the user or a
// link named is their business and is left to fail honestly.
const advancePastDeadPair=()=>{
if(!pairAuto||pairChosen)return false;
const cur=TOKENS[toSel.value];
if(!cur)return false;
deadOutputs.add(cur.addr.toLowerCase());
const fi=Number(fromSel.value);
const next=rankedOutputs(fi).find(i=>!deadOutputs.has(TOKENS[i].addr.toLowerCase()));
if(next==null)return false;
toSel.value=String(next);toSel.dataset.prev=toSel.value;

// There are two paths here - `connect`, and the boot path for a wallet that is
// already authorised - and they had this sequence written out twice. The
// second copy was missing the last line, so for a returning user rebuild()
// dropped every `disabled` flag and nothing put them back: the picker let the
// same asset be chosen on both sides and the form dead-ended on "Pick
// different tokens". The comment explaining that hazard was sitting in the
// copy that did it right, which is the whole argument for not having two.
const adoptList=keep=>{
rebuild();
settlePair(keep);
// rebuild() re-creates the <option> nodes, dropping the disabled flags, and an
// onchain list shorter than the built-in one can leave a selection pointing
// past its end. Restore both before anything reads the pair.
if(!TOKENS[fromSel.value])fromSel.value=0;
if(!TOKENS[toSel.value]||toSel.value===fromSel.value)toSel.value=TOKENS[1]?1:0;

// A collection is listed on every tab so the picker does not reshuffle underneath
// the user, but it is only SELECTABLE where something can act on it. Swapboard and
// Dutchboard take NFT lots; the router cannot quote one and `send` prices its
// transfer in decimals a collection does not have. Gating here rather than in the
// quote path means the disabled state is visible before the click, instead of a
// failed quote after it.
const syncDisabled=()=>{

// The same asset on both sides is not a trade, and every path that can create
// one ends here - so this is where it stops being possible, rather than in
// each caller remembering. Send is the exception: it has no output side, so
// the two selections are unrelated there.
//
// Belt to the disabled flags below, which are the braces. They are what a user
// meets; this is what catches the code path that forgot to apply them.
if(pair&&fromSel.value===toSel.value){
const alt=TOKENS.findIndex((t,i)=>String(i)!==fromSel.value&&(nftOk||t.std!=="nft"));
if(alt>=0){toSel.value=String(alt);toSel.dataset.prev=toSel.value}

for(const[sel,other]of[[fromSel,toSel],[toSel,fromSel]])

fromSel.innerHTML=optsHtml();fromSel.value=0;
toSel.innerHTML=optsHtml();toSel.value=5;
syncDisabled();
const syncIcons=()=>{fromIcon.innerHTML=TOKENS[fromSel.value]?.icon||"";toIcon.innerHTML=TOKENS[toSel.value]?.icon||"";syncPickers()};

// our pay leg (tB/aB); `quote` is what it pays out, our receive leg (tA/aA).
// Backwards here routes the wrong direction, so Swapbol re-checks it on chain.
// Prices climb, so a row is only true at the block it was read at.
async function floorCandidates(tokenIn,tokenOut,block){
  const bin=tokenIn===ZERO?WETH:tokenIn,bout=tokenOut===ZERO?WETH:tokenOut;
  const data="0x"+SEL_FLOOR_CANDS+encAddr(FLOOR)+encAddr(bin)+encAddr(bout)
    +encUint(0)+encUint(64)+encUint(512);
  const raw=await rpc(C,[{to:FLOORVIEW,data},block]).catch(()=>null);
  if(!raw)return[];
  const out=[];
  for(const b of decBidRows(raw)){
    if(b.isNFT||b.remaining<=0n||b.initial<=0n||b.price<=0n||b.proceeds<=0n)continue;
    if(b.token.toLowerCase()!==bin.toLowerCase())continue;
    if(b.quote.toLowerCase()!==bout.toLowerCase())continue;
    out.push({
      id:b.id,board:FLOOR,floor:1,v2:0,dutch:0,
      maker:b.bidder,pf:1,exp:b.expiry,nA:0,nB:0,cp:ZERO,
      tA:b.quote,aA:b.proceeds,sA:b.qSym,dA:b.qDec,
      tB:b.token,aB:b.remaining,sB:b.tSym,dB:b.tDec,
      price:b.price,initial:b.initial,
    });

  }
  return out;
}
// The board's own formula, not a rate: proceeds floor-divide against the size
// the bid OPENED at, so an aA/aB rate can land a wei high and revert the leg.
function floorGet(o,pay){return o.price*pay/o.initial}
// The inverse, rounded the other way - `Floorboard.giveFor`, computed locally.
function floorPay(o,want){
  if(want<=0n)return 0n;
  const g=(want*o.initial+o.price-1n)/o.price;
  return g>o.aB?o.aB:g;
}
// Ask boards are linear in their own terms; only the bid board has a basis.
function rowGet(o,pay){return o.floor?floorGet(o,pay):o.aA*pay/o.aB}

function decViewPage(hex){
  const h=strip0x(hex),bytes=h.length/2;
  const word=b=>{if(b<0||b+32>bytes)throw Error("bad lens page");return BigInt("0x"+h.slice(b*2,(b+32)*2))};
  const addr=(b)=>"0x"+h.slice((b+12)*2,(b+32)*2);
  const arr=Number(word(0)),next=word(32);
  if(!Number.isSafeInteger(arr)||arr<64||arr+32>bytes)throw Error("bad lens offset");
  const n=Number(word(arr)),head=arr+32;
  if(!Number.isSafeInteger(n)||n>256||head+n*32>bytes)throw Error("bad lens length");
  const text=(base,k)=>{const off=Number(word(base+k*32)),p=base+off,len=Number(word(p));
    if(!Number.isSafeInteger(off)||!Number.isSafeInteger(len)||len>64||p+32+len>bytes)throw Error("bad lens string");
    const a=new Uint8Array(len);for(let i=0;i<len;i++)a[i]=parseInt(h.slice((p+32+i)*2,(p+33+i)*2),16);
    return new TextDecoder().decode(a)};
  const rows=[];
  for(let i=0;i<n;i++){
    const off=Number(word(head+i*32)),b=head+off;
    if(!Number.isSafeInteger(off)||b+16*32>bytes)throw Error("bad lens row");
    rows.push({id:word(b),maker:addr(b+32),pf:word(b+64)===1n,exp:word(b+96),
      nA:word(b+128)===1n,nB:word(b+160)===1n,cp:addr(b+192),
      tA:addr(b+224),aA:word(b+256),sA:safeSym(text(b,9)),dA:Number(word(b+320)),
      tB:addr(b+352),aB:word(b+384),sB:safeSym(text(b,13)),dB:Number(word(b+448)),board:addr(b+480)});
  }
  return{rows,next};
}

const betterRate=(a,b)=>a.aA*b.aB>b.aA*a.aB;
const MAX_BOOK_LEGS=32,AON_PAIR_SEEDS=24;
function planBookExactIn(rows,amountIn,ammOut,ammIn){
  if(!amountIn||!ammIn)return null;
  let c=rows.filter(o=>!o.nA&&!o.nB&&o.aA&&(o.aB||o.dutch)&&(o.pf||o.aB<=amountIn));
  const candidateCapped=c.length>256;
  const aonCount=c.reduce((n,o)=>n+!o.pf,0);
  const aonBounded=aonCount>=3;
  c.sort((a,b)=>betterRate(a,b)?-1:betterRate(b,a)?1:0);
  if(c.length>256)c.length=256;
  const build=(seed=-1,seed2=-1)=>{
    let rem=amountIn,bin=0n,bout=0n,fills=[],legCapped=false;
    const take=o=>{
      if(o.aA*ammIn<=ammOut*o.aB)return;
      if(!o.pf&&o.aB>rem)return;
      if(fills.length>=MAX_BOOK_LEGS){legCapped=true;return}
      if(o.aB===0n){
        fills.push({id:o.id,board:o.board,pay:0n,get:o.aA,part:false});
        bout+=o.aA;return;
      }
      const pay=o.aB<rem?o.aB:rem;
      if(!pay)return;
      const get=o.pf?(pay===o.aB?o.aA:rowGet(o,pay)):o.aA;
      if(!get)return;
      fills.push({id:o.id,board:o.board,pay,get,part:o.pf&&pay<o.aB});
      rem-=pay;bin+=pay;bout+=get;
    };
    if(seed>=0)take(c[seed]);
    if(seed2>=0)take(c[seed2]);
    for(let i=0;i<c.length;i++)if(i!==seed&&i!==seed2)take(c[i]);
    return{fills,bookIn:bin,bookOut:bout,ammIn:rem,score:bout+rem*ammOut/ammIn,
      bounded:candidateCapped||aonBounded||legCapped};
  };
  let best=build(-1);
  for(let i=0;i<c.length;i++)if(!c[i].pf){
    const p=build(i);if(p.score>best.score)best=p;
  }
  const aon=[];for(let i=0;i<c.length&&aon.length<AON_PAIR_SEEDS;i++)if(!c[i].pf)aon.push(i);
  for(let i=0;i<aon.length;i++)for(let j=i+1;j<aon.length;j++){
    const p=build(aon[i],aon[j]);if(p.score>best.score)best=p;
  }
  return best.fills.length?best:null;
}

const cheaperRate=(a,b)=>a.aB*b.aA<b.aB*a.aA;
function planBookExactOut(rows,amountOut,ammIn,ammOut){
  if(!amountOut||!ammOut)return null;
  let c=rows.filter(o=>!o.nA&&!o.nB&&o.aA&&(o.aB||o.dutch)&&(o.pf||o.aA<=amountOut));
  const candidateCapped=c.length>256;
  const aonCount=c.reduce((n,o)=>n+!o.pf,0);
  const aonBounded=aonCount>=3;
  c.sort((a,b)=>cheaperRate(a,b)?-1:cheaperRate(b,a)?1:0);
  if(c.length>256)c.length=256;
  const build=(seed=-1,seed2=-1)=>{
    let left=amountOut,bin=0n,bout=0n,fills=[],legCapped=false;
    const take=o=>{
      if(o.aB*ammOut>=ammIn*o.aA)return;
      if(!o.pf&&o.aA>left)return;
      if(fills.length>=MAX_BOOK_LEGS){legCapped=true;return}
      const want=o.aA<left?o.aA:left;
      let pay,get;
      if(o.aB===0n){pay=0n;get=want}
      else if(want===o.aA){pay=o.aB;get=o.aA}
      else if(o.floor){
        // Invert the board's own round-down, then re-quote forwards through it.
        // Deriving `get` from a rate here is what a floor bid punishes: the
        // smallest delivery that clears `want` is not the one a linear inverse
        // names, and the difference is exactly the leg's revert.
        pay=floorPay(o,want);
        get=floorGet(o,pay);
      }
      else{
        pay=(want*o.aB+o.aA-1n)/o.aA;
        if(pay>o.aB)pay=o.aB;
        get=pay*o.aA/o.aB;
      }
      if(!get)return;
      fills.push({id:o.id,board:o.board,pay,get,part:want!==o.aA});
      bin+=pay;bout+=get;left-=get<left?get:left;
    };
    if(seed>=0)take(c[seed]);
    if(seed2>=0)take(c[seed2]);
    for(let i=0;i<c.length&&left;i++)if(i!==seed&&i!==seed2)take(c[i]);
    return{fills,bookIn:bin,bookOut:bout,ammOut:left,score:bin+left*ammIn/ammOut,
      bounded:candidateCapped||aonBounded||legCapped};
  };
  let best=build(-1);
  for(let i=0;i<c.length;i++)if(!c[i].pf){
    const p=build(i);if(p.score<best.score)best=p;
  }
  const aon=[];for(let i=0;i<c.length&&aon.length<AON_PAIR_SEEDS;i++)if(!c[i].pf)aon.push(i);
  for(let i=0;i<aon.length;i++)for(let j=i+1;j<aon.length;j++){
    const p=build(aon[i],aon[j]);if(p.score<best.score)best=p;
  }
  return best.fills.length?best:null;
}

function encFillPlan(fills,tokenIn,tokenOut,recipient,refundTo,deadline){
  let tail=encUint(fills.length);
  for(const f of fills)tail+=encUint(f.id)+encAddr(f.board)+encUint(f.pay)+encUint(f.get)+encBool(f.part);
  return"0x"+SEL_FILLPLAN+encAddr(tokenIn)+encAddr(tokenOut)+encAddr(recipient)+encAddr(refundTo)
    +encUint(deadline)+encUint(192)+tail;
}

function encFillPlanAndSwap(fills,tokenIn,tokenOut,recipient,refundTo,deadline,ammIn,ammData){
  let ft=encUint(fills.length);
  for(const f of fills)ft+=encUint(f.id)+encAddr(f.board)+encUint(f.pay)+encUint(f.get)+encBool(f.part);
  const d=strip0x(ammData||"0x"),dt=encUint(d.length/2)+d.padEnd(Math.ceil(d.length/64)*64,"0");
  return"0x"+SEL_FILLPLAN_SWAP+encAddr(tokenIn)+encAddr(tokenOut)+encAddr(recipient)+encAddr(refundTo)
    +encUint(deadline)+encUint(256)+encUint(ammIn)+encUint(256+ft.length/2)+ft+dt;
}

function encSnwap(tokenIn,amountIn,recipient,tokenOut,minOut,executor,data){
  const d=strip0x(data),body=encUint(d.length/2)+d.padEnd(Math.ceil(d.length/64)*64,"0");
  return"0x"+SEL_SNWAP+encAddr(tokenIn)+encUint(amountIn)+encAddr(recipient)+encAddr(tokenOut)
    +encUint(minOut)+encAddr(executor)+encUint(224)+body;
}
const encCheckpoint=(executor,token,recipient)=>encSnwap(
  ZERO,0n,recipient,ZERO,0n,executor,"0x"+SEL_CHECKPOINT+encAddr(token)
);
const encSweep=(token,amount,to)=>"0x"+SEL_SWEEP+encAddr(token)+encUint(0)+encUint(amount)+encAddr(to);
function encPermit2Hybrid(ammData,fills,tokenIn,tokenOut,recipient,refundTo,deadline,bookIn,bookOut){
  const bookData=encFillPlan(fills,tokenIn,tokenOut,recipient,refundTo,deadline);
  // Isolate the exact book budget before an exact-out AMM has a chance to
  // sweep/refund zRouter's whole token balance. The book executor is already
  // prefunded, so the protecting outer snwap uses a zero token input.
  const steps=[encCheckpoint(SWAPBOL,tokenIn,refundTo)];
  if(bookIn)steps.push(encSweep(tokenIn,bookIn,SWAPBOL));
  steps.push(encSnwap(ZERO,0n,recipient,tokenOut,bookOut,SWAPBOL,bookData));
  if(ammData&&ammData!=="0x")steps.push(ammData);
  // Exact-out AMMs can spend less than their maximum. Return anything still
  // physically held by zRouter to the payer, never the output recipient.
  steps.push(encSweep(tokenIn,0n,refundTo));
  return encCalls(steps);
}

async function swapCandidates(tokenIn,tokenOut,block){
  const key=tokenIn.toLowerCase()+":"+tokenOut.toLowerCase(),old=candCache[key];
  if(old&&Date.now()-old.at<15000&&old.block===block){
    old.rows.incomplete=old.incomplete;return old.rows;
  }
  const snapshotAt=Date.now();
  const boardIn=tokenIn===ZERO?WETH:tokenIn;
  const boardOut=tokenOut===ZERO?WETH:tokenOut;
  const [lc,le]=await Promise.all([
    rpc("eth_getCode",[SBVIEW,block]),rpc("eth_getCode",[SWAPBOL,block])
  ]);
  if(lc.length<5||le.length<5){
    const rows=[];rows.unavailable=true;return rows;
  }
  const specs=[...BOARDS];
  if(DUTCH!==ZERO&&(await rpc("eth_getCode",[DUTCH,block])).length>4){
    specs.push({a:DUTCH,dutch:1,ti:tokenIn});
    // Swapbol can wrap the native route budget per Dutch leg, so ETH users
    // compete against both literal-ETH and WETH-quoted Dutch liquidity.
    if(tokenIn===ZERO)specs.push({a:DUTCH,dutch:1,ti:WETH});
  }
  const groups=await Promise.all(specs.map(async b=>{
    let cursor=0n,out=[],turns=0,incomplete=false,failed=false;
    try{do{
      // Swapboards are WETH books at the native boundary. Dutchboard can take
      // native quote payment directly, but its sold lot is always ERC-20, so
      // native output is represented by a WETH lot and unwrapped by Swapbol.
      const ti=b.dutch?b.ti:boardIn,to=boardOut;
      const data="0x"+(b.dutch?SEL_DUTCH_CANDS:SEL_CANDS)+encAddr(b.a)
        +(b.dutch?"":encBool(b.v2))+encAddr(ti)+encAddr(to)+encAddr(SWAPBOL)
        +encUint(cursor)+encUint(512);
      const p=decViewPage(await rpc(C,[{to:SBVIEW,data},block]));
      out.push(...p.rows.map(r=>({...r,v2:b.v2||0,dutch:b.dutch||0})));
      cursor=p.next;
      ++turns;
    }while(cursor&&turns<64)}catch{failed=true;incomplete=true}
    incomplete=incomplete||!!cursor;
    return{out,incomplete,failed};
  }));
  let rows=groups.flatMap(g=>g.out);
  if(tokenIn===ZERO&&tokenOut.toLowerCase()===WETH.toLowerCase()){
    rows=rows.filter(r=>r.dutch&&r.tA.toLowerCase()===WETH.toLowerCase()&&r.tB===ZERO);
  }
  // The bid side, same block as the asks. Outside the ETH->WETH case above:
  // that is a canonical wrap with a narrow Dutch exception, not a bid.
  else if(await floorRoutable(block)){
    rows=rows.concat(await floorCandidates(tokenIn,tokenOut,block).catch(()=>[]));
  }
  const incomplete=groups.some(g=>g.incomplete);
  rows.incomplete=incomplete;
  rows.unavailable=groups.every(g=>g.failed&&!g.out.length);
  // A slow older request must not make a later block look freshly cached.
  const current=candCache[key],bn=BigInt(block),cn=current?BigInt(current.block):-1n;
  if(!current||bn>cn||(bn===cn&&snapshotAt>=current.at)){
    candCache[key]={at:snapshotAt,block,rows,incomplete};
  }
  // Entries are only fresh for 15s; drop the rest so a long session that touches
  // many pairs does not pin every page of every book it ever quoted.
  for(const k in candCache)if(k!==key&&snapshotAt-candCache[k].at>60000)delete candCache[k];
  return rows;
}

async function lensBookRows(my){
  if((await rpc("eth_getCode",[SBVIEW,L])).length<5)return null;
  const specs=[...BOARDS];
  if(DUTCH!==ZERO&&(await rpc("eth_getCode",[DUTCH,L])).length>4)specs.push({a:DUTCH,dutch:1});
  const pages=await Promise.all(specs.map(async b=>{
    let cursor=0n,out=[],turns=0;
    do{
      const data="0x"+(b.dutch?SEL_RECENT_DUTCH:SEL_RECENT)+encAddr(b.a)
        +(b.dutch?"":encBool(b.v2))+encUint(cursor)+encUint(80)+encUint(256);
      const p=decViewPage(await rpc(C,[{to:SBVIEW,data},L]));
      out.push(...p.rows.map(r=>({...r,v2:b.v2||0,dutch:b.dutch||0})));
      cursor=p.next;
    }while(cursor&&out.length<160&&++turns<64&&my===bookSeq);
    return out;
  }));
  const rows=pages.flat();
  // Own lens, own struct - an OrderView cannot hold a climbing price or an
  // "any id" set - mapped onto the row shape the renderer already reads. Shown
  // even when unroutable: a bid you placed is yours to see and cancel.
  if(FLOOR!==ZERO&&FLOORVIEW!==ZERO){
    await floorRoutable(L);
    try{
      const raw=await rpc(C,[{to:FLOORVIEW,
        data:"0x"+SEL_RECENT_FLOOR+encAddr(FLOOR)+encUint(0)+encUint(80)+encUint(256)},L]);
      for(const b of decBidRows(raw)){
        if(b.remaining<=0n)continue;
        rows.push({
          id:b.id,board:FLOOR,floor:1,v2:0,dutch:0,
          maker:b.bidder,pf:b.isNFT?0:1,exp:b.expiry,
          // Not nB: that renders `aB` as a token id, but on a bid `remaining`
          // is a COUNT - "wants 3 more", not "wants #3". Zero decimals says so.
          nA:0,nB:0,cp:ZERO,
          tA:b.quote,aA:b.proceeds,sA:b.qSym,dA:b.qDec,
          tB:b.token,aB:b.remaining,sB:b.tSym,dB:b.isNFT?0:b.tDec,
          price:b.price,initial:b.initial,anyId:b.anyId,isNFT:b.isNFT?1:0,
        });
      }
    }catch{}
  }
  return rows;
}

async function loadBook(){
  if(!account||tab!=="book"){book.innerHTML="";bookRows=[];syncBook(0);return}
  const my=++bookSeq;
  const live=[];
  for(const b of BOARDS){
    let code="0x";
    try{code=await rpc("eth_getCode",[b.a,L])}catch{}
    if(code.length>4)live.push(b);
  }
  if(my!==bookSeq)return;
  if(!live.length){book.innerHTML='<h6><span>Orderbook</span></h6><div class="o"><span class="l"><i>No Swapboard deployed on this network yet.</i></span></div>';return}
  let rows=null;
  try{rows=await lensBookRows(my)}catch{rows=null}
  if(my!==bookSeq)return;
  if(!rows)rows=[];
  for(const b of rows.length?[]:live){
    let total=0;
    try{total=Number(BigInt(await rpc(C,[{to:b.a,data:"0x"+SEL_NEXTID},L])))}catch{continue}
    if(!total)continue;
    // newest first: low ids are overwhelmingly filled or cancelled
    const hi=total,lo=Math.max(0,hi-40);
    const ids=[];for(let i=hi-1;i>=lo;--i)ids.push(i);
    let raw="";
    try{raw=await rpc(C,[{to:b.a,data:"0x"+SEL_GETORDERS+encUint(32)+encUint(ids.length)+ids.map(i=>encUint(i)).join("")},L])}catch{continue}
    if(my!==bookSeq)return;
    const h=strip0x(raw);if(!h)continue;
    const w=WORDS(b.v2),n=Number(BigInt("0x"+h.slice(64,128)));
    const at=(r,k)=>BigInt("0x"+h.slice(128+(r*w+k)*64,128+(r*w+k+1)*64));
    const ad=(r,k)=>"0x"+h.slice(128+(r*w+k)*64+24,128+(r*w+k+1)*64);
    for(let r=0;r<n&&r<ids.length;++r){
      if(at(r,1)!==1n)continue;                       // not active
      const o=b.v2
        ?{id:ids[r],board:b.a,v2:1,maker:ad(r,0),pf:at(r,2)===1n,exp:at(r,3),
          nA:at(r,4)===1n,nB:at(r,5)===1n,cp:ad(r,6),
          tA:ad(r,7),aA:at(r,8),tB:ad(r,9),aB:at(r,10)}
        :{id:ids[r],board:b.a,v2:0,maker:ad(r,0),pf:0,exp:0n,nA:0,nB:0,
          cp:ZERO,tA:ad(r,2),aA:at(r,3),tB:ad(r,4),aB:at(r,5)};
      if(o.exp&&BigInt(Math.floor(Date.now()/1e3))>o.exp)continue;   // expired
      if(o.cp!==ZERO
        &&o.cp.toLowerCase()!==account.toLowerCase()
        &&o.maker.toLowerCase()!==account.toLowerCase())continue; // neither maker nor permitted taker
      rows.push(o);
    }
  }
  if(my!==bookSeq)return;
  rows=rows.filter(o=>{
    if(o.exp&&BigInt(Math.floor(Date.now()/1e3))>o.exp)return false;
    return o.cp===ZERO
      ||o.cp.toLowerCase()===account.toLowerCase()
      ||o.maker.toLowerCase()===account.toLowerCase();
  });
  // Three per-row reads the lenses cannot answer, in ONE multicall with the
  // Dutch listings that were already being fetched: a Dutch schedule, a bid's
  // climb bounds, and a Swapboard order's original size. Each is a fact the
  // board keeps and the row does not carry.
  const dutchRows=rows.filter(r=>r.dutch);
  const bidRows=rows.filter(r=>r.floor);
  // `amountB` is REWRITTEN in place by a partial fill, so the row shows what is
  // left and nothing says how big it started. That is the one number a taker
  // cannot derive, and the board stores it.
  const fillRows=rows.filter(r=>!r.dutch&&!r.floor&&r.v2&&r.pf&&!r.nA&&!r.nB);
  if(dutchRows.length||bidRows.length||fillRows.length){
    const reqs=[
      ...dutchRows.map(r=>({to:DUTCH,data:"0x"+SEL_DUTCH_LISTING+encUint(r.id)})),
      ...bidRows.map(r=>({to:FLOOR,data:"0x"+SEL_BIDS+encUint(r.id)})),
      ...fillRows.map(r=>({to:r.board,data:"0x"+SEL_INITIAL_B+encUint(r.id)})),
    ];
    const raw=await mc3Deep(reqs);
    if(my!==bookSeq)return;
    let k=0;
    for(const r of dutchRows){const x=raw[k++];if(!x)continue;
      const h=strip0x(x),w=n=>BigInt("0x"+h.slice(n*64,(n+1)*64));
      if(h.length>=640)Object.assign(r,{
        start:w(2),duration:w(3),startPrice:w(5),endPrice:w(7),initial:w(8),remaining:w(9)});
    }
    for(const r of bidRows){const x=raw[k++];if(!x)continue;
      const h=strip0x(x),w=n=>BigInt("0x"+h.slice(n*64,(n+1)*64));
      // bids(): bidder,isNFT,startTime,duration,token,startPrice,quote,endPrice,...
      if(h.length>=11*64)Object.assign(r,{start:w(2),duration:w(3),startPrice:w(5),endPrice:w(7)});
    }
    for(const r of fillRows){const x=raw[k++];if(!x)continue;
      const h=strip0x(x);if(h.length<64)continue;
      const init=BigInt("0x"+h.slice(0,64));
      if(init>r.aB)r.filled=(init-r.aB)*10000n/init;
    }
  }
  bookRows=rows;
  if(!rows.length){book.innerHTML="";syncBook(0);return}
  await loadLogos(rows.flatMap(r=>[r.tA,r.tB]));
  if(my!==bookSeq)return;
  const legs=await Promise.all(rows.map(r=>Promise.all([
    // Both fields or neither: a symbol without decimals renders base units,
    // which reads as a different number rather than a missing one. Floorboard

    leg(r.tA,r.aA,r.nA,r.sA!=null&&r.dA!=null?{sym:r.sA,dec:r.dA}:null),
    leg(r.tB,r.aB,r.nB,r.sB!=null&&r.dB!=null?{sym:r.sB,dec:r.dB}:null)
  ])));
  if(my!==bookSeq)return;
  let own="",rest="",nOwn=0,nRest=0;
  rows.forEach((r,i)=>{
    const[a,bg]=legs[i];
    const mine=r.maker.toLowerCase()===account.toLowerCase();
    const tags=(r.nA||r.nB||r.isNFT?'<span class="tg">NFT</span>':"")
      +(r.v2&&!r.pf&&!r.nA&&!r.nB?'<span class="tg">AON</span>':"")
      +(r.dutch?'<span class="tg">Dutch</span>':"")
      // A BID, not an order: everything else here is someone selling, and
      // hitting this means selling INTO it.
      +(r.floor?'<span class="tg">Bid</span>':"")
      +(r.floor&&r.isNFT&&r.anyId?'<span class="tg">any id</span>':"")
      +(r.filled!==undefined&&r.filled>0n?`<span class="tg">${(Number(r.filled)/100).toFixed(0)}% filled</span>`:"")
      +(r.cp!==ZERO?'<span class="tg">private</span>':"")
      +(!a.ok||!bg.ok?'<span class="tg w">unverified</span>':"");
    const now=BigInt(Math.floor(Date.now()/1e3));
    let when=r.exp?" · "+rel(Number(r.exp-now))+" left":"";
    if(r.dutch&&r.duration){
      const end=r.start+r.duration;
      const floor=r.initial?(r.endPrice*r.remaining+r.initial-1n)/r.initial:0n;
      when=now>=end?` · floor reached: ${trimAmt(floor,r.dB)} ${r.sB}`
        :` · floor ${trimAmt(floor,r.dB)} ${r.sB} in ${rel(Number(end-now))}`;
    }
    // The bid's mirror of that line. A Dutch ask falls toward a floor a buyer
    // waits for; a bid CLIMBS toward a ceiling a seller waits for, and its
    // window is hard - past it the bid is dead, not resting at its best price.
    if(r.floor&&r.duration){
      const end=r.start+r.duration;
      when=now>=end?" · window closed"
        :` · climbs to ${trimAmt(r.endPrice,r.dA)} ${r.sA} in ${rel(Number(end-now))}`;
    }
    const dset=`data-i="${r.id}" data-b="${r.board}" data-v="${r.v2}" data-d="${r.dutch||0}" data-f="${r.floor||0}"`;
    // An NFT bid needs `hitNFT` and a chosen id; a fungible one needs an
    // executor that knows the board. Both still render and still cancel.
    const takeable=!r.floor||(!r.isNFT&&floorReady);
    const act=mine?`<button data-x="c" ${dset}>Cancel</button>`
                  :takeable?`<button data-x="f" ${dset}>${r.floor?"Sell into":"Fill"}</button>`
                  :`<button disabled>${r.isNFT?"NFT bid":"Not routable"}</button>`;

    // not an ERC-721 at all, so its rows stay flat rather than opening on empty.

    const row=`<div class="ow"><div class="o${card?" ins":""}"${card?` data-k="${r.board}:${r.id}"`:""}>`
      +`<span class="l">${a.ic}${bg.ic}<span><b>${a.txt} → ${bg.txt}</b>`
      +`<i>${a.link}${tags}${when}</i></span></span>${act}</div><div class="ic"></div></div>`;
    if(mine){own+=row;++nOwn}else{rest+=row;++nRest}
  });
  let html="";
  if(nOwn)html+=`<h6><span>Your orders</span><span>${nOwn}</span></h6>`+own;
  if(nRest)html+=`<h6><span>Orderbook</span><span>${nRest}</span></h6>`+rest;

// The receipt each board already renders on chain, on demand.
//
// Never per row: a card is ~4.5kB of base64 and one call, so a 40-row book
// would be 190kB to paint a list nobody asked to read. One click, one call,
// cached for the session - the card is immutable for a given state, and a
// stale one is corrected by the refresh that follows any action.
const cardCache={};
async function loadCard(board,id){
  const k=board.toLowerCase()+":"+id;
  if(cardCache[k])return cardCache[k];
  const raw=await rpc(C,[{to:board,data:"0x"+SEL_TOKENURI+encUint(id)},L]);
  const uri=decodeString(raw);
  const i=uri.indexOf("base64,");
  if(i<0)throw Error("card is not inline");
  const j=JSON.parse(atob(uri.slice(i+7)));
  // The image goes in an `src`, never into markup: an <img> data URI cannot run
  // script, and inlining the SVG would. `safeUrl` already admits exactly the
  // https and data:image forms, so the renderer's output is checked by the same
  // rule as a token logo rather than trusted for being ours.
  const out={attrs:Array.isArray(j.attributes)?j.attributes:[],img:safeUrl(j.image),
    name:safeSym(j.name).slice(0,40)};
  cardCache[k]=out;return out;
}
function cardHtml(c){
  const rows=c.attrs.slice(0,10).map(a=>{
    const t=safeSym(a&&a.trait_type).slice(0,20);
    let v=a&&a.value;
    if(a&&a.display_type==="date"&&+v)v=new Date(+v*1e3).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    else if(a&&a.display_type==="number")v=String(v);
    return`<dt>${t}</dt><dd>${safeSym(v).slice(0,28)}</dd>`}).join("");
  return(rows?`<dl>${rows}</dl>`:"")+(c.img?`<img src="${c.img}" alt="" loading="lazy">`:"");
}
async function inspect(el,k){
  const box=el.parentNode.querySelector(".ic");
  if(!box)return;
  if(box.innerHTML){box.innerHTML="";return}          // second click closes it
  const at=k.lastIndexOf(":"),board=k.slice(0,at),id=BigInt(k.slice(at+1));
  box.textContent="Reading the receipt\u2026";
  try{box.innerHTML=cardHtml(await loadCard(board,id))||"No card for this order."}
  catch{box.textContent="This receipt could not be read."}
}
// The book can run long, so it collapses to a caret and scrolls when open. With

function syncBook(n){

book.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-i]");
  if(!b){
    // A click anywhere else on an inspectable row opens its receipt. Links keep
    // their own behaviour - the etherscan link inside the row is not a toggle.
    const row=e.target.closest(".o.ins");
    if(row&&!e.target.closest("a"))inspect(row,row.dataset.k);
    return;
  }
  b.disabled=true;
  ++busy;
  try{
    await checkWallet();
    const id=BigInt(b.dataset.i),to=b.dataset.b,dl=BigInt(Math.floor(Date.now()/1e3)+1800);
    const row=bookRows.find(x=>String(x.id)===b.dataset.i&&x.board.toLowerCase()===to.toLowerCase());
    if(!row)throw Error("order changed — refresh and retry");
    if(b.dataset.x==="c"){
      // Unwrap when the escrow IS wrapped ether and the user has not asked to
      // keep it that way. This used to read the pay PICKER instead, so the same
      // cancel refunded ETH or WETH depending on a selection made for an
      // unrelated trade - the choice was real, the input to it was not.
      const native=!row.nA&&row.tA.toLowerCase()===WETH.toLowerCase()&&wantsUnwrap();
      // Floorboard shares Dutchboard's cancel pair, and the same `native` test
      // works: what returns is the ESCROW, and a bid escrows its quote (`tA`).
      const floorish=b.dataset.d==="1"||b.dataset.f==="1";
      const sel=floorish
        ?(native?SEL_DUTCH_CANCEL_UNWRAP:SEL_DUTCH_CANCEL)
        :(native&&b.dataset.v==="1"?SEL_CANCEL_UNWRAP:SEL_CANCELORD);
      const data="0x"+sel+encUint(id);
      stat.textContent=`Cancelling — the ${b.dataset.f==="1"?"unspent escrow":"unfilled remainder"} returns as ${native&&(floorish||b.dataset.v==="1")?"ETH":"its escrow token"}`;
      const tx={from:account,to,data,value:"0x0"};
      await rpc(C,[tx,L]);
      await settle(await rpc(S,[tx]));
      loadBook();refreshBalance();return;
    }

    const r=row;

    // Public fungible orders can use the same zRouter funding waterfall as a
    // swap. Swapbol remains msg.sender at the board, so private orders must
    // stay on the direct-wallet path below or their counterparty guard would
    // be weakened. NFTs likewise keep their native approval semantics.
    // Which side of the native boundary this fill uses comes from the ORDER,
    // the stated preference, and the balances that have to satisfy it - never
    // from the swap pickers, which is what it read before, so the identical row
    // executed as ETH or as WETH on the strength of an unrelated selection.
    const nativeOut=!r.nA&&r.tA.toLowerCase()===WETH.toLowerCase()&&wantsUnwrap();
    const wethLeg=!r.nB&&r.tB.toLowerCase()===WETH.toLowerCase()&&r.aB>0n;
    const plan=wethLeg?await planWethPayment(r.aB):null;
    if(plan&&plan.rail==="short")
      throw Error(`Not enough ether to fill: it costs ${trimAmt(r.aB,18)} and you hold `
        +`${trimAmt(plan.w,18)} WETH plus ${trimAmt(plan.e,18)} ETH.`);
    // Half wrapped and half not, with neither half enough on its own. Top up
    // the wrapped side by exactly the shortfall and the leg funds itself -
    // where before this was simply a fill the page refused.
    if(plan&&plan.wrap>0n){
      stat.textContent=`Wrapping ${trimAmt(plan.wrap,18)} ETH to cover the rest...`;
      const wtx={from:account,to:WETH,data:"0xd0e30db0",value:toHex(plan.wrap)};
      await rpc(C,[wtx,L]);await checkWallet();await settle(await rpc(S,[wtx]));
    }
    const nativeIn=plan?.rail==="eth";
    const routeIn=nativeIn?ZERO:r.tB;
    const routeOut=nativeOut?ZERO:r.tA;
    const canonicalNative=routeIn.toLowerCase()===routeOut.toLowerCase()
      ||(routeOut===ZERO&&routeIn.toLowerCase()===WETH.toLowerCase());
    // Before any approval, on every path below. `routeIn` is already the asset
    // this fill will actually spend - ETH where the leg wraps, the quoted token
    // otherwise - so one check covers the executor route and the direct one.
    // An NFT leg prices in token ids, not amounts, and is not a balance.
    if(!r.nB)await assertFunded(routeIn,r.aB,
      known(routeIn)||(routeIn===ZERO?{sym:"ETH",dec:18}:{sym:r.sB||"TOKEN",dec:r.dB??18}));
    if(!r.nA&&!r.nB&&r.cp===ZERO&&!canonicalNative){
      if((await rpc("eth_getCode",[SWAPBOL,L])).length<5)throw Error("orderbook executor not deployed yet");
      // Everything the executor will refuse, asked read-only FIRST. This runs
      // ahead of `sendRouterFunded`, which requests its approval before it ever
      // simulates the call - so without this a leg that was always going to
      // revert still costs the user an approval transaction, and leaves the
      // allowance standing behind it.
      await preflightLeg(r,routeIn,routeOut,r.aB);
      const pay=r.aB,fillPlan=encFillPlan([
        {id:r.id,board:r.board,pay,get:r.aA,part:false}
      ],routeIn,routeOut,account,account,dl);
      // amount == 0 means "sweep all" to zRouter, so a free Dutch fill must
      // name native input on the protecting snwap even when its quote is ERC20.
      const planCall=encSnwap(pay?routeIn:ZERO,pay,account,routeOut,r.aA,SWAPBOL,fillPlan);
      const checkpoint=routeIn===ZERO?null:encCheckpoint(SWAPBOL,routeIn,account);
      const direct=checkpoint?encCalls([checkpoint,planCall]):planCall;
      const funded=routeIn===ZERO||!pay?direct:encCalls([
        checkpoint,
        encSweep(routeIn,pay,SWAPBOL),
        encSnwap(ZERO,0n,account,routeOut,r.aA,SWAPBOL,fillPlan)
      ]);
      const meta=known(routeIn)||{addr:routeIn,sym:r.sB||"TOKEN",dec:r.dB||18};
      await sendRouterFunded(direct,funded,meta,pay,routeIn===ZERO?pay:0n,"Filling order...");
      loadBook();refreshBalance();return;
    }

    const data=r.dutch
      ?"0x"+SEL_DUTCH_FILL+encUint(id)+encUint(r.nA?0n:r.aA)+encAddr(account)+encUint(r.aB)
      :r.v2
        ?"0x"+(nativeIn?SEL_FILL2_ETH:nativeOut?SEL_FILL2_UNWRAP:SEL_FILL2)
          +encUint(id)+encUint(dl)+(nativeIn?"":encUint(0n))+encUint(0n)+encAddr(ZERO)
          // fillAmountB 0 = full fill (omitted by the ETH entry point, which
          // takes the amount as msg.value), then minAmountA 0 = no floor, then
          // recipient 0 = the caller. The fills gained the middle two words when
          // the board grew a slippage floor; the encoding still wrote four.
        :"0x"+SEL_FILL1+encUint(id)+encUint(dl);
    // Only Swapboard v2 has a payable ETH fill. A v1 order quoted in WETH still
    // reads as `nativeIn`, but it must be paid by approval, not by msg.value.
    const payNative=(nativeIn&&!r.dutch&&r.v2)||(r.dutch&&r.tB===ZERO);
    // Everything else paying natively has to wrap first: Dutch lots are not
    // routed through snwap's ERC20 balance guard, and a v1 board has no payable
    // entry point at all. Keyed off `payNative` rather than off the board kind,
    // so the one case that needs no wrap is the one that says so.
    const wrap=nativeIn&&!payNative&&r.aB
      ?{to:WETH,data:"0xd0e30db0",value:toHex(r.aB)}:null;
    const tx={from:account,to,data,value:payNative?toHex(r.aB):"0x0"};
    const approvals=[];
    if(r.nB){
      let ap=ZERO;
      try{ap="0x"+strip0x(await rpc(C,[{to:r.tB,data:"0x081812fc"+encUint(r.aB)},L])).slice(-40)}catch{}
      if(ap.toLowerCase()!==to.toLowerCase()){
        approvals.push({to:r.tB,data:"0x"+SEL_APPROVE+encAddr(to)+encUint(r.aB),value:"0x0"});
      }
    }else if(r.tB!==ZERO&&r.aB&&!(nativeIn&&!r.dutch&&r.v2)){
      const al=BigInt(await rpc(C,[{to:r.tB,data:"0x"+SEL_ALLOWANCE+encAddr(account)+encAddr(to)},L]));
      if(al<r.aB){
        // Clear a stale non-zero allowance for USDT-style tokens.
        if(al)approvals.push({to:r.tB,data:"0x"+SEL_APPROVE+encAddr(to)+encUint(0n),value:"0x0"});
        approvals.push({to:r.tB,data:"0x"+SEL_APPROVE+encAddr(to)+encUint(r.aB),value:"0x0"});
      }
    }
    const revoke=r.dutch&&!r.nB&&r.tB!==ZERO
      ?{to:r.tB,data:"0x"+SEL_APPROVE+encAddr(to)+encUint(0n),value:"0x0"}:null;
    if((wrap||approvals.length||revoke)&&await canBatch(account)){
      stat.textContent="Preparing and filling atomically...";
      await settle(await sendBatch(account,[
        ...(wrap?[wrap]:[]),...approvals,{to,data,value:tx.value},...(revoke?[revoke]:[])
      ]));
      loadBook();refreshBalance();return;
    }
    if(wrap){
      stat.textContent="Wrapping ETH...";
      await waitTx(await rpc(S,[{from:account,...wrap}]));
    }
    for(let i=0;i<approvals.length;i++){
      stat.textContent=`Approve${r.nB?" NFT":""}${approvals.length>1?` (${i+1}/${approvals.length})`:""}...`;
      await waitTx(await rpc(S,[{from:account,...approvals[i]}]));
    }
    await rpc(C,[tx,L]);
    await settle(await rpc(S,[tx]));
    if(revoke)try{
      stat.textContent="Filled · revoking quote allowance...";
      await waitTx(await rpc(S,[{from:account,...revoke}]));
      stat.textContent="Done";
    }catch{stat.textContent="Filled · quote allowance remains; revoke it in your wallet"}
    loadBook();refreshBalance();
  }catch(x){err(x);b.disabled=false}
  finally{--busy}
});

const SLOW="0x000000000000888741B254d37e1b27128AfEAaBC";

let posSeq=0,posShown=25;

async function loadPos(){

const my=++posSeq;
let outIds=[],inIds=[];
try{
const[oh,ih]=await Promise.all([
rpc(C,[{to:SLOW,data:"0x"+SEL_OUT+encAddr(account)},L]),
rpc(C,[{to:SLOW,data:"0x"+SEL_IN+encAddr(account)},L])]);

}catch{return}

for(const[t,d]of[...outIds.map(i=>[i,"out"]),...inIds.map(i=>[i,"in"])]){
const k=t.toString();dirs.set(k,(dirs.get(k)||"")+d)}

const allKeys=[...dirs.keys()].sort((a,b)=>a.length-b.length||(a<b?1:-1));

const more=allKeys.length-keys.length;

for(let i=0;i<keys.length;i+=10){
ps.push(...await Promise.all(keys.slice(i,i+10).map(k=>
rpc(C,[{to:SLOW,data:"0x"+SEL_PENDING+encUint(BigInt(k))},L]).catch(()=>0))));
if(my!==posSeq)return;
}
if(my!==posSeq)return;
const rows=[];
keys.forEach((k,i)=>{const p=ps[i];if(!p)return;

const now=BigInt(Math.floor(Date.now()/1e3));
const ready=rows.filter(r=>r.dir.includes("in")&&now>=r.ts+idDelay(r.id)).length;
// the badge counts what has been loaded; a trailing + means there is more
tabSend.textContent=ready?`Send (${ready}${more?"+":""})`:"Send";
if(tab!=="send"||!rows.length){pos.innerHTML="";return}
rows.sort((a,b)=>Number((a.ts+idDelay(a.id))-(b.ts+idDelay(b.id))));

const m=metas[n],exp=r.ts+idDelay(r.id),left=Number(exp-now);

else note=(io&&!oo?"Arrives in ":"Reversible · sends in ")+rel(left);

else if(oo&&!ripe)act=`<button data-a="r" data-t="${r.tid}" data-i="${r.id}" data-m="${r.amount}">Reverse</button>`;
else act=`<button disabled>${io?"In":"Out"}</button>`;
html+=`<div class="p"><span><b>${oo&&io?"↺":oo?"→":"←"} ${amt}</b><i>${note}</i></span>${act}</div>`;
});
if(more)html+=`<div class="p" style="justify-content:center"><button data-a="m">Show ${Math.min(more,POSPAGE)} more of ${more}</button></div>`;
pos.innerHTML=html;
}

});

// The droplet lists every Precision band for the pair the swap tile is pointed
// at, what the connected account holds in each, and lets it withdraw or add.
//
// A PAIR IS NOT A POOL, and that is the whole reason this is a list rather than
// a mirror of the swap form. Swapping can hide the choice - `quoteBestFor` picks
// whichever band is deepest and the user never learns there were four. For
// liquidity the band IS the product: ETH/USDC at [1800,2400] and at [1000,4000]
// are different positions with different risk, so the pair only filters and the
// user still has to choose.
//
// Everything here is read through the lens rather than off a pool address. The
// pool constructor is public and every LP token is named "Precision LP", so an
// address alone proves nothing; the lens answers only for pools its own factory
// created.
let lqSeq=0,lqRows=[];
// `PrecisionPoolFactory.isPool`, the trust anchor named at the top of this file.
// The lenses already refuse an address their factory did not create, so a row

// this makes that guarantee LOCAL rather than inherited from lens internals.
const SEL_ISPOOL="5b16ebb7",SEL_POOLFOR="83bd1387",SEL_PREVIEW_SEED="1d355417",SEL_CREATE_SEED="7163352a";

// Raw sqrt price, 1e18-scaled, into a human price for the pair. Decimals are
// NOT normalised on chain - the band is quoted in RAW token1 per RAW token0 -
// so the adjustment happens here, once, where the token metadata lives.
const bandPrice=(sqrtP,d0,d1)=>{const r=Number(sqrtP)/1e18;return r*r*10**(d0-d1)};
/**
 * A band drawn as a line, with a mark where price is.
 *
 * On a LOG scale, because a band can span six decades - 10 to 10,000,000 is a
 * normal full range - and on a linear one every realistic price would sit
 * against the left edge, which says nothing.
 */
const lqBar=(lo,hi,at)=>{
  if(!(lo>0)||!(hi>lo)||!(at>0))return "";
  const f=(Math.log(at)-Math.log(lo))/(Math.log(hi)-Math.log(lo));
  const out=f<0||f>1;
  const pct=(Math.max(0,Math.min(1,f))*100).toFixed(1);

};

  :v>=1?v.toFixed(4):v.toPrecision(3);

function lqRow(o,t0,t1){

  // In range is the question a depositor actually asks: outside it the position
  // is entirely one asset and earns nothing until price comes back.

    +`<div class="lqband"><b>${fmtPx(lo)} – ${fmtPx(hi)}</b> <span class="lqfee">${(Number(o.fee)/10000).toFixed(2)}%</span>`

    +`<input class="lqin" data-side="1" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.0 ${t1.sym}" aria-label="${t1.sym} to deposit">`

/**
 * Create a band for a pair that has none.
 *
 * A pool is a PRICE RANGE, not just a pair, so creating one is a decision the
 * page cannot make: where the band sits, and where inside it trading starts.
 * That is why it was never folded into "add liquidity" - adding joins a band
 * somebody already chose, and choosing badly here is arbitrageable rather than
 * merely suboptimal.
 *
 * Two defaults are opinions worth stating. The market is created NAMED
 * (feeRecipient = you) with a creator fee of ZERO: naming costs nothing, takes
 * nothing from traders, and is the only thing that stops a stranger seeding
 * your pool at a price of their choosing before you do. An unnamed market is
 * open to anyone to seed, which is fine for a pool nobody is pointing a
 * frontend at and wrong for one you are about to.
 */
// The number alone does not say which to pick. What a tier is FOR is the part
// that decides it, and it is the same taxonomy every concentrated AMM uses.
const LQ_FEES=[[500,"0.05%","pairs that track each other"],
  [3000,"0.30%","most pairs"],[10000,"1.00%","thin or volatile"]];
// Width as a MULTIPLE of the opening price, which is how a range is actually
// thought about: "it can double or halve" beats two absolute prices nobody can
// hold in their head. "full" is adaptive - see lqFullWidth.
const LQ_RANGES=[["full","Full range"],["100","Wide — 100×"],["10","10×"],
  ["2","2×"],["1.25","Tight — 25%"],["custom","Custom prices"]];
function lqNewForm(t0,t1){
  return `<div class="lqnew" data-t0="${t0.addr}" data-t1="${t1.addr}">`
    +`<label class="dly" for="lqRange">Range<select id="lqRange">`
    +LQ_RANGES.map(([v,l])=>`<option value="${v}"${v==="full"?" selected":""}>${l}</option>`).join("")
    +`</select></label>`
    +`<label class="dly hide" id="lqCustom">Prices<span class="r">`
    +`<input id="lqLo" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Low" aria-label="Lowest price in the band">`
    +`<input id="lqHi" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="High" aria-label="Highest price in the band"></span></label>`
    +`<label class="dly hide" id="lqPxRow" for="lqPx">Opening price`
    +`<input id="lqPx" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="${t1.sym} per ${t0.sym}" aria-label="Opening price"></label>`
    +`<label class="dly" for="lqFee">Fee<select id="lqFee">`
    +LQ_FEES.map(([v,l,h])=>`<option value="${v}"${v===3000?" selected":""}>${l} — ${h}</option>`).join("")
    +`</select></label>`
    +`<div class="lqout" id="lqRangeOut"></div>`
    +`<div class="lqout" id="lqPv"></div>`
    +`<button class="primary" id="lqCreate" disabled>Create band</button></div>`;
}

// A human price (token1 per token0) as the pool's own sqrt-price-in-WAD.
// Through the decimal string rather than Number: sqrt(raw)*1e18 loses the low
// digits at any realistic price, and the band edges are compared exactly.
const pxToSqrt=(px,d0,d1)=>{
  const raw=px*10**(d1-d0);
  if(!isFinite(raw)||raw<=0)return 0n;
  return BigInt(Math.round(Math.sqrt(raw)*1e9))*10n**9n;
};
// Market: eight STATIC words, encoded inline wherever it is passed.
const lqMarket=(t0,t1,lo,hi,fee,owner)=>encAddr(t0)+encAddr(t1)+encUint(lo)+encUint(hi)
  +encUint(fee)+encAddr(ZERO)+encAddr(owner)+encUint(0n);
const lqSeedPrice=(sl,sh,in0,in1)=>{
  const L=Number(sl),H=Number(sh),x=Number(in0),y=Number(in1),W=1e18;
  // lp0 rises with s and lp1 falls, so their ratio crosses 1 exactly once.
  const g=s=>(x*s*H*(s-L))/((H-s)*W*y*W);
  let lo=L,hi=H;
  for(let i=0;i<90;i++){const m=(lo+hi)/2;if(g(m)<1)lo=m;else hi=m}
  const s=(lo+hi)/2;
  // Strictly inside: the edges are the one-sided cases and mean something else.
  if(!(s>L&&s<H))return 0n;
  return BigInt(Math.round(s));
};

/**
 * Where the band sits, from the opening price and a width.
 *
 * Which SIDE it falls on is decided by the deposit, not by another question:
 * a single asset is a band lying entirely on one side of the opening price -
 * the Uniswap v3 rule - so depositing only token0 puts the band above the
 * opening price and only token1 puts it below. That removes the "your opening
 * price must equal the low edge" error entirely, because it can no longer be
 * anything else.
 */
const lqBandFor=(px,mult,a0,a1)=>{
  if(a0&&!a1)return[px,px*mult];        // token0 only: everything above
  if(a1&&!a0)return[px/mult,px];        // token1 only: everything below
  return[px/mult,px*mult];
};
/**
 * The widest band this deposit can actually back.
 *
 * A band is not free. The pool needs `lp > MIN_LIQUIDITY` and both virtual
 * reserves at or above `MIN_RESOLUTION`, and those are what width costs -
 * measured against the live factory, ten times the deposit buys about ten
 * times the width. A fixed "full range" constant would therefore fail for
 * small deposits, making the easiest option the likeliest error.
 *
 * This was asked of the chain, by simulating the create at each width. That
 * was wrong, and wrong in a way that pointed at the user: an ERC-20 side has
 * no allowance yet at preview time, so every width reverted TransferFromFailed
 * and the page reported "even the narrowest range needs more than this
 * deposit" to someone whose deposit was fine.
 *
 * So the three bounds are evaluated directly. They are the pool's own, they
 * need no allowance and no round trip, and the real preflight still runs
 * before anything is signed - this only chooses which range to offer.
 */
const LQ_MIN_LIQUIDITY=1000,LQ_MIN_RESOLUTION=1e6,LQ_WAD=1e18;
const lqSeedLp=(sl,sh,sp,in0,in1)=>{
  const L=Number(sl),H=Number(sh),S=Number(sp),x=Number(in0),y=Number(in1);
  if(!(S>=L&&S<=H))return 0;
  // At an edge the band is one asset, and the other side's formula divides by
  // zero - which is the same thing as saying it does not constrain anything.
  const lp0=x&&H>S?x*S*H/((H-S)*LQ_WAD):Infinity;
  const lp1=y&&S>L?y*LQ_WAD/(S-L):Infinity;
  const lp=Math.min(lp0,lp1);
  return isFinite(lp)&&lp>0?lp:0;
};
const lqBandFits=(sl,sh,sp,in0,in1)=>{
  const lp=lqSeedLp(sl,sh,sp,in0,in1);
  return lp>LQ_MIN_LIQUIDITY
    && lp*LQ_WAD/Number(sh)>=LQ_MIN_RESOLUTION
    && lp*Number(sl)/LQ_WAD>=LQ_MIN_RESOLUTION;
};
const LQ_WIDTHS=[1000,100,10,2];
function lqFullWidth(d0,d1,a0,a1,px){
  for(const mult of LQ_WIDTHS){
    const [lo,hi]=lqBandFor(px,mult,a0,a1);
    const sl=pxToSqrt(lo,d0,d1),sh=pxToSqrt(hi,d0,d1);
    if(!sl||!sh||sh<=sl)continue;
    const sp=a0&&!a1?sl:a1&&!a0?sh:lqSeedPrice(sl,sh,a0,a1);
    if(sp&&lqBandFits(sl,sh,sp,a0,a1))return mult;
  }
  return null;
}

// The pair's bands, then this account's LP balance in each.
//
// NOT `positionsOf`, which walks a page of the factory's GLOBAL pool list - so
// a holding in any pool past the first page was invisible, and indistinguishable
// from holding nothing. These pools are already known, and shares*reserve/supply
// is the arithmetic the lens does, so asking each pool is exact and complete.
async function loadLq(){
  const p=chPair();
  const my=++lqSeq;
  if(!p){lqList.innerHTML=`<div class="lqempty">Pick two different tokens.</div>`;lqSub.textContent="";lqRows=[];return}
  const [t0,t1]=p;
  lqSub.textContent=`${t0.sym} / ${t1.sym}`;
  lqList.innerHTML=`<div class="lqempty">Loading…</div>`;
  try{
    const who=account||ZERO;
    const [raw]=await mc3([{to:PPLENS,data:"0x"+SEL_MARKETS+encAddr(t0.addr)+encAddr(t1.addr)
      +encAddr(who)+encUint(0)+encUint(24)+encUint(0)}]);
    if(my!==lqSeq)return;
    const rows=[];
    if(raw){const h=strip0x(raw),n=Number(BigInt("0x"+h.slice(64,128))),base=128;
      for(let i=0;i<n&&i<24;i++){
        const at=k=>BigInt("0x"+h.slice(base+(i*PI_WORDS+k)*64,base+(i*PI_WORDS+k+1)*64));
        rows.push({pool:"0x"+h.slice(base+(i*PI_WORDS+PI_POOL)*64+24,base+(i*PI_WORDS+PI_POOL+1)*64),
          sl:at(PI_SL),sh:at(PI_SH),fee:at(PI_FEE),r0:at(PI_R0),r1:at(PI_R1),px:at(PI_PX),
          liq:at(PI_LIQ),hook:"0x"+h.slice(base+(i*PI_WORDS+PI_HOOK)*64+24,base+(i*PI_WORDS+PI_HOOK+1)*64),
          shares:0n,mine0:0n,mine1:0n})}}
    if(account&&rows.length){
      const bs=await mc3Deep(rows.map(r=>({to:r.pool,data:"0x"+SEL_BALANCEOF+encAddr(account)})));
      if(my!==lqSeq)return;
      rows.forEach((r,i)=>{
        if(!bs[i]||r.liq===0n)return;
        const s=dec1(bs[i],0);
        // Same floor division the pool performs on redemption, so the figure
        // shown is the figure `previewRemove` will confirm.
        r.shares=s;r.mine0=s*r.r0/r.liq;r.mine1=s*r.r1/r.liq;
      });
    }
    if(my!==lqSeq)return;
    if(!rows.length){
      lqList.innerHTML=`<div class="lqempty">No Precision band for this pair yet.</div>`+lqNewForm(t0,t1);
      lqRows=[];
      // Say what to do before anything is typed, rather than after.
      lqNewPreview();
      return}
    // Yours first, then deepest: the band you are already in is the one you came
    // to act on, and a list sorted purely by size buries it.
    rows.sort((a,b)=>(b.shares>0n)-(a.shares>0n)||(b.liq>a.liq?1:b.liq<a.liq?-1:0));
    lqRows=rows;
    lqList.innerHTML=rows.map(o=>lqRow(o,t0,t1)).join("");
  }catch(e){
    if(my!==lqSeq)return;
    lqRows=[];
    lqList.innerHTML=`<div class="lqempty">Could not read pools.</div>`;
  }
}
// ---------------------------------------------------------- LIQUIDITY ACTIONS
// Withdraw and two-sided add call the POOL DIRECTLY. Both are public entry
// points that pull from `msg.sender` in the same call, so there is no router,
// no checkpoint and no executor in the path - which also means no intent to get
// wrong. Zapping is the one that has to go through zRouter, because
// `PrecisionRoute.zapIn` is gated to the trusted executor; it comes later.
// All verified with `cast sig`. Four of these were wrong when written from
// memory, and a wrong selector on a VIEW is the dangerous kind: it returns
// empty calldata that decodes to zeros, so a preview reads as "the pool would
// refuse" and the button just never enables. Nothing throws.
const SEL_REMOVE="e39b0eb5",SEL_ADDEXACT="cc0025e4",SEL_PREVIEW_REMOVE="a2eaee07",
      SEL_PREVIEW_ADD="e03ec807"; // SEL_ALLOWANCE already declared above

// Every preview returns `ok` first. False is not an error - it is the pool
// saying it would refuse, which is a disabled button with a reason rather than
// a failed transaction the user pays for.
const dec1=(h,i)=>BigInt("0x"+strip0x(h).slice(i*64,(i+1)*64));

async function previewRemove(pool,shares){
  const [r]=await mc3([{to:PLQLENS,data:"0x"+SEL_PREVIEW_REMOVE+encAddr(pool)+encUint(shares)}]);
  if(!r)return null;
  return dec1(r,0)===1n?{a0:dec1(r,1),a1:dec1(r,2)}:null;
}
async function previewAdd(pool,a0,a1){
  const [r]=await mc3([{to:PLQLENS,data:"0x"+SEL_PREVIEW_ADD+encAddr(pool)+encUint(a0)+encUint(a1)}]);
  if(!r)return null;
  return dec1(r,0)===1n?{lp:dec1(r,1),used0:dec1(r,2),used1:dec1(r,3),ref0:dec1(r,4),ref1:dec1(r,5)}:null;
}

// PREVIEWS ARE READ AT A BLOCK; TRANSACTIONS LAND AT A LATER ONE, and both
// entry points bound themselves with minimums taken from the preview. A swap
// through the band in between moves the reserves, so an EXACT minimum is not a
// safety property - it is a guaranteed revert on any pool with traffic. Same
// slippage control the swap tile uses, for the same reason.
const lessSlip=v=>{const b=BigInt(Math.round(Math.min(10,Math.max(.01,+slip.value||.5))*100));
return v-(v*b)/10000n};

// The allowance has to cover what the pool MAY pull - the amount passed, not
// the amount the preview expects it to use. `addLiquidityExact` treats both
// sides as maxima and refunds the excess, so sizing this to `used` leaves an
// allowance between the two passing here and reverting inside the pool.
async function ensureAllowance(token,spender,need){
  if(token===ZERO||need===0n)return;
  const [r]=await mc3([{to:token,data:"0x"+SEL_ALLOWANCE+encAddr(account)+encAddr(spender)}]);
  if(r&&dec1(r,0)>=need)return;
  stat.textContent="Approving…";
  // Some tokens refuse a non-zero to non-zero approve, and an allowance that is
  // merely too small is exactly that case.
  if(r&&dec1(r,0)>0n)await waitTx(await rpc(S,[{from:account,to:token,
    data:"0x"+SEL_APPROVE+encAddr(spender)+encUint(0),value:"0x0"}]));
  await waitTx(await rpc(S,[{from:account,to:token,
    data:"0x"+SEL_APPROVE+encAddr(spender)+encUint(need),value:"0x0"}]));
}

// The factory is the trust anchor named at the top of this file, asked here
// rather than inferred. Both lenses already refuse a foreign address, so a row
// that rendered is genuine - but these two paths grant an allowance and send
// value, and that guarantee should not live in another contract's internals.
async function factoryPool(pool){
  const [r]=await mc3([{to:PFACTORY,data:"0x"+SEL_ISPOOL+encAddr(pool)}]).catch(()=>[null]);
  return !!r&&dec1(r,0)===1n;
}

async function doRemove(pool,shares,t0,t1){
  const pv=await previewRemove(pool,shares);
  // A real holding whose share of both reserves floors to zero cannot be
  // exited at all - the pool refuses it outright. Say so instead of sending.
  if(!pv){stat.textContent="This amount redeems nothing — the pool would refuse it.";return}
  if(!await factoryPool(pool)){stat.textContent="Not a Precision pool — refusing to send.";return}
  ++busy;
  try{
    await checkWallet();
    stat.textContent="Withdrawing…";
    await settle(await rpc(S,[{from:account,to:pool,value:"0x0",
      data:"0x"+SEL_REMOVE+encUint(shares)+encUint(lessSlip(pv.a0))+encUint(lessSlip(pv.a1))+encAddr(account)}]));
    await loadLq();refreshBalance();
  }catch(e){err(e)}
  finally{--busy}
}

async function doAdd(pool,a0,a1,t0,t1){
  const pv=await previewAdd(pool,a0,a1);
  if(!pv){stat.textContent="The pool would refuse this deposit.";return}
  if(!await factoryPool(pool)){stat.textContent="Not a Precision pool — refusing to send.";return}
  ++busy;
  try{
    await checkWallet();
    // Whichever sides are ERC-20 need an allowance for the full amount offered;
    // a native side is paid as value instead.
    await ensureAllowance(t0.addr,pool,a0);
    await ensureAllowance(t1.addr,pool,a1);
    stat.textContent="Adding…";
    const value=t0.addr===ZERO?a0:0n;
    // `sqrtPriceInit` is 0: this band exists, so there is no opening price to
    // set. The refund is not slippage - an off-ratio deposit ALWAYS hands the
    // excess back, and the preview shows it - but `minLP` is, for the same
    // reason the withdraw minimums are.
    await settle(await rpc(S,[{from:account,to:pool,value:toHex(value),
      data:"0x"+SEL_ADDEXACT+encUint(0)+encUint(a0)+encUint(a1)+encUint(lessSlip(pv.lp))+encAddr(account)}]));
    await loadLq();refreshBalance();
  }catch(e){err(e)}
  finally{--busy}
}

// The add form's own preview, debounced. It answers the one question the two
// inputs cannot: an off-ratio pair is not rejected, it is silently trimmed, so
// "you will actually deposit X and get Y back" has to be visible BEFORE the
// click rather than discovered in the receipt.
let lqPvT,lqPvSeq=0;
async function lqPreview(box){
  const pool=box.closest(".lqrow")?.dataset.pool||"";
  const row=lqRows.find(x=>x.pool.toLowerCase()===pool.toLowerCase());
  const p=chPair();
  const out=box.querySelector(".lqpv"),go=box.querySelector('[data-act="ac"]');
  if(!row||!p){out.textContent="";go.disabled=true;return}
  const [t0,t1]=p,ins=box.querySelectorAll(".lqin");
  let a0,a1;
  try{
    a0=ins[0].value.trim()?parseUnits(ins[0].value.trim(),t0.dec):0n;
    a1=ins[1].value.trim()?parseUnits(ins[1].value.trim(),t1.dec):0n;
  }catch{out.textContent="Invalid amount.";go.disabled=true;return}
  if(!a0||!a1){
    // Both sides, always: this is the two-sided entry point. One-sided entry is
    // the zap, which is a different call through a different contract.
    out.textContent="Enter both amounts.";go.disabled=true;return}
  const my=++lqPvSeq;
  out.textContent="Checking…";go.disabled=true;
  const pv=await previewAdd(row.pool,a0,a1).catch(()=>null);
  if(my!==lqPvSeq)return;
  if(!pv){out.textContent="The pool would refuse this deposit.";go.disabled=true;return}
  const ref=(pv.ref0>0n?` · refunds ${trimAmt(pv.ref0,t0.dec)} ${t0.sym}`:"")
    +(pv.ref1>0n?` · refunds ${trimAmt(pv.ref1,t1.dec)} ${t1.sym}`:"");
  out.textContent=`deposits ${trimAmt(pv.used0,t0.dec)} ${t0.sym} + ${trimAmt(pv.used1,t1.dec)} ${t1.sym}${ref}`;
  go.disabled=false;
}

/**
 * Fill the other side from the pool's own ratio.
 *
 * Adding to a live band is not a free choice of two numbers: the pool takes
 * them in the proportion its reserves are already in and hands the rest
 * straight back. Asking for both and then reporting a refund made the user do
 * that arithmetic, and punished them for getting it wrong.
 *
 * r0 and r1 are already on screen, so the counterpart is not a guess. The
 * preview still has the last word - this only stops the obvious answer having
 * to be worked out by hand.
 */
function lqMirror(box,src){
  const pool=box.closest(".lqrow")?.dataset.pool||"";
  const row=lqRows.find(x=>x.pool.toLowerCase()===pool.toLowerCase());
  const p=chPair();
  if(!row||!p||!row.r0||!row.r1)return;
  const [t0,t1]=p,ins=box.querySelectorAll(".lqin");
  const i=src===ins[0]?0:src===ins[1]?1:-1;
  if(i<0)return;
  const other=ins[1-i],v=src.value.trim();
  if(!v){other.value="";return}
  try{
    const raw=parseUnits(v,i===0?t0.dec:t1.dec);
    // Same direction the pool reads it: whichever side was typed, the other
    // follows the reserves.
    other.value=formatUnits(i===0?raw*row.r1/row.r0:raw*row.r0/row.r1,i===0?t1.dec:t0.dec);
  }catch{}
}

// Delegated so rows can be re-rendered freely.
lqList.addEventListener("input",e=>{
  if(!e.target.classList.contains("lqin"))return;
  const box=e.target.closest(".lqadd");
  if(box){lqMirror(box,e.target);clearTimeout(lqPvT);lqPvT=setTimeout(()=>lqPreview(box),300);return}
  if(e.target.closest(".lqnew")){clearTimeout(lqPvT);lqPvT=setTimeout(lqNewPreview,300)}
});
lqList.addEventListener("change",e=>{if(e.target.id==="lqFee"||e.target.id==="lqRange")lqNewPreview()});

/**
 * What the pool will take, and what it will refuse.
 *
 * `previewSeed` answers both: `ok` false is the band saying this opening price
 * cannot be seeded with these amounts at all, which is a different thing from
 * a bad rate and has to read differently. The amounts are MAXIMA - the seed
 * uses the ratio the price implies and hands the rest back - so the preview is
 * the only place the difference is visible before signing.
 */
let lqNewSeq=0;
let lqPvT2;
const lqPreviewSoon=()=>{clearTimeout(lqPvT2);lqPvT2=setTimeout(lqNewPreview,320)};
async function lqNewPreview(){
  const box=lqList.querySelector(".lqnew");
  if(!box)return;
  const out=box.querySelector("#lqPv"),go=box.querySelector("#lqCreate");
  const bandOut=box.querySelector("#lqRangeOut");
  const my=++lqNewSeq;
  go.disabled=true;
  const pair=chPair();
  if(!pair){out.textContent="";return}
  const [t0,t1]=pair;
  const range=box.querySelector("#lqRange").value;
  box.querySelector("#lqCustom").classList.toggle("hide",range!=="custom");
  // The deposit is the pair of amounts on the tile above.
  let a0=0n,a1=0n;
  try{
    const v0=amt.value.trim(),v1=outAmt.value.trim();
    a0=v0?parseUnits(v0,t0.dec):0n;a1=v1?parseUnits(v1,t1.dec):0n;
  }catch{out.textContent="Check the amounts.";bandOut.textContent="";return}
  const oneSided=(a0&&!a1)?0:(a1&&!a0)?1:-1;
  // A price is only asked for where the amounts cannot imply one: a single
  // asset has no ratio.
  box.querySelector("#lqPxRow").classList.toggle("hide",oneSided<0);
  if(!a0&&!a1){
    bandOut.textContent="";
    out.textContent=`Enter how much ${t0.sym} and ${t1.sym} to deposit — the ratio sets the opening price.`;
    return}
  const pxIn=box.querySelector("#lqPx").value.trim();
  // Both sides: the ratio IS the price. One side: it has to be named.
  const px=oneSided<0
    ?(Number(a1)/10**t1.dec)/(Number(a0)/10**t0.dec)
    :(pxIn?+pxIn:NaN);
  if(!(px>0)){
    bandOut.textContent="";
    const only=oneSided===0?t0.sym:t1.sym;
    out.textContent=`${/^[AEIOU]/i.test(only)?"An":"A"} ${only}-only band has no ratio to`
      +` read a price from — name one.`;
    return}
  let lo,hi;
  if(range==="custom"){
    const n=id=>{const v=box.querySelector("#"+id).value.trim();return v?+v:NaN};
    lo=n("lqLo");hi=n("lqHi");
    if(!(lo>0)||!(hi>0)){bandOut.textContent="";out.textContent="Name both prices.";return}
    if(lo>=hi){out.textContent="The low price must be below the high one.";bandOut.textContent="";return}
    if(oneSided<0&&(px<lo||px>hi)){
      out.textContent=`These amounts imply ${fmtPx(px)}, which is outside that band.`;return}
  }else{
    let mult=+range;
    if(range==="full"){
      const found=lqFullWidth(t0.dec,t1.dec,a0,a1,px);
      if(!found){
        bandOut.textContent="";
        out.textContent="Even the narrowest range needs more than this deposit.";return}
      mult=found;
    }
    [lo,hi]=lqBandFor(px,mult,a0,a1);
  }
  const sl=pxToSqrt(lo,t0.dec,t1.dec),sh=pxToSqrt(hi,t0.dec,t1.dec);
  if(!sl||!sh||sh<=sl){out.textContent="Check the prices.";bandOut.textContent="";return}
  // A single-asset band opens at the edge it touches - that is what makes it
  // single-asset. Otherwise the opening price is the one that consumes both
  // deposits in full, which is what their ratio means against a band.
  const sp=oneSided===0?sl:oneSided===1?sh:lqSeedPrice(sl,sh,a0,a1);
  if(!sp){out.textContent="Those amounts cannot open a band that wide.";return}
  const openAt=bandPrice(sp,t0.dec,t1.dec);
  // The bar is markup built from numbers; the line under it carries token
  // symbols, which are registry text - so it goes in through textContent
  // rather than being interpolated into the same string.
  bandOut.innerHTML=lqBar(lo,hi,openAt)+`<span></span>`;
  bandOut.querySelector("span").textContent=
    `${fmtPx(lo)} – ${fmtPx(hi)} · opens at ${fmtPx(openAt)} ${t1.sym} per ${t0.sym}`
    +(oneSided===0?` · ${t0.sym} only`:oneSided===1?` · ${t1.sym} only`:"");
  const fee=BigInt(box.querySelector("#lqFee").value);
  const market=lqMarket(t0.addr,t1.addr,sl,sh,fee,account||ZERO);
  box.dataset.sl=sl;box.dataset.sh=sh;box.dataset.sp=sp;box.dataset.fee=fee;
  box.dataset.a0=a0;box.dataset.a1=a1;box.dataset.lp=0;
  try{
    // Market is eight STATIC words, so it encodes inline - no offset. Getting
    // that wrong shifts every field by one and the factory reads the offset
    // itself as token0, which fails `token0 >= token1` and reverts Bad().
    const [addr]=await mc3([{to:PFACTORY,data:"0x"+SEL_POOLFOR+market}]);
    if(my!==lqNewSeq)return;
    const pool="0x"+strip0x(addr).slice(24);
    // The LENS reads the band off the pool, and there is no code at that
    // address yet - so an exact preview only exists where the market was
    // already deployed and left UNSEEDED, which the factory allows and seeds.
    const [pv]=await mc3([{to:PLQLENS,data:"0x"+SEL_PREVIEW_SEED+encAddr(pool)+encUint(sp)
      +encUint(a0)+encUint(a1)}]).catch(()=>[null]);
    if(my!==lqNewSeq)return;
    const h=strip0x(pv||""),w=i=>BigInt("0x"+h.slice(i*64,(i+1)*64));
    if(h.length>=256&&w(0)!==0n){
      const used0=w(2),used1=w(3);
      out.textContent=`Seeds ${trimAmt(used0,t0.dec)} ${t0.sym} + ${trimAmt(used1,t1.dec)} ${t1.sym}`
        +((used0<a0||used1<a1)?" — the rest is returned":"");
      box.dataset.lp=w(1);
    }else if(h.length>=256){
      out.textContent="This band cannot open at that price with those amounts.";return;
    }else{
      out.textContent=`Deposits ${trimAmt(a0,t0.dec)} ${t0.sym} + ${trimAmt(a1,t1.dec)} ${t1.sym}.`;
    }
    go.disabled=!account;
  }catch{
    if(my!==lqNewSeq)return;
    out.textContent="Could not reach the factory.";
  }
}

/**
 * Deploy the band and seed it, in one transaction.
 *
 * `createAndSeed` is deliberately not two steps. A pool that exists but has
 * never been seeded is squattable: the address is CREATE2-derived so it cannot
 * be redeployed, and whoever seeds it first chooses the opening price. Naming
 * the market closes that - only the creator may seed a named one - and doing
 * both in one call closes the window entirely.
 *
 * `minLP` carries the page's slippage, because the seed is priced off reserves
 * that nothing else can move yet but the amounts still round.
 */
async function lqCreate(){
  const box=lqList.querySelector(".lqnew");
  if(!box||busy||!account)return;
  const pair=chPair(); if(!pair)return;
  const [t0,t1]=pair;
  const go=box.querySelector("#lqCreate"),out=box.querySelector("#lqPv");
  const sl=BigInt(box.dataset.sl||0),sh=BigInt(box.dataset.sh||0),sp=BigInt(box.dataset.sp||0);
  const a0=BigInt(box.dataset.a0||0),a1=BigInt(box.dataset.a1||0),fee=BigInt(box.dataset.fee||0);
  if(!sl||!sh||!sp){out.textContent="Preview the band first.";return}
  busy=true;go.disabled=true;
  try{
    const bps=BigInt(Math.round(Math.min(10,Math.max(.01,+slip.value||.5))*100));
    const lp=BigInt(box.dataset.lp||0);
    // Zero when there was no exact preview to floor - which is the ordinary
    // case, since the band does not exist yet. It is not a gap: the market is
    // NAMED, so nobody else can seed it, there is no other liquidity to move
    // against, and the opening price is the caller's own. minLP guards
    // rounding here, not a counterparty.
    const minLP=lp>0n?lp*(10000n-bps)/10000n:0n;
    const market=lqMarket(t0.addr,t1.addr,sl,sh,fee,account);
    // token0 is the sorted-first side, and ETH sorts first as address(0) - so
    // a native leg is always amount0, and the factory takes it as value.
    const native=t0.addr===ZERO;
    if(!native&&a0)await lqApprove(t0.addr,a0);
    if(a1)await lqApprove(t1.addr,a1);
    // Market first and inline, then the five scalars - thirteen words, no
    // offsets anywhere.
    const data="0x"+SEL_CREATE_SEED+market+encUint(sp)+encUint(a0)+encUint(a1)
      +encUint(minLP)+encAddr(account);
    const tx={from:account,to:PFACTORY,data,value:native?toHex(a0):"0x0"};
    stat.textContent="Creating the band...";
    await rpc(C,[tx,L]);await checkWallet();await settle(await rpc(S,[tx]));
    stat.textContent="Band created.";
    loadLq();refreshBalance();
  }catch(e){err(e);out.textContent="";}
  finally{busy=false;go.disabled=false}
}
async function lqApprove(token,need){
  const al=BigInt(await rpc(C,[{to:token,data:"0x"+SEL_ALLOWANCE+encAddr(account)+encAddr(PFACTORY)},L]));
  if(al>=need)return;
  if(al)await settle(await rpc(S,[{from:account,to:token,
    data:"0x"+SEL_APPROVE+encAddr(PFACTORY)+encUint(0n),value:"0x0"}]));
  await settle(await rpc(S,[{from:account,to:token,
    data:"0x"+SEL_APPROVE+encAddr(PFACTORY)+encUint(need),value:"0x0"}]));
}

lqList.onclick=async ev=>{
  if(ev.target.id==="lqCreate"){await lqCreate();return}
  const b=ev.target.closest("[data-act]");
  if(!b||busy||!account)return;
  const p=chPair(); if(!p)return;
  const [t0,t1]=p,pool=b.dataset.pool;
  const row=lqRows.find(x=>x.pool.toLowerCase()===pool.toLowerCase());
  if(!row)return;
  const act=b.dataset.act;
  if(act==="a"){
    const box=b.closest(".lqrow").querySelector(".lqadd");
    box.classList.toggle("hide");
    b.textContent=box.classList.contains("hide")?"Add":"Cancel";
    if(!box.classList.contains("hide"))box.querySelector(".lqin").focus();
    return;
  }
  if(act==="w"){
    if(row.shares===0n)return;
    // Whole position. A slider is the next iteration; this proves the path.
    await doRemove(pool,row.shares,t0,t1);
    return;
  }
  if(act==="ac"){
    const box=b.closest(".lqadd");
    // Re-read from the inputs rather than trusting the dataset the preview
    // stamped: a keystroke after the preview settled would otherwise send an
    // amount the user never saw confirmed.
    let a0,a1;
    try{
      const ins=box.querySelectorAll(".lqin");
      a0=parseUnits(ins[0].value.trim(),t0.dec);a1=parseUnits(ins[1].value.trim(),t1.dec);
    }catch{stat.textContent="Invalid amount";return}
    if(!a0||!a1)return;
    await doAdd(pool,a0,a1,t0,t1);
  }
};

lq.onclick=()=>lqSet(!lqMode);

// ------------------------------------------------------------- PRICE TAPE
// Candles read straight out of PrecisionPool storage: no indexer, no subgraph,
// no server. One aggregate3 finds the pools for the pair and reads their tapes,
// so opening the drawer costs a single round trip. Closed by default, and it
// costs nothing at all until opened.
const PPLENS="0x000000Bad3a2fa57ed74fa06000573ccddF6B7fB";
const SEL_MARKETS="29c21083",SEL_TAPE="29a65241";
const FINE=300,COARSE=14400,TFS=[["5m",300],["1h",3600],["1d",86400]];
// The fine ring only spans ~21h, so a daily candle built from it is a stub.
// The pool also keeps a four-hour tape covering weeks; read both and pick the
// one whose resolution the timeframe actually needs.
const srcFor=tf=>tf>=COARSE?COARSE:FINE;
// PoolInfo is a static struct, so the lens returns rows of flat words - and the
// COUNT IS LOAD-BEARING, because it is the stride between rows. It was 18 until
// `clampable` was added to the struct; at the wrong stride every pool after the
// first decodes as garbage, silently, with no error anywhere. Anything added to
// PoolInfo has to be reflected here.
const PI_WORDS=19,PI_POOL=0,PI_LIQ=9,PI_HOOK=10,PI_T0=1,PI_T1=2,PI_SL=3,PI_SH=4,
      PI_FEE=5,PI_R0=6,PI_R1=7,PI_PX=8,PI_CLAMP=14;
let chKind=LS.ck==="line"?"line":"candle",chPeriod=300,chBars=null,chSeq=0,chPools=0,chOpen=LS.ch==="1",chCache={};
// Declared, not implied. `drawChart` can return early on an empty window AFTER
// `syncChartUI` has already revealed the drawer, so the pointer handlers below
// can run before this is ever assigned - and an undeclared identifier throws
// ReferenceError there rather than reading as the null it is meant to be.
let chDraw=null;
// value = mantissa << exponent, matching PriceTape.pack
const unf=p=>(p&0xffffff)*2**(p>>>24);
const decBar=w=>{if(!w)return null;const f=s=>Number((w>>BigInt(s))&0xffffffffn);
return{b:Number(w&0xffffffffn),o:unf(f(32)),h:unf(f(64)),l:unf(f(96)),c:unf(f(128)),v:unf(f(160)),n:Number((w>>192n)&0xffffn)}};
// Exact: a bar built from N sub-bars is the bar the trades would have produced.
const rollUp=(bars,src,dst)=>{if(dst<=src)return bars.filter(Boolean);
const out=[];let g=null,k=null;
for(let i=bars.length-1;i>=0;i--){const b=bars[i];if(!b)continue;
const key=Math.floor(b.b*src/dst);
if(key!==k){if(g)out.push(g);k=key;g={b:key,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v,n:b.n}}
else{g.h=Math.max(g.h,b.h);g.l=Math.min(g.l,b.l);g.c=b.c;g.v+=b.v;g.n+=b.n}}
if(g)out.push(g);return out.reverse()};
// One pair can have several pools at different fee tiers. Arbitrage keeps them
// on the same price, so the honest aggregate is the market: extremes are the
// union, volume sums, and open/close are volume-weighted - which also means a
// thin pool cannot drag the print away from where size actually traded.
const mergeTapes=tapes=>{const m=new Map();
for(const bars of tapes)for(const b of bars||[]){if(!b)continue;
const e=m.get(b.b);
if(!e)m.set(b.b,{b:b.b,o:b.o*b.v,h:b.h,l:b.l,c:b.c*b.v,v:b.v,n:b.n,w:b.v,fo:b.o,fc:b.c});
else{e.h=Math.max(e.h,b.h);e.l=Math.min(e.l,b.l);e.o+=b.o*b.v;e.c+=b.c*b.v;e.v+=b.v;e.n+=b.n;e.w+=b.v}}
const out=[...m.values()].sort((x,y)=>y.b-x.b);

  +encAddr(account)+encUint(0)+encUint(8)+encUint(0)}]);
